<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprova Daqui — ENEM da nossa região</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board: #101B33;
    --board-alt: #16244A;
    --board-line: #24345E;
    --paper: #FFFFFF;
    --paper-dim: #EEF1F6;
    --chalk-yellow: #C9932F;
    --clay-red: #C0392B;
    --ink: #16213A;
    --ink-soft: #5C6B85;
    --chalk-white: #EDF1FA;
    --ok-green: #1F8A5F;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#F4F6FA;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }
  .app{
    display:flex;
    min-height:100vh;
  }
  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:232px;
    flex-shrink:0;
    background:var(--board);
    padding:28px 18px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .brand{
    font-family:'Inter', sans-serif;
    font-size:1.35rem;
    font-weight:800;
    color:#FFFFFF;
    margin-bottom:2px;
    letter-spacing:-0.01em;
  }
  .brand-sub{
    font-family:'Inter', sans-serif;
    font-size:0.78rem;
    font-weight:500;
    color:var(--chalk-yellow);
    text-transform:uppercase;
    letter-spacing:0.06em;
    opacity:0.9;
    margin-bottom:30px;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 14px;
    border-radius:8px;
    color:var(--chalk-white);
    opacity:0.68;
    cursor:pointer;
    font-size:0.92rem;
    font-weight:500;
    transition:background .15s, opacity .15s;
    border:none;
    background:none;
    text-align:left;
    width:100%;
  }
  .nav-item:hover{ background:rgba(255,255,255,0.06); opacity:1; }
  .nav-item.active{
    background:rgba(255,255,255,0.09);
    opacity:1;
    box-shadow:inset 3px 0 0 var(--chalk-yellow);
    font-weight:600;
  }
  .nav-emoji{ font-size:1.0rem; }

  .trilha-selector{
    display:flex;
    flex-direction:column;
    gap:5px;
    margin-bottom:22px;
    padding-bottom:22px;
    border-bottom:1px solid rgba(255,255,255,0.1);
  }
  .trilha-btn{
    padding:9px 11px;
    border-radius:7px;
    border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.04);
    color:var(--chalk-white);
    font-size:0.82rem;
    font-weight:500;
    text-align:left;
    cursor:pointer;
    opacity:0.65;
    transition:background .15s, opacity .15s, border-color .15s;
  }
  .trilha-btn:hover{ opacity:0.9; }
  .trilha-btn.active{
    background:var(--chalk-yellow);
    color:var(--board);
    border-color:var(--chalk-yellow);
    opacity:1;
    font-weight:700;
  }
  .sidebar-foot{
    margin-top:auto;
    font-size:0.72rem;
    color:var(--chalk-white);
    opacity:0.35;
    line-height:1.5;
  }

  /* ---------- MAIN ---------- */
  .main{
    flex:1;
    padding:36px 42px;
    max-width:1140px;
  }
  .page-title{
    font-family:'Inter', sans-serif;
    font-size:1.6rem;
    font-weight:700;
    color:var(--ink);
    margin:0 0 4px 0;
    letter-spacing:-0.01em;
  }
  .page-sub{
    color:var(--ink-soft);
    font-size:0.92rem;
    margin-bottom:28px;
  }

  .card{
    background:var(--paper);
    color:var(--ink);
    border-radius:var(--radius);
    padding:24px;
    margin-bottom:20px;
    border:1px solid var(--paper-dim);
    box-shadow:0 1px 2px rgba(16,27,51,0.05);
  }
  .card h3{
    font-family:'Inter', sans-serif;
    font-weight:700;
    margin:0 0 14px 0;
    font-size:1.02rem;
    color:var(--ink);
  }

  /* ---------- PAINEL / DASHBOARD ---------- */
  .board-hero{
    background:linear-gradient(135deg, var(--board) 0%, var(--board-alt) 100%);
    border-radius:var(--radius);
    padding:28px 30px;
    margin-bottom:24px;
    position:relative;
  }
  .chalk-greeting{
    font-family:'Inter', sans-serif;
    font-size:1.5rem;
    font-weight:700;
    color:#FFFFFF;
    line-height:1.25;
    letter-spacing:-0.01em;
  }
  .chalk-greeting b{ color:var(--chalk-yellow); }

  .stat-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:14px;
    margin-top:22px;
  }
  .stat-pin{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:8px;
    padding:16px;
    text-align:left;
    position:relative;
    border-left:3px solid var(--chalk-yellow);
  }
  .stat-num{
    font-family:'JetBrains Mono', monospace;
    font-size:1.55rem;
    font-weight:700;
    color:#FFFFFF;
  }
  .stat-label{
    font-size:0.76rem;
    color:var(--chalk-white);
    opacity:0.65;
    margin-top:3px;
  }

  /* ---------- QUESTOES ---------- */
  .filter-row{
    display:flex;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  select, button.btn, input[type=text], textarea{
    font-family:'Work Sans', sans-serif;
    font-size:0.9rem;
  }
  select{
    padding:9px 12px;
    border-radius:7px;
    border:1px solid var(--paper-dim);
    background:#FFFFFF;
    color:var(--ink);
  }
  .btn{
    padding:10px 18px;
    border-radius:7px;
    border:none;
    background:var(--board);
    color:#FFFFFF;
    font-weight:600;
    cursor:pointer;
    transition:filter .15s, transform .1s;
  }
  .btn:hover{ filter:brightness(1.25); }
  .btn:active{ transform:scale(0.98); }
  .btn.secondary{
    background:transparent;
    border:1px solid var(--board-line);
    color:var(--board);
  }
  .btn.clay{ background:var(--clay-red); color:#FFFFFF; }

  .question-card .tag{
    display:inline-block;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    background:var(--board);
    color:var(--chalk-yellow);
    padding:3px 9px;
    border-radius:20px;
    margin-bottom:12px;
    font-weight:600;
  }
  .question-text{ font-size:1rem; line-height:1.55; margin-bottom:16px; }
  .opt{
    display:flex;
    gap:10px;
    align-items:flex-start;
    padding:11px 13px;
    border-radius:7px;
    border:1px solid var(--paper-dim);
    margin-bottom:8px;
    cursor:pointer;
    transition:background .12s;
  }
  .opt:hover{ background:var(--paper-dim); }
  .opt.correct{ background:#E6F4ED; border-color:var(--ok-green); }
  .opt.wrong{ background:#FBEAE8; border-color:var(--clay-red); }
  .opt-letter{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    color:var(--board);
    flex-shrink:0;
  }

  /* ---------- SIMULADO ---------- */
  .timer-box{
    font-family:'JetBrains Mono', monospace;
    font-size:1.3rem;
    font-weight:600;
    background:var(--board);
    color:var(--chalk-yellow);
    padding:8px 16px;
    border-radius:7px;
    display:inline-block;
    margin-bottom:18px;
  }
  .progress-bar-track{
    width:100%; height:6px; background:var(--paper-dim);
    border-radius:4px; overflow:hidden; margin-bottom:20px;
  }
  .progress-bar-fill{
    height:100%; background:var(--clay-red); transition:width .3s;
  }

  /* ---------- REDACAO ---------- */
  textarea{
    width:100%;
    min-height:280px;
    padding:16px;
    border-radius:8px;
    border:1px solid var(--paper-dim);
    background:#fff;
    color:var(--ink);
    line-height:1.6;
    resize:vertical;
  }
  .comp-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--paper-dim);
  }
  .comp-row:last-child{ border-bottom:none; }
  .comp-name{ font-weight:600; font-size:0.88rem; max-width:70%; }
  .comp-score{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    color:var(--board);
  }
  .comp-comment{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .nota-total{
    text-align:center;
    padding:22px;
    background:linear-gradient(135deg, var(--board) 0%, var(--board-alt) 100%);
    border-radius:8px;
    margin-bottom:18px;
  }
  .nota-total .num{
    font-family:'JetBrains Mono', monospace;
    font-size:2.6rem;
    font-weight:700;
    color:var(--chalk-yellow);
  }
  .nota-total .lbl{ color:var(--chalk-white); opacity:0.7; font-size:0.85rem; }

  /* ---------- RANKING ---------- */
  .rank-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 14px;
    border-radius:8px;
    margin-bottom:8px;
    background:var(--paper-dim);
  }
  .rank-row.me{ background:#FCF3DE; border:1px solid var(--chalk-yellow); }
  .rank-pos{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    width:28px;
    text-align:center;
    color:var(--board);
  }
  .rank-name{ flex:1; font-weight:500; }
  .rank-pts{ font-family:'JetBrains Mono', monospace; font-weight:600; }

  .loading-dots{ opacity:0.7; font-style:italic; font-size:0.9rem; }
  .empty-note{ color:var(--ink-soft); font-size:0.9rem; font-style:italic; }

  @media (max-width:800px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; overflow-x:auto; padding:14px; }
    .brand,.brand-sub,.sidebar-foot{ display:none; }
    .main{ padding:20px; }
    .stat-grid{ grid-template-columns:repeat(2,1fr); }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<div id="app-loading" style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#101B33; color:#fff; font-family:'Inter',sans-serif;">

<script>
/* ============================================================

    pontos:['Média: soma de todos os valores ÷ quantidade de valores','Mediana: valor central quando os dados estão ordenados; resiste a outliers','Desvio padrão: mede o quanto os dados se espalham em torno da média']},
  {trilha:'enem', materia:'Matemática', assunto:'Análise Combinatória',
    resumo:'Análise Combinatória estuda como contar de quantas formas diferentes é possível organizar ou escolher elementos de um conjunto, usando o Princípio Fundamental da Contagem, permutações, arranjos e combinações. É a base para calcular probabilidades no ENEM.',
    aprofundamento:'O ponto-chave é identificar se a ordem dos elementos importa ou não. Se a ordem importa (ex: formar uma senha, organizar pessoas em fila), usa-se permutação ou arranjo. Se a ordem NÃO importa (ex: escolher um grupo de pessoas para uma comissão, sem função definida), usa-se combinação. A fórmula de combinação é C(n,p) = n!/(p!×(n−p)!), enquanto arranjo é A(n,p) = n!/(n−p)! — a diferença entre elas é justamente que a combinação divide também por p!, eliminando as repetições que vêm apenas da ordem diferente dos mesmos elementos. Erro comum: usar arranjo/permutação quando na verdade a situação pede combinação (ou vice-versa) — sempre pergunte "trocar a ordem gera um resultado diferente?" antes de escolher a fórmula.',
    exemplo:'Escolher 3 pessoas entre 5 para formar uma comissão (ordem não importa): C(5,3) = 5!/(3!×2!) = 10 formas. Já formar uma fila com essas 3 pessoas escolhidas (ordem importa): seria um cálculo de permutação à parte.',
    pontos:['Ordem importa → permutação ou arranjo; ordem não importa → combinação','C(n,p) = n!/(p!×(n−p)!)','Sempre pergunte: "trocar a ordem muda o resultado?" antes de escolher a fórmula']},
  {trilha:'enem', materia:'Matemática', assunto:'Probabilidade',
    resumo:'Probabilidade mede a chance de um evento acontecer, calculada como número de casos favoráveis dividido pelo número de casos possíveis. No ENEM, conecta-se diretamente com Análise Combinatória para contar esses casos em situações mais complexas.',
    aprofundamento:'A probabilidade da união de dois eventos é P(A∪B) = P(A) + P(B) − P(A∩B) — a mesma lógica de conjuntos, subtraindo a interseção contada duas vezes. A probabilidade condicional, P(A|B), calcula a chance de A acontecer sabendo que B já aconteceu, e é dada por P(A∩B)/P(B) — muito cobrada em contextos médicos (chance de uma doença dado um resultado de exame) e jogos de cartas/dados sequenciais. Eventos independentes (um não afeta o outro) têm P(A∩B) = P(A)×P(B); eventos dependentes exigem calcular a probabilidade condicional passo a passo. Erro comum: tratar eventos dependentes como se fossem independentes, multiplicando probabilidades sem ajustar para a mudança de condição.',
    exemplo:'Numa urna com 5 bolas vermelhas e 3 azuis, a probabilidade de tirar 2 vermelhas seguidas sem reposição é: (5/8) × (4/7) = 20/56 = 5/14 (a segunda probabilidade muda porque uma bola já foi retirada).',
    pontos:['P(evento) = casos favoráveis / casos possíveis','P(A∪B) = P(A) + P(B) − P(A∩B)','Sem reposição, as probabilidades mudam a cada evento (eventos dependentes)']},
  {trilha:'enem', materia:'Matemática', assunto:'Introdução às Funções',
    resumo:'Função é uma relação em que cada valor de entrada (x) corresponde a exatamente um valor de saída (y). Função composta e função inversa são extensões desse conceito, testando se o aluno realmente entende a relação entre entrada e saída, e não apenas decora fórmulas prontas.',
    aprofundamento:'Função composta, escrita como (f∘g)(x) = f(g(x)), significa aplicar primeiro g e depois usar esse resultado como entrada de f — a ordem de aplicação é essencial e não pode ser invertida. Função inversa, f⁻¹(x), "desfaz" o que a função original fez: se f(2)=7, então f⁻¹(7)=2. Só existe função inversa quando a função original é bijetora (cada saída corresponde a uma única entrada). Erro comum: calcular f⁻¹(x) como 1/f(x) — a função inversa NÃO é o inverso multiplicativo, é a função que desfaz a transformação original.',
    exemplo:'Se f(x) = 2x+3, para achar a inversa: trocamos x por y, isolamos: y=2x+3 → x=(y−3)/2, logo f⁻¹(x) = (x−3)/2. Conferindo: f(2)=7, e f⁻¹(7) = (7−3)/2 = 2. Correto.',
    pontos:['(f∘g)(x) = f(g(x)) — aplica g primeiro, depois f','Função inversa desfaz a transformação original (não é 1/f(x))','Só existe inversa se a função for bijetora']},
  {trilha:'enem', materia:'Matemática', assunto:'Função Afim',
    resumo:'Função afim é do tipo f(x) = ax + b, cujo gráfico é sempre uma reta. É a função mais cobrada no ENEM porque modela situações do dia a dia com "custo fixo + custo variável", como corridas de aplicativo, contas de telefone e tarifas de água.',
    aprofundamento:'O coeficiente "b" representa o valor de partida (quando x=0, antes de qualquer variação, também chamado de valor inicial ou intercepto), e o coeficiente "a" representa a taxa de variação — quanto y muda para cada unidade que x aumenta. A raiz da função (onde f(x)=0) indica em que ponto o gráfico cruza o eixo x. Funções definidas por várias sentenças (função por partes) aparecem em tarifas com faixas diferentes, como conta de luz que cobra um valor por kWh até certo consumo e outro valor acima disso. Se a reta sobe, "a" é positivo (função crescente); se desce, "a" é negativo (função decrescente); quanto mais inclinada, maior o valor absoluto de "a".',
    exemplo:'Uma corrida de táxi custa C(km) = 6 + 2,5×km. Para uma corrida de 10 km: C(10) = 6 + 2,5×10 = R$ 31,00. A raiz dessa função (onde custaria zero) não tem sentido prático aqui, mas seria em km=−2,4.',
    pontos:['f(x) = ax + b — gráfico é sempre uma reta','"a" é a taxa de variação (inclinação); "b" é o valor quando x=0','Reta sobe: a>0 (crescente); reta desce: a<0 (decrescente)']},
  {trilha:'enem', materia:'Matemática', assunto:'Função Quadrática',
    resumo:'Função quadrática é do tipo f(x) = ax² + bx + c (a≠0), cujo gráfico é uma parábola. Aparece no ENEM em problemas de otimização (maximizar lucro, minimizar custo) e em situações de lançamento de projéteis.',
    aprofundamento:'O discriminante (Δ = b²−4ac) define quantas raízes reais a função tem: Δ>0 (parábola cruza o eixo x em dois pontos), Δ=0 (toca o eixo x em um único ponto — o vértice), Δ<0 (não cruza o eixo x). O vértice da parábola, ponto de máximo ou mínimo, tem coordenadas xv = −b/2a e yv = −Δ/4a — se "a" é positivo, a parábola tem concavidade para cima (vértice é ponto de mínimo); se "a" é negativo, concavidade para baixo (vértice é ponto de máximo). A forma fatorada f(x) = a(x−r1)(x−r2), usando as raízes, facilita esboçar o gráfico rapidamente.',
    exemplo:'Uma bola é lançada e sua altura é h(t) = −5t² + 20t. O tempo de altura máxima é tv = −20/(2×−5) = 2s, e a altura máxima é h(2) = −5×4+40 = 20m.',
    pontos:['Δ = b²−4ac define o número de raízes reais','Vértice: xv = −b/2a (ponto de máximo se a<0, mínimo se a>0)','Forma fatorada usa as raízes para facilitar o esboço do gráfico']},
  {trilha:'enem', materia:'Matemática', assunto:'Exponencial',
    resumo:'Função exponencial é do tipo f(x) = aˣ (a>0, a≠1), caracterizada por crescimento ou decrescimento muito mais rápido que o da função afim. É usada para modelar crescimento populacional, juros compostos, meia-vida radioativa e propagação de epidemias.',
    aprofundamento:'Se a base "a" é maior que 1, a função é crescente (cresce cada vez mais rápido); se a base está entre 0 e 1, a função é decrescente (decai cada vez mais devagar, se aproximando de zero sem nunca chegar lá). Equações exponenciais são resolvidas igualando as bases: se aˣ = aʸ, então x = y — por isso o primeiro passo é sempre tentar escrever os dois lados da equação com a mesma base. Um erro muito comum é achar que crescimento exponencial é "parecido" com crescimento linear em curto prazo — na prática, a diferença fica gigantesca rapidamente, e é exatamente essa aceleração que torna a exponencial tão poderosa para modelar juros compostos e epidemias.',
    exemplo:'Resolvendo 2^x = 32: escrevemos 32 como 2⁵, logo 2^x = 2⁵ → x=5.',
    pontos:['a>1: função crescente; 0<a<1: função decrescente','Para resolver equações exponenciais, iguale as bases primeiro','Modela juros compostos, crescimento populacional e meia-vida radioativa']},
  {trilha:'enem', materia:'Matemática', assunto:'Logaritmos',
    resumo:'Logaritmo é a operação inversa da exponenciação: log_a(b) = x significa que a^x = b. É a ferramenta usada para "trazer o expoente para baixo", essencial em equações exponenciais que não podem ser resolvidas só igualando bases.',
    aprofundamento:'As propriedades operatórias mais cobradas são: log(m×n) = log(m)+log(n) (log do produto vira soma), log(m/n) = log(m)−log(n) (log do quociente vira subtração), e log(m^k) = k×log(m) (o expoente "desce" multiplicando). A mudança de base, log_a(b) = log_c(b)/log_c(a), é usada quando a calculadora ou tabela só tem uma base disponível (geralmente log na base 10). A função logarítmica é o "espelho" da função exponencial — seus gráficos são simétricos em relação à reta y=x. Erro comum: aplicar as propriedades operatórias em log de soma ou subtração (log(m+n) NÃO é log(m)+log(n) — essa propriedade só vale para produto e quociente).',
    exemplo:'Resolvendo log₂(x) = 5: por definição, 2⁵=x, logo x=32.',
    pontos:['log_a(b)=x significa a^x=b (definição fundamental)','log(m×n)=log(m)+log(n); log(m^k)=k×log(m)','log(m+n) NÃO é igual a log(m)+log(n) — essa propriedade não existe']},
  {trilha:'enem', materia:'Matemática', assunto:'Trigonometria',
    resumo:'Trigonometria estuda as relações entre ângulos e lados em triângulos e na circunferência trigonométrica, usando seno, cosseno e tangente. É aplicada em problemas de altura, distância e também nas funções periódicas (movimentos cíclicos, ondas, marés).',
    aprofundamento:'A relação fundamental sen²x + cos²x = 1 é a base para deduzir todas as outras identidades trigonométricas. Na circunferência trigonométrica (raio 1), o seno é a coordenada y e o cosseno é a coordenada x de um ponto que se move ao longo do círculo conforme o ângulo aumenta — por isso ambos os valores oscilam entre −1 e 1. As funções seno e cosseno são periódicas (se repetem a cada 360° ou 2π radianos), o que as torna ideais para modelar fenômenos cíclicos como marés, batimentos cardíacos e ondas sonoras. Arcos côngruos são ângulos que têm a mesma posição final na circunferência (diferem por voltas completas de 360°), tendo os mesmos valores de seno, cosseno e tangente.',
    exemplo:'Sabendo que sen(30°) = 0,5, o cos(30°) pode ser encontrado por sen²+cos²=1: 0,25+cos²=1 → cos²=0,75 → cos(30°) = √0,75 ≈ 0,866.',
    pontos:['sen²x + cos²x = 1 (relação fundamental, base de tudo)','Seno e cosseno são periódicos: se repetem a cada 360°','tg(x) = sen(x)/cos(x) — relação entre as três razões principais']},
  {trilha:'enem', materia:'Matemática', assunto:'Matemática Comercial e Financeira',
    resumo:'Matemática Financeira estuda o cálculo de juros — a remuneração cobrada ou paga pelo uso do dinheiro ao longo do tempo — em regime simples ou composto. É um dos assuntos mais aplicados do ENEM, presente em financiamentos, investimentos e cartões de crédito.',
    aprofundamento:'Juros simples crescem de forma linear: J = C×i×t (capital × taxa × tempo), sempre calculado sobre o capital inicial. Juros compostos crescem de forma exponencial: M = C×(1+i)^t (montante = capital vezes (1+taxa) elevado ao tempo), porque os juros de cada período passam a incidir também sobre os juros anteriores ("juros sobre juros"). Essa diferença é crucial: no longo prazo, juros compostos crescem MUITO mais rápido que juros simples, mesmo com a mesma taxa — é por isso que dívidas de cartão de crédito (juros compostos) crescem tão rápido se não pagas. Valor atual de um conjunto de capitais traz valores futuros para o presente, descontando a taxa de juros — usado para comparar propostas de pagamento em datas diferentes.',
    exemplo:'R$1.000 aplicados a 10% ao ano: em juros simples, após 3 anos = 1000×(1+0,10×3) = R$1.300. Em juros compostos, após 3 anos = 1000×(1,10)³ = R$1.331 — a diferença cresce ano após ano.',
    pontos:['Juros simples: J = C×i×t (crescimento linear)','Juros compostos: M = C×(1+i)^t (crescimento exponencial, "juros sobre juros")','No longo prazo, juros compostos superam muito os juros simples com a mesma taxa']},
  {trilha:'enem', materia:'Matemática', assunto:'Matrizes',
    resumo:'Matrizes são tabelas retangulares de números organizados em linhas e colunas, usadas para representar e resolver sistemas de dados de forma organizada — desde tabelas de preços até transformações geométricas e criptografia.',
    aprofundamento:'A adição e subtração de matrizes só é possível entre matrizes de mesma dimensão, somando ou subtraindo elemento por elemento nas mesmas posições. A multiplicação de matrizes é mais complexa: só é possível se o número de colunas da primeira matriz for igual ao número de linhas da segunda, e o resultado NÃO é comutativo (A×B geralmente é diferente de B×A). A matriz inversa (A⁻¹) é aquela que, multiplicada pela matriz original, resulta na matriz identidade — só existe para matrizes quadradas com determinante diferente de zero. Erro comum: tentar somar matrizes de dimensões diferentes, ou assumir que a multiplicação de matrizes é comutativa como a multiplicação de números.',
    exemplo:'Multiplicando a matriz linha [2 3] pela matriz coluna [4; 5]: resultado = 2×4 + 3×5 = 8+15 = 23 (uma matriz 1×1).',
    pontos:['Soma/subtração: só entre matrizes de mesma dimensão, elemento por elemento','Multiplicação: colunas da 1ª = linhas da 2ª; NÃO é comutativa (A×B ≠ B×A)','Matriz inversa só existe se o determinante for diferente de zero']},
  {trilha:'enem', materia:'Matemática', assunto:'Determinantes',
    resumo:'Determinante é um número calculado a partir de uma matriz quadrada, usado para saber se ela tem inversa, resolver sistemas lineares e calcular áreas/volumes em geometria analítica.',
    aprofundamento:'Para matrizes 2×2, o determinante é calculado por "produto da diagonal principal menos produto da diagonal secundária" (ad−bc, para a matriz [[a,b],[c,d]]). Para matrizes 3×3, usa-se a Regra de Sarrus, repetindo as duas primeiras colunas ao lado da matriz e somando os produtos das diagonais principais, subtraindo os produtos das diagonais secundárias. Se o determinante de uma matriz é zero, ela NÃO tem inversa (é chamada de matriz singular). Uma propriedade importante: se duas linhas (ou colunas) de uma matriz são proporcionais ou iguais, o determinante é automaticamente zero — isso permite identificar rapidamente matrizes sem inversa, sem precisar calcular tudo.',
    exemplo:'Para a matriz [[3,2],[1,4]], o determinante é: (3×4) − (2×1) = 12−2 = 10. Como é diferente de zero, essa matriz tem inversa.',
    pontos:['2×2: determinante = ad−bc (diagonal principal menos secundária)','3×3: Regra de Sarrus (repete as duas primeiras colunas)','Determinante zero = matriz sem inversa (matriz singular)']},
  {trilha:'enem', materia:'Matemática', assunto:'Sistemas Lineares',
    resumo:'Sistema linear é um conjunto de equações do 1º grau com as mesmas incógnitas, resolvido simultaneamente. É usado para modelar situações com múltiplas condições, como misturas de produtos, alocação de recursos e problemas de idade.',
    aprofundamento:'O escalonamento é o método mais usado para resolver sistemas maiores: organiza-se as equações de forma sistemática, eliminando uma incógnita de cada vez através de operações entre as linhas (multiplicar uma equação por um número e somar/subtrair de outra), até isolar uma variável por vez. A discussão de um sistema linear classifica-o em três tipos: possível e determinado (uma única solução), possível e indeterminado (infinitas soluções) ou impossível (nenhuma solução) — essa classificação pode ser feita analisando o determinante da matriz dos coeficientes: se for diferente de zero, o sistema é possível e determinado. A representação matricial de um sistema (escrevendo os coeficientes como uma matriz) conecta diretamente esse assunto com matrizes e determinantes.',
    exemplo:'Sistema: x+y=10 e x−y=2. Somando as duas equações: 2x=12 → x=6; substituindo: 6+y=10 → y=4. Solução única (sistema possível e determinado).',
    pontos:['Escalonamento: elimina uma incógnita de cada vez através de operações entre linhas','Sistema pode ser possível determinado (1 solução), indeterminado (infinitas) ou impossível (nenhuma)','Determinante da matriz de coeficientes ≠0 → sistema possível e determinado']},
  {trilha:'enem', materia:'Matemática', assunto:'Geometria Analítica',
    resumo:'Geometria Analítica estuda figuras geométricas usando coordenadas no plano cartesiano e equações algébricas, unindo álgebra e geometria. É usada para calcular distâncias, áreas, e equações de retas e circunferências a partir de pontos.',
    aprofundamento:'A distância entre dois pontos usa uma aplicação direta do Teorema de Pitágoras: d = √[(x2−x1)² + (y2−y1)²]. O coeficiente angular de uma reta (m = Δy/Δx) indica sua inclinação: retas paralelas têm o mesmo coeficiente angular, e retas perpendiculares têm coeficientes angulares cujo produto é −1. A equação reduzida da reta (y = mx+n) usa o coeficiente angular "m" e o coeficiente linear "n" (onde a reta cruza o eixo y). A equação da circunferência, (x−a)² + (y−b)² = r², descreve todos os pontos a uma distância "r" (raio) do centro (a,b) — essa fórmula também vem diretamente da fórmula de distância entre dois pontos.',
    exemplo:'A distância entre os pontos (1,2) e (4,6) é: d = √[(4−1)²+(6−2)²] = √[9+16] = √25 = 5.',
    pontos:['Distância entre pontos: d = √[(x2−x1)²+(y2−y1)²] (vem de Pitágoras)','Retas paralelas: mesmo coeficiente angular; perpendiculares: produto dos coeficientes = −1','Equação da circunferência: (x−a)²+(y−b)²=r², centro (a,b) e raio r']},
  {trilha:'enem', materia:'Matemática', assunto:'Módulo',
    resumo:'Módulo (ou valor absoluto) de um número representa sua distância até o zero na reta numérica, sempre um valor positivo ou zero — |x| = x se x≥0, e |x| = −x se x<0. É usado para resolver equações e funções que envolvem "distância" sem se importar com a direção (positiva ou negativa).',
    aprofundamento:'A função modular f(x) = |x| tem gráfico em formato de "V", pois reflete a parte negativa do gráfico de f(x)=x para cima do eixo x. Ao resolver equações modulares do tipo |x| = a (com a>0), existem sempre duas soluções: x=a ou x=−a, porque tanto o número positivo quanto seu oposto têm o mesmo módulo. Já equações do tipo |x−k| = a representam a distância entre x e k, muito usadas para expressar intervalos de tolerância (ex: uma peça que pode variar até 2mm do tamanho ideal). Erro comum: esquecer o caso negativo ao resolver equações modulares, considerando apenas uma das duas soluções possíveis.',
    exemplo:'Resolvendo |x−3| = 5: x−3=5 (x=8) ou x−3=−5 (x=−2). Ambas as soluções satisfazem a equação original.',
    pontos:['|x| = x se x≥0; |x| = −x se x<0 (sempre resultado positivo ou zero)','Equações |x|=a (a>0) sempre têm duas soluções: x=a ou x=−a','Gráfico da função modular tem formato de "V"']},
  {trilha:'enem', materia:'Matemática', assunto:'Números Complexos',
    resumo:'Números complexos ampliam o conjunto dos números reais, incluindo a unidade imaginária "i" (onde i² = −1), permitindo resolver equações que não têm solução real, como x²+1=0. São representados na forma z = a+bi, com aplicações em engenharia elétrica e processamento de sinais.',
    aprofundamento:'Um número complexo z=a+bi tem parte real "a" e parte imaginária "b". As operações de soma e subtração são feitas separadamente entre partes reais e imaginárias; a multiplicação usa distributividade normal, lembrando que i²=−1. A forma trigonométrica (ou polar) representa o número complexo usando seu módulo (distância até a origem) e seu argumento (ângulo), sendo especialmente útil para multiplicação e divisão de números complexos, e essencial para calcular potências e raízes de forma mais simples do que na forma algébrica.',
    exemplo:'Multiplicando (2+3i)×(1−i): 2×1 + 2×(−i) + 3i×1 + 3i×(−i) = 2−2i+3i−3i² = 2+i−3×(−1) = 2+i+3 = 5+i.',
    pontos:['i² = −1 (a definição que resolve equações sem solução real)','z = a+bi: "a" é a parte real, "b" é a parte imaginária','Forma trigonométrica facilita multiplicação, divisão e potenciação']},
  {trilha:'enem', materia:'Matemática', assunto:'Polinômios',
    resumo:'Polinômio é uma expressão algébrica formada pela soma de termos com variáveis elevadas a expoentes inteiros não negativos (ex: 3x²+2x−5). O estudo inclui operações entre polinômios e técnicas de divisão, como o Dispositivo de Briot-Ruffini.',
    aprofundamento:'A divisão de polinômios segue lógica parecida com a divisão de números: divide-se o termo de maior grau do dividendo pelo termo de maior grau do divisor, multiplica-se de volta e subtrai-se, repetindo o processo até não ser mais possível dividir. Quando o divisor é um binômio do tipo (x−a), o Dispositivo de Briot-Ruffini oferece um atalho mais rápido que a divisão tradicional, usando apenas os coeficientes do polinômio e o valor "a". O grau do polinômio resultante da divisão é sempre o grau do dividendo menos o grau do divisor.',
    exemplo:'Dividindo x²−5x+6 por (x−2) usando Briot-Ruffini: coeficientes 1,−5,6 e raiz 2. Primeiro coeficiente desce (1); 1×2+(−5)=−3; −3×2+6=0 (resto zero). Quociente: x−3, resto 0.',
    pontos:['Grau do quociente = grau do dividendo − grau do divisor','Briot-Ruffini: atalho para dividir por binômios do tipo (x−a)','Resto zero na divisão significa que (x−a) é raiz do polinômio']},
  {trilha:'enem', materia:'Matemática', assunto:'Equações Algébricas',
    resumo:'Equações algébricas são equações polinomiais igualadas a zero (P(x)=0), cujas soluções são chamadas de raízes. O estudo inclui o Teorema Fundamental da Álgebra, multiplicidade de raízes, Relações de Girard e raízes complexas.',
    aprofundamento:'O Teorema Fundamental da Álgebra garante que toda equação polinomial de grau n tem exatamente n raízes (contando repetições e números complexos). As Relações de Girard conectam os coeficientes do polinômio diretamente com a soma e o produto das raízes, sem precisar calculá-las individualmente — muito útil para verificar respostas ou resolver problemas onde só se conhece parte das raízes. Um resultado importante: se um polinômio com coeficientes reais tem uma raiz complexa, seu conjugado também é obrigatoriamente raiz — as raízes complexas sempre aparecem em pares conjugados nesse tipo de polinômio.',
    exemplo:'Para x²−7x+10=0 (raízes 2 e 5), Girard confirma: soma das raízes = −(−7)/1 = 7 (2+5=7 ✓); produto das raízes = 10/1 = 10 (2×5=10 ✓).',
    pontos:['Toda equação de grau n tem exatamente n raízes (Teorema Fundamental da Álgebra)','Relações de Girard: conectam soma/produto das raízes aos coeficientes, sem calculá-las','Raízes complexas de polinômios com coeficientes reais aparecem sempre em pares conjugados']},
  {trilha:'enem', materia:'Linguagens', assunto:'Interpretação de texto',
    resumo:'A maior parte das questões de Linguagens do ENEM depende de interpretação, não de decoreba. A banca costuma testar se o candidato entende a intenção do autor, o público-alvo do texto e o contexto de produção.',
    aprofundamento:'Uma técnica que funciona bem é ler primeiro o comando da questão (o que ela está pedindo) antes de ler o texto todo com atenção máxima — isso ajuda a filtrar o que realmente importa durante a leitura. As bancas costumam criar alternativas "quase certas", que repetem palavras do texto mas mudam o sentido ou generalizam demais uma ideia pontual. Por isso, desconfiar de alternativas com termos absolutos ("sempre", "nunca", "todos", "nenhum") é uma estratégia sólida, porque textos reais raramente sustentam afirmações tão categóricas. Identificar o gênero textual (notícia, charge, poema, artigo de opinião) também ajuda a prever a intenção comunicativa por trás do texto.',
    exemplo:'Numa charge que satiriza um político usando ironia, a alternativa correta normalmente reconhece a crítica por trás do humor — não a leitura literal da imagem.',
    pontos:['Sempre volte ao texto antes de escolher a alternativa','Desconfie de alternativas com termos absolutos ("sempre", "nunca")','Identifique o gênero textual (notícia, charge, poema, artigo)']},
  {trilha:'enem', materia:'Linguagens', assunto:'Figuras de linguagem',
    resumo:'Figuras de linguagem são recursos expressivos usados para dar mais força, beleza ou efeito de sentido a um texto. São recorrentes em questões que envolvem textos literários, letras de música e charges.',
    aprofundamento:'É comum confundir metáfora com comparação (símile): a comparação usa conectivo explícito ("como", "tal qual"), enquanto a metáfora funde os dois elementos sem conectivo, criando uma identidade direta. Outra confusão frequente é entre hipérbole (exagero) e ironia (dizer o oposto do que se pensa, geralmente com intenção crítica ou irônica). O ENEM costuma contextualizar essas figuras dentro de letras de música ou textos literários regionais, exigindo que o candidato reconheça o efeito de sentido pretendido, não apenas o nome técnico da figura.',
    exemplo:'"Ele é um leão" = metáfora (identifica direto). "Ele é como um leão" = comparação (usa "como"). "Chorei rios de lágrimas" = hipérbole (exagero proposital).',
    pontos:['Metáfora: comparação implícita','Antítese: oposição de ideias','Hipérbole: exagero proposital']},
  {trilha:'enem', materia:'Linguagens', assunto:'Variação linguística',
    resumo:'O português falado no Brasil varia conforme região, classe social, idade e contexto. O ENEM valoriza o respeito a essas variações, sem tratar nenhuma forma de falar como "errada", apenas adequada ou não ao contexto.',
    aprofundamento:'A prova nunca vai considerar uma variação regional ou popular como "erro de português" — o conceito central é adequação, não correção absoluta. Isso significa que uma expressão típica do interior do Nordeste, por exemplo, é perfeitamente adequada numa conversa informal entre familiares, mas pode não ser adequada num relatório técnico formal. O ENEM costuma trazer textos que valorizam a diversidade linguística brasileira (poemas regionais, letras de rap, textos de cordel) justamente para testar se o candidato entende esse conceito de adequação ao contexto, e não memorização de "regras certas x erradas".',
    exemplo:'"Nós vai" é inadequado num texto formal (norma culta pede "nós vamos"), mas é uma variação linguística legítima e comum em determinadas regiões e contextos informais — não é "errado", é outra norma de uso.',
    pontos:['Variação regional: sotaques e vocabulário por região','Variação social: diferença entre grupos sociais','Registro formal x informal: adequação ao contexto de comunicação']},
  {trilha:'enem', materia:'Ciências Humanas', assunto:'Geografia - Urbanização',
    resumo:'A urbanização brasileira aconteceu de forma rápida e concentrada, principalmente a partir da segunda metade do século XX, gerando desafios como moradia irregular, mobilidade urbana e desigualdade territorial nas grandes cidades.',
    aprofundamento:'O Brasil urbanizou-se de forma tardia e muito acelerada (diferente da Europa, onde o processo foi mais lento e ligado à Revolução Industrial). Isso significa que a infraestrutura das cidades brasileiras não acompanhou o ritmo de crescimento populacional, gerando os problemas típicos cobrados no ENEM: favelização, déficit habitacional, mobilidade urbana precária e forte desigualdade entre bairros centrais bem estruturados e periferias carentes de serviços básicos. O conceito de "segregação socioespacial" é central: refere-se à separação, muitas vezes informal, entre grupos sociais dentro do espaço urbano, refletindo desigualdades de renda e acesso a serviços.',
    exemplo:'Uma questão típica apresenta um mapa de uma cidade brasileira mostrando bairros centrais com infraestrutura completa e periferias sem saneamento básico, pedindo para identificar o conceito de segregação socioespacial.',
    pontos:['Êxodo rural: migração do campo para a cidade','Macrocefalia urbana: concentração populacional em poucas grandes cidades','Segregação socioespacial: desigualdade no acesso à cidade']},
  {trilha:'enem', materia:'Ciências Humanas', assunto:'História do Brasil',
    resumo:'O ENEM costuma cobrar processos históricos de longa duração (escravidão, formação territorial, república) relacionando-os com seus impactos na sociedade brasileira atual, mais do que datas isoladas.',
    aprofundamento:'A abordagem do ENEM é predominantemente temática e crítica, não factual: raramente pergunta "em que ano aconteceu X", e sim "qual foi a consequência de longo prazo de X para a sociedade brasileira atual". Isso significa que decorar datas isoladas rende pouco resultado comparado a entender as relações de causa e consequência entre eventos. Por exemplo, entender como a escravidão moldou desigualdades raciais e sociais que persistem hoje é mais valioso para a prova do que saber a data exata da Lei Áurea. Contextos econômicos (a economia agroexportadora, a industrialização tardia) costumam ser a chave para entender decisões políticas do período.',
    exemplo:'Uma questão pode pedir para relacionar o legado da escravidão com desigualdades sociais e raciais observadas no mercado de trabalho brasileiro atual — não apenas com o ano de abolição.',
    pontos:['Pensar sempre em causa e consequência, não só na data do fato','Relacionar o passado com desigualdades ou estruturas sociais de hoje','Contextos econômicos costumam explicar decisões políticas da época']},
  {trilha:'enem', materia:'Ciências Humanas', assunto:'Filosofia',
    resumo:'As questões de Filosofia no ENEM geralmente pedem para relacionar um conceito de um filósofo com uma situação do cotidiano, sem exigir memorização extensa de obras completas.',
    aprofundamento:'A estratégia mais eficiente é dominar o conceito central de cada grande corrente filosófica (não a biografia completa do filósofo). Kant e o imperativo categórico (agir segundo princípios que poderiam virar lei universal), o contrato social de Rousseau/Hobbes (a sociedade como acordo entre indivíduos), o utilitarismo (avaliar ações pelo resultado/consequência, não pela intenção) — esses são os conceitos mais recorrentes. O ENEM apresenta uma situação cotidiana (ex: um dilema ético) e pede para identificar qual corrente filosófica melhor explica ou se aplica àquela situação.',
    exemplo:'Uma pessoa devolve uma carteira perdida mesmo sem ninguém ver, só porque "é a coisa certa a fazer" — isso ilustra bem o conceito kantiano de agir por dever, não por interesse ou consequência.',
    pontos:['Ética: reflexão sobre o que é certo/errado na ação humana','Contrato social: ideia de que a sociedade se organiza por acordo entre indivíduos','Foque no conceito central de cada pensador, não em biografia']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Introdução à Biologia',
    resumo:'Aborda os fundamentos do que define um ser vivo (características gerais dos seres vivos) e como a ciência produz conhecimento através do método científico. É a base conceitual para entender toda a disciplina de Biologia no ENEM.',
    aprofundamento:'As características gerais dos seres vivos (organização celular, metabolismo, homeostase, reprodução, hereditariedade, evolução, resposta a estímulos) são usadas para diferenciar o que é vivo do que não é — um tema clássico envolve os vírus, que não têm metabolismo próprio fora de uma célula hospedeira, gerando debate sobre serem ou não considerados seres vivos completos. O método científico segue etapas: observação, formulação de hipótese, experimentação (com grupo controle e grupo experimental) e conclusão — o ENEM gosta de apresentar um experimento e pedir para identificar qual é a variável controlada, qual é a manipulada, e qual seria uma conclusão válida a partir dos dados.',
    exemplo:'Num experimento testando se a luz afeta o crescimento de plantas, o grupo controle fica em condições normais e o grupo experimental recebe a variável testada (mais ou menos luz) — todas as outras condições (água, temperatura, solo) devem ser mantidas iguais entre os grupos para a comparação ser válida.',
    pontos:['Seres vivos: organização celular, metabolismo, reprodução, resposta a estímulos, evolução','Vírus geram debate por não terem metabolismo próprio fora de uma célula hospedeira','Método científico: observação → hipótese → experimento (controle x experimental) → conclusão']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Bioquímica',
    resumo:'Estuda a composição química dos seres vivos — água e sais minerais (constituintes inorgânicos) e carboidratos, lipídios e proteínas (constituintes orgânicos) — e como essas moléculas sustentam funções vitais como energia, estrutura e reações metabólicas.',
    aprofundamento:'Carboidratos (glicídios) são a principal fonte de energia rápida do corpo, armazenados como glicogênio no fígado e músculos, e como amido nas plantas; lipídios armazenam energia de forma mais concentrada e de longo prazo, além de formar membranas celulares (fosfolipídios) e hormônios (esteroides); proteínas são formadas por aminoácidos e desempenham funções estruturais, enzimáticas e de defesa (anticorpos). A desnaturação de proteínas (perda da estrutura tridimensional por calor ou pH extremo) é um tema recorrente, relacionado a por que febre muito alta é perigosa e por que cozinhar um ovo muda sua textura permanentemente.',
    exemplo:'O colesterol, um lipídio esteroide, é essencial para a produção de hormônios e membranas celulares, mas seu excesso na dieta está associado a doenças cardiovasculares — um tema de saúde pública recorrente no ENEM.',
    pontos:['Carboidratos: energia rápida (glicose, glicogênio, amido)','Lipídios: energia de reserva de longo prazo, membranas celulares, hormônios','Proteínas: estrutura, enzimas, defesa — podem ser desnaturadas por calor ou pH extremo']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Biologia Molecular e Engenharia Genética',
    resumo:'Estuda a estrutura do DNA e RNA, os processos de replicação, transcrição e tradução (síntese proteica), e as tecnologias modernas de manipulação genética, como CRISPR e transgenia. É um dos blocos mais atuais do ENEM, ligado a biotecnologia e saúde.',
    aprofundamento:'O dogma central da biologia molecular (DNA → RNA → Proteína) explica como a informação genética é usada para produzir as proteínas que definem as características de um organismo. A técnica CRISPR-Cas9 revolucionou a edição genética por permitir cortar e modificar sequências específicas de DNA com precisão e baixo custo, sendo usada em pesquisas médicas e agricultura. Testes de PCR (usados em diagnóstico de COVID-19, por exemplo) amplificam pequenas quantidades de material genético para detecção — um tema muito contextualizado desde a pandemia. Transgênicos são organismos que receberam genes de outra espécie, gerando debates éticos e ambientais sobre segurança alimentar e biodiversidade.',
    exemplo:'O teste de RT-PCR para COVID-19 detecta material genético do vírus (RNA) amplificando-o milhares de vezes até ser detectável — uma aplicação direta e atual da biologia molecular.',
    pontos:['Dogma central: DNA → RNA → Proteína','CRISPR-Cas9: tecnologia de edição genética precisa e barata','Transgênicos: organismos com genes de outra espécie, geram debate ético e ambiental']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Citologia',
    resumo:'Estuda a estrutura e função da célula, unidade básica de todos os seres vivos, incluindo membrana plasmática, organelas citoplasmáticas e diferenças entre células procariontes e eucariontes.',
    aprofundamento:'A membrana plasmática, formada por uma bicamada de fosfolipídios com proteínas embutidas (modelo do mosaico fluido), controla o que entra e sai da célula através de difusão simples, osmose (movimento de água) e transporte ativo (com gasto de energia, contra o gradiente de concentração). As organelas têm funções especializadas: mitocôndrias realizam respiração celular, ribossomos sintetizam proteínas, complexo de Golgi processa e empacota substâncias, e lisossomos digerem materiais. Células procariontes (bactérias) não têm núcleo organizado nem organelas membranosas, enquanto células eucariontes (animais, plantas, fungos) têm núcleo definido e organelas complexas.',
    exemplo:'Ao colocar uma célula vegetal em água pura, ela incha por osmose (água entra pois a concentração interna de solutos é maior), mas não estoura porque a parede celular rígida contém a pressão — diferente de uma célula animal na mesma situação, que poderia sofrer lise celular.',
    pontos:['Membrana plasmática: controla entrada/saída por difusão, osmose e transporte ativo','Mitocôndria: respiração celular; Ribossomo: síntese de proteínas','Procariontes: sem núcleo organizado; Eucariontes: núcleo definido e organelas complexas']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Bioenergética',
    resumo:'Estuda como as células obtêm e utilizam energia através da respiração celular (aeróbica e fermentação) e da fotossíntese, os dois processos fundamentais que conectam o mundo vivo através de trocas de gases e energia.',
    aprofundamento:'A respiração celular aeróbica ocorre nas mitocôndrias e usa oxigênio para "quebrar" glicose, liberando bastante energia (ATP) e produzindo CO2 e água como subprodutos — é o processo inverso da fotossíntese. A fermentação ocorre na ausência de oxigênio e produz muito menos energia, gerando ácido lático (fermentação láctica, em músculos durante exercício intenso) ou álcool e CO2 (fermentação alcoólica, usada na produção de pão, cerveja e etanol combustível). A fotossíntese, realizada por plantas e algas nos cloroplastos, converte energia luminosa em energia química (glicose), usando CO2 e água como matéria-prima e liberando oxigênio como subproduto.',
    exemplo:'Durante um exercício físico intenso, quando o oxigênio não chega rápido o suficiente aos músculos, eles recorrem à fermentação láctica para gerar energia, e o acúmulo de ácido lático é o que causa a sensação de cansaço e queimação muscular.',
    pontos:['Respiração aeróbica: usa O2, produz muito ATP, libera CO2 e água','Fermentação: sem O2, produz pouco ATP (láctica: ácido lático; alcoólica: álcool + CO2)','Fotossíntese: luz + CO2 + água → glicose + O2 (processo inverso da respiração)']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Núcleo e Divisão Celular',
    resumo:'Estuda a estrutura do núcleo celular, os cromossomos, e os dois principais processos de divisão celular: mitose (gera células idênticas, usada em crescimento e reparo) e meiose (gera gametas com metade dos cromossomos, usada na reprodução sexuada).',
    aprofundamento:'A mitose produz duas células-filhas geneticamente idênticas à célula-mãe, mantendo o mesmo número de cromossomos — é o processo usado no crescimento do corpo e na reposição de células. A meiose reduz o número de cromossomos pela metade, formando gametas geneticamente diferentes entre si por causa da recombinação genética (crossing-over) — essa variabilidade é a base da diversidade entre irmãos, mesmo tendo os mesmos pais. Erros na divisão celular, como a não disjunção (cromossomos que não se separam corretamente), podem causar condições como a Síndrome de Down (trissomia do cromossomo 21).',
    exemplo:'A Síndrome de Down ocorre quando, por não disjunção durante a meiose, um gameta recebe uma cópia extra do cromossomo 21, resultando em três cópias desse cromossomo no indivíduo, em vez das duas normais.',
    pontos:['Mitose: 2 células idênticas, mesmo número de cromossomos (crescimento e reparo)','Meiose: 4 células diferentes, metade dos cromossomos (formação de gametas)','Não disjunção: erro na separação de cromossomos, pode causar síndromes genéticas']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Reprodução Humana',
    resumo:'Estuda os sistemas reprodutores masculino e feminino, os processos de formação de gametas, o ciclo menstrual, métodos contraceptivos e fecundação.',
    aprofundamento:'O ciclo menstrual é regulado por hormônios (FSH, LH, estrogênio e progesterona) que controlam a maturação do óvulo e a preparação do endométrio para uma possível gravidez — se não há fecundação, os níveis hormonais caem e ocorre a menstruação. Métodos contraceptivos hormonais (pílula) funcionam principalmente inibindo a ovulação através de hormônios sintéticos que "enganam" o corpo, fazendo-o reagir como se já estivesse grávido. O ENEM costuma contextualizar esse conteúdo com educação sexual, saúde reprodutiva e prevenção de gravidez na adolescência e de infecções sexualmente transmissíveis.',
    exemplo:'A pílula anticoncepcional combina hormônios que inibem a liberação de FSH e LH pela hipófise, impedindo a ovulação — sem óvulo liberado, não há possibilidade de fecundação.',
    pontos:['Ciclo menstrual regulado por FSH, LH, estrogênio e progesterona','Métodos hormonais geralmente inibem a ovulação','Fecundação ocorre nas tubas uterinas, geralmente poucos dias após a ovulação']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Embriologia Animal',
    resumo:'Estuda o desenvolvimento do embrião desde a fecundação até a formação completa dos órgãos, incluindo os anexos embrionários (âmnio, placenta) que protegem e nutrem o embrião em diferentes grupos de animais.',
    aprofundamento:'As fases do desenvolvimento embrionário seguem uma sequência: segmentação (divisões celulares sucessivas do zigoto), gastrulação (formação das três camadas germinativas: ectoderme, mesoderme, endoderme) e organogênese (formação dos órgãos a partir dessas camadas). Répteis e aves (animais amniotas) desenvolvem âmnio, cório e alantoide dentro do ovo; mamíferos desenvolvem a placenta, órgão que permite trocas diretas de nutrientes e gases entre mãe e feto. Vivíparos (mamíferos) se desenvolvem dentro do corpo da mãe; ovíparos (aves, répteis) se desenvolvem dentro de um ovo fora do corpo da mãe; ovovivíparos (alguns tubarões e cobras) se desenvolvem em ovos que permanecem dentro do corpo da mãe até a eclosão.',
    exemplo:'A placenta humana permite que oxigênio, nutrientes e anticorpos passem da mãe para o feto, enquanto dióxido de carbono e resíduos metabólicos passam do feto para a mãe ser eliminados — uma via de mão dupla essencial para o desenvolvimento fetal.',
    pontos:['Fases: segmentação → gastrulação (3 camadas germinativas) → organogênese','Placenta (mamíferos) permite trocas diretas entre mãe e feto','Vivíparos: nascem do corpo da mãe; Ovíparos: nascem de ovo; Ovovivíparos: ovo dentro da mãe']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Histologia Animal',
    resumo:'Estuda os tecidos que compõem o corpo dos animais — epitelial, conjuntivo, muscular e nervoso — cada um especializado em funções específicas como revestimento, sustentação, movimento e transmissão de impulsos.',
    aprofundamento:'O tecido epitelial reveste superfícies internas e externas do corpo e também forma glândulas de secreção; o tecido conjuntivo (que inclui sangue, tecido ósseo, cartilaginoso e adiposo) sustenta e conecta outros tecidos, além de ter função de defesa imunológica; o tecido muscular é responsável pelo movimento através de contração de fibras; o tecido nervoso é formado por neurônios especializados em transmitir impulsos elétricos. O sistema imunológico é um tema muito contextualizado com vacinas: a imunização ativa (vacinas) estimula o próprio corpo a produzir anticorpos, enquanto a imunização passiva (soros) fornece anticorpos prontos, de ação mais rápida mas duração mais curta.',
    exemplo:'Uma vacina contra tétano estimula o sistema imunológico a produzir anticorpos específicos (imunização ativa, efeito duradouro), enquanto o soro antitetânico aplicado após um ferimento contaminado fornece anticorpos prontos imediatamente (imunização passiva, efeito rápido mas temporário).',
    pontos:['Tecido epitelial: revestimento e glândulas','Tecido conjuntivo: sustentação, sangue, defesa imunológica','Vacina (imunização ativa) x Soro (imunização passiva): diferença de mecanismo e duração']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Fisiologia Animal',
    resumo:'Estuda o funcionamento dos sistemas do corpo animal — nervoso, endócrino, respiratório, circulatório, digestório e excretor — e como eles trabalham de forma integrada para manter a homeostase do organismo.',
    aprofundamento:'O sistema nervoso autônomo (simpático e parassimpático) regula funções involuntárias: o simpático prepara o corpo para situações de estresse ("luta ou fuga") e o parassimpático promove relaxamento e digestão. O sistema endócrino usa hormônios para regular processos mais lentos e duradouros, como crescimento e metabolismo — a hipófise é considerada a "glândula mestra" por controlar outras glândulas do corpo. O sistema circulatório evoluiu de simples (peixes) para duplo completo (aves e mamíferos), permitindo maior eficiência na distribuição de oxigênio e sustentando a endotermia. O ENEM adora contextualizar drogas (álcool, tabaco, cocaína) com seus efeitos específicos nesses sistemas.',
    exemplo:'O sistema nervoso simpático é ativado numa situação de perigo, acelerando os batimentos cardíacos e dilatando as pupilas para preparar o corpo para "lutar ou fugir"; já o parassimpático, ativado em repouso, desacelera o coração e estimula a digestão.',
    pontos:['Sistema nervoso autônomo: simpático (luta/fuga) x parassimpático (repouso/digestão)','Sistema endócrino: hipófise é a "glândula mestra", regula outras glândulas','Circulação dupla completa (aves/mamíferos) sustenta a endotermia']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Genética',
    resumo:'Estuda como as características são transmitidas dos pais para os filhos, através das Leis de Mendel, sistemas sanguíneos (ABO e Rh) e padrões mais complexos de herança, como ligada ao sexo e poligênica.',
    aprofundamento:'A Primeira Lei de Mendel explica que cada característica é determinada por um par de alelos que se separam na formação dos gametas; a Segunda Lei explica que características diferentes são herdadas de forma independente umas das outras (exceto quando os genes estão ligados no mesmo cromossomo, fenômeno chamado linkage). O sistema sanguíneo ABO é determinado por três alelos que se combinam para formar os quatro tipos sanguíneos, e o sistema Rh é relevante em gestações, podendo causar eritroblastose fetal quando uma mãe Rh- gesta um filho Rh+ sem tratamento preventivo. Herança ligada ao sexo (genes no cromossomo X) explica por que certas condições, como o daltonismo, são muito mais comuns em homens do que em mulheres.',
    exemplo:'Um casal onde a mãe é Rh- e já teve sensibilização (por exposição prévia a sangue Rh+) corre risco de eritroblastose fetal numa segunda gestação de bebê Rh+, por isso o pré-natal inclui prevenção específica para esse caso.',
    pontos:['1ª Lei de Mendel: segregação dos alelos na formação de gametas','2ª Lei de Mendel: características diferentes herdadas de forma independente (exceto genes ligados)','Herança ligada ao sexo: genes no cromossomo X, mais expressos em homens (ex: daltonismo)']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Origem da Vida',
    resumo:'Estuda as teorias científicas sobre como a vida surgiu na Terra, incluindo a superação histórica da geração espontânea (abiogênese) e as hipóteses modernas sobre a formação das primeiras moléculas orgânicas e células.',
    aprofundamento:'Os experimentos de Pasteur (com o balão de pescoço de cisne) refutaram definitivamente a abiogênese, mostrando que a vida só surge de vida preexistente (biogênese). A hipótese de Oparin propõe que moléculas orgânicas simples se formaram espontaneamente na atmosfera primitiva da Terra, ideia testada experimentalmente por Miller e Urey, que recriaram condições da Terra primitiva em laboratório e obtiveram aminoácidos. A hipótese do "mundo de RNA" sugere que o RNA pode ter sido o primeiro material genético, por conseguir tanto armazenar informação quanto catalisar reações. A teoria endossimbiótica explica a origem de mitocôndrias e cloroplastos como bactérias antigas incorporadas por simbiose, evidenciada pelo fato dessas organelas terem DNA próprio.',
    exemplo:'O experimento de Miller e Urey (1953) recriou em laboratório a atmosfera primitiva da Terra com descargas elétricas simulando raios, produzindo aminoácidos — evidência experimental a favor da hipótese de Oparin.',
    pontos:['Pasteur refutou a geração espontânea (abiogênese) com o experimento do balão de pescoço de cisne','Miller e Urey testaram experimentalmente a hipótese de Oparin, obtendo aminoácidos','Teoria endossimbiótica: mitocôndrias e cloroplastos seriam bactérias antigas incorporadas por simbiose']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Evolução',
    resumo:'Estuda como as espécies mudam ao longo do tempo através da seleção natural, principal mecanismo proposto por Darwin, e como evidências como fósseis, anatomia comparada e genética molecular sustentam a teoria evolutiva moderna.',
    aprofundamento:'A seleção natural darwiniana propõe que indivíduos com características mais vantajosas têm maior chance de sobreviver e se reproduzir — é um processo que atua sobre a variação já existente numa população, não "cria" características sob demanda. O neodarwinismo integrou a genética às ideias de Darwin. Órgãos homólogos (mesma origem embrionária, funções diferentes, como o braço humano e a asa do morcego) são evidência de ancestralidade comum; órgãos análogos (funções parecidas, origens diferentes) são evidência de evolução convergente. O Equilíbrio de Hardy-Weinberg descreve as condições sob as quais as frequências gênicas de uma população permanecem estáveis — útil para detectar quando uma população está de fato evoluindo.',
    exemplo:'A resistência de bactérias a antibióticos é um exemplo moderno de seleção natural em ação: bactérias com mutações que conferem resistência sobrevivem ao tratamento e se multiplicam, tornando a população cada vez mais resistente ao longo do tempo.',
    pontos:['Seleção natural: atua sobre variação já existente, não cria características sob demanda','Órgãos homólogos: mesma origem, funções diferentes (evidência de ancestralidade comum)','Órgãos análogos: funções parecidas, origens diferentes (evolução convergente)']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Taxionomia',
    resumo:'Estuda a classificação científica dos seres vivos em categorias hierárquicas, usando o sistema binomial de nomenclatura criado por Lineu, além de conceitos modernos como os três domínios da vida.',
    aprofundamento:'O sistema binomial de Lineu nomeia cada espécie com dois termos em latim: o gênero (inicial maiúscula) e o epíteto específico (minúsculo), ambos em itálico — como Homo sapiens. A classificação moderna adota três domínios (Bacteria, Archaea e Eukarya), que agrupam os antigos cinco reinos com base em características celulares moleculares. Árvores evolutivas (cladogramas) representam graficamente as relações de parentesco evolutivo entre grupos, mostrando quais compartilham ancestrais comuns mais recentes.',
    exemplo:'O ser humano é classificado como Homo sapiens: Homo é o gênero (compartilhado com espécies extintas como Homo erectus) e sapiens é o epíteto específico exclusivo da nossa espécie.',
    pontos:['Sistema binomial de Lineu: Gênero + epíteto específico, em itálico (ex: Homo sapiens)','3 domínios: Bacteria, Archaea, Eukarya (baseados em características celulares moleculares)','Cladogramas mostram relações de parentesco evolutivo entre grupos']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Microbiologia',
    resumo:'Estuda os microrganismos — vírus, bactérias, protozoários e fungos — incluindo suas características, formas de transmissão de doenças e importância médica e ambiental. É um bloco muito atual, ligado a epidemias e saúde pública.',
    aprofundamento:'Vírus são agentes acelulares que dependem obrigatoriamente de uma célula hospedeira para se replicar — doenças virais recorrentes no ENEM incluem dengue, gripe, COVID-19 e HIV. Bactérias são procariontes que podem causar doenças (tuberculose, cólera) mas também têm papéis benéficos (fixação de nitrogênio no solo, fermentação). Protozoários causam doenças como malária (transmitida pelo mosquito Anopheles) e doença de Chagas (transmitida pelo barbeiro), temas recorrentes de saúde pública em regiões tropicais como o Brasil. Fungos podem ser decompositores importantes, mas também causam micoses e intoxicações alimentares.',
    exemplo:'A malária, causada pelo protozoário Plasmodium e transmitida pela picada da fêmea do mosquito Anopheles, ainda é um grave problema de saúde pública em regiões tropicais, incluindo partes da Amazônia brasileira.',
    pontos:['Vírus: acelulares, dependem de célula hospedeira para se replicar','Bactérias: procariontes, podem ser patogênicas ou benéficas (fixação de nitrogênio, fermentação)','Protozoários: causam malária (Plasmodium, mosquito Anopheles) e doença de Chagas (barbeiro)']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Botânica',
    resumo:'Estuda as plantas — suas estruturas, classificação (briófitas, pteridófitas, gimnospermas, angiospermas) e processos vitais como fotossíntese, reprodução e resposta a estímulos através de fitormônios.',
    aprofundamento:'A evolução das plantas mostra progressiva adaptação ao ambiente terrestre: briófitas dependem de água para reprodução e não têm vasos condutores; pteridófitas já têm vasos condutores mas ainda dependem de água para reprodução; gimnospermas produzem sementes mas não têm frutos; angiospermas produzem flores e frutos, sendo o grupo mais diversificado. Os fitormônios regulam o crescimento vegetal: auxinas controlam o crescimento em direção à luz e à gravidade; giberelinas estimulam crescimento e germinação; etileno acelera o amadurecimento de frutos. A fotossíntese ocorre em duas etapas: fase clara (produz ATP e libera O2) e fase escura ou Ciclo de Calvin (fixa CO2 em glicose usando o ATP produzido).',
    exemplo:'Colocar uma banana verde dentro de um saco fechado junto com uma maçã madura acelera seu amadurecimento, porque a maçã libera etileno, o hormônio vegetal responsável por sinalizar o amadurecimento de frutos.',
    pontos:['Evolução das plantas: briófitas → pteridófitas → gimnospermas → angiospermas (crescente adaptação terrestre)','Auxinas: crescimento direcional (luz e gravidade); Etileno: amadurecimento de frutos','Fotossíntese: fase clara (produz ATP e O2) + fase escura/Ciclo de Calvin (fixa CO2 em glicose)']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Zoologia',
    resumo:'Estuda a diversidade e classificação dos animais, desde invertebrados simples até vertebrados complexos, incluindo suas características anatômicas e fisiológicas distintivas.',
    aprofundamento:'Os invertebrados evoluíram de estruturas corporais simples para mais complexas: poríferos não têm tecidos verdadeiros; cnidários têm simetria radial e células urticantes; platelmintos e nematódeos incluem importantes parasitas humanos (tênia, esquistossomose, ascaridíase); artrópodes são o grupo animal mais numeroso e diverso do planeta. Entre os vertebrados, a evolução mostra adaptações progressivas ao ambiente terrestre: peixes (respiração branquial, ectotermia), anfíbios (respiração dupla, dependência de água para reprodução), répteis (ovo amniótico, reprodução totalmente terrestre), aves e mamíferos (endotermia). O ENEM costuma contextualizar zoologia com saúde pública e conservação ambiental.',
    exemplo:'A esquistossomose é causada por um platelminto (Schistosoma mansoni) transmitido através do contato com água contaminada por um caramujo hospedeiro intermediário — um problema de saúde pública em regiões com saneamento básico precário no Brasil.',
    pontos:['Invertebrados: de poríferos (sem tecidos) a artrópodes (grupo mais diverso do planeta)','Vertebrados: peixes → anfíbios → répteis → aves/mamíferos (crescente adaptação terrestre)','Endotermia (aves e mamíferos): manutenção de temperatura corporal constante']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Ecologia',
    resumo:'Ecologia estuda as relações entre os seres vivos e o ambiente. No ENEM, aparece muito ligada a questões ambientais atuais, como desmatamento, cadeias alimentares e impacto humano nos ecossistemas.',
    aprofundamento:'Entender o fluxo de energia numa cadeia alimentar é essencial: a energia sempre flui em uma direção (produtores → consumidores → decompositores), e a cada nível trófico se perde uma boa parte da energia em forma de calor — por isso cadeias alimentares raramente têm mais de 4-5 níveis. O ENEM gosta de contextualizar isso com questões ambientais reais: o que acontece com uma cadeia alimentar quando um nível é removido (ex: extinção de um predador), ou como o desmatamento afeta ciclos biogeoquímicos inteiros, não só a vegetação local.',
    exemplo:'Se um predador de topo (como uma onça) é extinto numa região, a população de suas presas tende a crescer descontroladamente, o que pode levar ao esgotamento da vegetação da qual essas presas se alimentam — um efeito em cascata.',
    pontos:['Produtores: fazem fotossíntese (plantas, algas)','Consumidores: se alimentam de outros seres vivos','Decompositores: reciclam matéria orgânica no ecossistema']},
  {trilha:'enem', materia:'Física', assunto:'Física - Cinemática',
    resumo:'Cinemática estuda o movimento dos corpos sem se preocupar com suas causas. As questões do ENEM costumam contextualizar velocidade, distância e tempo em situações do dia a dia, como trânsito e transporte.',
    aprofundamento:'O erro mais comum nessas questões é esquecer de converter unidades antes de calcular — misturar km/h com m/s ou minutos com horas sem converter gera resposta errada mesmo com o raciocínio certo. A regra de conversão mais usada é: para passar de km/h para m/s, divide-se por 3,6; para o caminho inverso, multiplica-se por 3,6. Gráficos de posição x tempo também são muito cobrados: a inclinação da reta no gráfico representa a velocidade — quanto mais inclinada, mais rápido o movimento.',
    exemplo:'Um carro a 108 km/h, convertendo para m/s: 108 ÷ 3,6 = 30 m/s. Se percorre essa velocidade por 10 segundos, percorre 30 × 10 = 300 metros.',
    pontos:['Velocidade média = distância percorrida ÷ tempo gasto','Atenção às unidades (km/h vs m/s) antes de calcular','Gráficos de posição x tempo aparecem com frequência']},
  {trilha:'enem', materia:'Química', assunto:'Química - Misturas',
    resumo:'Misturas são combinações de duas ou mais substâncias que mantêm suas propriedades. O ENEM costuma explorar processos de separação de misturas em contextos de saneamento, indústria e meio ambiente.',
    aprofundamento:'A escolha do processo de separação correto depende das propriedades físicas dos componentes da mistura. Filtração separa sólido de líquido (baseado no tamanho das partículas), decantação separa líquidos de densidades diferentes que não se misturam (ou sólido que sedimenta), e destilação separa líquidos misturados com base na diferença de ponto de ebulição. O ENEM costuma contextualizar isso em situações reais de tratamento de água, purificação de combustíveis ou processos industriais, exigindo que o candidato escolha o método certo para cada tipo de mistura apresentada.',
    exemplo:'Para separar areia de água (mistura heterogênea sólido-líquido), usa-se filtração. Para separar álcool de água (mistura homogênea, líquidos com pontos de ebulição diferentes), usa-se destilação simples.',
    pontos:['Mistura homogênea: uma única fase visível (ex: água + sal)','Mistura heterogênea: mais de uma fase visível (ex: água + óleo)','Processos de separação: filtração, destilação, decantação']},
  {trilha:'enem', materia:'Química', assunto:'Química - Porcentagem e concentração',
    resumo:'Em Química, porcentagem é usada para expressar concentração de soluções — quanto soluto existe em relação à quantidade total da solução. Aparece direto em rótulos de soro, medicamentos, bebidas e produtos de limpeza, sendo um assunto de aplicação muito prática no ENEM.',
    aprofundamento:'Existem três formas principais: % massa/massa (massa de soluto ÷ massa de solução ×100), % massa/volume (massa de soluto em gramas ÷ volume de solução em mL ×100, usada em soro e medicamentos) e % volume/volume (volume de soluto ÷ volume de solução, usada em bebidas alcoólicas). O erro mais comum é aplicar a fórmula errada por não identificar qual tipo de porcentagem o rótulo está informando — o ENEM gosta de dar o rótulo de um produto real (soro, álcool, vinagre) e pedir para calcular a massa ou volume de soluto presente numa quantidade específica.',
    exemplo:'Soro fisiológico "0,9% m/v" significa 0,9 g de cloreto de sódio para cada 100 mL de solução. Em uma bolsa de 500 mL desse soro, a massa de sal é: 0,9 × (500/100) = 4,5 g.',
    pontos:['% m/v: massa de soluto (g) ÷ volume de solução (mL) ×100 — padrão em soro e remédios','% v/v: usada em bebidas alcoólicas (ex: cerveja com 5% v/v de álcool)','Sempre identifique qual tipo de porcentagem o rótulo está usando antes de calcular']},
  {trilha:'enem', materia:'Química', assunto:'Química - Estrutura Atômica',
    resumo:'Estuda a organização interna do átomo: um núcleo com prótons e nêutrons, cercado por uma eletrosfera de elétrons. Os conceitos de número atômico, número de massa, íons e isótopos formam a base para entender a tabela periódica e as ligações químicas.',
    aprofundamento:'O ENEM cobra bastante a diferença entre número atômico (Z = quantidade de prótons, identifica o elemento) e número de massa (A = prótons + nêutrons). Um erro comum é achar que o número de elétrons é fixo: em um átomo neutro, elétrons = prótons, mas ao formar um íon isso muda — cátions perdem elétrons (ficam com carga positiva), ânions ganham elétrons (carga negativa), e nada disso altera o número de massa, que depende só de prótons e nêutrons. Isótopos são átomos do mesmo elemento (mesmo Z) com números de massa diferentes (quantidade diferente de nêutrons) — é a base de aplicações como datação por carbono-14 e exames de medicina nuclear, temas frequentes de contextualização.',
    exemplo:'O carbono-14 tem Z=6 (6 prótons) e A=14 (6 prótons + 8 nêutrons); o carbono-12, mais comum, tem A=12 (6 prótons + 6 nêutrons). Ambos são isótopos de carbono, pois têm o mesmo número atômico.',
    pontos:['Z (número atômico) = quantidade de prótons, define o elemento','A (número de massa) = prótons + nêutrons','Isótopos: mesmo Z, A diferente (mesmo elemento, massa diferente)']},
  {trilha:'enem', materia:'Química', assunto:'Química - Tabela Periódica',
    resumo:'A tabela periódica organiza os elementos químicos por número atômico crescente, agrupando-os em famílias (colunas, propriedades químicas parecidas) e períodos (linhas, número de camadas eletrônicas). É a ferramenta usada para prever o comportamento químico de qualquer elemento.',
    aprofundamento:'As propriedades periódicas mais cobradas são raio atômico, eletronegatividade e energia de ionização. O raio atômico aumenta descendo numa família (mais camadas eletrônicas) e diminui da esquerda para a direita num período (mais prótons puxando os elétrons para mais perto do núcleo). A eletronegatividade tem comportamento oposto ao raio: aumenta da esquerda para a direita e de baixo para cima, com o flúor sendo o elemento mais eletronegativo da tabela. O ENEM gosta de contextualizar com aplicações reais: por que metais alcalinos (família 1A) são tão reativos (perdem facilmente o único elétron da última camada) e por que os gases nobres (família 8A) são estáveis e pouco reativos (camada de valência completa).',
    exemplo:'Comparando sódio (Na, família 1A) e cloro (Cl, família 7A) no mesmo período: o cloro tem raio atômico menor e eletronegatividade muito maior, por isso "atrai" o elétron do sódio na formação do sal de cozinha (NaCl).',
    pontos:['Raio atômico: aumenta descendo na família, diminui da esquerda para a direita no período','Eletronegatividade: comportamento oposto ao raio atômico (flúor é o mais eletronegativo)','Família 1A (alcalinos): muito reativos; Família 8A (gases nobres): estáveis']},
  {trilha:'enem', materia:'Química', assunto:'Química - Ligações Químicas',
    resumo:'Ligações químicas explicam como os átomos se unem para formar substâncias mais estáveis, geralmente buscando completar a camada de valência. Os três tipos principais são iônica, covalente e metálica, cada uma responsável por um conjunto característico de propriedades físicas.',
    aprofundamento:'A ligação iônica ocorre entre metal e não-metal (com transferência de elétrons), forma cristais sólidos com alto ponto de fusão e só conduz eletricidade quando dissolvida em água ou fundida (nunca no estado sólido). A ligação covalente ocorre entre não-metais (com compartilhamento de elétrons), forma moléculas com propriedades muito variadas — de gases a sólidos — e geralmente não conduz eletricidade. A ligação metálica ocorre entre átomos de metais e explica a maleabilidade e a alta condutividade elétrica e térmica através do chamado "mar de elétrons" livres que circula entre os átomos. O erro mais comum é achar que toda ligação envolvendo um metal é automaticamente iônica — na prática, o tipo de ligação depende da diferença de eletronegatividade entre os átomos envolvidos, não apenas de um deles ser metal.',
    exemplo:'No cloreto de sódio (NaCl), o sódio perde 1 elétron e o cloro ganha, formando íons Na⁺ e Cl⁻ que se atraem eletrostaticamente — ligação iônica. Já no gás oxigênio (O₂), os dois átomos são não-metais e compartilham elétrons — ligação covalente.',
    pontos:['Iônica: metal + não-metal, transferência de elétrons, conduz eletricidade dissolvido ou fundido','Covalente: não-metal + não-metal, compartilhamento de elétrons','Metálica: metal + metal, "mar de elétrons" explica condutividade e maleabilidade']},
  {trilha:'enem', materia:'Química', assunto:'Química - Nox e Reações Redox',
    resumo:'O número de oxidação (Nox) indica a carga que um átomo teria se a ligação fosse totalmente iônica, e é usado para identificar reações de oxidação (perda de elétrons) e redução (ganho de elétrons) — as duas sempre acontecem juntas nas reações de óxido-redução (redox).',
    aprofundamento:'A regra prática mais usada é: quem oxida perde elétron e tem o Nox aumentado; quem reduz ganha elétron e tem o Nox diminuído. O ENEM costuma contextualizar isso com corrosão de metais (enferrujamento), funcionamento de pilhas e baterias, e processos biológicos como a respiração celular. Um erro muito comum é confundir "quem sofre oxidação" com "agente oxidante": o agente oxidante é a substância que provoca a oxidação da outra, mas ela mesma sofre redução no processo — parece contraintuitivo, mas é assim que a nomenclatura funciona.',
    exemplo:'No enferrujamento, o ferro metálico (Nox 0) perde elétrons e vira Fe³⁺ (Nox +3) — é oxidado. O oxigênio do ar ganha esses elétrons e é reduzido. Nesse processo, o ferro é o agente redutor e o oxigênio é o agente oxidante.',
    pontos:['Oxidação: perde elétron, Nox aumenta','Redução: ganha elétron, Nox diminui','Agente oxidante sofre redução; agente redutor sofre oxidação']},
  {trilha:'enem', materia:'Química', assunto:'Química - Funções Inorgânicas',
    resumo:'As quatro funções inorgânicas principais são ácidos, bases, sais e óxidos, classificadas pelos íons que liberam em solução aquosa ou pela composição dos elementos. Cada função tem propriedades e aplicações práticas muito cobradas em contextos do cotidiano.',
    aprofundamento:'Ácidos liberam H⁺ em solução aquosa (ex: o ácido clorídrico do suco gástrico), bases liberam OH⁻ (ex: hidróxido de sódio, a soda cáustica), sais são formados pela reação de neutralização entre um ácido e uma base (ex: cloreto de sódio, o sal de cozinha), e óxidos são compostos binários que contêm oxigênio (ex: CO₂, o gás carbônico). O pH é a ferramenta usada para medir acidez ou basicidade: valores menores que 7 indicam meio ácido, igual a 7 é neutro, e maiores que 7 é básico — o ENEM adora contextualizar isso com chuva ácida, pH do sangue, azia estomacal e produtos de limpeza doméstica.',
    exemplo:'Ao tomar um antiácido (uma base fraca) para aliviar azia (excesso de ácido clorídrico no estômago), ocorre uma reação de neutralização: ácido + base → sal + água, reduzindo a acidez estomacal.',
    pontos:['Ácidos: liberam H⁺ em água, pH menor que 7','Bases: liberam OH⁻ em água, pH maior que 7','Sal + água = resultado da reação de neutralização entre ácido e base']},
  {trilha:'enem', materia:'Química', assunto:'Química - Estequiometria',
    resumo:'Estequiometria é o cálculo das quantidades de reagentes e produtos envolvidos numa reação química, usando a proporção definida pelos coeficientes da equação balanceada. É um dos assuntos mais cobrados porque exige integrar mol, massa molar e proporção numa única questão.',
    aprofundamento:'O passo a passo padrão é: balancear a equação química, converter os dados fornecidos (massa, volume ou número de partículas) para mol, aplicar a proporção estequiométrica dos coeficientes para descobrir a quantidade da substância pedida, e converter o resultado de volta para a unidade solicitada pela questão. O erro mais comum é esquecer de balancear a equação antes de montar a proporção, ou tentar usar a massa da substância diretamente sem antes converter para mol. Questões de reagente limitante são as mais difíceis do tópico: quando são fornecidas quantidades de dois reagentes ao mesmo tempo, é preciso descobrir qual deles "acaba primeiro" — esse reagente limita a quantidade máxima de produto que pode ser formada.',
    exemplo:'Na reação 2H₂ + O₂ → 2H₂O, se reagem 4 mol de H₂, a proporção 2:1 mostra que são necessários 2 mol de O₂ para reagir completamente, formando 4 mol de água.',
