    aprofundamento:'Canudos (interior da Bahia, liderado por Antônio Conselheiro) e o Contestado (fronteira entre Santa Catarina e Paraná) foram movimentos messiânicos/religiosos de camponeses pobres, ambos duramente reprimidos pelo Exército republicano; o Cangaço (sertão nordestino, com destaque para o líder Lampião) foi um fenômeno de banditismo social intimamente ligado à miséria estrutural e às secas recorrentes do semiárido; a Revolta da Vacina (Rio de Janeiro, 1904) foi uma reação popular à vacinação obrigatória contra a varíola e às reformas urbanas excludentes do período; a Revolta da Chibata (1910) foi um protesto de marinheiros majoritariamente negros contra os castigos físicos (chibatadas) ainda aplicados na Marinha brasileira.',
    exemplo:'A Revolta da Vacina, embora oficialmente motivada pela resistência popular à vacinação obrigatória contra a varíola, também refletia a insatisfação da população pobre com as reformas urbanas excludentes que demoliam cortiços e expulsavam moradores pobres do centro do Rio de Janeiro.',
    pontos:['Canudos e Contestado: movimentos messiânicos de camponeses pobres, duramente reprimidos pelo Exército','Cangaço: banditismo social ligado à miséria estrutural e às secas do sertão nordestino','Revolta da Chibata (1910): protesto de marinheiros negros contra castigos físicos na Marinha']},
  {trilha:'enem', materia:'História', assunto:'História do Brasil - Crise da República Oligárquica e Revolução de 1930',
    resumo:'Estuda o Tenentismo (movimento de jovens oficiais militares reivindicando reformas políticas), o Modernismo cultural, a criação do PCB, e a crise política que culminou na Revolução de 1930, encerrando a República Oligárquica.',
    aprofundamento:'O Tenentismo questionava o domínio das oligarquias regionais e a fraude eleitoral generalizada, defendendo reformas políticas e sociais através de revoltas armadas, com destaque para a Coluna Prestes (marcha de resistência que percorreu boa parte do interior do país); o Modernismo (marcado simbolicamente pela Semana de Arte Moderna de 1922, em São Paulo) refletia, no campo cultural, o mesmo espírito de inquietação e ruptura com padrões estabelecidos; o Partido Comunista Brasileiro (PCB) também surgiu nesse contexto de efervescência política dos anos 1920. A Revolução de 1930, liderada por Getúlio Vargas após sua derrota na eleição presidencial contra a Aliança Liberal, derrubou o presidente Washington Luís e encerrou definitivamente a República Oligárquica, dando início à Era Vargas.',
    exemplo:'A Coluna Prestes, liderada pelo tenente Luís Carlos Prestes, percorreu milhares de quilômetros pelo interior do Brasil entre 1925-1927 pregando reformas políticas contra as oligarquias regionais — um símbolo direto do descontentamento tenentista com a República Oligárquica.',
    pontos:['Tenentismo: jovens oficiais militares reivindicando reformas contra o domínio das oligarquias','Semana de Arte Moderna (1922): marco cultural do mesmo espírito de ruptura da época','Revolução de 1930 (Vargas): encerrou a República Oligárquica, deu início à Era Vargas']},
  {trilha:'enem', materia:'História', assunto:'História do Brasil - Era Vargas',
    resumo:'O governo de Getúlio Vargas (1930-1945), dividido em Governo Provisório, Governo Constitucional e Estado Novo (fase ditatorial), marcado por centralização política, criação da CLT e industrialização com forte intervenção estatal.',
    aprofundamento:'O Governo Provisório consolidou o poder de Vargas logo após a Revolução de 1930; o Governo Constitucional (após a Constituição de 1934) enfrentou forte polarização política entre a Ação Integralista Brasileira (AIB, movimento de extrema-direita nacionalista) e a Aliança Nacional Libertadora (ANL, coalizão de esquerda que incluía o PCB), com o forjado (e nunca totalmente comprovado) Plano Cohen servindo de pretexto oficial para o golpe que instaurou o Estado Novo (1937) — ditadura marcada por censura e forte repressão política, mas também por avanços trabalhistas concretos (CLT, 1943) e intenso nacionalismo econômico (criação de estatais estratégicas, como a Companhia Siderúrgica Nacional). A política externa oscilou entre aproximação com o Eixo e com os Aliados, culminando na entrada do Brasil na Segunda Guerra ao lado dos Aliados — uma contradição interna (lutar pela democracia lá fora enquanto vivia sob ditadura em casa) que ajudou a acelerar a abertura política e o fim do Estado Novo em 1945.',
    exemplo:'A contradição de enviar tropas brasileiras (a FEB) para lutar contra regimes totalitários na Europa enquanto o próprio Brasil vivia sob a ditadura do Estado Novo foi um dos fatores que fragilizaram politicamente Vargas, contribuindo para sua deposição em 1945.',
    pontos:['Estado Novo (1937-1945): fase ditatorial, mas com avanços trabalhistas concretos (CLT, 1943)','Plano Cohen: pretexto forjado usado para justificar o golpe que instaurou o Estado Novo','Contradição de lutar na 2ª Guerra pela democracia enquanto vivia sob ditadura acelerou o fim do regime']},
  {trilha:'enem', materia:'História', assunto:'História do Brasil - República Populista',
    resumo:'Cobre o período entre 1945-1964, incluindo os governos de Dutra, o retorno eleito de Vargas, JK (desenvolvimentismo e construção de Brasília), Jânio Quadros e João Goulart (Jango), até o golpe civil-militar de 1964.',
    aprofundamento:'O populismo se caracterizava por líderes carismáticos que buscavam apoio direto das massas urbanas trabalhadoras, muitas vezes contornando ou tensionando as instituições políticas tradicionais; Juscelino Kubitschek (JK) promoveu um forte desenvolvimentismo industrial através do Plano de Metas ("50 anos em 5") e a construção de Brasília, nova capital planejada; Jânio Quadros renunciou abruptamente à presidência em 1961, apenas meses após assumir, por motivos ainda debatidos historicamente; João Goulart (Jango) assumiu em meio a forte crise política (com o parlamentarismo sendo adotado como solução de compromisso temporária) e suas propostas de reformas de base (incluindo reforma agrária) geraram forte reação conservadora de setores empresariais, militares e da classe média, culminando no golpe civil-militar de 1964.',
    exemplo:'O Plano de Metas de JK, resumido no slogan "cinquenta anos em cinco", buscava acelerar drasticamente a industrialização e o desenvolvimento brasileiro num prazo curto, tendo a construção de Brasília como seu símbolo mais visível e ambicioso.',
    pontos:['JK: desenvolvimentismo industrial (Plano de Metas) e construção de Brasília como nova capital','Jânio Quadros: renúncia abrupta em 1961, meses após assumir a presidência','Jango: reformas de base geraram forte reação conservadora, culminando no golpe civil-militar de 1964']},
  {trilha:'enem', materia:'História', assunto:'História do Brasil - Ditadura Militar',
    resumo:'O regime militar brasileiro (1964-1985), dividido nos governos de Castelo Branco, Costa e Silva, Médici (período de maior repressão, coincidindo com o "milagre econômico"), Geisel e Figueiredo (abertura política gradual).',
    aprofundamento:'O regime foi marcado pela edição de Atos Institucionais (concentrando poder no Executivo, cassando mandatos políticos e suspendendo direitos civis e políticos), além de censura sistemática e forte repressão a opositores (prisão, tortura, exílio forçado, desaparecimentos), especialmente intensa no governo Médici — período de auge da repressão, simbolizado pelo AI-5 (1968), que suspendeu garantias constitucionais básicas. Ao mesmo tempo, o chamado "milagre econômico" (1969-1973) trouxe crescimento acelerado do PIB, mas acompanhado de aumento significativo da desigualdade social e da dívida externa. A abertura política, definida pelo próprio regime como "lenta, gradual e segura", começou timidamente com Geisel e se consolidou com Figueiredo, terminando formalmente com a eleição indireta (ainda pelo Colégio Eleitoral) de Tancredo Neves em 1985.',
    exemplo:'O AI-5 (Ato Institucional nº 5, de 1968), que suspendeu garantias constitucionais básicas e permitiu ao regime fechar o Congresso e cassar mandatos livremente, é considerado o marco do período de maior repressão política durante toda a ditadura militar.',
    pontos:['AI-5 (1968): suspendeu garantias constitucionais, marco do auge da repressão (governo Médici)','"Milagre econômico" (1969-1973): crescimento acelerado do PIB, mas com desigualdade e dívida externa crescentes','Abertura "lenta, gradual e segura": iniciada por Geisel, concluída com a eleição indireta de Tancredo em 1985']},
  {trilha:'enem', materia:'História', assunto:'História do Brasil - Redemocratização e República Nova',
    resumo:'Cobre da eleição de Tancredo Neves (que faleceu antes de tomar posse, sendo sucedido por José Sarney) até os governos mais recentes (Collor, Itamar, FHC, Lula, Dilma, Temer, Bolsonaro), consolidando a democracia sob a Constituição de 1988.',
    aprofundamento:'José Sarney enfrentou hiperinflação persistente e planos econômicos malsucedidos (como o Plano Cruzado); Fernando Collor de Mello (o primeiro presidente eleito por voto direto desde a ditadura) renunciou em 1992, em meio a um processo de impeachment por corrupção, sendo sucedido por seu vice, Itamar Franco; Fernando Henrique Cardoso (FHC) conseguiu estabilizar a economia brasileira através do Plano Real, encerrando décadas de inflação crônica; Lula e Dilma Rousseff (ambos do PT) ampliaram significativamente políticas sociais e de transferência de renda, mas Dilma sofreu um processo de impeachment em 2016, em meio a grave crise econômica e política; Michel Temer completou o mandato de Dilma; Jair Bolsonaro representou uma guinada política mais conservadora na política brasileira recente.',
    exemplo:'O Plano Real, implementado ainda no governo Itamar Franco sob a coordenação de FHC (então ministro da Fazenda), conseguiu finalmente estabilizar a moeda brasileira e encerrar décadas de hiperinflação crônica, sendo um marco econômico central da redemocratização.',
    pontos:['Constituição de 1988: marco jurídico da redemocratização, garante direitos e liberdades civis','Plano Real (1994): estabilizou a economia após décadas de hiperinflação crônica','Collor: primeiro presidente eleito por voto direto desde a ditadura, renunciou em processo de impeachment']},
  {trilha:'enem', materia:'História', assunto:'História da Arte - Fundamentos e Interpretação de Obras',
    resumo:'Estuda as funções da arte (expressiva, estética, social, política), como interpretar obras de artes plásticas e a leitura de uma obra de arte considerando elementos formais e contexto histórico.',
    aprofundamento:'A arte cumpre diferentes funções ao longo da história: expressiva (comunicar emoções e ideias), estética (buscar beleza ou impacto visual), social (refletir ou criticar a sociedade) e política (propaganda ou resistência). Interpretar corretamente uma obra exige analisar seus elementos formais (cor, composição, técnica, materiais) em conjunto com o contexto histórico e social de sua produção, evitando julgamentos anacrônicos — ou seja, evitar julgar obras antigas exclusivamente com os valores e critérios estéticos do presente, sem considerar seu contexto original de produção.',
    exemplo:'Uma pintura religiosa medieval, com figuras "achatadas" e sem perspectiva realista aos olhos modernos, não deve ser julgada como "tecnicamente inferior" — ela seguia convenções estéticas próprias da época, priorizando simbolismo religioso sobre representação naturalista.',
    pontos:['Arte cumpre funções expressiva, estética, social e política, variando conforme o contexto histórico','Interpretação exige unir elementos formais (cor, composição, técnica) ao contexto histórico de produção','Evitar anacronismo: não julgar obras antigas apenas pelos critérios estéticos do presente']},
  {trilha:'enem', materia:'História', assunto:'História da Arte - Pré-História, Antiguidade e América Pré-Colombiana',
    resumo:'Cobre a arte pré-histórica (pinturas rupestres), a arte das civilizações antigas (Egito, Grécia, Roma) e a arte da América Pré-Colombiana, cada uma com funções e estilos próprios ligados ao seu contexto cultural.',
    aprofundamento:'A arte pré-histórica (pinturas rupestres em cavernas) provavelmente tinha função ritual ou mágica, ligada à caça e à sobrevivência do grupo; a arte egípcia era fortemente ligada à religião e à vida após a morte, com convenções rígidas de representação (figura humana em perfil, hierática); a arte grega buscava idealização e proporção matemática da forma humana (o "cânone" de proporções); a arte romana era geralmente mais realista e voltada à propaganda política e à comemoração de feitos militares (arcos do triunfo, esculturas de imperadores); a arte pré-colombiana (astecas, maias, incas) tinha características monumentais e fortemente simbólicas, ligadas às cosmologias e religiões próprias de cada civilização.',
    exemplo:'As pirâmides maias e astecas, com sua escala monumental e alinhamento astronômico preciso, cumpriam funções religiosas e políticas semelhantes às pirâmides egípcias, embora tenham se desenvolvido de forma totalmente independente, sem contato entre as civilizações.',
    pontos:['Arte egípcia: convenções rígidas ligadas à religião e à vida após a morte','Arte grega: busca de idealização e proporção matemática da forma humana','Arte pré-colombiana: monumental e simbólica, ligada às cosmologias próprias de cada civilização']},
  {trilha:'enem', materia:'História', assunto:'História da Arte - Arte Medieval e Renascentista',
    resumo:'Cobre a arte medieval (bizantina, românica, gótica), fortemente religiosa, e o Renascimento artístico, que retomou o naturalismo e a valorização da figura humana da arte clássica greco-romana.',
    aprofundamento:'A arte bizantina usava mosaicos e ícones estilizados com forte simbolismo religioso, priorizando a mensagem espiritual sobre o realismo; a arte românica (arquitetura de igrejas com arcos redondos e paredes grossas) e a gótica (arcos ogivais pontiagudos, vitrais coloridos, catedrais mais altas e luminosas) dominaram sucessivamente a arquitetura religiosa da Idade Média europeia. O Renascimento (Itália, séc. XIV-XVI) retomou técnicas de perspectiva linear, proporção matemática e naturalismo da arte clássica greco-romana, com artistas como Leonardo da Vinci, Michelangelo e Rafael elevando a representação da figura humana e do espaço a um novo patamar técnico.',
    exemplo:'As catedrais góticas, com seus vitrais coloridos e arcos ogivais que permitiam tetos muito mais altos que o estilo românico anterior, buscavam criar uma sensação de elevação espiritual e luminosidade divina dentro do espaço sagrado.',
    pontos:['Arte bizantina: mosaicos e ícones estilizados, priorizam mensagem espiritual sobre realismo','Românico (arcos redondos) e Gótico (arcos ogivais, vitrais): estilos sucessivos da arquitetura religiosa medieval','Renascimento: retomada da perspectiva, proporção e naturalismo da arte clássica greco-romana']},
  {trilha:'enem', materia:'História', assunto:'História da Arte - Barroco, Rococó e Neoclassicismo',
    resumo:'Estuda o Barroco (dramático e teatral, ligado à Contrarreforma católica), o Rococó (mais leve e ornamentado, ligado à aristocracia) e o Neoclassicismo (retomada da sobriedade clássica, ligado ao Iluminismo).',
    aprofundamento:'O Barroco usava fortes contrastes de luz e sombra, movimento dramático e emoção intensa para impressionar e reforçar a fé católica em resposta direta à Reforma Protestante — muito presente também no Brasil colonial, especialmente em Minas Gerais. O Rococó, mais decorativo, leve e associado à vida refinada da corte francesa do século XVIII, antecedeu o Neoclassicismo, que retomou a sobriedade, o equilíbrio e a racionalidade formal da arte clássica greco-romana, refletindo diretamente os valores racionalistas do Iluminismo então em ascensão.',
    exemplo:'As esculturas de Aleijadinho em Minas Gerais, com seu dramatismo expressivo e movimento intenso, são um exemplo do Barroco colonial brasileiro, adaptando a estética barroca europeia ao contexto e aos materiais disponíveis na região mineradora.',
    pontos:['Barroco: contrastes de luz/sombra e drama intenso, resposta católica à Reforma Protestante','Barroco mineiro (Aleijadinho): adaptação brasileira do estilo barroco europeu','Neoclassicismo: retomada da sobriedade clássica, refletindo os valores racionais do Iluminismo']},
  {trilha:'enem', materia:'História', assunto:'História da Arte - Século XIX e Vanguardas Europeias',
    resumo:'Cobre as correntes artísticas do século XIX (Romantismo, Realismo, Impressionismo) e as Vanguardas Europeias do início do século XX (cubismo, futurismo, surrealismo, expressionismo), que romperam radicalmente com a tradição realista.',
    aprofundamento:'O Romantismo valorizava a emoção intensa, a natureza e o sentimento nacionalista; o Realismo buscava retratar a vida cotidiana e as desigualdades sociais sem idealização romântica, muitas vezes com intenção crítica; o Impressionismo capturava impressões momentâneas de luz e cor (pintando ao ar livre, registrando mudanças rápidas de iluminação), rompendo com as convenções do academicismo tradicional. As vanguardas europeias do início do século XX (cubismo de Picasso, que fragmentava formas em múltiplas perspectivas simultâneas; futurismo italiano, que exaltava velocidade e tecnologia; surrealismo de Dalí, inspirado no inconsciente freudiano; expressionismo alemão, com distorções emocionais intensas) romperam radicalmente com a representação realista tradicional, cada uma explorando novas formas de representar a experiência moderna.',
    exemplo:'O cubismo de Picasso, ao fragmentar objetos e figuras em múltiplas perspectivas simultâneas numa mesma tela, rompeu radicalmente com séculos de tradição de perspectiva única herdada do Renascimento, sendo um marco fundamental da arte moderna.',
    pontos:['Impressionismo: capturava impressões momentâneas de luz e cor, pintando ao ar livre','Cubismo (Picasso): fragmenta formas em múltiplas perspectivas simultâneas na mesma tela','Vanguardas europeias romperam radicalmente com a representação realista tradicional herdada do Renascimento']},
  {trilha:'enem', materia:'História', assunto:'História da Arte - Arte Moderna, Contemporânea, Cinema e Fotografia',
    resumo:'Estuda os conceitos gerais de arte moderna e pós-moderna, as expressões estéticas contemporâneas, e o papel do cinema e da fotografia como novas linguagens artísticas desde o século XX.',
    aprofundamento:'A arte moderna rompeu com convenções estéticas tradicionais em busca de originalidade e experimentação constante; a arte pós-moderna e contemporânea vai além, questionando a própria definição do que conta como "arte", incorporando novas mídias, performance, instalação e crítica institucional direta ao sistema das artes (museus, galerias, mercado). A fotografia e o cinema surgiram como novas linguagens artísticas no final do século XIX e ao longo do século XX, democratizando e transformando profundamente tanto a produção quanto o consumo de imagens em massa, além de criarem novas formas de narrativa visual.',
    exemplo:'A obra "A Fonte" de Marcel Duchamp (um mictório comum assinado e apresentado como escultura em 1917) é um marco histórico da arte contemporânea por questionar diretamente a própria definição institucional do que pode ser considerado "arte".',
    pontos:['Arte moderna: ruptura constante com convenções, busca por originalidade e experimentação','Arte contemporânea: questiona a própria definição institucional de "arte" (performance, instalação)','Fotografia e cinema: novas linguagens artísticas que democratizaram a produção e o consumo de imagens']},
  {trilha:'enem', materia:'História', assunto:'História da Arte - Música e Dança no Brasil',
    resumo:'Estuda a música brasileira (refletindo a miscigenação cultural do país) e a dança como expressões corporais e identitárias, frequentemente cobradas no ENEM em conexão com contexto social e cultural.',
    aprofundamento:'A música brasileira reflete diretamente a miscigenação cultural do país, combinando influências indígenas, africanas e europeias — gêneros como samba, bossa nova e MPB muitas vezes carregaram forte crítica social e política embutida em suas letras, especialmente durante o período de censura da Ditadura Militar, quando muitos compositores usavam metáforas e linguagem figurada para driblar a repressão. A dança é estudada no ENEM como expressão corporal diretamente ligada à identidade cultural de diferentes grupos sociais e regiões do país, refletindo tradições populares, religiosas e regionais específicas.',
    exemplo:'Compositores da MPB durante a Ditadura Militar, como Chico Buarque, frequentemente usavam metáforas e linguagem figurada nas letras de suas canções para driblar a censura oficial enquanto ainda comunicavam crítica política implícita ao regime.',
    pontos:['Música brasileira reflete a miscigenação cultural: influências indígenas, africanas e europeias','MPB durante a Ditadura: uso de metáforas e linguagem figurada para driblar a censura política','Dança: expressão corporal ligada à identidade cultural de diferentes grupos sociais e regiões']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Pré-Socráticos e Sofistas',
    resumo:'Marca o surgimento da filosofia na Grécia Antiga como tentativa de explicar o mundo através da razão, e não apenas de mitos. Os pré-socráticos buscavam o "princípio" (arché) de todas as coisas, enquanto os sofistas deslocaram o foco para o ser humano e a linguagem.',
    aprofundamento:'Os filósofos pré-socráticos (Tales, Heráclito, Parmênides, entre outros) foram os primeiros a propor explicações racionais e naturais para a origem do universo, rompendo com explicações puramente mitológicas — Tales via a água como princípio de tudo, Heráclito defendia que tudo está em constante mudança ("não se entra duas vezes no mesmo rio"), enquanto Parmênides defendia que o ser é imutável, um contraponto direto. Os sofistas foram os primeiros a colocar o ser humano no centro da reflexão filosófica (o famoso "o homem é a medida de todas as coisas", de Protágoras), ensinando retórica e argumentação, mas sendo criticados por Sócrates e Platão por relativizarem a verdade em função da persuasão.',
    exemplo:'A frase "não se pode entrar duas vezes no mesmo rio", atribuída a Heráclito, ilustra sua filosofia do "devir": o rio parece o mesmo, mas a água que flui nunca é a mesma, assim como tudo no universo está em constante mudança.',
    pontos:['Pré-socráticos: buscavam o "princípio" (arché) racional do universo, não mitológico','Heráclito: tudo está em constante mudança (devir); Parmênides: o ser é imutável','Sofistas: colocaram o ser humano e a linguagem no centro da reflexão, ensinavam retórica']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Sócrates, Platão e Aristóteles',
    resumo:'O trio mais influente da filosofia clássica grega: Sócrates com seu método de investigação através do diálogo, Platão com a teoria das Ideias, e Aristóteles com sua abordagem mais empírica e sistemática da realidade, política e ética.',
    aprofundamento:'Sócrates não deixou nada escrito, mas é conhecido pelo método socrático (maiêutica): através de perguntas sucessivas, ele levava o interlocutor a perceber contradições em suas próprias ideias — seu lema era "só sei que nada sei". Platão, discípulo de Sócrates, propôs a Teoria das Ideias: o mundo sensível (percebido pelos sentidos) seria apenas uma cópia imperfeita do mundo das Ideias (perfeito e imutável), ilustrado no famoso Mito da Caverna, onde prisioneiros confundem sombras com a realidade. Aristóteles, discípulo de Platão, discordou do mestre ao valorizar a experiência sensível como fonte legítima de conhecimento, desenvolvendo a lógica formal, a ética das virtudes (o meio-termo entre excessos) e a ideia de que o ser humano é um "animal político" que só se realiza plenamente em sociedade.',
    exemplo:'No Mito da Caverna de Platão, prisioneiros acorrentados desde a infância só veem sombras projetadas numa parede e as confundem com a realidade — uma metáfora para como as pessoas comuns confundem aparências com a verdade profunda.',
    pontos:['Sócrates: método socrático (maiêutica), "só sei que nada sei"','Platão: Teoria das Ideias, Mito da Caverna (mundo sensível x mundo das Ideias)','Aristóteles: valoriza a experiência sensível, ética das virtudes (meio-termo), "animal político"']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Filosofia Helenística',
    resumo:'Período pós-Aristóteles marcado por escolas filosóficas voltadas para a busca da felicidade individual e da tranquilidade de espírito (ataraxia), num contexto de instabilidade política após a morte de Alexandre, o Grande.',
    aprofundamento:'O Estoicismo defendia que a felicidade vem da aceitação racional do que não podemos controlar (o destino), cultivando o autocontrole e a virtude como únicos bens verdadeiros. O Epicurismo, frequentemente mal interpretado como puro hedonismo, defendia a busca por prazeres moderados e simples como caminho para a tranquilidade. O Ceticismo questionava a possibilidade de se alcançar certeza absoluta sobre qualquer coisa, defendendo a suspensão do julgamento (epoché) como caminho para a paz de espírito.',
    exemplo:'Um estoico moderno, ao perder o emprego, focaria em aceitar racionalmente o que não pode mudar e concentrar sua energia no que está sob seu controle, em vez de sofrer com o que já passou — aplicação prática do estoicismo.',
    pontos:['Estoicismo: aceitação racional do destino, virtude como único bem verdadeiro','Epicurismo: prazeres moderados e simples, não hedonismo desenfreado','Ceticismo: suspensão do julgamento (epoché) diante da incerteza']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Filosofia Medieval',
    resumo:'Período em que a filosofia se desenvolveu em estreita ligação com a teologia cristã, buscando conciliar fé e razão — com Santo Agostinho influenciado por Platão e São Tomás de Aquino influenciado por Aristóteles.',
    aprofundamento:'Santo Agostinho incorporou elementos platônicos ao cristianismo, defendendo que a verdadeira sabedoria vem da iluminação divina, e que o mal não é uma substância própria, mas ausência de bem (privatio boni). São Tomás de Aquino promoveu uma síntese entre a filosofia aristotélica e a teologia católica, defendendo que fé e razão não se opõem, mas se complementam — a razão pode chegar a algumas verdades sobre Deus através da observação do mundo (suas famosas "cinco vias"), enquanto outras exigem revelação divina.',
    exemplo:'As "cinco vias" de Tomás de Aquino usam argumentos racionais (como a necessidade de uma "causa primeira" para explicar o movimento no universo) para sustentar racionalmente a existência de Deus.',
    pontos:['Agostinho: influência platônica, iluminação divina, o mal como ausência de bem','Tomás de Aquino: síntese entre Aristóteles e teologia católica, fé e razão se complementam','As "cinco vias" de Tomás de Aquino: argumentos racionais para a existência de Deus']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Renascimento e Filosofia Política Moderna',
    resumo:'Período de transição entre a Idade Média e a Modernidade, marcado pela retomada do humanismo clássico e pelo surgimento de reflexões políticas mais realistas sobre o poder, com destaque para Maquiavel e Hobbes.',
    aprofundamento:'Maquiavel, em "O Príncipe", rompeu com a tradição de tratar política e moral como inseparáveis, defendendo uma análise pragmática do poder — o governante deveria fazer o que fosse necessário para manter a estabilidade do Estado. Montaigne, com seus "Ensaios", inaugurou um estilo de reflexão mais pessoal e cético sobre a condição humana. Francis Bacon defendeu o método indutivo e experimental como caminho para o conhecimento científico. Thomas Hobbes descreveu o estado de natureza como "a guerra de todos contra todos", justificando a necessidade de um Estado forte (o Leviatã) para garantir a paz social através de um contrato social.',
    exemplo:'Hobbes argumenta que, sem um poder soberano forte controlando a sociedade, os seres humanos viveriam em constante conflito por recursos e segurança — por isso abrem mão de parte de sua liberdade natural em troca de proteção.',
    pontos:['Maquiavel: análise pragmática do poder, separação entre política e moral tradicional','Bacon: método indutivo e experimental como base da ciência moderna','Hobbes: estado de natureza como "guerra de todos contra todos", Leviatã garante a paz social']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Racionalismo (Descartes e Espinosa)',
    resumo:'O racionalismo defende que a razão, e não a experiência sensível, é a principal fonte confiável de conhecimento verdadeiro — com René Descartes como fundador da filosofia moderna e Espinosa desenvolvendo uma visão radical de unidade entre Deus e a natureza.',
    aprofundamento:'Descartes, em busca de uma base absolutamente certa para o conhecimento, duvidou metodicamente de tudo que pudesse ser questionado, chegando à conclusão de que a única coisa da qual não se pode duvidar é do próprio ato de duvidar — daí sua célebre frase "penso, logo existo" (cogito ergo sum). Espinosa propôs uma visão panteísta, na qual Deus e a Natureza são a mesma substância infinita ("Deus sive Natura"), rejeitando a ideia de um Deus pessoal separado do mundo.',
    exemplo:'A dúvida metódica de Descartes é como questionar absolutamente tudo que você acredita, até restar apenas uma certeza inabalável: o próprio ato de duvidar prova que existe algo (você) que duvida.',
    pontos:['Descartes: dúvida metódica leva à certeza do "penso, logo existo" (cogito ergo sum)','Racionalismo: a razão é a fonte principal do conhecimento verdadeiro, não os sentidos','Espinosa: panteísmo — Deus e Natureza são a mesma substância infinita']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Empirismo (Locke e Hume)',
    resumo:'O empirismo se opõe ao racionalismo ao defender que todo conhecimento vem da experiência sensível — a mente humana nasceria como uma "tábula rasa" a ser preenchida pelas experiências vividas.',
    aprofundamento:'John Locke defendeu que não existem ideias inatas: tudo que sabemos vem da experiência e da reflexão sobre essa experiência — essa visão influenciou teorias políticas liberais, incluindo a defesa da propriedade privada e dos direitos naturais. David Hume levou o empirismo a um ceticismo radical, questionando o princípio de causalidade: nunca observamos diretamente uma "causa" produzindo um "efeito", apenas eventos que costumam ocorrer em sequência — o que chamamos de causalidade seria apenas um hábito mental de associação.',
    exemplo:'Segundo Hume, quando vemos uma bola de bilhar bater em outra e a segunda se mover, não "vemos" a causalidade em si — apenas observamos que isso sempre aconteceu no passado, e por hábito assumimos que vai continuar acontecendo.',
    pontos:['Empirismo: todo conhecimento vem da experiência sensível, mente como "tábula rasa"','Locke: base filosófica do liberalismo político, direitos naturais (vida, liberdade, propriedade)','Hume: ceticismo radical sobre causalidade — seria apenas hábito de associação, não certeza lógica']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Iluminismo e Contratualismo',
    resumo:'Movimento intelectual do século XVIII que valorizava a razão, a ciência e a crítica às tradições e autoridades estabelecidas, lançando as bases filosóficas para a Revolução Francesa e as democracias modernas.',
    aprofundamento:'Voltaire defendia a liberdade de expressão e criticava duramente o fanatismo religioso e o abuso de poder. Montesquieu propôs a divisão dos poderes (Executivo, Legislativo, Judiciário) como forma de evitar a concentração e o abuso de poder — princípio que ainda hoje estrutura constituições democráticas, incluindo a brasileira. Rousseau desenvolveu sua própria versão do contrato social: para ele, o ser humano nasce naturalmente bom e é a sociedade que o corrompe, e o contrato social ideal deveria expressar a "vontade geral" do povo, não apenas submissão a um soberano.',
    exemplo:'A divisão dos três poderes proposta por Montesquieu é a base da organização do Estado brasileiro hoje, criada justamente para evitar que uma só pessoa ou grupo concentre poder demais.',
    pontos:['Voltaire: liberdade de expressão, crítica ao fanatismo e abuso de poder','Montesquieu: divisão dos três poderes (Executivo, Legislativo, Judiciário)','Rousseau: ser humano nasce bom, sociedade corrompe; contrato social deve expressar a "vontade geral"']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Immanuel Kant',
    resumo:'Kant promoveu uma "revolução copernicana" na filosofia ao propor que é a mente humana que estrutura ativamente a forma como percebemos a realidade — além de desenvolver uma ética baseada no dever, não nas consequências.',
    aprofundamento:'Para Kant, a mente humana possui estruturas próprias (como espaço e tempo) que organizam ativamente as informações sensoriais antes mesmo de qualquer experiência. Na ética, Kant propôs o imperativo categórico: agir sempre segundo uma máxima que você gostaria que se tornasse uma lei universal — diferente de julgar uma ação apenas por suas consequências, o que importa é agir por dever, pela boa vontade em si mesma.',
    exemplo:'Mentir para conseguir uma vantagem pessoal falha no teste do imperativo categórico kantiano: se todo mundo mentisse sempre que fosse conveniente, a própria confiança necessária para a mentira funcionar deixaria de existir.',
    pontos:['"Revolução copernicana": a mente estrutura ativamente como percebemos a realidade','Imperativo categórico: aja segundo uma máxima que poderia virar lei universal','Ética kantiana: o que importa é agir por dever, não pelas consequências ou interesse próprio']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Idealismo Alemão e Marx',
    resumo:'Hegel desenvolveu uma filosofia da história baseada no movimento dialético do Espírito em direção à liberdade plena, e Karl Marx inverteu essa dialética para analisar as contradições materiais e econômicas da sociedade capitalista.',
    aprofundamento:'Para Hegel, a história humana avança através de contradições que se resolvem em sínteses cada vez mais elevadas (o método dialético: tese, antítese, síntese). Marx pegou esse método, mas o aplicou de forma materialista: seriam as condições materiais e econômicas que determinam a consciência e a organização social ("materialismo histórico dialético"). Marx analisou o capitalismo como baseado na exploração da mais-valia (o valor que o trabalhador produz além do que recebe como salário), prevendo que as contradições internas do sistema levariam a revoluções proletárias.',
    exemplo:'Segundo Marx, o lucro do capitalista vem da diferença entre o valor que o trabalhador produz e o salário que ele efetivamente recebe — essa diferença é a mais-valia apropriada pelo dono dos meios de produção.',
    pontos:['Hegel: dialética (tese-antítese-síntese), história como progresso racional da liberdade','Marx: materialismo histórico — condições econômicas determinam a consciência social, não o contrário','Mais-valia: diferença entre o valor produzido pelo trabalhador e o salário que ele recebe']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Utilitarismo e Positivismo',
    resumo:'O utilitarismo avalia a moralidade de uma ação por suas consequências, buscando maximizar a felicidade do maior número de pessoas, enquanto o positivismo de Auguste Comte defendia que apenas o conhecimento científico deveria guiar a sociedade.',
    aprofundamento:'O utilitarismo de John Stuart Mill defende que uma ação é moralmente correta na medida em que maximiza a felicidade do maior número possível de pessoas afetadas — diferente da ética kantiana, que julga a ação pela intenção. Auguste Comte propôs a Lei dos Três Estados: o pensamento humano evolui de explicações teológicas para metafísicas até chegar ao estágio positivo (científico) — sua filosofia influenciou até a frase "Ordem e Progresso" na bandeira brasileira. Schopenhauer, mais pessimista, via a existência humana como dominada por uma "vontade" cega e insaciável, defendendo a arte e a compaixão como formas de aliviar o sofrimento.',
    exemplo:'A frase "Ordem e Progresso", presente na bandeira do Brasil, é uma síntese direta do lema positivista de Auguste Comte, demonstrando a influência dessa filosofia na formação da República brasileira.',
    pontos:['Utilitarismo (Mill): moralidade avaliada pelas consequências, maximizar felicidade coletiva','Positivismo (Comte): conhecimento científico deve guiar a sociedade; Lei dos Três Estados','A frase "Ordem e Progresso" da bandeira brasileira tem origem direta no positivismo de Comte']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Nietzsche',
    resumo:'Nietzsche criticou radicalmente a moral tradicional ocidental, propondo conceitos como a "morte de Deus", a vontade de potência e o além-do-homem como caminhos para uma nova forma de existência, livre de valores impostos externamente.',
    aprofundamento:'A célebre frase "Deus está morto" constata que os valores absolutos tradicionais perderam sua força de sustentação na sociedade moderna, deixando um vazio de sentido a ser preenchido por novos valores criados pelo próprio ser humano. Nietzsche criticava a "moral de rebanho" e propunha a vontade de potência — o impulso vital de autoafirmação e superação constante. O "além-do-homem" (Übermensch) representa um ideal de indivíduo que cria seus próprios valores, afirmando plenamente a existência através do conceito de "eterno retorno".',
    exemplo:'Alguém que abandona valores impostos pela sociedade para viver de acordo com seus próprios valores autênticos e criados por si mesmo estaria, na visão nietzschiana, se aproximando do ideal do além-do-homem.',
    pontos:['"Deus está morto": os valores absolutos tradicionais perderam sua força na modernidade','Vontade de potência: impulso vital de autoafirmação e superação constante','Além-do-homem (Übermensch): ideal de indivíduo que cria seus próprios valores']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Fenomenologia e Existencialismo',
    resumo:'A fenomenologia de Husserl busca descrever a experiência consciente tal como ela se apresenta, sem pressupostos prévios, e o existencialismo explorou a liberdade radical e a angústia da existência humana, sem essência predefinida.',
    aprofundamento:'Husserl propôs a fenomenologia como método para estudar os fenômenos colocando "entre parênteses" (epoché) os pressupostos prévios sobre o mundo. Merleau-Ponty aprofundou essa abordagem enfatizando o papel do corpo na experiência do mundo. Sartre, principal nome do existencialismo, defendia que "a existência precede a essência": primeiro existimos e só depois, através de escolhas livres, definimos quem somos — essa liberdade radical gera angústia ("o homem está condenado a ser livre"). Hannah Arendt cunhou o conceito de "banalidade do mal" — atrocidades em massa podem ser cometidas por pessoas comuns que deixam de pensar criticamente.',
    exemplo:'O conceito de "banalidade do mal" de Hannah Arendt, desenvolvido a partir do julgamento do nazista Adolf Eichmann, mostra que ele não era um monstro sádico, mas um burocrata comum que executou ordens horríveis sem refletir criticamente.',
    pontos:['Husserl: fenomenologia, descrever a experiência consciente colocando pressupostos "entre parênteses"','Sartre: "a existência precede a essência" — somos livres para nos definirmos através de nossas escolhas','Hannah Arendt: "banalidade do mal" — atrocidades cometidas por pessoas comuns que não pensam criticamente']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Filosofia da Ciência e da Linguagem',
    resumo:'Explora como o conhecimento científico é validado e como a linguagem estrutura nosso pensamento, com destaque para Wittgenstein, o Círculo de Viena, Karl Popper e Thomas Kuhn.',
    aprofundamento:'Wittgenstein defendia que a linguagem funciona como uma representação lógica da realidade, e que os limites da linguagem seriam os limites do próprio mundo que podemos descrever. O Círculo de Viena propunha o verificacionismo: uma afirmação só teria sentido científico se pudesse ser verificada empiricamente. Karl Popper propôs em seu lugar o critério de falseabilidade: uma teoria só é genuinamente científica se puder, em princípio, ser refutada por alguma observação. Thomas Kuhn argumentou que a ciência não avança de forma linear, mas através de "revoluções paradigmáticas" — crises que substituem um paradigma inteiro por outro incompatível.',
    exemplo:'Segundo o critério de Popper, a teoria da evolução é científica porque poderia, em princípio, ser refutada — mas até hoje resistiu a todas as tentativas de refutação.',
    pontos:['Círculo de Viena: verificacionismo — só tem sentido científico o que pode ser verificado empiricamente','Popper: falseabilidade — uma teoria científica precisa poder, em princípio, ser refutada','Kuhn: ciência avança por "revoluções paradigmáticas", não de forma linear e acumulativa']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Escola de Frankfurt e Filosofia Contemporânea',
    resumo:'A Escola de Frankfurt desenvolveu a "teoria crítica" da sociedade, questionando a razão instrumental e a indústria cultural, enquanto pensadores como Foucault, Rawls e Hans Jonas expandiram a reflexão para poder, justiça social e ética ambiental.',
    aprofundamento:'Adorno e Horkheimer criticaram a "indústria cultural" — a produção em massa de entretenimento padronizado que aliena as pessoas em vez de estimular pensamento crítico. Habermas propôs a "ação comunicativa" como base para uma democracia mais autêntica, baseada no diálogo racional livre de coerção. Michel Foucault analisou como o poder se exerce de forma difusa através de instituições (prisões, escolas, hospitais), moldando corpos e comportamentos através de vigilância e disciplina. John Rawls desenvolveu uma teoria da justiça baseada no "véu da ignorância". Hans Jonas propôs uma "ética da responsabilidade" voltada para as futuras gerações, ligada a debates ambientais atuais.',
    exemplo:'O "véu da ignorância" de Rawls é um exercício mental: imagine ajudar a criar as regras de uma sociedade sem saber se vai nascer rico ou pobre — nessas condições, você tenderia a criar regras mais justas para todos.',
    pontos:['Adorno e Horkheimer: crítica à "indústria cultural" como instrumento de alienação no capitalismo','Foucault: poder se exerce de forma difusa através de instituições (vigilância e disciplina)','Rawls: "véu da ignorância" — princípios justos são aceitos sem saber sua posição social futura']},
  {trilha:'enem', materia:'Sociologia', assunto:'Filosofia - Pré-Socráticos e Sofistas',
    resumo:'Marca o surgimento da filosofia na Grécia Antiga como tentativa de explicar o mundo através da razão, e não apenas de mitos. Os pré-socráticos buscavam o "princípio" (arché) de todas as coisas, enquanto os sofistas deslocaram o foco para o ser humano e a linguagem.',
    aprofundamento:'Os filósofos pré-socráticos (Tales, Heráclito, Parmênides, entre outros) foram os primeiros a propor explicações racionais e naturais para a origem do universo, rompendo com explicações puramente mitológicas — Tales via a água como princípio de tudo, Heráclito defendia que tudo está em constante mudança ("não se entra duas vezes no mesmo rio"), enquanto Parmênides defendia que o ser é imutável, um contraponto direto. Os sofistas foram os primeiros a colocar o ser humano no centro da reflexão filosófica (o famoso "o homem é a medida de todas as coisas", de Protágoras), ensinando retórica e argumentação, mas sendo criticados por Sócrates e Platão por relativizarem a verdade em função da persuasão.',
    exemplo:'A frase "não se pode entrar duas vezes no mesmo rio", atribuída a Heráclito, ilustra sua filosofia do "devir": o rio parece o mesmo, mas a água que flui nunca é a mesma, assim como tudo no universo está em constante mudança.',
    pontos:['Pré-socráticos: buscavam o "princípio" (arché) racional do universo, não mitológico','Heráclito: tudo está em constante mudança (devir); Parmênides: o ser é imutável','Sofistas: colocaram o ser humano e a linguagem no centro da reflexão, ensinavam retórica']},
  {trilha:'enem', materia:'Sociologia', assunto:'Filosofia - Sócrates, Platão e Aristóteles',
    resumo:'O trio mais influente da filosofia clássica grega: Sócrates com seu método de investigação através do diálogo, Platão com a teoria das Ideias, e Aristóteles com sua abordagem mais empírica e sistemática da realidade, política e ética.',
    aprofundamento:'Sócrates não deixou nada escrito, mas é conhecido pelo método socrático (maiêutica): através de perguntas sucessivas, ele levava o interlocutor a perceber contradições em suas próprias ideias — seu lema era "só sei que nada sei". Platão, discípulo de Sócrates, propôs a Teoria das Ideias: o mundo sensível (percebido pelos sentidos) seria apenas uma cópia imperfeita do mundo das Ideias (perfeito e imutável), ilustrado no famoso Mito da Caverna, onde prisioneiros confundem sombras com a realidade. Aristóteles, discípulo de Platão, discordou do mestre ao valorizar a experiência sensível como fonte legítima de conhecimento, desenvolvendo a lógica formal, a ética das virtudes (o meio-termo entre excessos) e a ideia de que o ser humano é um "animal político" que só se realiza plenamente em sociedade.',
    exemplo:'No Mito da Caverna de Platão, prisioneiros acorrentados desde a infância só veem sombras projetadas numa parede e as confundem com a realidade — uma metáfora para como as pessoas comuns confundem aparências com a verdade profunda.',
    pontos:['Sócrates: método socrático (maiêutica), "só sei que nada sei"','Platão: Teoria das Ideias, Mito da Caverna (mundo sensível x mundo das Ideias)','Aristóteles: valoriza a experiência sensível, ética das virtudes (meio-termo), "animal político"']},
  {trilha:'enem', materia:'Sociologia', assunto:'Filosofia - Filosofia Helenística',
    resumo:'Período pós-Aristóteles marcado por escolas filosóficas voltadas para a busca da felicidade individual e da tranquilidade de espírito (ataraxia), num contexto de instabilidade política após a morte de Alexandre, o Grande.',
    aprofundamento:'O Estoicismo defendia que a felicidade vem da aceitação racional do que não podemos controlar (o destino), cultivando o autocontrole e a virtude como únicos bens verdadeiros. O Epicurismo, frequentemente mal interpretado como puro hedonismo, defendia a busca por prazeres moderados e simples como caminho para a tranquilidade. O Ceticismo questionava a possibilidade de se alcançar certeza absoluta sobre qualquer coisa, defendendo a suspensão do julgamento (epoché) como caminho para a paz de espírito.',
    exemplo:'Um estoico moderno, ao perder o emprego, focaria em aceitar racionalmente o que não pode mudar e concentrar sua energia no que está sob seu controle, em vez de sofrer com o que já passou — aplicação prática do estoicismo.',
    pontos:['Estoicismo: aceitação racional do destino, virtude como único bem verdadeiro','Epicurismo: prazeres moderados e simples, não hedonismo desenfreado','Ceticismo: suspensão do julgamento (epoché) diante da incerteza']},
  {trilha:'enem', materia:'Sociologia', assunto:'Filosofia - Filosofia Medieval',
    resumo:'Período em que a filosofia se desenvolveu em estreita ligação com a teologia cristã, buscando conciliar fé e razão — com Santo Agostinho influenciado por Platão e São Tomás de Aquino influenciado por Aristóteles.',
    aprofundamento:'Santo Agostinho incorporou elementos platônicos ao cristianismo, defendendo que a verdadeira sabedoria vem da iluminação divina, e que o mal não é uma substância própria, mas ausência de bem (privatio boni). São Tomás de Aquino promoveu uma síntese entre a filosofia aristotélica e a teologia católica, defendendo que fé e razão não se opõem, mas se complementam — a razão pode chegar a algumas verdades sobre Deus através da observação do mundo (suas famosas "cinco vias"), enquanto outras exigem revelação divina.',
    exemplo:'As "cinco vias" de Tomás de Aquino usam argumentos racionais (como a necessidade de uma "causa primeira" para explicar o movimento no universo) para sustentar racionalmente a existência de Deus.',
    pontos:['Agostinho: influência platônica, iluminação divina, o mal como ausência de bem','Tomás de Aquino: síntese entre Aristóteles e teologia católica, fé e razão se complementam','As "cinco vias" de Tomás de Aquino: argumentos racionais para a existência de Deus']},
  {trilha:'enem', materia:'Sociologia', assunto:'Filosofia - Renascimento e Filosofia Política Moderna',
    resumo:'Período de transição entre a Idade Média e a Modernidade, marcado pela retomada do humanismo clássico e pelo surgimento de reflexões políticas mais realistas sobre o poder, com destaque para Maquiavel e Hobbes.',
    aprofundamento:'Maquiavel, em "O Príncipe", rompeu com a tradição de tratar política e moral como inseparáveis, defendendo uma análise pragmática do poder — o governante deveria fazer o que fosse necessário para manter a estabilidade do Estado. Montaigne, com seus "Ensaios", inaugurou um estilo de reflexão mais pessoal e cético sobre a condição humana. Francis Bacon defendeu o método indutivo e experimental como caminho para o conhecimento científico. Thomas Hobbes descreveu o estado de natureza como "a guerra de todos contra todos", justificando a necessidade de um Estado forte (o Leviatã) para garantir a paz social através de um contrato social.',
    exemplo:'Hobbes argumenta que, sem um poder soberano forte controlando a sociedade, os seres humanos viveriam em constante conflito por recursos e segurança — por isso abrem mão de parte de sua liberdade natural em troca de proteção.',
    pontos:['Maquiavel: análise pragmática do poder, separação entre política e moral tradicional','Bacon: método indutivo e experimental como base da ciência moderna','Hobbes: estado de natureza como "guerra de todos contra todos", Leviatã garante a paz social']},
  {trilha:'enem', materia:'Sociologia', assunto:'Filosofia - Racionalismo (Descartes e Espinosa)',
    resumo:'O racionalismo defende que a razão, e não a experiência sensível, é a principal fonte confiável de conhecimento verdadeiro — com René Descartes como fundador da filosofia moderna e Espinosa desenvolvendo uma visão radical de unidade entre Deus e a natureza.',
    aprofundamento:'Descartes, em busca de uma base absolutamente certa para o conhecimento, duvidou metodicamente de tudo que pudesse ser questionado, chegando à conclusão de que a única coisa da qual não se pode duvidar é do próprio ato de duvidar — daí sua célebre frase "penso, logo existo" (cogito ergo sum). Espinosa propôs uma visão panteísta, na qual Deus e a Natureza são a mesma substância infinita ("Deus sive Natura"), rejeitando a ideia de um Deus pessoal separado do mundo.',
    exemplo:'A dúvida metódica de Descartes é como questionar absolutamente tudo que você acredita, até restar apenas uma certeza inabalável: o próprio ato de duvidar prova que existe algo (você) que duvida.',
    pontos:['Descartes: dúvida metódica leva à certeza do "penso, logo existo" (cogito ergo sum)','Racionalismo: a razão é a fonte principal do conhecimento verdadeiro, não os sentidos','Espinosa: panteísmo — Deus e Natureza são a mesma substância infinita']},
  {trilha:'enem', materia:'Sociologia', assunto:'Filosofia - Empirismo (Locke e Hume)',
    resumo:'O empirismo se opõe ao racionalismo ao defender que todo conhecimento vem da experiência sensível — a mente humana nasceria como uma "tábula rasa" a ser preenchida pelas experiências vividas.',
    aprofundamento:'John Locke defendeu que não existem ideias inatas: tudo que sabemos vem da experiência e da reflexão sobre essa experiência — essa visão influenciou teorias políticas liberais, incluindo a defesa da propriedade privada e dos direitos naturais. David Hume levou o empirismo a um ceticismo radical, questionando o princípio de causalidade: nunca observamos diretamente uma "causa" produzindo um "efeito", apenas eventos que costumam ocorrer em sequência — o que chamamos de causalidade seria apenas um hábito mental de associação.',
    exemplo:'Segundo Hume, quando vemos uma bola de bilhar bater em outra e a segunda se mover, não "vemos" a causalidade em si — apenas observamos que isso sempre aconteceu no passado, e por hábito assumimos que vai continuar acontecendo.',
    pontos:['Empirismo: todo conhecimento vem da experiência sensível, mente como "tábula rasa"','Locke: base filosófica do liberalismo político, direitos naturais (vida, liberdade, propriedade)','Hume: ceticismo radical sobre causalidade — seria apenas hábito de associação, não certeza lógica']},
  {trilha:'enem', materia:'Sociologia', assunto:'Filosofia - Iluminismo e Contratualismo',
    resumo:'Movimento intelectual do século XVIII que valorizava a razão, a ciência e a crítica às tradições e autoridades estabelecidas, lançando as bases filosóficas para a Revolução Francesa e as democracias modernas.',
    aprofundamento:'Voltaire defendia a liberdade de expressão e criticava duramente o fanatismo religioso e o abuso de poder. Montesquieu propôs a divisão dos poderes (Executivo, Legislativo, Judiciário) como forma de evitar a concentração e o abuso de poder — princípio que ainda hoje estrutura constituições democráticas, incluindo a brasileira. Rousseau desenvolveu sua própria versão do contrato social: para ele, o ser humano nasce naturalmente bom e é a sociedade que o corrompe, e o contrato social ideal deveria expressar a "vontade geral" do povo, não apenas submissão a um soberano.',
    exemplo:'A divisão dos três poderes proposta por Montesquieu é a base da organização do Estado brasileiro hoje, criada justamente para evitar que uma só pessoa ou grupo concentre poder demais.',
    pontos:['Voltaire: liberdade de expressão, crítica ao fanatismo e abuso de poder','Montesquieu: divisão dos três poderes (Executivo, Legislativo, Judiciário)','Rousseau: ser humano nasce bom, sociedade corrompe; contrato social deve expressar a "vontade geral"']},
  {trilha:'enem', materia:'Sociologia', assunto:'Filosofia - Immanuel Kant',
    resumo:'Kant promoveu uma "revolução copernicana" na filosofia ao propor que é a mente humana que estrutura ativamente a forma como percebemos a realidade — além de desenvolver uma ética baseada no dever, não nas consequências.',
    aprofundamento:'Para Kant, a mente humana possui estruturas próprias (como espaço e tempo) que organizam ativamente as informações sensoriais antes mesmo de qualquer experiência. Na ética, Kant propôs o imperativo categórico: agir sempre segundo uma máxima que você gostaria que se tornasse uma lei universal — diferente de julgar uma ação apenas por suas consequências, o que importa é agir por dever, pela boa vontade em si mesma.',
    exemplo:'Mentir para conseguir uma vantagem pessoal falha no teste do imperativo categórico kantiano: se todo mundo mentisse sempre que fosse conveniente, a própria confiança necessária para a mentira funcionar deixaria de existir.',
    pontos:['"Revolução copernicana": a mente estrutura ativamente como percebemos a realidade','Imperativo categórico: aja segundo uma máxima que poderia virar lei universal','Ética kantiana: o que importa é agir por dever, não pelas consequências ou interesse próprio']},
  {trilha:'enem', materia:'Sociologia', assunto:'Filosofia - Idealismo Alemão e Marx',
    resumo:'Hegel desenvolveu uma filosofia da história baseada no movimento dialético do Espírito em direção à liberdade plena, e Karl Marx inverteu essa dialética para analisar as contradições materiais e econômicas da sociedade capitalista.',
    aprofundamento:'Para Hegel, a história humana avança através de contradições que se resolvem em sínteses cada vez mais elevadas (o método dialético: tese, antítese, síntese). Marx pegou esse método, mas o aplicou de forma materialista: seriam as condições materiais e econômicas que determinam a consciência e a organização social ("materialismo histórico dialético"). Marx analisou o capitalismo como baseado na exploração da mais-valia (o valor que o trabalhador produz além do que recebe como salário), prevendo que as contradições internas do sistema levariam a revoluções proletárias.',
    exemplo:'Segundo Marx, o lucro do capitalista vem da diferença entre o valor que o trabalhador produz e o salário que ele efetivamente recebe — essa diferença é a mais-valia apropriada pelo dono dos meios de produção.',
    pontos:['Hegel: dialética (tese-antítese-síntese), história como progresso racional da liberdade','Marx: materialismo histórico — condições econômicas determinam a consciência social, não o contrário','Mais-valia: diferença entre o valor produzido pelo trabalhador e o salário que ele recebe']},
  {trilha:'enem', materia:'Sociologia', assunto:'Filosofia - Utilitarismo e Positivismo',
    resumo:'O utilitarismo avalia a moralidade de uma ação por suas consequências, buscando maximizar a felicidade do maior número de pessoas, enquanto o positivismo de Auguste Comte defendia que apenas o conhecimento científico deveria guiar a sociedade.',
    aprofundamento:'O utilitarismo de John Stuart Mill defende que uma ação é moralmente correta na medida em que maximiza a felicidade do maior número possível de pessoas afetadas — diferente da ética kantiana, que julga a ação pela intenção. Auguste Comte propôs a Lei dos Três Estados: o pensamento humano evolui de explicações teológicas para metafísicas até chegar ao estágio positivo (científico) — sua filosofia influenciou até a frase "Ordem e Progresso" na bandeira brasileira. Schopenhauer, mais pessimista, via a existência humana como dominada por uma "vontade" cega e insaciável, defendendo a arte e a compaixão como formas de aliviar o sofrimento.',
    exemplo:'A frase "Ordem e Progresso", presente na bandeira do Brasil, é uma síntese direta do lema positivista de Auguste Comte, demonstrando a influência dessa filosofia na formação da República brasileira.',
    pontos:['Utilitarismo (Mill): moralidade avaliada pelas consequências, maximizar felicidade coletiva','Positivismo (Comte): conhecimento científico deve guiar a sociedade; Lei dos Três Estados','A frase "Ordem e Progresso" da bandeira brasileira tem origem direta no positivismo de Comte']},
  {trilha:'enem', materia:'Sociologia', assunto:'Filosofia - Nietzsche',
    resumo:'Nietzsche criticou radicalmente a moral tradicional ocidental, propondo conceitos como a "morte de Deus", a vontade de potência e o além-do-homem como caminhos para uma nova forma de existência, livre de valores impostos externamente.',
    aprofundamento:'A célebre frase "Deus está morto" constata que os valores absolutos tradicionais perderam sua força de sustentação na sociedade moderna, deixando um vazio de sentido a ser preenchido por novos valores criados pelo próprio ser humano. Nietzsche criticava a "moral de rebanho" e propunha a vontade de potência — o impulso vital de autoafirmação e superação constante. O "além-do-homem" (Übermensch) representa um ideal de indivíduo que cria seus próprios valores, afirmando plenamente a existência através do conceito de "eterno retorno".',
    exemplo:'Alguém que abandona valores impostos pela sociedade para viver de acordo com seus próprios valores autênticos e criados por si mesmo estaria, na visão nietzschiana, se aproximando do ideal do além-do-homem.',
    pontos:['"Deus está morto": os valores absolutos tradicionais perderam sua força na modernidade','Vontade de potência: impulso vital de autoafirmação e superação constante','Além-do-homem (Übermensch): ideal de indivíduo que cria seus próprios valores']},
  {trilha:'enem', materia:'Sociologia', assunto:'Filosofia - Fenomenologia e Existencialismo',
    resumo:'A fenomenologia de Husserl busca descrever a experiência consciente tal como ela se apresenta, sem pressupostos prévios, e o existencialismo explorou a liberdade radical e a angústia da existência humana, sem essência predefinida.',
    aprofundamento:'Husserl propôs a fenomenologia como método para estudar os fenômenos colocando "entre parênteses" (epoché) os pressupostos prévios sobre o mundo. Merleau-Ponty aprofundou essa abordagem enfatizando o papel do corpo na experiência do mundo. Sartre, principal nome do existencialismo, defendia que "a existência precede a essência": primeiro existimos e só depois, através de escolhas livres, definimos quem somos — essa liberdade radical gera angústia ("o homem está condenado a ser livre"). Hannah Arendt cunhou o conceito de "banalidade do mal" — atrocidades em massa podem ser cometidas por pessoas comuns que deixam de pensar criticamente.',
    exemplo:'O conceito de "banalidade do mal" de Hannah Arendt, desenvolvido a partir do julgamento do nazista Adolf Eichmann, mostra que ele não era um monstro sádico, mas um burocrata comum que executou ordens horríveis sem refletir criticamente.',
    pontos:['Husserl: fenomenologia, descrever a experiência consciente colocando pressupostos "entre parênteses"','Sartre: "a existência precede a essência" — somos livres para nos definirmos através de nossas escolhas','Hannah Arendt: "banalidade do mal" — atrocidades cometidas por pessoas comuns que não pensam criticamente']},
  {trilha:'enem', materia:'Sociologia', assunto:'Filosofia - Filosofia da Ciência e da Linguagem',
    resumo:'Explora como o conhecimento científico é validado e como a linguagem estrutura nosso pensamento, com destaque para Wittgenstein, o Círculo de Viena, Karl Popper e Thomas Kuhn.',
    aprofundamento:'Wittgenstein defendia que a linguagem funciona como uma representação lógica da realidade, e que os limites da linguagem seriam os limites do próprio mundo que podemos descrever. O Círculo de Viena propunha o verificacionismo: uma afirmação só teria sentido científico se pudesse ser verificada empiricamente. Karl Popper propôs em seu lugar o critério de falseabilidade: uma teoria só é genuinamente científica se puder, em princípio, ser refutada por alguma observação. Thomas Kuhn argumentou que a ciência não avança de forma linear, mas através de "revoluções paradigmáticas" — crises que substituem um paradigma inteiro por outro incompatível.',
    exemplo:'Segundo o critério de Popper, a teoria da evolução é científica porque poderia, em princípio, ser refutada — mas até hoje resistiu a todas as tentativas de refutação.',
    pontos:['Círculo de Viena: verificacionismo — só tem sentido científico o que pode ser verificado empiricamente','Popper: falseabilidade — uma teoria científica precisa poder, em princípio, ser refutada','Kuhn: ciência avança por "revoluções paradigmáticas", não de forma linear e acumulativa']},

  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Introdução à Biologia',
    resumo:'Aborda os fundamentos do que define um ser vivo (características gerais dos seres vivos) e como a ciência produz conhecimento através do método científico. É a base conceitual para entender toda a disciplina de Biologia no ENEM.',
    aprofundamento:'As características gerais dos seres vivos (organização celular, metabolismo, homeostase, reprodução, hereditariedade, evolução, resposta a estímulos) são usadas para diferenciar o que é vivo do que não é — um tema clássico envolve os vírus, que não têm metabolismo próprio fora de uma célula hospedeira, gerando debate sobre serem ou não considerados seres vivos completos. O método científico segue etapas: observação, formulação de hipótese, experimentação (com grupo controle e grupo experimental) e conclusão — o ENEM gosta de apresentar um experimento e pedir para identificar qual é a variável controlada, qual é a manipulada, e qual seria uma conclusão válida a partir dos dados.',
    exemplo:'Num experimento testando se a luz afeta o crescimento de plantas, o grupo controle fica em condições normais e o grupo experimental recebe a variável testada (mais ou menos luz) — todas as outras condições (água, temperatura, solo) devem ser mantidas iguais entre os grupos para a comparação ser válida.',
    pontos:['Seres vivos: organização celular, metabolismo, reprodução, resposta a estímulos, evolução','Vírus geram debate por não terem metabolismo próprio fora de uma célula hospedeira','Método científico: observação → hipótese → experimento (controle x experimental) → conclusão']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Bioquímica',
    resumo:'Estuda a composição química dos seres vivos — água e sais minerais (constituintes inorgânicos) e carboidratos, lipídios e proteínas (constituintes orgânicos) — e como essas moléculas sustentam funções vitais como energia, estrutura e reações metabólicas.',
    aprofundamento:'Carboidratos (glicídios) são a principal fonte de energia rápida do corpo, armazenados como glicogênio no fígado e músculos, e como amido nas plantas; lipídios armazenam energia de forma mais concentrada e de longo prazo, além de formar membranas celulares (fosfolipídios) e hormônios (esteroides); proteínas são formadas por aminoácidos e desempenham funções estruturais, enzimáticas e de defesa (anticorpos). A desnaturação de proteínas (perda da estrutura tridimensional por calor ou pH extremo) é um tema recorrente, relacionado a por que febre muito alta é perigosa e por que cozinhar um ovo muda sua textura permanentemente.',
    exemplo:'O colesterol, um lipídio esteroide, é essencial para a produção de hormônios e membranas celulares, mas seu excesso na dieta está associado a doenças cardiovasculares — um tema de saúde pública recorrente no ENEM.',
    pontos:['Carboidratos: energia rápida (glicose, glicogênio, amido)','Lipídios: energia de reserva de longo prazo, membranas celulares, hormônios','Proteínas: estrutura, enzimas, defesa — podem ser desnaturadas por calor ou pH extremo']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Biologia Molecular e Engenharia Genética',
    resumo:'Estuda a estrutura do DNA e RNA, os processos de replicação, transcrição e tradução (síntese proteica), e as tecnologias modernas de manipulação genética, como CRISPR e transgenia. É um dos blocos mais atuais do ENEM, ligado a biotecnologia e saúde.',
    aprofundamento:'O dogma central da biologia molecular (DNA → RNA → Proteína) explica como a informação genética é usada para produzir as proteínas que definem as características de um organismo. A técnica CRISPR-Cas9 revolucionou a edição genética por permitir cortar e modificar sequências específicas de DNA com precisão e baixo custo, sendo usada em pesquisas médicas e agricultura. Testes de PCR (usados em diagnóstico de COVID-19, por exemplo) amplificam pequenas quantidades de material genético para detecção — um tema muito contextualizado desde a pandemia. Transgênicos são organismos que receberam genes de outra espécie, gerando debates éticos e ambientais sobre segurança alimentar e biodiversidade.',
    exemplo:'O teste de RT-PCR para COVID-19 detecta material genético do vírus (RNA) amplificando-o milhares de vezes até ser detectável — uma aplicação direta e atual da biologia molecular.',
    pontos:['Dogma central: DNA → RNA → Proteína','CRISPR-Cas9: tecnologia de edição genética precisa e barata','Transgênicos: organismos com genes de outra espécie, geram debate ético e ambiental']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Citologia',
    resumo:'Estuda a estrutura e função da célula, unidade básica de todos os seres vivos, incluindo membrana plasmática, organelas citoplasmáticas e diferenças entre células procariontes e eucariontes.',
    aprofundamento:'A membrana plasmática, formada por uma bicamada de fosfolipídios com proteínas embutidas (modelo do mosaico fluido), controla o que entra e sai da célula através de difusão simples, osmose (movimento de água) e transporte ativo (com gasto de energia, contra o gradiente de concentração). As organelas têm funções especializadas: mitocôndrias realizam respiração celular, ribossomos sintetizam proteínas, complexo de Golgi processa e empacota substâncias, e lisossomos digerem materiais. Células procariontes (bactérias) não têm núcleo organizado nem organelas membranosas, enquanto células eucariontes (animais, plantas, fungos) têm núcleo definido e organelas complexas.',
    exemplo:'Ao colocar uma célula vegetal em água pura, ela incha por osmose (água entra pois a concentração interna de solutos é maior), mas não estoura porque a parede celular rígida contém a pressão — diferente de uma célula animal na mesma situação, que poderia sofrer lise celular.',
    pontos:['Membrana plasmática: controla entrada/saída por difusão, osmose e transporte ativo','Mitocôndria: respiração celular; Ribossomo: síntese de proteínas','Procariontes: sem núcleo organizado; Eucariontes: núcleo definido e organelas complexas']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Bioenergética',
    resumo:'Estuda como as células obtêm e utilizam energia através da respiração celular (aeróbica e fermentação) e da fotossíntese, os dois processos fundamentais que conectam o mundo vivo através de trocas de gases e energia.',
    aprofundamento:'A respiração celular aeróbica ocorre nas mitocôndrias e usa oxigênio para "quebrar" glicose, liberando bastante energia (ATP) e produzindo CO2 e água como subprodutos — é o processo inverso da fotossíntese. A fermentação ocorre na ausência de oxigênio e produz muito menos energia, gerando ácido lático (fermentação láctica, em músculos durante exercício intenso) ou álcool e CO2 (fermentação alcoólica, usada na produção de pão, cerveja e etanol combustível). A fotossíntese, realizada por plantas e algas nos cloroplastos, converte energia luminosa em energia química (glicose), usando CO2 e água como matéria-prima e liberando oxigênio como subproduto.',
    exemplo:'Durante um exercício físico intenso, quando o oxigênio não chega rápido o suficiente aos músculos, eles recorrem à fermentação láctica para gerar energia, e o acúmulo de ácido lático é o que causa a sensação de cansaço e queimação muscular.',
    pontos:['Respiração aeróbica: usa O2, produz muito ATP, libera CO2 e água','Fermentação: sem O2, produz pouco ATP (láctica: ácido lático; alcoólica: álcool + CO2)','Fotossíntese: luz + CO2 + água → glicose + O2 (processo inverso da respiração)']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Núcleo e Divisão Celular',
    resumo:'Estuda a estrutura do núcleo celular, os cromossomos, e os dois principais processos de divisão celular: mitose (gera células idênticas, usada em crescimento e reparo) e meiose (gera gametas com metade dos cromossomos, usada na reprodução sexuada).',
    aprofundamento:'A mitose produz duas células-filhas geneticamente idênticas à célula-mãe, mantendo o mesmo número de cromossomos — é o processo usado no crescimento do corpo e na reposição de células. A meiose reduz o número de cromossomos pela metade, formando gametas geneticamente diferentes entre si por causa da recombinação genética (crossing-over) — essa variabilidade é a base da diversidade entre irmãos, mesmo tendo os mesmos pais. Erros na divisão celular, como a não disjunção (cromossomos que não se separam corretamente), podem causar condições como a Síndrome de Down (trissomia do cromossomo 21).',
    exemplo:'A Síndrome de Down ocorre quando, por não disjunção durante a meiose, um gameta recebe uma cópia extra do cromossomo 21, resultando em três cópias desse cromossomo no indivíduo, em vez das duas normais.',
    pontos:['Mitose: 2 células idênticas, mesmo número de cromossomos (crescimento e reparo)','Meiose: 4 células diferentes, metade dos cromossomos (formação de gametas)','Não disjunção: erro na separação de cromossomos, pode causar síndromes genéticas']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Reprodução Humana',
    resumo:'Estuda os sistemas reprodutores masculino e feminino, os processos de formação de gametas, o ciclo menstrual, métodos contraceptivos e fecundação.',
    aprofundamento:'O ciclo menstrual é regulado por hormônios (FSH, LH, estrogênio e progesterona) que controlam a maturação do óvulo e a preparação do endométrio para uma possível gravidez — se não há fecundação, os níveis hormonais caem e ocorre a menstruação. Métodos contraceptivos hormonais (pílula) funcionam principalmente inibindo a ovulação através de hormônios sintéticos que "enganam" o corpo, fazendo-o reagir como se já estivesse grávido. O ENEM costuma contextualizar esse conteúdo com educação sexual, saúde reprodutiva e prevenção de gravidez na adolescência e de infecções sexualmente transmissíveis.',
    exemplo:'A pílula anticoncepcional combina hormônios que inibem a liberação de FSH e LH pela hipófise, impedindo a ovulação — sem óvulo liberado, não há possibilidade de fecundação.',
    pontos:['Ciclo menstrual regulado por FSH, LH, estrogênio e progesterona','Métodos hormonais geralmente inibem a ovulação','Fecundação ocorre nas tubas uterinas, geralmente poucos dias após a ovulação']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Embriologia Animal',
    resumo:'Estuda o desenvolvimento do embrião desde a fecundação até a formação completa dos órgãos, incluindo os anexos embrionários (âmnio, placenta) que protegem e nutrem o embrião em diferentes grupos de animais.',
    aprofundamento:'As fases do desenvolvimento embrionário seguem uma sequência: segmentação (divisões celulares sucessivas do zigoto), gastrulação (formação das três camadas germinativas: ectoderme, mesoderme, endoderme) e organogênese (formação dos órgãos a partir dessas camadas). Répteis e aves (animais amniotas) desenvolvem âmnio, cório e alantoide dentro do ovo; mamíferos desenvolvem a placenta, órgão que permite trocas diretas de nutrientes e gases entre mãe e feto. Vivíparos (mamíferos) se desenvolvem dentro do corpo da mãe; ovíparos (aves, répteis) se desenvolvem dentro de um ovo fora do corpo da mãe; ovovivíparos (alguns tubarões e cobras) se desenvolvem em ovos que permanecem dentro do corpo da mãe até a eclosão.',
    exemplo:'A placenta humana permite que oxigênio, nutrientes e anticorpos passem da mãe para o feto, enquanto dióxido de carbono e resíduos metabólicos passam do feto para a mãe ser eliminados — uma via de mão dupla essencial para o desenvolvimento fetal.',
    pontos:['Fases: segmentação → gastrulação (3 camadas germinativas) → organogênese','Placenta (mamíferos) permite trocas diretas entre mãe e feto','Vivíparos: nascem do corpo da mãe; Ovíparos: nascem de ovo; Ovovivíparos: ovo dentro da mãe']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Histologia Animal',
    resumo:'Estuda os tecidos que compõem o corpo dos animais — epitelial, conjuntivo, muscular e nervoso — cada um especializado em funções específicas como revestimento, sustentação, movimento e transmissão de impulsos.',
    aprofundamento:'O tecido epitelial reveste superfícies internas e externas do corpo e também forma glândulas de secreção; o tecido conjuntivo (que inclui sangue, tecido ósseo, cartilaginoso e adiposo) sustenta e conecta outros tecidos, além de ter função de defesa imunológica; o tecido muscular é responsável pelo movimento através de contração de fibras; o tecido nervoso é formado por neurônios especializados em transmitir impulsos elétricos. O sistema imunológico é um tema muito contextualizado com vacinas: a imunização ativa (vacinas) estimula o próprio corpo a produzir anticorpos, enquanto a imunização passiva (soros) fornece anticorpos prontos, de ação mais rápida mas duração mais curta.',
    exemplo:'Uma vacina contra tétano estimula o sistema imunológico a produzir anticorpos específicos (imunização ativa, efeito duradouro), enquanto o soro antitetânico aplicado após um ferimento contaminado fornece anticorpos prontos imediatamente (imunização passiva, efeito rápido mas temporário).',
    pontos:['Tecido epitelial: revestimento e glândulas','Tecido conjuntivo: sustentação, sangue, defesa imunológica','Vacina (imunização ativa) x Soro (imunização passiva): diferença de mecanismo e duração']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Fisiologia Animal',
    resumo:'Estuda o funcionamento dos sistemas do corpo animal — nervoso, endócrino, respiratório, circulatório, digestório e excretor — e como eles trabalham de forma integrada para manter a homeostase do organismo.',
    aprofundamento:'O sistema nervoso autônomo (simpático e parassimpático) regula funções involuntárias: o simpático prepara o corpo para situações de estresse ("luta ou fuga") e o parassimpático promove relaxamento e digestão. O sistema endócrino usa hormônios para regular processos mais lentos e duradouros, como crescimento e metabolismo — a hipófise é considerada a "glândula mestra" por controlar outras glândulas do corpo. O sistema circulatório evoluiu de simples (peixes) para duplo completo (aves e mamíferos), permitindo maior eficiência na distribuição de oxigênio e sustentando a endotermia. O ENEM adora contextualizar drogas (álcool, tabaco, cocaína) com seus efeitos específicos nesses sistemas.',
    exemplo:'O sistema nervoso simpático é ativado numa situação de perigo, acelerando os batimentos cardíacos e dilatando as pupilas para preparar o corpo para "lutar ou fugir"; já o parassimpático, ativado em repouso, desacelera o coração e estimula a digestão.',
    pontos:['Sistema nervoso autônomo: simpático (luta/fuga) x parassimpático (repouso/digestão)','Sistema endócrino: hipófise é a "glândula mestra", regula outras glândulas','Circulação dupla completa (aves/mamíferos) sustenta a endotermia']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Genética',
    resumo:'Estuda como as características são transmitidas dos pais para os filhos, através das Leis de Mendel, sistemas sanguíneos (ABO e Rh) e padrões mais complexos de herança, como ligada ao sexo e poligênica.',
    aprofundamento:'A Primeira Lei de Mendel explica que cada característica é determinada por um par de alelos que se separam na formação dos gametas; a Segunda Lei explica que características diferentes são herdadas de forma independente umas das outras (exceto quando os genes estão ligados no mesmo cromossomo, fenômeno chamado linkage). O sistema sanguíneo ABO é determinado por três alelos que se combinam para formar os quatro tipos sanguíneos, e o sistema Rh é relevante em gestações, podendo causar eritroblastose fetal quando uma mãe Rh- gesta um filho Rh+ sem tratamento preventivo. Herança ligada ao sexo (genes no cromossomo X) explica por que certas condições, como o daltonismo, são muito mais comuns em homens do que em mulheres.',
    exemplo:'Um casal onde a mãe é Rh- e já teve sensibilização (por exposição prévia a sangue Rh+) corre risco de eritroblastose fetal numa segunda gestação de bebê Rh+, por isso o pré-natal inclui prevenção específica para esse caso.',
    pontos:['1ª Lei de Mendel: segregação dos alelos na formação de gametas','2ª Lei de Mendel: características diferentes herdadas de forma independente (exceto genes ligados)','Herança ligada ao sexo: genes no cromossomo X, mais expressos em homens (ex: daltonismo)']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Origem da Vida',
    resumo:'Estuda as teorias científicas sobre como a vida surgiu na Terra, incluindo a superação histórica da geração espontânea (abiogênese) e as hipóteses modernas sobre a formação das primeiras moléculas orgânicas e células.',
