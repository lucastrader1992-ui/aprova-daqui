<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprova Daqui — ENEM da nossa região</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board: #101B33;
    --board-alt: #16244A;
    --board-line: #24345E;
    --paper: #FFFFFF;
    --paper-dim: #EEF1F6;
    --chalk-yellow: #C9932F;
    --clay-red: #C0392B;
    --ink: #16213A;
    --ink-soft: #5C6B85;
    --chalk-white: #EDF1FA;
    --ok-green: #1F8A5F;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#F4F6FA;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }
  .app{
    display:flex;
    min-height:100vh;
  }
  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:232px;
    flex-shrink:0;
    background:var(--board);
    padding:28px 18px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .brand{
    font-family:'Inter', sans-serif;
    font-size:1.35rem;
    font-weight:800;
    color:#FFFFFF;
    margin-bottom:2px;
    letter-spacing:-0.01em;
  }
  .brand-sub{
    font-family:'Inter', sans-serif;
    font-size:0.78rem;
    font-weight:500;
    color:var(--chalk-yellow);
    text-transform:uppercase;
    letter-spacing:0.06em;
    opacity:0.9;
    margin-bottom:30px;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 14px;
    border-radius:8px;
    color:var(--chalk-white);
    opacity:0.68;
    cursor:pointer;
    font-size:0.92rem;
    font-weight:500;
    transition:background .15s, opacity .15s;
    border:none;
    background:none;
    text-align:left;
    width:100%;
  }
  .nav-item:hover{ background:rgba(255,255,255,0.06); opacity:1; }
  .nav-item.active{
    background:rgba(255,255,255,0.09);
    opacity:1;
    box-shadow:inset 3px 0 0 var(--chalk-yellow);
    font-weight:600;
  }
  .nav-emoji{ font-size:1.0rem; }

  .trilha-selector{
    display:flex;
    flex-direction:column;
    gap:5px;
    margin-bottom:22px;
    padding-bottom:22px;
    border-bottom:1px solid rgba(255,255,255,0.1);
  }
  .trilha-btn{
    padding:9px 11px;
    border-radius:7px;
    border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.04);
    color:var(--chalk-white);
    font-size:0.82rem;
    font-weight:500;
    text-align:left;
    cursor:pointer;
    opacity:0.65;
    transition:background .15s, opacity .15s, border-color .15s;
  }
  .trilha-btn:hover{ opacity:0.9; }
  .trilha-btn.active{
    background:var(--chalk-yellow);
    color:var(--board);
    border-color:var(--chalk-yellow);
    opacity:1;
    font-weight:700;
  }
  .sidebar-foot{
    margin-top:auto;
    font-size:0.72rem;
    color:var(--chalk-white);
    opacity:0.35;
    line-height:1.5;
  }

  /* ---------- MAIN ---------- */
  .main{
    flex:1;
    padding:36px 42px;
    max-width:1140px;
  }
  .page-title{
    font-family:'Inter', sans-serif;
    font-size:1.6rem;
    font-weight:700;
    color:var(--ink);
    margin:0 0 4px 0;
    letter-spacing:-0.01em;
  }
  .page-sub{
    color:var(--ink-soft);
    font-size:0.92rem;
    margin-bottom:28px;
  }

  .card{
    background:var(--paper);
    color:var(--ink);
    border-radius:var(--radius);
    padding:24px;
    margin-bottom:20px;
    border:1px solid var(--paper-dim);
    box-shadow:0 1px 2px rgba(16,27,51,0.05);
  }
  .card h3{
    font-family:'Inter', sans-serif;
    font-weight:700;
    margin:0 0 14px 0;
    font-size:1.02rem;
    color:var(--ink);
  }

  /* ---------- PAINEL / DASHBOARD ---------- */
  .board-hero{
    background:linear-gradient(135deg, var(--board) 0%, var(--board-alt) 100%);
    border-radius:var(--radius);
    padding:28px 30px;
    margin-bottom:24px;
    position:relative;
  }
  .chalk-greeting{
    font-family:'Inter', sans-serif;
    font-size:1.5rem;
    font-weight:700;
    color:#FFFFFF;
    line-height:1.25;
    letter-spacing:-0.01em;
  }
  .chalk-greeting b{ color:var(--chalk-yellow); }

  .stat-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:14px;
    margin-top:22px;
  }
  .stat-pin{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:8px;
    padding:16px;
    text-align:left;
    position:relative;
    border-left:3px solid var(--chalk-yellow);
  }
  .stat-num{
    font-family:'JetBrains Mono', monospace;
    font-size:1.55rem;
    font-weight:700;
    color:#FFFFFF;
  }
  .stat-label{
    font-size:0.76rem;
    color:var(--chalk-white);
    opacity:0.65;
    margin-top:3px;
  }

  /* ---------- QUESTOES ---------- */
  .filter-row{
    display:flex;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  select, button.btn, input[type=text], textarea{
    font-family:'Work Sans', sans-serif;
    font-size:0.9rem;
  }
  select{
    padding:9px 12px;
    border-radius:7px;
    border:1px solid var(--paper-dim);
    background:#FFFFFF;
    color:var(--ink);
  }
  .btn{
    padding:10px 18px;
    border-radius:7px;
    border:none;
    background:var(--board);
    color:#FFFFFF;
    font-weight:600;
    cursor:pointer;
    transition:filter .15s, transform .1s;
  }
  .btn:hover{ filter:brightness(1.25); }
  .btn:active{ transform:scale(0.98); }
  .btn.secondary{
    background:transparent;
    border:1px solid var(--board-line);
    color:var(--board);
  }
  .btn.clay{ background:var(--clay-red); color:#FFFFFF; }

  .question-card .tag{
    display:inline-block;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    background:var(--board);
    color:var(--chalk-yellow);
    padding:3px 9px;
    border-radius:20px;
    margin-bottom:12px;
    font-weight:600;
  }
  .question-text{ font-size:1rem; line-height:1.55; margin-bottom:16px; }
  .opt{
    display:flex;
    gap:10px;
    align-items:flex-start;
    padding:11px 13px;
    border-radius:7px;
    border:1px solid var(--paper-dim);
    margin-bottom:8px;
    cursor:pointer;
    transition:background .12s;
  }
  .opt:hover{ background:var(--paper-dim); }
  .opt.correct{ background:#E6F4ED; border-color:var(--ok-green); }
  .opt.wrong{ background:#FBEAE8; border-color:var(--clay-red); }
  .opt-letter{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    color:var(--board);
    flex-shrink:0;
  }

  /* ---------- SIMULADO ---------- */
  .timer-box{
    font-family:'JetBrains Mono', monospace;
    font-size:1.3rem;
    font-weight:600;
    background:var(--board);
    color:var(--chalk-yellow);
    padding:8px 16px;
    border-radius:7px;
    display:inline-block;
    margin-bottom:18px;
  }
  .progress-bar-track{
    width:100%; height:6px; background:var(--paper-dim);
    border-radius:4px; overflow:hidden; margin-bottom:20px;
  }
  .progress-bar-fill{
    height:100%; background:var(--clay-red); transition:width .3s;
  }

  /* ---------- REDACAO ---------- */
  textarea{
    width:100%;
    min-height:280px;
    padding:16px;
    border-radius:8px;
    border:1px solid var(--paper-dim);
    background:#fff;
    color:var(--ink);
    line-height:1.6;
    resize:vertical;
  }
  .comp-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--paper-dim);
  }
  .comp-row:last-child{ border-bottom:none; }
  .comp-name{ font-weight:600; font-size:0.88rem; max-width:70%; }
  .comp-score{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    color:var(--board);
  }
  .comp-comment{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .nota-total{
    text-align:center;
    padding:22px;
    background:linear-gradient(135deg, var(--board) 0%, var(--board-alt) 100%);
    border-radius:8px;
    margin-bottom:18px;
  }
  .nota-total .num{
    font-family:'JetBrains Mono', monospace;
    font-size:2.6rem;
    font-weight:700;
    color:var(--chalk-yellow);
  }
  .nota-total .lbl{ color:var(--chalk-white); opacity:0.7; font-size:0.85rem; }

  /* ---------- RANKING ---------- */
  .rank-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 14px;
    border-radius:8px;
    margin-bottom:8px;
    background:var(--paper-dim);
  }
  .rank-row.me{ background:#FCF3DE; border:1px solid var(--chalk-yellow); }
  .rank-pos{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    width:28px;
    text-align:center;
    color:var(--board);
  }
  .rank-name{ flex:1; font-weight:500; }
  .rank-pts{ font-family:'JetBrains Mono', monospace; font-weight:600; }

  .loading-dots{ opacity:0.7; font-style:italic; font-size:0.9rem; }
  .empty-note{ color:var(--ink-soft); font-size:0.9rem; font-style:italic; }

  @media (max-width:800px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; overflow-x:auto; padding:14px; }
    .brand,.brand-sub,.sidebar-foot{ display:none; }
    .main{ padding:20px; }
    .stat-grid{ grid-template-columns:repeat(2,1fr); }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<div id="app-loading" style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#101B33; color:#fff; font-family:'Inter',sans-serif;">

<script>
/* ============================================================

    pontos:['Média: soma de todos os valores ÷ quantidade de valores','Mediana: valor central quando os dados estão ordenados; resiste a outliers','Desvio padrão: mede o quanto os dados se espalham em torno da média']},
  {trilha:'enem', materia:'Matemática', assunto:'Análise Combinatória',
    resumo:'Análise Combinatória estuda como contar de quantas formas diferentes é possível organizar ou escolher elementos de um conjunto, usando o Princípio Fundamental da Contagem, permutações, arranjos e combinações. É a base para calcular probabilidades no ENEM.',
    aprofundamento:'O ponto-chave é identificar se a ordem dos elementos importa ou não. Se a ordem importa (ex: formar uma senha, organizar pessoas em fila), usa-se permutação ou arranjo. Se a ordem NÃO importa (ex: escolher um grupo de pessoas para uma comissão, sem função definida), usa-se combinação. A fórmula de combinação é C(n,p) = n!/(p!×(n−p)!), enquanto arranjo é A(n,p) = n!/(n−p)! — a diferença entre elas é justamente que a combinação divide também por p!, eliminando as repetições que vêm apenas da ordem diferente dos mesmos elementos. Erro comum: usar arranjo/permutação quando na verdade a situação pede combinação (ou vice-versa) — sempre pergunte "trocar a ordem gera um resultado diferente?" antes de escolher a fórmula.',
    exemplo:'Escolher 3 pessoas entre 5 para formar uma comissão (ordem não importa): C(5,3) = 5!/(3!×2!) = 10 formas. Já formar uma fila com essas 3 pessoas escolhidas (ordem importa): seria um cálculo de permutação à parte.',
    pontos:['Ordem importa → permutação ou arranjo; ordem não importa → combinação','C(n,p) = n!/(p!×(n−p)!)','Sempre pergunte: "trocar a ordem muda o resultado?" antes de escolher a fórmula']},
  {trilha:'enem', materia:'Matemática', assunto:'Probabilidade',
    resumo:'Probabilidade mede a chance de um evento acontecer, calculada como número de casos favoráveis dividido pelo número de casos possíveis. No ENEM, conecta-se diretamente com Análise Combinatória para contar esses casos em situações mais complexas.',
    aprofundamento:'A probabilidade da união de dois eventos é P(A∪B) = P(A) + P(B) − P(A∩B) — a mesma lógica de conjuntos, subtraindo a interseção contada duas vezes. A probabilidade condicional, P(A|B), calcula a chance de A acontecer sabendo que B já aconteceu, e é dada por P(A∩B)/P(B) — muito cobrada em contextos médicos (chance de uma doença dado um resultado de exame) e jogos de cartas/dados sequenciais. Eventos independentes (um não afeta o outro) têm P(A∩B) = P(A)×P(B); eventos dependentes exigem calcular a probabilidade condicional passo a passo. Erro comum: tratar eventos dependentes como se fossem independentes, multiplicando probabilidades sem ajustar para a mudança de condição.',
    exemplo:'Numa urna com 5 bolas vermelhas e 3 azuis, a probabilidade de tirar 2 vermelhas seguidas sem reposição é: (5/8) × (4/7) = 20/56 = 5/14 (a segunda probabilidade muda porque uma bola já foi retirada).',
    pontos:['P(evento) = casos favoráveis / casos possíveis','P(A∪B) = P(A) + P(B) − P(A∩B)','Sem reposição, as probabilidades mudam a cada evento (eventos dependentes)']},
  {trilha:'enem', materia:'Matemática', assunto:'Introdução às Funções',
    resumo:'Função é uma relação em que cada valor de entrada (x) corresponde a exatamente um valor de saída (y). Função composta e função inversa são extensões desse conceito, testando se o aluno realmente entende a relação entre entrada e saída, e não apenas decora fórmulas prontas.',
    aprofundamento:'Função composta, escrita como (f∘g)(x) = f(g(x)), significa aplicar primeiro g e depois usar esse resultado como entrada de f — a ordem de aplicação é essencial e não pode ser invertida. Função inversa, f⁻¹(x), "desfaz" o que a função original fez: se f(2)=7, então f⁻¹(7)=2. Só existe função inversa quando a função original é bijetora (cada saída corresponde a uma única entrada). Erro comum: calcular f⁻¹(x) como 1/f(x) — a função inversa NÃO é o inverso multiplicativo, é a função que desfaz a transformação original.',
    exemplo:'Se f(x) = 2x+3, para achar a inversa: trocamos x por y, isolamos: y=2x+3 → x=(y−3)/2, logo f⁻¹(x) = (x−3)/2. Conferindo: f(2)=7, e f⁻¹(7) = (7−3)/2 = 2. Correto.',
    pontos:['(f∘g)(x) = f(g(x)) — aplica g primeiro, depois f','Função inversa desfaz a transformação original (não é 1/f(x))','Só existe inversa se a função for bijetora']},
  {trilha:'enem', materia:'Matemática', assunto:'Função Afim',
    resumo:'Função afim é do tipo f(x) = ax + b, cujo gráfico é sempre uma reta. É a função mais cobrada no ENEM porque modela situações do dia a dia com "custo fixo + custo variável", como corridas de aplicativo, contas de telefone e tarifas de água.',
    aprofundamento:'O coeficiente "b" representa o valor de partida (quando x=0, antes de qualquer variação, também chamado de valor inicial ou intercepto), e o coeficiente "a" representa a taxa de variação — quanto y muda para cada unidade que x aumenta. A raiz da função (onde f(x)=0) indica em que ponto o gráfico cruza o eixo x. Funções definidas por várias sentenças (função por partes) aparecem em tarifas com faixas diferentes, como conta de luz que cobra um valor por kWh até certo consumo e outro valor acima disso. Se a reta sobe, "a" é positivo (função crescente); se desce, "a" é negativo (função decrescente); quanto mais inclinada, maior o valor absoluto de "a".',
    exemplo:'Uma corrida de táxi custa C(km) = 6 + 2,5×km. Para uma corrida de 10 km: C(10) = 6 + 2,5×10 = R$ 31,00. A raiz dessa função (onde custaria zero) não tem sentido prático aqui, mas seria em km=−2,4.',
    pontos:['f(x) = ax + b — gráfico é sempre uma reta','"a" é a taxa de variação (inclinação); "b" é o valor quando x=0','Reta sobe: a>0 (crescente); reta desce: a<0 (decrescente)']},
  {trilha:'enem', materia:'Matemática', assunto:'Função Quadrática',
    resumo:'Função quadrática é do tipo f(x) = ax² + bx + c (a≠0), cujo gráfico é uma parábola. Aparece no ENEM em problemas de otimização (maximizar lucro, minimizar custo) e em situações de lançamento de projéteis.',
    aprofundamento:'O discriminante (Δ = b²−4ac) define quantas raízes reais a função tem: Δ>0 (parábola cruza o eixo x em dois pontos), Δ=0 (toca o eixo x em um único ponto — o vértice), Δ<0 (não cruza o eixo x). O vértice da parábola, ponto de máximo ou mínimo, tem coordenadas xv = −b/2a e yv = −Δ/4a — se "a" é positivo, a parábola tem concavidade para cima (vértice é ponto de mínimo); se "a" é negativo, concavidade para baixo (vértice é ponto de máximo). A forma fatorada f(x) = a(x−r1)(x−r2), usando as raízes, facilita esboçar o gráfico rapidamente.',
    exemplo:'Uma bola é lançada e sua altura é h(t) = −5t² + 20t. O tempo de altura máxima é tv = −20/(2×−5) = 2s, e a altura máxima é h(2) = −5×4+40 = 20m.',
    pontos:['Δ = b²−4ac define o número de raízes reais','Vértice: xv = −b/2a (ponto de máximo se a<0, mínimo se a>0)','Forma fatorada usa as raízes para facilitar o esboço do gráfico']},
  {trilha:'enem', materia:'Matemática', assunto:'Exponencial',
    resumo:'Função exponencial é do tipo f(x) = aˣ (a>0, a≠1), caracterizada por crescimento ou decrescimento muito mais rápido que o da função afim. É usada para modelar crescimento populacional, juros compostos, meia-vida radioativa e propagação de epidemias.',
    aprofundamento:'Se a base "a" é maior que 1, a função é crescente (cresce cada vez mais rápido); se a base está entre 0 e 1, a função é decrescente (decai cada vez mais devagar, se aproximando de zero sem nunca chegar lá). Equações exponenciais são resolvidas igualando as bases: se aˣ = aʸ, então x = y — por isso o primeiro passo é sempre tentar escrever os dois lados da equação com a mesma base. Um erro muito comum é achar que crescimento exponencial é "parecido" com crescimento linear em curto prazo — na prática, a diferença fica gigantesca rapidamente, e é exatamente essa aceleração que torna a exponencial tão poderosa para modelar juros compostos e epidemias.',
    exemplo:'Resolvendo 2^x = 32: escrevemos 32 como 2⁵, logo 2^x = 2⁵ → x=5.',
    pontos:['a>1: função crescente; 0<a<1: função decrescente','Para resolver equações exponenciais, iguale as bases primeiro','Modela juros compostos, crescimento populacional e meia-vida radioativa']},
  {trilha:'enem', materia:'Matemática', assunto:'Logaritmos',
    resumo:'Logaritmo é a operação inversa da exponenciação: log_a(b) = x significa que a^x = b. É a ferramenta usada para "trazer o expoente para baixo", essencial em equações exponenciais que não podem ser resolvidas só igualando bases.',
    aprofundamento:'As propriedades operatórias mais cobradas são: log(m×n) = log(m)+log(n) (log do produto vira soma), log(m/n) = log(m)−log(n) (log do quociente vira subtração), e log(m^k) = k×log(m) (o expoente "desce" multiplicando). A mudança de base, log_a(b) = log_c(b)/log_c(a), é usada quando a calculadora ou tabela só tem uma base disponível (geralmente log na base 10). A função logarítmica é o "espelho" da função exponencial — seus gráficos são simétricos em relação à reta y=x. Erro comum: aplicar as propriedades operatórias em log de soma ou subtração (log(m+n) NÃO é log(m)+log(n) — essa propriedade só vale para produto e quociente).',
    exemplo:'Resolvendo log₂(x) = 5: por definição, 2⁵=x, logo x=32.',
    pontos:['log_a(b)=x significa a^x=b (definição fundamental)','log(m×n)=log(m)+log(n); log(m^k)=k×log(m)','log(m+n) NÃO é igual a log(m)+log(n) — essa propriedade não existe']},
  {trilha:'enem', materia:'Matemática', assunto:'Trigonometria',
    resumo:'Trigonometria estuda as relações entre ângulos e lados em triângulos e na circunferência trigonométrica, usando seno, cosseno e tangente. É aplicada em problemas de altura, distância e também nas funções periódicas (movimentos cíclicos, ondas, marés).',
    aprofundamento:'A relação fundamental sen²x + cos²x = 1 é a base para deduzir todas as outras identidades trigonométricas. Na circunferência trigonométrica (raio 1), o seno é a coordenada y e o cosseno é a coordenada x de um ponto que se move ao longo do círculo conforme o ângulo aumenta — por isso ambos os valores oscilam entre −1 e 1. As funções seno e cosseno são periódicas (se repetem a cada 360° ou 2π radianos), o que as torna ideais para modelar fenômenos cíclicos como marés, batimentos cardíacos e ondas sonoras. Arcos côngruos são ângulos que têm a mesma posição final na circunferência (diferem por voltas completas de 360°), tendo os mesmos valores de seno, cosseno e tangente.',
    exemplo:'Sabendo que sen(30°) = 0,5, o cos(30°) pode ser encontrado por sen²+cos²=1: 0,25+cos²=1 → cos²=0,75 → cos(30°) = √0,75 ≈ 0,866.',
    pontos:['sen²x + cos²x = 1 (relação fundamental, base de tudo)','Seno e cosseno são periódicos: se repetem a cada 360°','tg(x) = sen(x)/cos(x) — relação entre as três razões principais']},
  {trilha:'enem', materia:'Matemática', assunto:'Matemática Comercial e Financeira',
    resumo:'Matemática Financeira estuda o cálculo de juros — a remuneração cobrada ou paga pelo uso do dinheiro ao longo do tempo — em regime simples ou composto. É um dos assuntos mais aplicados do ENEM, presente em financiamentos, investimentos e cartões de crédito.',
    aprofundamento:'Juros simples crescem de forma linear: J = C×i×t (capital × taxa × tempo), sempre calculado sobre o capital inicial. Juros compostos crescem de forma exponencial: M = C×(1+i)^t (montante = capital vezes (1+taxa) elevado ao tempo), porque os juros de cada período passam a incidir também sobre os juros anteriores ("juros sobre juros"). Essa diferença é crucial: no longo prazo, juros compostos crescem MUITO mais rápido que juros simples, mesmo com a mesma taxa — é por isso que dívidas de cartão de crédito (juros compostos) crescem tão rápido se não pagas. Valor atual de um conjunto de capitais traz valores futuros para o presente, descontando a taxa de juros — usado para comparar propostas de pagamento em datas diferentes.',
    exemplo:'R$1.000 aplicados a 10% ao ano: em juros simples, após 3 anos = 1000×(1+0,10×3) = R$1.300. Em juros compostos, após 3 anos = 1000×(1,10)³ = R$1.331 — a diferença cresce ano após ano.',
    pontos:['Juros simples: J = C×i×t (crescimento linear)','Juros compostos: M = C×(1+i)^t (crescimento exponencial, "juros sobre juros")','No longo prazo, juros compostos superam muito os juros simples com a mesma taxa']},
  {trilha:'enem', materia:'Matemática', assunto:'Matrizes',
    resumo:'Matrizes são tabelas retangulares de números organizados em linhas e colunas, usadas para representar e resolver sistemas de dados de forma organizada — desde tabelas de preços até transformações geométricas e criptografia.',
    aprofundamento:'A adição e subtração de matrizes só é possível entre matrizes de mesma dimensão, somando ou subtraindo elemento por elemento nas mesmas posições. A multiplicação de matrizes é mais complexa: só é possível se o número de colunas da primeira matriz for igual ao número de linhas da segunda, e o resultado NÃO é comutativo (A×B geralmente é diferente de B×A). A matriz inversa (A⁻¹) é aquela que, multiplicada pela matriz original, resulta na matriz identidade — só existe para matrizes quadradas com determinante diferente de zero. Erro comum: tentar somar matrizes de dimensões diferentes, ou assumir que a multiplicação de matrizes é comutativa como a multiplicação de números.',
    exemplo:'Multiplicando a matriz linha [2 3] pela matriz coluna [4; 5]: resultado = 2×4 + 3×5 = 8+15 = 23 (uma matriz 1×1).',
    pontos:['Soma/subtração: só entre matrizes de mesma dimensão, elemento por elemento','Multiplicação: colunas da 1ª = linhas da 2ª; NÃO é comutativa (A×B ≠ B×A)','Matriz inversa só existe se o determinante for diferente de zero']},
  {trilha:'enem', materia:'Matemática', assunto:'Determinantes',
    resumo:'Determinante é um número calculado a partir de uma matriz quadrada, usado para saber se ela tem inversa, resolver sistemas lineares e calcular áreas/volumes em geometria analítica.',
    aprofundamento:'Para matrizes 2×2, o determinante é calculado por "produto da diagonal principal menos produto da diagonal secundária" (ad−bc, para a matriz [[a,b],[c,d]]). Para matrizes 3×3, usa-se a Regra de Sarrus, repetindo as duas primeiras colunas ao lado da matriz e somando os produtos das diagonais principais, subtraindo os produtos das diagonais secundárias. Se o determinante de uma matriz é zero, ela NÃO tem inversa (é chamada de matriz singular). Uma propriedade importante: se duas linhas (ou colunas) de uma matriz são proporcionais ou iguais, o determinante é automaticamente zero — isso permite identificar rapidamente matrizes sem inversa, sem precisar calcular tudo.',
    exemplo:'Para a matriz [[3,2],[1,4]], o determinante é: (3×4) − (2×1) = 12−2 = 10. Como é diferente de zero, essa matriz tem inversa.',
    pontos:['2×2: determinante = ad−bc (diagonal principal menos secundária)','3×3: Regra de Sarrus (repete as duas primeiras colunas)','Determinante zero = matriz sem inversa (matriz singular)']},
  {trilha:'enem', materia:'Matemática', assunto:'Sistemas Lineares',
    resumo:'Sistema linear é um conjunto de equações do 1º grau com as mesmas incógnitas, resolvido simultaneamente. É usado para modelar situações com múltiplas condições, como misturas de produtos, alocação de recursos e problemas de idade.',
    aprofundamento:'O escalonamento é o método mais usado para resolver sistemas maiores: organiza-se as equações de forma sistemática, eliminando uma incógnita de cada vez através de operações entre as linhas (multiplicar uma equação por um número e somar/subtrair de outra), até isolar uma variável por vez. A discussão de um sistema linear classifica-o em três tipos: possível e determinado (uma única solução), possível e indeterminado (infinitas soluções) ou impossível (nenhuma solução) — essa classificação pode ser feita analisando o determinante da matriz dos coeficientes: se for diferente de zero, o sistema é possível e determinado. A representação matricial de um sistema (escrevendo os coeficientes como uma matriz) conecta diretamente esse assunto com matrizes e determinantes.',
    exemplo:'Sistema: x+y=10 e x−y=2. Somando as duas equações: 2x=12 → x=6; substituindo: 6+y=10 → y=4. Solução única (sistema possível e determinado).',
    pontos:['Escalonamento: elimina uma incógnita de cada vez através de operações entre linhas','Sistema pode ser possível determinado (1 solução), indeterminado (infinitas) ou impossível (nenhuma)','Determinante da matriz de coeficientes ≠0 → sistema possível e determinado']},
  {trilha:'enem', materia:'Matemática', assunto:'Geometria Analítica',
    resumo:'Geometria Analítica estuda figuras geométricas usando coordenadas no plano cartesiano e equações algébricas, unindo álgebra e geometria. É usada para calcular distâncias, áreas, e equações de retas e circunferências a partir de pontos.',
    aprofundamento:'A distância entre dois pontos usa uma aplicação direta do Teorema de Pitágoras: d = √[(x2−x1)² + (y2−y1)²]. O coeficiente angular de uma reta (m = Δy/Δx) indica sua inclinação: retas paralelas têm o mesmo coeficiente angular, e retas perpendiculares têm coeficientes angulares cujo produto é −1. A equação reduzida da reta (y = mx+n) usa o coeficiente angular "m" e o coeficiente linear "n" (onde a reta cruza o eixo y). A equação da circunferência, (x−a)² + (y−b)² = r², descreve todos os pontos a uma distância "r" (raio) do centro (a,b) — essa fórmula também vem diretamente da fórmula de distância entre dois pontos.',
    exemplo:'A distância entre os pontos (1,2) e (4,6) é: d = √[(4−1)²+(6−2)²] = √[9+16] = √25 = 5.',
    pontos:['Distância entre pontos: d = √[(x2−x1)²+(y2−y1)²] (vem de Pitágoras)','Retas paralelas: mesmo coeficiente angular; perpendiculares: produto dos coeficientes = −1','Equação da circunferência: (x−a)²+(y−b)²=r², centro (a,b) e raio r']},
  {trilha:'enem', materia:'Matemática', assunto:'Módulo',
    resumo:'Módulo (ou valor absoluto) de um número representa sua distância até o zero na reta numérica, sempre um valor positivo ou zero — |x| = x se x≥0, e |x| = −x se x<0. É usado para resolver equações e funções que envolvem "distância" sem se importar com a direção (positiva ou negativa).',
    aprofundamento:'A função modular f(x) = |x| tem gráfico em formato de "V", pois reflete a parte negativa do gráfico de f(x)=x para cima do eixo x. Ao resolver equações modulares do tipo |x| = a (com a>0), existem sempre duas soluções: x=a ou x=−a, porque tanto o número positivo quanto seu oposto têm o mesmo módulo. Já equações do tipo |x−k| = a representam a distância entre x e k, muito usadas para expressar intervalos de tolerância (ex: uma peça que pode variar até 2mm do tamanho ideal). Erro comum: esquecer o caso negativo ao resolver equações modulares, considerando apenas uma das duas soluções possíveis.',
    exemplo:'Resolvendo |x−3| = 5: x−3=5 (x=8) ou x−3=−5 (x=−2). Ambas as soluções satisfazem a equação original.',
    pontos:['|x| = x se x≥0; |x| = −x se x<0 (sempre resultado positivo ou zero)','Equações |x|=a (a>0) sempre têm duas soluções: x=a ou x=−a','Gráfico da função modular tem formato de "V"']},
  {trilha:'enem', materia:'Matemática', assunto:'Números Complexos',
    resumo:'Números complexos ampliam o conjunto dos números reais, incluindo a unidade imaginária "i" (onde i² = −1), permitindo resolver equações que não têm solução real, como x²+1=0. São representados na forma z = a+bi, com aplicações em engenharia elétrica e processamento de sinais.',
    aprofundamento:'Um número complexo z=a+bi tem parte real "a" e parte imaginária "b". As operações de soma e subtração são feitas separadamente entre partes reais e imaginárias; a multiplicação usa distributividade normal, lembrando que i²=−1. A forma trigonométrica (ou polar) representa o número complexo usando seu módulo (distância até a origem) e seu argumento (ângulo), sendo especialmente útil para multiplicação e divisão de números complexos, e essencial para calcular potências e raízes de forma mais simples do que na forma algébrica.',
    exemplo:'Multiplicando (2+3i)×(1−i): 2×1 + 2×(−i) + 3i×1 + 3i×(−i) = 2−2i+3i−3i² = 2+i−3×(−1) = 2+i+3 = 5+i.',
    pontos:['i² = −1 (a definição que resolve equações sem solução real)','z = a+bi: "a" é a parte real, "b" é a parte imaginária','Forma trigonométrica facilita multiplicação, divisão e potenciação']},
  {trilha:'enem', materia:'Matemática', assunto:'Polinômios',
    resumo:'Polinômio é uma expressão algébrica formada pela soma de termos com variáveis elevadas a expoentes inteiros não negativos (ex: 3x²+2x−5). O estudo inclui operações entre polinômios e técnicas de divisão, como o Dispositivo de Briot-Ruffini.',
    aprofundamento:'A divisão de polinômios segue lógica parecida com a divisão de números: divide-se o termo de maior grau do dividendo pelo termo de maior grau do divisor, multiplica-se de volta e subtrai-se, repetindo o processo até não ser mais possível dividir. Quando o divisor é um binômio do tipo (x−a), o Dispositivo de Briot-Ruffini oferece um atalho mais rápido que a divisão tradicional, usando apenas os coeficientes do polinômio e o valor "a". O grau do polinômio resultante da divisão é sempre o grau do dividendo menos o grau do divisor.',
    exemplo:'Dividindo x²−5x+6 por (x−2) usando Briot-Ruffini: coeficientes 1,−5,6 e raiz 2. Primeiro coeficiente desce (1); 1×2+(−5)=−3; −3×2+6=0 (resto zero). Quociente: x−3, resto 0.',
    pontos:['Grau do quociente = grau do dividendo − grau do divisor','Briot-Ruffini: atalho para dividir por binômios do tipo (x−a)','Resto zero na divisão significa que (x−a) é raiz do polinômio']},
  {trilha:'enem', materia:'Matemática', assunto:'Equações Algébricas',
    resumo:'Equações algébricas são equações polinomiais igualadas a zero (P(x)=0), cujas soluções são chamadas de raízes. O estudo inclui o Teorema Fundamental da Álgebra, multiplicidade de raízes, Relações de Girard e raízes complexas.',
    aprofundamento:'O Teorema Fundamental da Álgebra garante que toda equação polinomial de grau n tem exatamente n raízes (contando repetições e números complexos). As Relações de Girard conectam os coeficientes do polinômio diretamente com a soma e o produto das raízes, sem precisar calculá-las individualmente — muito útil para verificar respostas ou resolver problemas onde só se conhece parte das raízes. Um resultado importante: se um polinômio com coeficientes reais tem uma raiz complexa, seu conjugado também é obrigatoriamente raiz — as raízes complexas sempre aparecem em pares conjugados nesse tipo de polinômio.',
    exemplo:'Para x²−7x+10=0 (raízes 2 e 5), Girard confirma: soma das raízes = −(−7)/1 = 7 (2+5=7 ✓); produto das raízes = 10/1 = 10 (2×5=10 ✓).',
    pontos:['Toda equação de grau n tem exatamente n raízes (Teorema Fundamental da Álgebra)','Relações de Girard: conectam soma/produto das raízes aos coeficientes, sem calculá-las','Raízes complexas de polinômios com coeficientes reais aparecem sempre em pares conjugados']},
  {trilha:'enem', materia:'Linguagens', assunto:'Signo e Código Linguístico',
    resumo:'Signo linguístico é a união entre um significante (a forma — som ou grafia) e um significado (o conceito mental que essa forma representa). Código é o sistema organizado de signos que precisa ser compartilhado entre emissor e receptor para que a comunicação funize.',
    aprofundamento:'Todo processo de comunicação depende de um código comum: se o receptor não domina o mesmo código do emissor (outro idioma, uma gíria desconhecida, um jargão técnico), a mensagem não é decodificada corretamente, mesmo que o canal físico funcione perfeitamente. O ENEM cobra esse conceito de forma indireta, em textos que exploram ambiguidade ou ruído na comunicação — quando o código é compartilhado de forma parcial ou distorcida. A relação entre significante e significado é arbitrária na maioria das línguas (não há motivo natural para a palavra "casa" significar o que significa), mas convencional (todos os falantes do português concordam com esse uso).',
    exemplo:'Um símbolo de trânsito (placa de "pare") é um signo: o significante é a forma octogonal vermelha, o significado é a ordem de parar. Quem não conhece o código de trânsito não interpreta o signo corretamente.',
    pontos:['Signo = significante (forma) + significado (conceito)','Código é o sistema compartilhado que permite a comunicação','Relação significante-significado é arbitrária, mas fixada por convenção social']},
  {trilha:'enem', materia:'Linguagens', assunto:'Língua e Linguagem',
    resumo:'Linguagem é qualquer sistema de comunicação, verbal ou não verbal (gestos, imagens, música, sinais de trânsito). Língua é um tipo específico de linguagem: um sistema verbal, organizado por regras gramaticais, compartilhado por uma comunidade específica de falantes.',
    aprofundamento:'Toda língua é uma linguagem, mas nem toda linguagem é uma língua — essa é a distinção central cobrada no ENEM. Um semáforo comunica através de linguagem visual (cores), mas não é uma língua, pois não tem gramática nem é falado por uma comunidade linguística. O conceito se conecta com linguagem verbal (usa palavras, oral ou escrita) e linguagem não verbal (usa outros códigos, como imagens, sons, gestos) e linguagem mista (combina as duas, como uma charge com texto e desenho, muito cobrada em provas por exigir leitura simultânea de dois sistemas de signos).',
    exemplo:'Uma tirinha de jornal usa linguagem mista: o desenho (não verbal) e o texto nos balões (verbal, em língua portuguesa) se combinam para construir o sentido completo, e o ENEM cobra a interpretação dessa combinação.',
    pontos:['Linguagem: qualquer sistema de comunicação (verbal ou não verbal)','Língua: sistema verbal específico, com gramática, de uma comunidade','Linguagem mista combina verbal + não verbal (comum em charges e tirinhas)']},
  {trilha:'enem', materia:'Linguagens', assunto:'Decodificação',
    resumo:'Decodificação é o processo mecânico de reconhecer e traduzir os signos de um texto (letras, palavras, sinais de pontuação) em unidades de sentido básicas, sem ainda envolver interpretação crítica ou aprofundada.',
    aprofundamento:'É a primeira etapa da leitura, anterior à compreensão e à interpretação: antes de entender o que um texto quer dizer nas entrelinhas, o leitor precisa primeiro reconhecer as palavras e sua organização sintática básica. Dificuldades de decodificação (como em leitores iniciantes ou em textos com vocabulário técnico desconhecido) travam todo o processo seguinte, porque não dá para interpretar aquilo que ainda não foi decodificado corretamente. No ENEM, esse conceito é a base teórica que justifica por que um texto com vocabulário muito específico de uma área (jurídico, médico) pode ser mais difícil de interpretar, mesmo que o assunto de fundo seja simples.',
    exemplo:'Ao ler a palavra "fotossíntese" pela primeira vez, um aluno decodifica os sons/letras da palavra antes de conseguir associá-la ao conceito biológico que ela representa.',
    pontos:['Decodificação: reconhecer os signos do texto (etapa mecânica, anterior ao sentido)','É pré-requisito para compreensão e interpretação','Vocabulário desconhecido trava a decodificação e, por consequência, a interpretação']},
  {trilha:'enem', materia:'Linguagens', assunto:'Compreensão x Interpretação',
    resumo:'Compreensão é entender o que está explícito no texto (o que o autor disse literalmente). Interpretação é ir além do texto: inferir, relacionar com contexto e conhecimento de mundo, e chegar a conclusões que não estão escritas literalmente, mas são sustentadas pelo texto.',
    aprofundamento:'Essa é uma das distinções mais cobradas no ENEM: uma questão de compreensão pergunta "o que o texto diz" (resposta está lá, explícita); uma questão de interpretação pergunta "o que se pode concluir a partir do texto" (resposta exige inferência, mas ainda presa ao que o texto permite concluir — não é opinião livre). O erro mais comum dos candidatos é "viajar" na interpretação, trazendo conhecimento de mundo que contradiz ou extrapola o que o texto sustenta — a interpretação correta é sempre balizada pelo texto, mesmo quando exige inferência.',
    exemplo:'No texto "Maria saiu de casa sem guarda-chuva e voltou encharcada", a compreensão registra que ela saiu sem guarda-chuva e voltou molhada; a interpretação infere que provavelmente choveu, mesmo sem o texto dizer isso explicitamente.',
    pontos:['Compreensão: o que está explícito, literal, no texto','Interpretação: inferência sustentada pelo texto (não é opinião livre)','Erro comum: extrapolar a interpretação além do que o texto permite concluir']},
  {trilha:'enem', materia:'Linguagens', assunto:'Retenção Textual',
    resumo:'Retenção textual é a capacidade de reter na memória as informações relevantes de um texto — personagens, argumentos, dados, sequência de fatos — durante o tempo de leitura, permitindo relacionar partes distantes do texto entre si.',
    aprofundamento:'Textos mais longos e complexos, com múltiplos parágrafos e argumentos encadeados (comuns nas questões de Linguagens e Ciências Humanas do ENEM), exigem que o leitor retenha informações do início do texto para conectar com conclusões apresentadas no final. A falta de retenção é uma das principais causas de erro em questões que pedem para relacionar uma informação do primeiro parágrafo com uma conclusão do último — o candidato lê o texto todo, mas "esquece" o dado necessário para resolver a questão. Técnicas de leitura ativa (grifar palavras-chave, fazer anotações rápidas nas margens) ajudam a compensar limitações de retenção durante a prova.',
    exemplo:'Um texto argumentativo que apresenta um dado estatístico no primeiro parágrafo e retoma esse dado como base de uma conclusão no último parágrafo exige que o leitor tenha retido essa informação ao longo de toda a leitura.',
    pontos:['Retenção: guardar na memória informações relevantes durante a leitura','Essencial para textos longos que conectam início e fim argumentativamente','Grifar palavras-chave compensa limitações de retenção durante a prova']},
  {trilha:'enem', materia:'Linguagens', assunto:'Revisão de Interpretação Textual',
    resumo:'Bloco de consolidação que retoma e conecta os conceitos de signo, código, língua, linguagem, decodificação, compreensão, interpretação e retenção textual como uma cadeia integrada do processo de leitura.',
    aprofundamento:'O processo de leitura crítica, cobrado sistematicamente no ENEM, segue essa cadeia: primeiro o leitor decodifica os signos (reconhece palavras e código), depois compreende o que está explícito, em seguida interpreta (infere o que está implícito, mas sustentado pelo texto), e tudo isso depende da retenção das informações ao longo da leitura. Essa revisão serve para o aluno enxergar que cada etapa depende da anterior: não se interpreta bem um texto que não foi decodificado ou compreendido corretamente, e não se compreende bem um texto cujas informações não foram retidas ao longo da leitura.',
    exemplo:'Uma questão do ENEM que exige relacionar o título de uma reportagem com uma conclusão implícita no último parágrafo testa, na prática, toda essa cadeia: decodificação, compreensão, retenção e interpretação, todas ao mesmo tempo.',
    pontos:['A leitura crítica é uma cadeia: decodificação → compreensão → interpretação','Retenção textual sustenta a conexão entre partes distantes do texto','Falhas em uma etapa da cadeia comprometem as etapas seguintes']},
  {trilha:'enem', materia:'Linguagens', assunto:'Texto Descritivo',
    resumo:'Texto descritivo tem como objetivo caracterizar um objeto, pessoa, lugar ou cena, apresentando suas qualidades sensoriais e características através de adjetivos e imagens, sem contar uma sequência de ações no tempo.',
    aprofundamento:'A tipologia descritiva é estática — não há progressão temporal de eventos, como no texto narrativo. Ela se organiza espacialmente (de cima para baixo, de fora para dentro, do geral para o específico) e explora fortemente adjetivação e figuras de linguagem sensoriais (comparações, metáforas visuais, sonoras, táteis). O ENEM cobra a identificação de trechos descritivos dentro de textos maiores (como uma descrição de cenário dentro de um conto) e pede para reconhecer sua função: criar ambientação, caracterizar um personagem, ou situar o leitor num espaço antes da ação começar.',
    exemplo:'"A casa era pequena, com paredes desbotadas e um jardim tomado por ervas daninhas" é um trecho descritivo: caracteriza um espaço através de adjetivos, sem indicar uma ação em progresso.',
    pontos:['Texto descritivo: caracteriza, sem progressão temporal de ações','Organização espacial (geral→específico, cima→baixo) e forte uso de adjetivos','Função comum: criar ambientação ou caracterizar personagens/cenários']},
  {trilha:'enem', materia:'Linguagens', assunto:'Texto Narrativo',
    resumo:'Texto narrativo conta uma sequência de fatos/ações envolvendo personagens, organizados no tempo e no espaço, geralmente com um conflito central (enredo) que se desenvolve até um desfecho.',
    aprofundamento:'Os elementos estruturais da narrativa — enredo (sequência de fatos), personagens, tempo, espaço, narrador e foco narrativo — são a base para analisar contos, crônicas e romances no ENEM. O foco narrativo pode ser em 1ª pessoa (narrador-personagem, participa da história, visão limitada e subjetiva) ou em 3ª pessoa (narrador observador ou onisciente, fora da história, visão mais ampla). Reconhecer o foco narrativo é frequentemente cobrado porque afeta diretamente a confiabilidade da informação apresentada — um narrador em 1ª pessoa pode ser parcial ou até "não confiável" (esconder ou distorcer fatos), enquanto um narrador onisciente em 3ª pessoa tem acesso a pensamentos de vários personagens.',
    exemplo:'Em "Eu não sabia que aquele seria o último dia que veria meu pai", o narrador está em 1ª pessoa, participando diretamente dos eventos narrados — sua visão é limitada ao que ele viveu e sentiu.',
    pontos:['Narrativo: sequência de ações organizadas no tempo, com enredo e personagens','Foco narrativo: 1ª pessoa (limitado, subjetivo) x 3ª pessoa (observador/onisciente)','Narrador não confiável é um recurso cobrado em textos literários mais complexos']},
  {trilha:'enem', materia:'Linguagens', assunto:'Texto Injuntivo',
    resumo:'Texto injuntivo (ou instrucional) tem como objetivo orientar ou instruir o leitor a realizar uma ação, através de comandos, verbos no imperativo e sequência de passos a seguir.',
    aprofundamento:'É a tipologia menos discutida academicamente, mas presente em gêneros do cotidiano: receitas culinárias, manuais de instrução, bulas de remédio, regras de jogos. A marca linguística mais característica é o uso do modo imperativo ("misture", "adicione", "não ultrapasse") ou de infinitivos com valor de comando ("misturar os ingredientes"). O ENEM cobra o reconhecimento dessa tipologia geralmente em questões que comparam gêneros textuais e pedem para identificar a finalidade comunicativa predominante de um texto (instruir vs. narrar vs. descrever vs. argumentar).',
    exemplo:'"Bata os ovos, adicione o açúcar aos poucos e leve ao forno por 40 minutos" é um texto injuntivo: verbos no imperativo, sequência de passos, objetivo de orientar uma ação.',
    pontos:['Injuntivo: orienta uma ação através de comandos e sequência de passos','Marca linguística típica: verbos no imperativo ou infinitivo com valor de comando','Gêneros comuns: receitas, manuais, bulas, regras de jogos']},
  {trilha:'enem', materia:'Linguagens', assunto:'Texto Dissertativo',
    resumo:'Texto dissertativo apresenta e defende um ponto de vista sobre um tema, através de argumentação lógica, com tese, argumentos de sustentação e (geralmente) uma conclusão — é a base teórica direta da redação do ENEM.',
    aprofundamento:'Existem dois tipos principais: dissertação expositiva (apresenta informações e diferentes pontos de vista sobre um tema, sem necessariamente defender uma posição própria, comum em textos jornalísticos e didáticos) e dissertação argumentativa (defende uma tese específica, usando argumentos, dados, exemplos e contra-argumentação, exigida na redação do ENEM). A estrutura argumentativa clássica é: introdução (apresenta o tema e a tese), desenvolvimento (argumentos que sustentam a tese, com dados e exemplos) e conclusão (retoma a tese e, na redação do ENEM, propõe uma intervenção). Reconhecer a tese de um texto argumentativo é a habilidade mais cobrada nas questões de Linguagens que trazem textos opinativos.',
    exemplo:'Um artigo de opinião que defende a tese de que "a reciclagem deveria ser obrigatória em todos os municípios", sustentando com dados sobre poluição e exemplos de cidades que já adotaram a medida, é uma dissertação argumentativa clássica.',
    pontos:['Dissertativo expositivo: apresenta informações, sem necessariamente defender uma tese','Dissertativo argumentativo: defende uma tese com argumentos (base da redação do ENEM)','Estrutura clássica: introdução (tese) → desenvolvimento (argumentos) → conclusão']},
  {trilha:'enem', materia:'Linguagens', assunto:'Revisão de Tipologia Textual',
    resumo:'Bloco de consolidação que diferencia as quatro tipologias textuais (descritivo, narrativo, injuntivo, dissertativo) por sua finalidade comunicativa predominante, ajudando a reconhecê-las rapidamente em textos mistos.',
    aprofundamento:'Um mesmo texto raramente é "puro" em uma única tipologia — um conto (narrativo) pode conter trechos descritivos (caracterizando um cenário) e até falas de personagens com tom dissertativo (defendendo uma opinião dentro do diálogo). O ENEM cobra o reconhecimento da tipologia predominante de um texto ou de um trecho específico dentro dele, e a pergunta-chave para identificar rapidamente é: o texto conta uma sequência de ações no tempo (narrativo)? Caracteriza algo sem progressão temporal (descritivo)? Instrui uma ação através de comandos (injuntivo)? Ou defende/apresenta um ponto de vista com argumentação (dissertativo)?',
    exemplo:'Uma crônica pode narrar um passeio no parque (narrativo), descrever a paisagem observada (descritivo) e terminar com uma reflexão argumentativa sobre a vida urbana (dissertativo) — tudo no mesmo texto.',
    pontos:['Textos reais frequentemente misturam tipologias em trechos diferentes','Pergunta-chave: o texto narra, descreve, instrui ou argumenta predominantemente?','Reconhecer a tipologia certa direciona a interpretação da questão']},
  {trilha:'enem', materia:'Linguagens', assunto:'Gêneros Narrativos',
    resumo:'Gêneros narrativos são as formas concretas que o texto narrativo assume no mundo real: conto, crônica, romance, novela, fábula, lenda, notícia — cada um com convenções próprias de extensão, propósito e contexto de circulação.',
    aprofundamento:'Enquanto a tipologia (narrativo) é uma categoria abstrata sobre a estrutura do texto, o gênero é a forma social e concreta que essa estrutura assume, ligada a um contexto de circulação específico (jornal, livro, internet). O ENEM cobra a diferenciação entre gêneros próximos: conto (curto, poucos personagens, um conflito central, final geralmente conciso) x crônica (curta, cotidiana, muitas vezes com tom reflexivo ou bem-humorado, publicada originalmente em jornais/revistas) x notícia (narrativa factual, jornalística, estruturada em pirâmide invertida: informação mais importante primeiro).',
    exemplo:'Uma fábula, como as de Esopo, é um gênero narrativo curto, com animais personificados e uma moral explícita no final — diferente de um conto, que não precisa ter uma lição moral explícita.',
    pontos:['Gênero é a forma social concreta; tipologia é a estrutura abstrata','Conto x crônica x notícia: diferem em extensão, propósito e contexto de circulação','Fábula tem moral explícita; conto não tem essa obrigatoriedade estrutural']},
  {trilha:'enem', materia:'Linguagens', assunto:'Gêneros Descritivos',
    resumo:'Gêneros descritivos são as formas textuais concretas centradas em caracterizar algo: anúncio publicitário, cardápio, guia de viagem, retrato literário — cada um adaptando a descrição a um propósito comunicativo específico.',
    aprofundamento:'A descrição muda de função dependendo do gênero: num anúncio publicitário, a descrição do produto é feita para persuadir e vender (usando adjetivos valorativos, como "incrível", "exclusivo"); num guia de viagem, a descrição de um local busca informar e atrair turisticamente; num retrato literário (dentro de um romance), a descrição de um personagem revela traços psicológicos através de detalhes físicos escolhidos deliberadamente pelo autor. O ENEM costuma cobrar como a escolha lexical (as palavras específicas usadas na descrição) revela a intenção comunicativa por trás do gênero.',
    exemplo:'Um anúncio imobiliário que descreve um apartamento como "aconchegante e cheio de luz natural" usa adjetivos valorativos deliberadamente escolhidos para tornar o imóvel atrativo — a mesma descrição objetiva poderia dizer apenas "apartamento pequeno com janelas".',
    pontos:['Gêneros descritivos adaptam a função da descrição ao contexto (vender, informar, caracterizar)','Escolha lexical (adjetivos) revela a intenção comunicativa do gênero','Retrato literário usa descrição física para sugerir traços psicológicos']},
  {trilha:'enem', materia:'Linguagens', assunto:'Gêneros Dissertativos',
    resumo:'Gêneros dissertativos são as formas concretas da argumentação: artigo de opinião, editorial, ensaio, resenha crítica, carta argumentativa — cada um com convenções próprias de tom, extensão e veículo de publicação.',
    aprofundamento:'O editorial expressa a opinião oficial de um veículo de comunicação (jornal ou revista) sobre um tema atual, geralmente sem assinatura individual, representando a "voz institucional" do veículo — diferente do artigo de opinião, assinado por um autor específico, que expressa um ponto de vista pessoal (podendo ou não coincidir com a linha editorial do veículo). A resenha crítica combina descrição (do que é a obra) com dissertação (avaliação crítica da obra), sendo um gênero híbrido muito cobrado por misturar tipologias.',
    exemplo:'Um editorial de jornal sobre uma nova política pública representa a posição institucional do veículo, sem assinatura de um autor específico — diferente de uma coluna de opinião assinada por um jornalista, que representa a visão pessoal dele.',
    pontos:['Editorial: opinião institucional do veículo, sem assinatura individual','Artigo de opinião: ponto de vista pessoal, assinado por um autor específico','Resenha crítica combina descrição da obra com avaliação argumentativa']},
  {trilha:'enem', materia:'Linguagens', assunto:'Gêneros Injuntivos',
    resumo:'Gêneros injuntivos são as formas concretas de instrução: receita culinária, manual de instrução, bula de remédio, regulamento, tutorial — organizados geralmente em passos sequenciais e comandos diretos.',
    aprofundamento:'Cada gênero injuntivo tem convenções de formatação específicas cobradas indiretamente pelo ENEM: receitas costumam separar "ingredientes" de "modo de preparo"; bulas de remédio têm seções padronizadas (indicações, contraindicações, posologia); manuais técnicos frequentemente combinam texto injuntivo com imagens ou diagramas numerados para ilustrar os passos. A linguagem injuntiva prioriza clareza e objetividade acima de qualquer recurso estético, pois o objetivo é que o leitor execute a ação corretamente, sem ambiguidade.',
    exemplo:'Uma bula de remédio organiza a informação em seções fixas (como agir em caso de superdosagem, como armazenar o medicamento) porque a clareza objetiva é prioridade absoluta nesse gênero, dada a natureza sensível da informação.',
    pontos:['Cada gênero injuntivo tem convenções de formatação próprias e padronizadas','Linguagem prioriza clareza e objetividade sobre qualquer recurso estético','Muitas vezes combina texto com imagens/diagramas numerados (manuais técnicos)']},
  {trilha:'enem', materia:'Linguagens', assunto:'Revisão de Gênero Textual',
    resumo:'Bloco de consolidação que reforça a distinção entre tipologia textual (estrutura abstrata: narrar, descrever, instruir, argumentar) e gênero textual (forma social concreta, ligada a um contexto de circulação específico).',
    aprofundamento:'O erro mais comum dos candidatos é confundir tipologia com gênero, tratando-os como sinônimos. Um mesmo gênero pode combinar várias tipologias (uma notícia geralmente narra os fatos, mas pode ter trechos descritivos do local do ocorrido); e uma mesma tipologia pode se manifestar em vários gêneros (o narrativo aparece tanto num conto quanto numa notícia jornalística, embora com propósitos e convenções completamente diferentes). O ENEM cobra essa distinção principalmente em questões que comparam dois textos de gêneros diferentes, mas tipologia semelhante, pedindo para identificar o contexto de circulação e a finalidade de cada um.',
    exemplo:'Uma notícia e um conto podem ambos ter estrutura predominantemente narrativa (tipologia), mas pertencem a gêneros diferentes: a notícia circula no jornalismo com compromisso factual, o conto circula na literatura com liberdade de ficção.',
    pontos:['Tipologia = estrutura abstrata; gênero = forma social concreta e contextualizada','Um gênero pode combinar várias tipologias no mesmo texto','Mesma tipologia pode aparecer em gêneros com propósitos completamente diferentes']},
  {trilha:'enem', materia:'Linguagens', assunto:'Texto Figurativo',
    resumo:'Texto figurativo utiliza linguagem conotativa, simbólica e imagética para construir sentido — comum em poesia, propaganda e textos literários, onde o significado vai além do sentido literal das palavras.',
    aprofundamento:'A linguagem figurativa (conotativa) explora figuras de linguagem, ambiguidades intencionais e sentidos simbólicos, exigindo do leitor um trabalho interpretativo mais profundo do que a leitura literal. É a base teórica que sustenta a leitura de poemas e textos publicitários no ENEM, onde uma imagem (como "o sol da minha vida") não deve ser lida literalmente, mas como uma construção simbólica de sentido. O contraste com o texto temático (mais direto, informativo) é frequentemente cobrado em questões que comparam dois textos sobre o mesmo assunto, um em linguagem figurativa e outro em linguagem direta.',
    exemplo:'Num poema, o verso "meu coração é uma casa vazia" não deve ser lido literalmente (o coração não é uma casa) — é uma construção figurativa que sugere solidão ou vazio emocional.',
    pontos:['Texto figurativo: linguagem conotativa, simbólica, exige leitura além do literal','Base teórica da interpretação de poemas e propagandas no ENEM','Contrasta com texto temático, que usa linguagem mais direta e informativa']},
  {trilha:'enem', materia:'Linguagens', assunto:'Texto Temático',
    resumo:'Texto temático apresenta informação de forma direta e objetiva sobre um tema, priorizando a clareza denotativa sobre a construção simbólica — comum em textos jornalísticos, científicos e didáticos.',
    aprofundamento:'Diferente do texto figurativo, o texto temático usa linguagem denotativa (sentido literal, dicionarizado das palavras), priorizando a transmissão clara e objetiva de uma informação. O ENEM frequentemente apresenta dois textos sobre o mesmo assunto — um figurativo (um poema, uma letra de música) e outro temático (uma reportagem, um texto científico) — pedindo para o candidato comparar como cada um aborda a mesma questão através de estratégias linguísticas diferentes.',
    exemplo:'Uma reportagem sobre aquecimento global que apresenta dados, gráficos e explicações científicas diretas é um texto temático; um poema sobre o mesmo assunto, usando metáforas sobre a "terra doente", seria um texto figurativo.',
    pontos:['Texto temático: linguagem denotativa, direta, objetiva sobre um assunto','Comum em jornalismo, textos científicos e didáticos','ENEM compara textos figurativos e temáticos sobre o mesmo tema']},
  {trilha:'enem', materia:'Linguagens', assunto:'Comparação entre Texto Temático e Figurativo',
    resumo:'Habilidade de comparar como um mesmo tema é tratado de forma direta (texto temático) versus simbólica (texto figurativo), reconhecendo os efeitos de sentido diferentes que cada abordagem produz.',
    aprofundamento:'Essa comparação é um dos formatos de questão mais recorrentes no ENEM: dois textos curtos, geralmente lado a lado, tratando do mesmo assunto (por exemplo, meio ambiente, solidão, tecnologia), um em linguagem denotativa e outro em linguagem conotativa/figurativa. A questão pede para identificar a diferença de abordagem, o efeito de sentido pretendido em cada um, ou qual recurso linguístico específico (figura de linguagem, dado estatístico) sustenta essa diferença. A habilidade central é reconhecer que a escolha entre linguagem figurativa e temática não é aleatória — está ligada ao propósito comunicativo e ao gênero em que o texto circula.',
    exemplo:'Uma prova pode trazer um texto científico sobre a extinção de espécies (temático, com dados) ao lado de um poema sobre a mesma extinção usando metáforas de "silêncio na floresta" (figurativo) — pedindo para comparar as estratégias de cada um.',
    pontos:['Comparação testa se o aluno reconhece as duas abordagens lado a lado','Escolha entre linguagem figurativa/temática está ligada ao propósito comunicativo','Formato clássico de questão do ENEM: dois textos curtos, mesmo tema, abordagens diferentes']},
  {trilha:'enem', materia:'Linguagens', assunto:'Revisão de Texto Temático x Texto Figurativo',
    resumo:'Bloco de consolidação que fixa a diferença entre linguagem denotativa (temática) e conotativa (figurativa), e o motivo pelo qual o ENEM adora testar essa distinção em textos pareados sobre o mesmo assunto.',
    aprofundamento:'A pergunta-chave para diferenciar rapidamente os dois: as palavras estão sendo usadas no sentido literal, dicionarizado (temático) ou estão construindo um sentido simbólico, que exige interpretação além do literal (figurativo)? Essa distinção sustenta boa parte das questões de interpretação de poesia e propaganda, gêneros que exploram fortemente a linguagem figurativa, em contraste com reportagens e textos científicos, que priorizam a linguagem temática/denotativa.',
    exemplo:'A expressão "chover no molhado" usada literalmente (descrever uma chuva forte durante outra chuva) seria temática; usada para dizer que algo redundante está sendo repetido, é figurativa — o mesmo texto pode ser lido nos dois níveis dependendo do contexto.',
    pontos:['Pergunta-chave: sentido literal (temático) ou sentido simbólico (figurativo)?','Poesia e propaganda exploram fortemente a linguagem figurativa','Reportagens e textos científicos priorizam a linguagem temática/denotativa']},
  {trilha:'enem', materia:'Linguagens', assunto:'O que é Intertextualidade?',
    resumo:'Intertextualidade é o diálogo que um texto estabelece com outro(s) texto(s) já existentes — seja retomando, contestando, parodiando ou fazendo referência a uma obra, expressão ou ideia anterior, de forma explícita ou implícita.',
    aprofundamento:'Todo texto é, de alguma forma, construído a partir de outros textos que já existem na cultura — essa é a ideia central da intertextualidade, um dos conceitos mais cobrados nas questões de Linguagens do ENEM, especialmente em charges, propagandas e textos que retomam ditados populares, obras literárias famosas ou frases históricas. A intertextualidade pode ser explícita (quando a fonte é citada claramente, como uma citação direta com aspas) ou implícita (quando o texto pressupõe que o leitor reconheça a referência sem apontá-la diretamente, como uma paródia que só faz sentido para quem conhece o original).',
    exemplo:'Uma charge que reescreve o ditado "água mole em pedra dura, tanto bate até que fura" para criticar a corrupção usa intertextualidade implícita: só faz sentido completo para quem já conhece o ditado original.',
    pontos:['Intertextualidade: diálogo de um texto com outro(s) texto(s) já existentes','Pode ser explícita (fonte citada) ou implícita (pressupõe conhecimento do leitor)','Muito cobrada em charges, propagandas e textos que retomam obras/ditados conhecidos']},
  {trilha:'enem', materia:'Linguagens', assunto:'Paráfrase',
    resumo:'Paráfrase é a reescrita de um texto original com outras palavras, mantendo o mesmo sentido essencial — é um tipo de intertextualidade que reafirma a ideia original, sem contestá-la ou satirizá-la.',
    aprofundamento:'Diferente da paródia (que contesta, critica ou satiriza o texto original, geralmente com humor ou ironia), a paráfrase concorda com a mensagem original e apenas a reformula linguisticamente, mantendo a essência do sentido. O ENEM cobra essa diferenciação em questões que apresentam um texto-base (como um poema clássico) seguido de uma reescrita, pedindo para identificar se essa reescrita é uma paráfrase (reafirma) ou uma paródia (contesta/satiriza).',
    exemplo:'Reescrever "Minha terra tem palmeiras, onde canta o sabiá" (Gonçalves Dias) como "Meu país tem árvores tropicais, onde um pássaro canta" seria uma paráfrase: mesmo sentido essencial, palavras diferentes.',
    pontos:['Paráfrase: reescreve mantendo o mesmo sentido essencial do original','Reafirma a mensagem original (diferente da paródia, que contesta)','ENEM cobra a diferenciação entre paráfrase e paródia em textos pareados']},
  {trilha:'enem', materia:'Linguagens', assunto:'Outros Tipos de Intertextualidade',
    resumo:'Além da paráfrase, existem outros tipos de intertextualidade: paródia (contesta/satiriza com humor ou crítica), citação (reproduz trecho do original com atribuição de fonte), epígrafe (citação no início de uma obra que dialoga com seu conteúdo) e alusão (referência sutil, sem citação direta).',
    aprofundamento:'A paródia é o tipo mais cobrado depois da paráfrase: ela subverte o sentido original, geralmente com tom crítico, cômico ou irônico, sendo muito usada em charges e memes que reescrevem frases célebres ou trechos de músicas famosas para comentar um fato atual. A alusão é mais sutil — não cita diretamente, apenas insinua uma referência que o leitor precisa reconhecer por conta própria (por exemplo, mencionar "uma maçã e uma serpente" alude à história bíblica de Adão e Eva sem citá-la explicitamente). A epígrafe, comum em livros e capítulos, é uma citação posicionada estrategicamente no início de um texto para antecipar ou dialogar com seu tema central.',
    exemplo:'Um meme que reescreve a letra de uma música famosa para satirizar um evento político recente é uma paródia: contesta ou ironiza o sentido original através da nova roupagem.',
    pontos:['Paródia: contesta/satiriza o original, geralmente com humor ou crítica','Alusão: referência sutil e implícita, sem citação direta','Epígrafe: citação estratégica no início de uma obra, dialogando com seu tema']},
  {trilha:'enem', materia:'Linguagens', assunto:'Revisão de Intertextualidade',
    resumo:'Bloco de consolidação que organiza os tipos de intertextualidade (paráfrase, paródia, citação, epígrafe, alusão) segundo um critério central: o texto novo reafirma, contesta ou apenas referencia sutilmente o texto original?',
    aprofundamento:'Para resolver rapidamente uma questão de intertextualidade, a estratégia é perguntar: o novo texto concorda e apenas reformula o original (paráfrase)? Contesta ou satiriza (paródia)? Reproduz um trecho com fonte identificada (citação)? Ou apenas insinua uma referência sem citar diretamente (alusão)? Essa organização evita a confusão mais comum entre os candidatos, que costumam identificar corretamente que existe intertextualidade, mas erram ao classificar qual tipo específico está em jogo.',
    exemplo:'Uma propaganda que reescreve com ironia a frase "o amor é lindo" para vender um produto de forma sarcástica seria uma paródia, e não uma paráfrase, pois há contestação/subversão do sentido original.',
    pontos:['Pergunta central: o texto reafirma, contesta ou apenas alude ao original?','Paráfrase reafirma; paródia contesta/satiriza; alusão apenas insinua','Erro comum: identificar a intertextualidade, mas errar o tipo específico']},
  {trilha:'enem', materia:'Linguagens', assunto:'Anáfora',
    resumo:'Anáfora é o mecanismo de coesão textual que retoma, através de um pronome ou outra expressão, um termo ou ideia já mencionado anteriormente no texto, evitando repetição desnecessária.',
    aprofundamento:'É um dos principais recursos de coesão referencial cobrados no ENEM: ao invés de repetir um substantivo várias vezes, o texto usa pronomes (ele, ela, esse, aquele) ou outras expressões referenciais para retomar algo já dito, mantendo o texto fluido e evitando redundância. Questões do ENEM costumam pedir para identificar a que termo anterior um determinado pronome se refere no texto — um exercício direto de coesão referencial anafórica, essencial para não perder o fio da leitura em textos longos.',
    exemplo:'"Maria comprou um carro novo. Ela estava muito feliz com a compra." O pronome "ela" retoma anaforicamente "Maria", evitando repetir o nome.',
    pontos:['Anáfora: retoma um termo já mencionado anteriormente no texto','Evita repetição desnecessária e mantém a fluidez textual','ENEM cobra identificar a que termo anterior um pronome se refere']},
  {trilha:'enem', materia:'Linguagens', assunto:'Catáfora',
    resumo:'Catáfora é o mecanismo de coesão textual que antecipa, através de um pronome ou expressão, um termo ou ideia que só será explicitado mais adiante no texto — o oposto direcional da anáfora.',
    aprofundamento:'Enquanto a anáfora "olha para trás" (retoma algo já dito), a catáfora "olha para frente" (anuncia algo que vai ser dito em seguida). É um recurso menos frequente que a anáfora, mas igualmente cobrado no ENEM, especialmente em textos que criam suspense ou expectativa antes de revelar uma informação central — o pronome catafórico gera uma pequena tensão de leitura até o termo ser esclarecido.',
    exemplo:'"Ele nunca imaginou: o vencedor da competição era seu próprio irmão." O pronome "ele" é catafórico, pois só é esclarecido (quem é "ele") depois, no restante da frase/texto.',
    pontos:['Catáfora: antecipa um termo que só será explicitado mais à frente no texto','Direção oposta à anáfora (que retoma algo já dito)','Usada para criar expectativa ou suspense antes de revelar a informação']},
  {trilha:'enem', materia:'Linguagens', assunto:'Pressuposto',
    resumo:'Pressuposto é uma informação implícita que decorre diretamente da estrutura linguística da frase — de certas palavras (como "até", "ainda", "voltar a") que embutem uma ideia subentendida na própria construção gramatical.',
    aprofundamento:'O pressuposto é identificável através de marcadores linguísticos específicos, chamados de "gatilhos pressuposicionais": palavras como "até" (pressupõe que outros elementos também se aplicam), "ainda" (pressupõe uma situação anterior que persiste), "parar de" (pressupõe que a ação acontecia antes), "voltar a" (pressupõe que a ação já havia ocorrido e foi interrompida). É diferente do subentendido porque não depende do contexto situacional — está embutido na própria estrutura gramatical da frase, sendo praticamente inegável por quem a pronunciou.',
    exemplo:'"João parou de fumar" pressupõe que João fumava antes — essa informação está embutida na expressão "parar de", independente de qualquer contexto adicional.',
    pontos:['Pressuposto: informação implícita embutida na estrutura gramatical da frase','Identificado por "gatilhos" linguísticos: até, ainda, parar de, voltar a','Não depende do contexto situacional — está na própria construção da frase']},
  {trilha:'enem', materia:'Linguagens', assunto:'Subentendido',
    resumo:'Subentendido é uma informação implícita que depende do contexto situacional e da intenção comunicativa do falante, não estando marcada explicitamente na estrutura gramatical da frase como o pressuposto.',
    aprofundamento:'Diferente do pressuposto (embutido na gramática da frase), o subentendido é uma sugestão que depende de interpretação contextual — o falante deixa uma ideia implícita de propósito, muitas vezes para ser mais educado, irônico ou evitar assumir diretamente uma responsabilidade. Por depender do contexto, o subentendido pode ser negado pelo falante ("eu não disse isso, você que entendeu assim"), enquanto o pressuposto dificilmente pode ser negado, pois está na própria estrutura da frase.',
    exemplo:'Se alguém diz "está um pouco frio aqui" numa sala com a janela aberta, subentende-se (pelo contexto) o pedido implícito para fechar a janela — mas o falante pode negar essa intenção, dizendo que só comentou o clima.',
    pontos:['Subentendido: informação implícita que depende do contexto situacional','Pode ser negado pelo falante ("não foi isso que eu quis dizer")','Diferente do pressuposto: não está marcado na estrutura gramatical da frase']},
  {trilha:'enem', materia:'Linguagens', assunto:'Revisão de Elementos Textuais',
    resumo:'Bloco de consolidação que diferencia os quatro mecanismos implícitos de sentido: anáfora e catáfora (coesão referencial, direção temporal do texto) e pressuposto e subentendido (informação implícita, gramatical ou contextual).',
    aprofundamento:'Anáfora e catáfora lidam com a direção da referência dentro do texto (para trás ou para frente); pressuposto e subentendido lidam com a origem da informação implícita (gramatical/estrutural ou contextual/situacional). O ENEM costuma testar a diferenciação entre pressuposto e subentendido com mais frequência do que anáfora/catáfora, pois exige do candidato reconhecer se a informação implícita pode ser "provada" pela estrutura da frase (pressuposto) ou se depende de interpretação contextual, mais subjetiva (subentendido).',
    exemplo:'"Até o estagiário sabia resolver aquele problema" (pressuposto: outras pessoas mais experientes também sabiam, embutido no "até") é diferente de "não parece que você estudou muito para essa prova" (subentendido: sugestão de crítica, que depende do tom e contexto, e pode ser negada).',
    pontos:['Anáfora/catáfora: direção da referência (para trás/para frente)','Pressuposto: informação implícita na gramática; subentendido: no contexto','Pressuposto é difícil de negar; subentendido pode ser negado pelo falante']},
  {trilha:'enem', materia:'Linguagens', assunto:'Coesão e Coerência',
    resumo:'Coesão é a conexão gramatical entre as partes do texto (uso de pronomes, conectivos, repetições controladas). Coerência é a lógica de sentido do texto como um todo — as ideias precisam fazer sentido entre si, mesmo que a coesão gramatical esteja correta.',
    aprofundamento:'Um texto pode ser coeso (gramaticalmente bem amarrado, com pronomes e conectivos corretos) e ainda assim incoerente (as ideias se contradizem ou não fazem sentido logicamente) — essa distinção é central para o ENEM, especialmente na correção de redações, onde a coerência (organização lógica das ideias, ausência de contradições) pesa tanto quanto a coesão (conectivos bem empregados). O inverso também é possível: um texto pode ter falhas de coesão (repetições, pronomes mal empregados) mas ainda ser coerente, se o leitor consegue reconstruir o sentido lógico apesar dos problemas gramaticais.',
    exemplo:'"Pedro é vegetariano. Ontem ele comeu um bife enorme no jantar" é coeso (o pronome "ele" retoma "Pedro" corretamente), mas incoerente (contradiz a informação de que Pedro é vegetariano).',
    pontos:['Coesão: conexão gramatical entre as partes do texto','Coerência: lógica de sentido do texto como um todo, sem contradições','Um texto pode ser coeso e incoerente, ou ter falhas de coesão e ainda ser coerente']},
  {trilha:'enem', materia:'Linguagens', assunto:'Seleção Lexical',
    resumo:'Seleção lexical é a escolha deliberada de palavras específicas (entre várias sinônimas possíveis) para produzir um efeito de sentido particular — mais formal, mais crítico, mais afetivo — de acordo com a intenção comunicativa do texto.',
    aprofundamento:'Nenhuma escolha de palavra é neutra: dizer que um governo "investiu" ou "gastou" em determinada área carrega conotações completamente diferentes (a primeira sugere retorno positivo, a segunda sugere desperdício ou custo), mesmo que ambas se refiram ao mesmo fato objetivo. O ENEM cobra fortemente a percepção de que a seleção lexical revela o posicionamento ideológico ou a intenção comunicativa de quem escreve, especialmente em textos jornalísticos e publicitários, onde a escolha de adjetivos e verbos direciona a interpretação do leitor.',
    exemplo:'Chamar um grupo de manifestantes de "ativistas" ou de "baderneiros" no mesmo relato de um protesto revela, através da seleção lexical, um posicionamento completamente diferente sobre o mesmo evento.',
    pontos:['Seleção lexical: escolha deliberada de palavras específicas para um efeito de sentido','Nenhuma escolha de palavra é neutra — carrega conotação e intenção','Muito cobrada em textos jornalísticos e publicitários que revelam posicionamento']},
  {trilha:'enem', materia:'Linguagens', assunto:'Conectivos',
    resumo:'Conectivos são palavras ou expressões que ligam ideias dentro do texto, estabelecendo relações lógicas entre elas: adição, oposição, causa, consequência, condição, finalidade, entre outras.',
    aprofundamento:'Cada conectivo carrega uma relação lógica específica que, se mal empregada ou mal interpretada, distorce completamente o sentido do texto: "mas", "porém", "contudo" indicam oposição/contraste; "porque", "já que", "pois" indicam causa; "portanto", "logo", "assim" indicam consequência/conclusão; "para que", "a fim de" indicam finalidade; "se", "caso" indicam condição. O ENEM cobra intensamente a substituição de conectivos (pedindo qual outro conectivo poderia substituir um dado, mantendo o mesmo sentido lógico) e a identificação da relação lógica que um conectivo específico estabelece num trecho.',
    exemplo:'"Estudou bastante, portanto, foi bem na prova" — o conectivo "portanto" estabelece uma relação de consequência: o bom resultado é consequência lógica do estudo.',
    pontos:['Cada conectivo carrega uma relação lógica específica (causa, oposição, consequência...)','Trocar um conectivo por outro de sentido diferente distorce a lógica do texto','ENEM cobra substituição de conectivos mantendo a mesma relação lógica original']},
  {trilha:'enem', materia:'Linguagens', assunto:'Referências e Reiterações',
    resumo:'Referências e reiterações são mecanismos de coesão lexical que retomam uma ideia ou termo usando sinônimos, hiperônimos (termos mais gerais) ou expressões equivalentes, evitando repetir exatamente a mesma palavra.',
    aprofundamento:'Diferente da anáfora pronominal (que usa pronomes para retomar um termo), a reiteração lexical usa outras palavras de sentido equivalente ou mais abrangente para retomar uma ideia — por exemplo, retomar "cachorro" com "o animal" (hiperônimo, termo mais geral que engloba outras categorias também) ou com "o bichano... não, o vira-lata" (sinônimo aproximado). Esse recurso, muito usado em textos jornalísticos para evitar repetição excessiva de um mesmo termo, é cobrado no ENEM em questões que pedem para identificar a que elemento anterior uma expressão substituta se refere.',
    exemplo:'"O jaguar é o maior felino das Américas. O animal está ameaçado de extinção." A expressão "o animal" é uma reiteração por hiperônimo, retomando "o jaguar" com um termo mais geral.',
    pontos:['Reiteração: retoma um termo usando sinônimo ou hiperônimo (termo mais geral)','Diferente da anáfora pronominal, que usa pronomes para retomar','Muito usada no jornalismo para evitar repetir a mesma palavra várias vezes']},
  {trilha:'enem', materia:'Linguagens', assunto:'Correlação Verbal',
    resumo:'Correlação verbal é a coerência temporal entre os tempos e modos verbais usados ao longo de um texto — os verbos precisam se relacionar de forma lógica no tempo, sem contradições ou saltos temporais inconsistentes.',
    aprofundamento:'Erros de correlação verbal geram frases gramaticalmente estranhas ou até incoerentes: usar o futuro do subjuntivo com o presente do indicativo de forma incompatível ("se eu ganhasse na loteria, eu compro uma casa" está incorreto — deveria ser "compraria", no futuro do pretérito, para manter a correlação lógica com o "ganhasse"). O ENEM cobra esse conceito principalmente na correção de redações e em questões de reescrita de frases, testando se o candidato percebe quando a sequência de tempos verbais quebra a lógica temporal do texto.',
    exemplo:'"Se eu tivesse estudado mais, eu teria passado no concurso" tem correlação verbal correta: pretérito mais-que-perfeito do subjuntivo ("tivesse estudado") correlacionado com futuro do pretérito composto ("teria passado").',
    pontos:['Correlação verbal: coerência temporal entre os verbos usados no texto','Erros geram frases gramaticalmente estranhas ou logicamente incoerentes','Muito cobrado na correção de redações e em questões de reescrita']},
  {trilha:'enem', materia:'Linguagens', assunto:'Coerência Textual',
    resumo:'Coerência textual é a qualidade de um texto fazer sentido lógico como um todo — sem contradições internas, com progressão de ideias organizada e relação clara entre as partes, mesmo quando há falhas pontuais de coesão gramatical.',
    aprofundamento:'A coerência depende de fatores internos ao texto (não contradizer a si mesmo, manter progressão lógica de ideias) e de fatores externos (compatibilidade com o conhecimento de mundo do leitor — um texto que afirma algo factualmente absurdo, sem contexto ficcional, quebra a coerência). Na redação do ENEM, a coerência é avaliada pela competência que julga a argumentação: um texto pode ter ótima coesão gramatical (conectivos bem usados) e ainda perder pontos por incoerência, se os argumentos se contradizem ou não sustentam logicamente a tese defendida.',
    exemplo:'Um texto que defende, no início, que "a tecnologia aproxima as pessoas" e, no final, conclui que "por isso a tecnologia deveria ser banida" apresenta uma quebra de coerência: a conclusão contradiz o argumento inicial.',
