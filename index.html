    pontos:['Coerência: o texto faz sentido lógico como um todo, sem contradições internas','Depende de fatores internos (progressão lógica) e externos (conhecimento de mundo)','Central na avaliação da competência argumentativa da redação do ENEM']},
  {trilha:'enem', materia:'Linguagens', assunto:'Revisão de Coesão e Coerência',
    resumo:'Bloco de consolidação que integra todos os mecanismos de coesão (anáfora, catáfora, conectivos, reiteração lexical, correlação verbal) como ferramentas a serviço de um objetivo maior: a coerência textual.',
    aprofundamento:'Todos os mecanismos de coesão estudados (anáfora, catáfora, seleção lexical, conectivos, reiterações, correlação verbal) são meios técnicos para alcançar um fim: um texto coerente, que faça sentido lógico do início ao fim. O ENEM cobra essa integração especialmente na competência 4 da redação (mecanismos linguísticos para a construção da argumentação, ou seja, coesão) e na competência 3 (progressão lógica das ideias, ou seja, coerência) — são competências separadas na correção, mas profundamente interligadas na prática.',
    exemplo:'Uma redação que usa conectivos variados e corretos (boa coesão), mas cujos parágrafos não têm relação lógica clara entre si (má coerência), tende a perder pontos justamente na competência que avalia a coerência argumentativa, mesmo com boa coesão gramatical.',
    pontos:['Mecanismos de coesão são ferramentas a serviço da coerência textual','Coesão e coerência são competências separadas, mas interligadas na redação do ENEM','Um texto coeso não é garantia automática de ser coerente, e vice-versa']},
  {trilha:'enem', materia:'Linguagens', assunto:'O que é Literatura?',
    resumo:'Literatura é a arte que usa a linguagem verbal (escrita ou oral) com intenção estética, criando um efeito de sentido que vai além da função puramente informativa da linguagem — a chamada função poética da linguagem.',
    aprofundamento:'O texto literário se distingue de um texto meramente informativo por priorizar a forma (como se diz) tanto quanto ou mais que o conteúdo (o que se diz), através de recursos como ritmo, sonoridade, figuras de linguagem e construção ficcional. A literatura pode ser em prosa (organizada em parágrafos, como romances e contos) ou em verso (organizada em linhas com métrica e ritmo próprios, como poemas). O ENEM valoriza a literatura como registro histórico-cultural: cada texto literário reflete a visão de mundo, os valores e as tensões do período em que foi escrito.',
    exemplo:'Um mesmo fato (uma pessoa apaixonada) pode ser relatado objetivamente ("Ela está apaixonada") ou literariamente ("Seu peito carrega um incêndio que nenhuma água apaga") — a segunda versão usa linguagem com intenção estética, a função poética da linguagem.',
    pontos:['Literatura: uso estético da linguagem, priorizando também a forma, não só o conteúdo','Função poética da linguagem: a forma de dizer produz efeito de sentido próprio','Literatura é também registro histórico-cultural do período em que foi produzida']},
  {trilha:'enem', materia:'Linguagens', assunto:'Como a Literatura Cai no ENEM?',
    resumo:'No ENEM, a literatura é cobrada principalmente através de trechos de obras (poemas, excertos de romances/contos) contextualizados historicamente, exigindo que o candidato reconheça características de estilo de época e faça conexões entre texto e contexto histórico-social.',
    aprofundamento:'As questões raramente pedem decoreba de datas ou biografias de autores; o foco está em reconhecer, a partir de um trecho apresentado na prova, a qual escola literária ou momento histórico aquele texto pertence, com base em características de linguagem, temática e estilo. Também é comum a prova comparar dois textos de períodos diferentes sobre um tema semelhante (por exemplo, o amor no Romantismo x o amor no Modernismo), pedindo para identificar as diferenças de abordagem entre as épocas.',
    exemplo:'Uma questão pode apresentar um poema desconhecido, com linguagem idealizada sobre a natureza e o amor, e pedir para identificar que se trata de um texto de características românticas, mesmo sem o candidato ter decorado aquele poema especificamente.',
    pontos:['ENEM cobra reconhecimento de características de época, não decoreba de datas/biografias','Questões geralmente trazem um trecho contextualizado para análise direta','Comum comparar textos de períodos diferentes sobre um tema semelhante']},
  {trilha:'enem', materia:'Linguagens', assunto:'Gêneros Literários',
    resumo:'Os três grandes gêneros literários são: lírico (poemas centrados em sentimentos e subjetividade, geralmente em 1ª pessoa), épico/narrativo (conta uma história com enredo e personagens) e dramático (escrito para ser encenado, com diálogos e rubricas).',
    aprofundamento:'O gênero lírico é o mais cobrado isoladamente no ENEM, geralmente através de poemas que expressam emoção, subjetividade e uso intenso de figuras de linguagem — sua unidade central não é o enredo, mas a expressão de um "eu lírico" (que não deve ser confundido com o autor real do poema). O gênero épico originalmente se referia a longos poemas narrativos (como Os Lusíadas), mas hoje o termo "narrativo" é mais usado para englobar romance, novela e conto em prosa. O gênero dramático (teatro) é menos cobrado isoladamente, mas aparece em questões sobre estrutura de texto teatral (rubricas, diálogos, atos).',
    exemplo:'Um soneto de amor, com "eu lírico" expressando sentimento intenso, é do gênero lírico; "Os Lusíadas", de Camões, com uma longa narrativa de viagens e heróis, é do gênero épico.',
    pontos:['Lírico: expressão subjetiva de sentimentos, centrado no "eu lírico" (não é o autor)','Épico/narrativo: conta uma história, com enredo e personagens','Dramático: escrito para encenação teatral, com diálogos e rubricas']},
  {trilha:'enem', materia:'Linguagens', assunto:'Prosa x Poesia',
    resumo:'Prosa é o texto organizado em parágrafos, seguindo a estrutura linear da linguagem cotidiana. Poesia é organizada em versos e estrofes, com atenção especial ao ritmo, à métrica e à sonoridade das palavras.',
    aprofundamento:'A poesia não se define apenas pela forma visual (organização em versos), mas pela intensificação de recursos sonoros e rítmicos: rima (semelhança de som no final dos versos), métrica (contagem de sílabas poéticas por verso) e ritmo (alternância de sílabas fortes e fracas). É importante notar que nem todo texto em versos é necessariamente "poético" no sentido estético pleno, e existe também a "prosa poética", que usa recursos líricos dentro da estrutura em parágrafos da prosa — uma zona de fronteira cobrada em questões mais avançadas do ENEM.',
    exemplo:'Um romance de Machado de Assis é prosa (organizado em parágrafos, narrando uma história linear); um soneto de Camões é poesia (organizado em versos, com métrica e rima definidas).',
    pontos:['Prosa: organizada em parágrafos, estrutura linear da linguagem cotidiana','Poesia: organizada em versos/estrofes, com atenção a ritmo, métrica e rima','Prosa poética mistura recursos líricos dentro da estrutura da prosa']},
  {trilha:'enem', materia:'Linguagens', assunto:'Romance e Novela',
    resumo:'Romance é uma narrativa longa, com múltiplos personagens, tramas secundárias e desenvolvimento psicológico aprofundado. Novela (no sentido literário) é uma narrativa de extensão intermediária entre o conto e o romance, com enredo mais linear.',
    aprofundamento:'O romance permite o desenvolvimento complexo de vários personagens e subtramas ao longo de muitos capítulos, sendo o gênero narrativo mais extenso e mais cobrado no ENEM (especialmente romances de Machado de Assis, José de Alencar e do Modernismo). A novela literária, no sentido clássico do termo (diferente da "novela de TV"), tem uma trama mais enxuta que o romance, mas mais desenvolvida que o conto, geralmente com foco em um conflito central sem tantas subtramas paralelas.',
    exemplo:'"Dom Casmurro", de Machado de Assis, é um romance: extensão longa, múltiplas camadas psicológicas do narrador, ambiguidade central sobre a traição de Capitu que sustenta a obra inteira.',
    pontos:['Romance: narrativa longa, múltiplos personagens e subtramas, aprofundamento psicológico','Novela literária: extensão intermediária entre conto e romance','Não confundir novela literária com o formato de "novela de TV" (folhetim televisivo)']},
  {trilha:'enem', materia:'Linguagens', assunto:'Conto e Crônica',
    resumo:'Conto é uma narrativa curta, com poucos personagens e um único conflito central, geralmente com final conciso e impactante. Crônica é um texto breve, ligado ao cotidiano, publicado originalmente em jornais/revistas, muitas vezes com tom reflexivo, bem-humorado ou lírico.',
    aprofundamento:'O conto se concentra num único núcleo dramático (diferente do romance, que comporta várias subtramas), e sua economia narrativa (poucos personagens, tempo e espaço limitados) é o que permite o impacto do desfecho, muitas vezes surpreendente. A crônica nasceu ligada ao jornalismo (relatando fatos cotidianos com um olhar mais pessoal e literário do que uma notícia), e por isso costuma ser breve, escrita em linguagem mais coloquial, e frequentemente mistura observação do cotidiano com reflexão ou humor.',
    exemplo:'Uma crônica de Rubem Braga sobre observar a chuva de uma janela é um exemplo clássico: parte de um fato banal do cotidiano para uma reflexão mais ampla, em tom pessoal e linguagem acessível.',
    pontos:['Conto: narrativa curta, um único conflito central, final geralmente impactante','Crônica: texto breve sobre o cotidiano, tom pessoal, nasceu ligada ao jornalismo','Ambos são gêneros narrativos, mas com propósitos e origens diferentes']},
  {trilha:'enem', materia:'Linguagens', assunto:'Outros Gêneros Literários',
    resumo:'Além de romance, novela, conto e crônica, existem outros gêneros narrativos relevantes: fábula (curta, com animais personificados e moral explícita), lenda (narrativa popular com elementos fantásticos, ligada à cultura oral de um povo) e mito (narrativa que explica fenômenos naturais ou existenciais através de deuses/seres sobrenaturais).',
    aprofundamento:'A fábula tem função pedagógica explícita, terminando quase sempre com uma moral que resume o ensinamento da história (como nas fábulas de Esopo e La Fontaine). A lenda está profundamente ligada ao folclore e à cultura popular de uma região específica (como o Boitatá e o Curupira no folclore brasileiro), misturando fatos reais com elementos fantásticos, geralmente transmitida oralmente entre gerações. O mito, por sua vez, busca explicar a origem do mundo, dos fenômenos naturais ou da condição humana através de narrativas envolvendo deuses e seres sobrenaturais, sendo a base de muitas culturas antigas (mitologia grega, indígena).',
    exemplo:'A lenda do Curupira, personagem do folclore brasileiro com pés virados para trás que protege a floresta, mistura elementos fantásticos com uma função cultural de preservação ambiental simbólica.',
    pontos:['Fábula: animais personificados, moral explícita, função pedagógica','Lenda: narrativa popular/folclórica, mistura fatos reais com elementos fantásticos','Mito: explica origens e fenômenos através de deuses/seres sobrenaturais']},
  {trilha:'enem', materia:'Linguagens', assunto:'Elementos da Narrativa',
    resumo:'Os elementos estruturais de qualquer narrativa são: enredo (sequência de fatos), personagens, tempo, espaço, narrador e foco narrativo — a base analítica para interpretar qualquer texto narrativo cobrado no ENEM.',
    aprofundamento:'O enredo geralmente segue uma estrutura de apresentação, complicação (conflito), clímax e desfecho. Os personagens podem ser classificados como protagonistas (centrais), antagonistas (em conflito com o protagonista) ou secundários, e também como planos (sem grande desenvolvimento psicológico) ou redondos (complexos, mudam ao longo da história). O tempo pode ser cronológico (segue a ordem linear dos fatos) ou psicológico (organizado pela subjetividade do narrador/personagem, com saltos temporais, flashbacks). O espaço não é apenas cenário decorativo — muitas vezes reflete ou intensifica o estado emocional dos personagens (espaço físico e espaço psicológico).',
    exemplo:'Em "Vidas Secas", de Graciliano Ramos, o espaço árido do sertão nordestino não é apenas cenário: reflete e intensifica a dureza da vida e a limitação psicológica dos personagens, quase mudos ao longo da obra.',
    pontos:['Elementos: enredo, personagens, tempo, espaço, narrador, foco narrativo','Personagens: protagonista/antagonista; planos (simples) ou redondos (complexos)','Tempo cronológico (linear) x tempo psicológico (subjetivo, com saltos temporais)']},
  {trilha:'enem', materia:'Linguagens', assunto:'Conceito de Escola Literária',
    resumo:'Escola literária (ou movimento literário) é um conjunto de obras que compartilham características estéticas, temáticas e um contexto histórico-social comum, formando um período identificável na história da literatura.',
    aprofundamento:'Cada escola literária não surge no vácuo: ela reflete e responde ao contexto histórico, social, político e filosófico do seu tempo — o Barroco reflete o conflito religioso da Contrarreforma, o Romantismo reflete o nacionalismo pós-independência, o Modernismo reflete a ruptura cultural do início do século XX. Entender esse princípio (escola literária = estética + contexto histórico) é a chave para resolver a maior parte das questões de literatura no ENEM, que raramente pedem decoreba pura, mas sim a conexão entre um trecho apresentado e o momento histórico que ele reflete.',
    exemplo:'O Arcadismo, com sua valorização da vida simples no campo (bucolismo), reflete o contexto do Iluminismo europeu e a reação contra os excessos ornamentais do Barroco anterior.',
    pontos:['Escola literária: conjunto de obras com estética e contexto histórico comuns','Cada movimento reflete e responde ao contexto histórico-social de seu tempo','Chave do ENEM: conectar características do texto ao momento histórico que reflete']},
  {trilha:'enem', materia:'Linguagens', assunto:'Quinhentismo',
    resumo:'Quinhentismo (século XVI) é o período literário inicial do Brasil colonial, marcado pela literatura de informação (relatos de viajantes, como a Carta de Pero Vaz de Caminha) e pela literatura jesuítica de catequese (obras de José de Anchieta).',
    aprofundamento:'A literatura de informação tinha propósito descritivo e informativo, relatando aos portugueses as características da nova terra (fauna, flora, povos indígenas) — a Carta de Caminha é o documento fundador dessa tradição, descrevendo o Brasil sob um olhar europeu maravilhado e idealizado. A literatura jesuítica, por outro lado, tinha finalidade catequética: converter os povos indígenas ao catolicismo através de autos (peças teatrais religiosas) e textos didáticos, com Anchieta como figura central desse movimento.',
    exemplo:'A Carta de Pero Vaz de Caminha, ao descrever os indígenas como seres "inocentes" e a terra como um paraíso natural, exemplifica a visão idealizada e eurocêntrica típica da literatura de informação do Quinhentismo.',
    pontos:['Literatura de informação: relatos de viajantes sobre a nova terra (Carta de Caminha)','Literatura jesuítica: catequese dos povos indígenas (José de Anchieta)','Marca o início da literatura no Brasil colonial, sob olhar europeu']},
  {trilha:'enem', materia:'Linguagens', assunto:'Barroco',
    resumo:'Barroco (século XVII) é marcado pelo dualismo e conflito entre fé e prazer terreno, pecado e salvação, expresso através de linguagem rebuscada, antíteses e jogo de contrastes — reflexo do contexto da Contrarreforma católica.',
    aprofundamento:'O "fingimento poético" barroco explora contrastes extremos (vida x morte, céu x inferno, luz x trevas) através de figuras de linguagem como antítese e paradoxo, criando uma tensão constante entre o desejo terreno (carnal, material) e a busca pela salvação espiritual (religiosa). Gregório de Matos é o principal autor barroco brasileiro, conhecido tanto pela poesia religiosa/filosófica quanto pela poesia satírica (crítica social e política da Bahia colonial), evidenciando o próprio dualismo barroco em sua obra.',
    exemplo:'Versos de Gregório de Matos que contrastam a busca pelo prazer mundano com o medo do pecado e da condenação eterna ilustram o dualismo característico barroco entre corpo e alma.',
    pontos:['Barroco: dualismo entre fé/pecado e prazer terreno, linguagem rebuscada','Recursos centrais: antítese e paradoxo, jogo de contrastes extremos','Gregório de Matos: principal autor barroco brasileiro, poesia religiosa e satírica']},
  {trilha:'enem', materia:'Linguagens', assunto:'Arcadismo',
    resumo:'Arcadismo (século XVIII) valoriza a simplicidade da vida no campo (bucolismo), o equilíbrio racional (influência do Iluminismo) e a busca pelo prazer moderado, em contraste com o exagero e dualismo do Barroco anterior.',
    aprofundamento:'O ideal árcade (também chamado neoclassicismo) segue princípios latinos resgatados do classicismo: "fugere urbem" (fugir da cidade, valorizando a vida simples do campo), "locus amoenus" (lugar aprazível, natural e idílico) e "carpe diem" (aproveitar o momento presente, com moderação). No Brasil, o Arcadismo se desenvolveu principalmente em Minas Gerais (Escola Mineira), ligado ao contexto da mineração e, posteriormente, à Inconfidência Mineira — Tomás Antônio Gonzaga é o principal nome, com sua obra "Marília de Dirceu".',
    exemplo:'Em "Marília de Dirceu", Tomás Antônio Gonzaga idealiza a vida pastoril simples ao lado da amada, seguindo o ideal árcade de fuga da cidade e valorização da natureza equilibrada.',
    pontos:['Arcadismo: valorização da simplicidade do campo (bucolismo) e razão iluminista','Princípios: fugere urbem, locus amoenus, carpe diem','Escola Mineira: Tomás Antônio Gonzaga, ligado ao contexto da Inconfidência Mineira']},
  {trilha:'enem', materia:'Linguagens', assunto:'Romantismo - Poesia',
    resumo:'A poesia romântica (século XIX) se divide em três gerações: a primeira (nacionalista/indianista, com Gonçalves Dias), a segunda (byroniana/ultrarromântica, com Álvares de Azevedo, marcada por angústia e morte) e a terceira (condoreira/social, com Castro Alves, focada na abolição).',
    aprofundamento:'A primeira geração romântica constrói o indígena como símbolo do herói nacional brasileiro (indianismo), buscando forjar uma identidade literária própria, desvinculada de Portugal, logo após a independência — Gonçalves Dias e sua "Canção do Exílio" são o exemplo máximo. A segunda geração, influenciada pelo poeta inglês Lord Byron, mergulha em temas de angústia existencial, morte, pessimismo e um certo "mal do século" (tédio existencial), com Álvares de Azevedo como principal nome. A terceira geração, condoreira (referência ao voo alto do condor, símbolo de liberdade), usa a poesia com função social explícita, principalmente na luta abolicionista — Castro Alves, com "O Navio Negreiro", é o expoente máximo.',
    exemplo:'Castro Alves, em "O Navio Negreiro", descreve com indignação as condições desumanas do tráfico de escravos, exemplificando a poesia condoreira de forte engajamento social e abolicionista da terceira geração.',
    pontos:['1ª geração: nacionalista/indianista (Gonçalves Dias)','2ª geração: byroniana, angústia e morte (Álvares de Azevedo)','3ª geração: condoreira, engajamento social e abolicionista (Castro Alves)']},
  {trilha:'enem', materia:'Linguagens', assunto:'Romantismo - Prosa',
    resumo:'A prosa romântica brasileira se divide principalmente em romance indianista (o índio como herói nacional idealizado, com José de Alencar), romance urbano (retrata a sociedade burguesa carioca) e romance regionalista (retrata costumes de diferentes regiões do Brasil).',
    aprofundamento:'José de Alencar é a figura central da prosa romântica, com obras indianistas como "Iracema" e "O Guarani", que idealizam o indígena como nobre, corajoso e puro, construindo um mito de origem para a nacionalidade brasileira através da miscigenação simbólica entre o colonizador europeu e o indígena. O romance urbano de Alencar (como "Senhora") retrata os costumes e valores da sociedade burguesa do Rio de Janeiro, muitas vezes criticando o casamento por interesse financeiro. O romance regionalista, com autores como Bernardo Guimarães, antecipa o interesse pela diversidade cultural e geográfica brasileira que será aprofundado depois pelo Realismo/Naturalismo.',
    exemplo:'Em "Iracema", José de Alencar narra o romance idealizado entre a indígena Iracema e o colonizador português Martim, numa alegoria da formação do povo brasileiro através da miscigenação.',
    pontos:['Romance indianista: índio idealizado como herói nacional (José de Alencar)','Romance urbano: retrata a sociedade burguesa carioca e seus valores','Romance regionalista: antecipa o interesse pela diversidade cultural do Brasil']},
  {trilha:'enem', materia:'Linguagens', assunto:'Realismo',
    resumo:'Realismo (final do século XIX) rompe com o idealismo romântico, propondo uma visão crítica, objetiva e muitas vezes pessimista da sociedade, com foco na análise psicológica dos personagens e na crítica aos valores da burguesia.',
    aprofundamento:'Diferente do Romantismo (que idealiza sentimentos e heróis), o Realismo busca retratar a realidade sem filtros idealizantes, expondo hipocrisias sociais, o adultério burguês, o interesse financeiro disfarçado de amor, e a complexidade psicológica (muitas vezes ambígua e contraditória) dos personagens. No Brasil, Machado de Assis é a figura absolutamente central do Realismo, sendo considerado por muitos críticos o maior escritor da literatura brasileira, com sua análise implacável da psicologia humana e uso de narradores não confiáveis.',
    exemplo:'Em "Dom Casmurro", Machado de Assis constrói um narrador (Bentinho) que talvez esteja mentindo ou distorcendo a realidade sobre a suposta traição de Capitu — uma ambiguidade psicológica típica do Realismo machadiano.',
    pontos:['Realismo: visão crítica e objetiva da sociedade, rompe com o idealismo romântico','Foco em análise psicológica complexa e crítica aos valores burgueses','Machado de Assis: figura central, narradores não confiáveis, ambiguidade psicológica']},
  {trilha:'enem', materia:'Linguagens', assunto:'Machado de Assis - Romance',
    resumo:'Os romances de Machado de Assis (especialmente da fase realista: "Memórias Póstumas de Brás Cubas", "Dom Casmurro", "Quincas Borba") são marcados por narradores não confiáveis, ironia fina e uma visão cética e pessimista da natureza humana.',
    aprofundamento:'"Memórias Póstumas de Brás Cubas" inaugura, na literatura brasileira, o narrador defunto (que narra a própria vida já morto, com liberdade total de julgamento sobre os vivos) e explora o conceito filosófico do "humanitismo" (paródia da filosofia positivista, sugerindo que a humanidade existe apenas para servir a si mesma egoisticamente). "Dom Casmurro" é o romance mais cobrado no ENEM, centrado na ambiguidade sobre a traição de Capitu — Bentinho (o narrador) apresenta "provas" da traição, mas o próprio texto sugere que ele pode estar projetando ciúme doentio e reconstruindo o passado de forma distorcida, sem provas objetivas concretas.',
    exemplo:'A famosa expressão "olhos de ressaca" usada por Bentinho para descrever Capitu em "Dom Casmurro" é subjetiva e ambígua — não prova nada sobre a traição, mas revela a obsessão e o ciúme do próprio narrador.',
    pontos:['"Memórias Póstumas de Brás Cubas": narrador defunto, crítica ao humanitismo/positivismo','"Dom Casmurro": ambiguidade central sobre a traição de Capitu, narrador não confiável','Machado explora a psicologia humana com ironia fina e ceticismo constante']},
  {trilha:'enem', materia:'Linguagens', assunto:'Machado de Assis - Conto e Crônica',
    resumo:'Os contos de Machado de Assis (como "O Espelho", "A Cartomante", "Missa do Galo") aplicam, em formato curto, a mesma ironia fina e análise psicológica ambígua de seus romances, muitas vezes com finais abertos ou reviravoltas irônicas.',
    aprofundamento:'Nos contos machadianos, é comum o narrador comentar diretamente com o leitor, quebrando a ilusão narrativa (metalinguagem), e a construção de personagens cuja motivação real permanece deliberadamente ambígua até o final. Machado também escreveu crônicas ao longo de sua carreira jornalística, comentando o cotidiano carioca com o mesmo olhar irônico e crítico que caracteriza sua ficção, unindo observação social fina a um estilo elegante e conciso.',
    exemplo:'Em "A Cartomante", Machado constrói um conto com reviravolta irônica sobre destino e superstição, questionando até que ponto o acaso ou a crença cega determinam o desfecho trágico da história.',
    pontos:['Contos machadianos: ironia fina, ambiguidade psicológica, finais muitas vezes abertos','Comum a quebra da ilusão narrativa, com o narrador comentando diretamente ao leitor','Crônicas de Machado: olhar irônico e crítico sobre o cotidiano carioca da época']},
  {trilha:'enem', materia:'Linguagens', assunto:'Naturalismo',
    resumo:'Naturalismo é uma vertente radical do Realismo que retrata o ser humano de forma ainda mais determinista, influenciado por instintos biológicos, herança genética e o ambiente social — muitas vezes com personagens reduzidos quase a "animais" em seus impulsos.',
    aprofundamento:'Influenciado pelo positivismo científico e pelo determinismo (a ideia de que o comportamento humano é definido por raça, meio e momento histórico, mais do que por livre-arbítrio), o Naturalismo explora temas como sexualidade explícita, violência, doenças e degradação social, com uma linguagem mais crua e descritiva do que o Realismo machadiano (mais psicológico e irônico). Aluísio Azevedo, com "O Cortiço", é o principal autor naturalista brasileiro, retratando a vida coletiva num cortiço carioca como um organismo quase biológico, onde o ambiente (o próprio cortiço) determina o destino dos personagens.',
    exemplo:'Em "O Cortiço", Aluísio Azevedo descreve o cortiço como um organismo vivo que "cresce" e "se multiplica", e os personagens são tratados quase como produtos determinados pelo ambiente insalubre em que vivem, refletindo o determinismo naturalista.',
    pontos:['Naturalismo: radicaliza o Realismo, com forte influência do determinismo científico','Explora temas de instinto, sexualidade, violência e degradação social','Aluísio Azevedo, "O Cortiço": ambiente determina o destino dos personagens']},
  {trilha:'enem', materia:'Linguagens', assunto:'Parnasianismo',
    resumo:'Parnasianismo (poesia, final do século XIX) valoriza a perfeição formal acima do conteúdo emocional: rigor métrico, rimas ricas, vocabulário culto e a filosofia da "arte pela arte" (l\'art pour l\'art), sem compromisso social ou sentimental.',
    aprofundamento:'Em reação ao subjetivismo excessivo do Romantismo, os poetas parnasianos buscavam objetividade e frieza emocional deliberada, tratando o poema como um objeto de arte a ser lapidado com precisão técnica, comparável a um artesão trabalhando uma pedra preciosa — daí a comparação com o escultor. Olavo Bilac é o principal nome do Parnasianismo brasileiro, com sonetos de rigor formal impecável, priorizando a beleza da forma (métrica perfeita, rimas elaboradas) sobre qualquer engajamento emocional ou social direto.',
    exemplo:'Olavo Bilac, em seus sonetos, compara o trabalho do poeta ao de um ourives que lapida cuidadosamente uma joia, priorizando a perfeição técnica da forma acima da espontaneidade emocional.',
    pontos:['Parnasianismo: perfeição formal, rigor métrico, rimas ricas, "arte pela arte"','Reação ao subjetivismo romântico, busca objetividade e frieza emocional','Olavo Bilac: principal nome, sonetos de rigor técnico impecável']},
  {trilha:'enem', materia:'Linguagens', assunto:'Simbolismo',
    resumo:'Simbolismo (poesia, final do século XIX) explora a musicalidade das palavras, o subjetivismo extremo, a sugestão (em vez da descrição direta) e temas místicos/espirituais — em reação direta à objetividade fria do Parnasianismo.',
    aprofundamento:'Enquanto o Parnasianismo busca descrever objetivamente com precisão formal, o Simbolismo busca sugerir através de sons, sinestesias (mistura de sentidos, como "cor que se ouve" ou "som que se vê") e ambiguidade deliberada, priorizando a musicalidade das palavras (aliterações, assonâncias) acima da clareza lógica do sentido. Cruz e Sousa é o principal nome do Simbolismo brasileiro, sendo também uma figura importante por ser um dos primeiros grandes poetas negros da literatura brasileira, enfrentando racismo intenso em sua época.',
    exemplo:'Versos de Cruz e Sousa que combinam sensações de cor, som e luz de forma embaralhada e musical (sinestesia) ilustram a busca simbolista por sugestão e musicalidade acima da descrição objetiva.',
    pontos:['Simbolismo: musicalidade, subjetivismo, sugestão (não descrição direta), misticismo','Recurso central: sinestesia (mistura de sentidos: cor, som, tato combinados)','Cruz e Sousa: principal nome, um dos primeiros grandes poetas negros do Brasil']},
  {trilha:'enem', materia:'Linguagens', assunto:'Pré-modernismo',
    resumo:'Pré-modernismo (início do século XX, entre 1902 e 1922) é um período de transição, sem uma estética unificada, marcado pela denúncia social das desigualdades brasileiras e pela valorização de regiões até então pouco retratadas literariamente.',
    aprofundamento:'Não é propriamente uma "escola" com características estéticas unificadas, mas um momento de transição entre o final do século XIX e o Modernismo, caracterizado por diferentes autores que, cada um a sua maneira, denunciam as contradições e desigualdades do Brasil recém-republicano. Euclides da Cunha, com "Os Sertões", narra e analisa a Guerra de Canudos, expondo o abismo entre o litoral "civilizado" e o sertão nordestino abandonado pelo Estado. Lima Barreto, com "Triste Fim de Policarpo Quaresma", critica o nacionalismo ingênuo e o racismo da sociedade carioca da época.',
    exemplo:'Em "Os Sertões", Euclides da Cunha documenta a Guerra de Canudos e expõe como o Estado brasileiro tratou a população sertaneja como "inimiga" por puro desconhecimento e preconceito regional.',
    pontos:['Pré-modernismo: transição, sem estética unificada, forte denúncia social','Euclides da Cunha, "Os Sertões": Guerra de Canudos, abismo litoral x sertão','Lima Barreto: crítica ao nacionalismo ingênuo e ao racismo da sociedade carioca']},
  {trilha:'enem', materia:'Linguagens', assunto:'Vanguardas Europeias',
    resumo:'Vanguardas europeias (início do século XX) são movimentos artísticos de ruptura radical com a tradição: Futurismo (culto à velocidade e à máquina), Cubismo (fragmentação de perspectivas), Dadaísmo (negação da lógica e da razão) e Surrealismo (exploração do inconsciente e dos sonhos).',
    aprofundamento:'Essas vanguardas influenciaram diretamente o Modernismo brasileiro, especialmente na Semana de Arte Moderna de 1922: o Futurismo italiano de Marinetti (culto à velocidade, à máquina, ruptura com o passado) inspirou o tom provocador e de ruptura da primeira fase modernista brasileira; o Cubismo (fragmentação da imagem em múltiplas perspectivas simultâneas, como nas pinturas de Picasso) influenciou experimentações visuais e de linguagem; o Surrealismo (associado a Freud e ao inconsciente) influenciou a exploração de associações livres e imagens oníricas na poesia posterior.',
    exemplo:'A pintura "Abaporu", de Tarsila do Amaral, que inspirou o Manifesto Antropofágico, dialoga diretamente com as vanguardas europeias (especialmente o Cubismo) ao fragmentar e distorcer proporções do corpo humano de forma não realista.',
    pontos:['Futurismo: culto à velocidade e à máquina, ruptura com o passado','Cubismo: fragmentação de perspectivas; Surrealismo: exploração do inconsciente','Vanguardas europeias influenciaram diretamente a Semana de Arte Moderna de 1922']},
  {trilha:'enem', materia:'Linguagens', assunto:'Modernismo - Primeira Fase',
    resumo:'A primeira fase do Modernismo brasileiro (1922-1930), iniciada com a Semana de Arte Moderna, rompe radicalmente com as tradições anteriores, valorizando a linguagem coloquial, o humor, a experimentação formal e temas nacionais vistos sob nova ótica.',
    aprofundamento:'A Semana de Arte Moderna de 1922, em São Paulo, é o marco fundador do Modernismo brasileiro, reunindo artistas plásticos, músicos e escritores num evento de forte impacto e provocação contra o academicismo parnasiano então dominante. Mário de Andrade ("Macunaíma", um "herói sem nenhum caráter" que sintetiza a identidade brasileira através de mitos indígenas e folclore nacional) e Oswald de Andrade (autor dos manifestos Pau-Brasil e Antropofágico, que propõe "devorar" culturalmente as influências estrangeiras e reelaborá-las de forma genuinamente brasileira) são as figuras centrais dessa fase, marcada pelo verso livre e pela ruptura com a métrica tradicional.',
    exemplo:'O Manifesto Antropofágico de Oswald de Andrade, com a frase-síntese "Tupy or not tupy, that is the question", propõe devorar culturalmente as referências europeias para produzir algo genuinamente brasileiro.',
    pontos:['Semana de Arte Moderna (1922): marco fundador, ruptura com o parnasianismo','Mário de Andrade ("Macunaíma") e Oswald de Andrade (Manifesto Antropofágico)','Marcada por verso livre, humor, experimentação formal e nacionalismo crítico']},
  {trilha:'enem', materia:'Linguagens', assunto:'Modernismo - Segunda Fase: Poesia',
    resumo:'A poesia da segunda fase modernista (1930-1945) aprofunda o engajamento social e a reflexão existencial, com Carlos Drummond de Andrade (ironia e existencialismo cotidiano) e Cecília Meireles (musicalidade e introspecção lírica).',
    aprofundamento:'Diferente da provocação inicial da primeira fase, a segunda geração busca maior maturidade formal e temática, sem abandonar totalmente as conquistas modernistas (verso livre, linguagem mais próxima do cotidiano). Carlos Drummond de Andrade, com poemas como "No meio do caminho", explora o existencialismo cotidiano com ironia e um certo desconforto existencial diante da vida moderna urbana. Cecília Meireles retoma uma musicalidade mais lírica e introspectiva, com forte presença de imagens sobre o tempo, a memória e a fluidez da existência.',
    exemplo:'"No meio do caminho tinha uma pedra / tinha uma pedra no meio do caminho", de Drummond, usa repetição obsessiva para explorar o incômodo existencial diante de um obstáculo banal do cotidiano, num tom minimalista típico dessa fase.',
    pontos:['2ª fase: maior maturidade formal, aprofunda engajamento social e existencial','Carlos Drummond de Andrade: ironia e existencialismo do cotidiano urbano','Cecília Meireles: musicalidade lírica, temas de tempo, memória e introspecção']},
  {trilha:'enem', materia:'Linguagens', assunto:'Modernismo - Segunda Fase: Prosa',
    resumo:'A prosa da segunda fase modernista (romance de 30) é marcada pelo regionalismo nordestino, denunciando a seca, a miséria e as desigualdades sociais — com Graciliano Ramos ("Vidas Secas") e Jorge Amado como principais nomes.',
    aprofundamento:'O "romance de 30" retoma o regionalismo com forte crítica social, retratando as agruras do sertão nordestino (seca, fome, exploração dos trabalhadores rurais) com uma linguagem enxuta e objetiva, muito diferente da exuberância estilística de Mário e Oswald na primeira fase. Graciliano Ramos, em "Vidas Secas", usa uma prosa extremamente econômica (frases curtas, vocabulário limitado) para espelhar a própria limitação de expressão dos personagens, uma família de retirantes quase reduzidos ao silêncio pela dureza da vida. Jorge Amado retrata a Bahia e seus contrastes sociais, com forte engajamento político em suas obras iniciais.',
    exemplo:'Em "Vidas Secas", a família de Fabiano é retratada com frases curtas e secas, espelhando através da própria linguagem a limitação de expressão e a dureza de vida dos personagens no sertão.',
    pontos:['Romance de 30: regionalismo nordestino, forte crítica social e denúncia','Graciliano Ramos ("Vidas Secas"): prosa enxuta que espelha a dureza dos personagens','Jorge Amado: retrata a Bahia e seus contrastes sociais com engajamento político']},
  {trilha:'enem', materia:'Linguagens', assunto:'Modernismo - Terceira Fase',
    resumo:'A terceira fase modernista (Geração de 45, pós-1945) retoma certo rigor formal e equilíbrio clássico, sem abandonar as conquistas modernistas anteriores — com Guimarães Rosa (experimentação radical de linguagem) e João Cabral de Melo Neto (rigor construtivo e racionalidade) como principais nomes.',
    aprofundamento:'Guimarães Rosa, em "Grande Sertão: Veredas", radicaliza a experimentação linguística com neologismos, sintaxe reinventada e uma prosa que mistura oralidade sertaneja com erudição filosófica, criando um universo linguístico único na literatura brasileira. João Cabral de Melo Neto, na poesia, busca o extremo oposto do lirismo sentimental: uma "poesia-objeto", construída com precisão quase arquitetônica, racional e enxuta, como em "Morte e Vida Severina", que denuncia a miséria nordestina com uma linguagem extremamente controlada e sem sentimentalismo.',
    exemplo:'Em "Grande Sertão: Veredas", Guimarães Rosa cria palavras novas e reorganiza a sintaxe tradicional para capturar a fala e o pensamento do sertanejo Riobaldo de forma absolutamente original na literatura de língua portuguesa.',
    pontos:['Geração de 45: retoma rigor formal, sem abandonar conquistas modernistas','Guimarães Rosa ("Grande Sertão: Veredas"): experimentação radical de linguagem','João Cabral de Melo Neto: poesia racional e construtiva, sem sentimentalismo']},
  {trilha:'enem', materia:'Linguagens', assunto:'Poesia Concreta',
    resumo:'Poesia concreta (a partir de 1950) explora a disposição visual e gráfica das palavras na página como parte essencial do significado do poema, unindo forma visual, som e sentido numa experiência integrada.',
    aprofundamento:'Liderada pelo grupo Noigandres (irmãos Augusto e Haroldo de Campos, Décio Pignatari), a poesia concreta rompe com o verso tradicional organizado em linhas sequenciais, distribuindo palavras no espaço da página de forma a criar significados através da própria disposição visual (tamanho de fonte, posição, repetição espacial) — o poema é também uma imagem, não apenas um texto a ser lido linearmente. Essa vanguarda dialoga com as artes visuais e o design gráfico, sendo considerada uma das contribuições brasileiras mais originais e influentes internacionalmente na poesia do século XX.',
    exemplo:'O poema "Beba Coca-Cola", de Décio Pignatari, distribui e reorganiza graficamente as letras da palavra "Coca-Cola" para criar, através da própria forma visual, uma crítica ao consumismo — o significado depende da disposição espacial das palavras, não só do que elas dizem.',
    pontos:['Poesia concreta: disposição visual/gráfica das palavras é parte do significado','Grupo Noigandres: irmãos Campos e Décio Pignatari, a partir de 1950','Une forma visual, som e sentido numa experiência integrada (poema como imagem)']},
  {trilha:'enem', materia:'Linguagens', assunto:'Poesia Práxis e Poesia Social',
    resumo:'Poesia práxis (derivada da poesia concreta, com maior engajamento político) e poesia social (forte crítica às desigualdades e injustiças) são vertentes que usam a poesia como instrumento de transformação e denúncia social direta.',
    aprofundamento:'A poesia práxis, associada principalmente a Mário Chamie, retoma alguns experimentalismos formais da poesia concreta, mas com maior compromisso ideológico e crítico com a realidade social brasileira, evitando o "hermetismo" (fechamento excessivo em si mesmo) que às vezes era criticado na poesia concreta pura. A poesia social, de forma mais ampla, é uma tendência (não uma escola fechada) presente em diversos poetas ao longo do século XX que usam versos para denunciar diretamente desigualdades sociais, fome, opressão política — muitas vezes com linguagem mais direta e acessível do que os experimentalismos formais da poesia concreta.',
    exemplo:'Um poema que denuncia diretamente a fome e a desigualdade social brasileira, usando linguagem simples e direta para maximizar o impacto da crítica no leitor, exemplifica a poesia social.',
    pontos:['Poesia práxis: experimentalismo formal com maior engajamento ideológico','Poesia social: denúncia direta de desigualdades, linguagem mais acessível','Ambas usam a poesia como instrumento de crítica e transformação social']},
  {trilha:'enem', materia:'Linguagens', assunto:'Tropicália',
    resumo:'Tropicália (final dos anos 1960) é um movimento cultural (não só literário, mas também musical e artístico) que mistura, de forma irônica e antropofágica, elementos da cultura brasileira tradicional com influências estrangeiras modernas (rock, psicodelia).',
    aprofundamento:'A Tropicália retoma diretamente o princípio antropofágico de Oswald de Andrade (dos anos 1920), "devorando" e misturando referências nacionais (como o samba e o folclore) com influências internacionais contemporâneas (rock psicodélico, guitarra elétrica), num contexto de forte repressão política durante a ditadura militar. Caetano Veloso e Gilberto Gil são as figuras centrais, e a mistura tropicalista (que combina o "atrasado" com o "moderno", o nacional com o estrangeiro, sem hierarquia) é uma forma de crítica cultural e política através da estética, muitas vezes usando ironia e colagem de referências contrastantes.',
    exemplo:'A canção "Tropicália", de Caetano Veloso, combina imagens do Brasil arcaico e rural com referências à modernidade urbana e influências musicais estrangeiras, numa colagem irônica que reflete o próprio conceito do movimento.',
    pontos:['Tropicália: movimento cultural (música, artes, literatura) do final dos anos 1960','Retoma o princípio antropofágico de Oswald de Andrade (misturar nacional/estrangeiro)','Caetano Veloso e Gilberto Gil: figuras centrais, contexto de ditadura militar']},
  {trilha:'enem', materia:'Linguagens', assunto:'Poesia Marginal',
    resumo:'Poesia marginal (anos 1970) é caracterizada pela linguagem cotidiana, informal e despojada, produção e distribuição independente (fora dos grandes selos editoriais) e temas do dia a dia urbano, muitas vezes com humor e tom confessional.',
    aprofundamento:'Também chamada de "geração mimeógrafo" (pela forma artesanal de reprodução e distribuição dos livros, feita em mimeógrafos, fora do circuito editorial tradicional), a poesia marginal rejeita o hermetismo formal e a erudição da poesia concreta/práxis, buscando uma linguagem coloquial, direta, muitas vezes irônica ou confessional, sobre temas cotidianos (amor, cidade, drogas, comportamento) — refletindo também o contexto de repressão política e contracultura dos anos 1970. Ana Cristina Cesar e Chacal são nomes associados a essa geração.',
    exemplo:'Um poema marginal que fala sobre uma situação banal e íntima do cotidiano urbano, em linguagem coloquial e sem grandes recursos formais rebuscados, ilustra o tom despojado típico dessa geração.',
    pontos:['Poesia marginal: linguagem cotidiana, informal, produção independente (anos 1970)','"Geração mimeógrafo": distribuição artesanal, fora do circuito editorial tradicional','Rejeita hermetismo formal, prioriza tom confessional e temas do dia a dia']},
  {trilha:'enem', materia:'Linguagens', assunto:'Prosa Contemporânea',
    resumo:'A prosa contemporânea brasileira (a partir dos anos 1970/80 até hoje) é marcada pela diversidade de vozes e temas: literatura urbana e violenta (Rubem Fonseca), realismo brutal das periferias (Ferréz, literatura marginal), e crescente protagonismo de autoras mulheres e autores negros.',
    aprofundamento:'Rubem Fonseca é conhecido por uma prosa urbana violenta e direta, retratando o submundo do crime e da desigualdade nas grandes cidades brasileiras com linguagem crua. A literatura marginal periférica contemporânea, associada a autores como Ferréz ("Capão Pecado"), narra a realidade das periferias urbanas a partir de dentro, com linguagem que incorpora gírias e a fala real das comunidades retratadas, rompendo com a tradição de autores de classe média narrando a periferia "de fora". O ENEM também tem valorizado crescentemente autoras mulheres (como Conceição Evaristo, com o conceito de "escrevivência") e a diversidade de vozes historicamente marginalizadas na literatura canônica.',
    exemplo:'Conceição Evaristo cunhou o termo "escrevivência" para descrever uma escrita que nasce da vivência real de mulheres negras, unindo experiência pessoal e coletiva à criação literária, um conceito cada vez mais cobrado no ENEM.',
    pontos:['Prosa contemporânea: diversidade de vozes, temas urbanos e periféricos','Literatura marginal periférica (Ferréz): narra a periferia a partir de dentro','Crescente protagonismo de autoras mulheres e autores negros (ex: Conceição Evaristo)']},
  {trilha:'enem', materia:'Linguagens', assunto:'Literatura Hoje em Dia',
    resumo:'A literatura contemporânea convive com novos formatos e suportes (literatura digital, redes sociais, audiolivros) e uma pluralidade de vozes e temas que refletem debates atuais: identidade, representatividade, meio ambiente, tecnologia e novas formas de narrar.',
    aprofundamento:'O ENEM, por ser uma prova que reflete debates sociais contemporâneos em seus textos motivadores (inclusive na redação), valoriza a conexão entre literatura e questões atuais — não apenas obras publicadas em livro físico tradicional, mas também gêneros emergentes como a literatura de cordel digitalizada, poesia compartilhada em redes sociais, e narrativas que discutem diretamente temas de representatividade racial, de gênero e ambiental. Entender que a literatura é um organismo vivo, em constante transformação de suporte e de vozes, ajuda a interpretar textos contemporâneos apresentados na prova sem tentar encaixá-los rigidamente em escolas literárias do passado.',
    exemplo:'Um poema publicado originalmente numa rede social, tratando de temas como ansiedade ou identidade na era digital, pode aparecer no ENEM como texto motivador, exigindo que o candidato reconheça a literatura contemporânea sem tentar classificá-la numa escola literária tradicional.',
    pontos:['Literatura hoje convive com novos suportes: digital, redes sociais, audiolivros','Pluralidade de vozes e temas: representatividade, identidade, meio ambiente','Literatura contemporânea nem sempre se encaixa em escolas literárias tradicionais']},
  {trilha:'enem', materia:'Geografia', assunto:'Geografia - Urbanização',
    resumo:'A urbanização brasileira aconteceu de forma rápida e concentrada, principalmente a partir da segunda metade do século XX, gerando desafios como moradia irregular, mobilidade urbana e desigualdade territorial nas grandes cidades.',
    aprofundamento:'O Brasil urbanizou-se de forma tardia e muito acelerada (diferente da Europa, onde o processo foi mais lento e ligado à Revolução Industrial). Isso significa que a infraestrutura das cidades brasileiras não acompanhou o ritmo de crescimento populacional, gerando os problemas típicos cobrados no ENEM: favelização, déficit habitacional, mobilidade urbana precária e forte desigualdade entre bairros centrais bem estruturados e periferias carentes de serviços básicos. O conceito de "segregação socioespacial" é central: refere-se à separação, muitas vezes informal, entre grupos sociais dentro do espaço urbano, refletindo desigualdades de renda e acesso a serviços.',
    exemplo:'Uma questão típica apresenta um mapa de uma cidade brasileira mostrando bairros centrais com infraestrutura completa e periferias sem saneamento básico, pedindo para identificar o conceito de segregação socioespacial.',
    pontos:['Êxodo rural: migração do campo para a cidade','Macrocefalia urbana: concentração populacional em poucas grandes cidades','Segregação socioespacial: desigualdade no acesso à cidade']},
  {trilha:'enem', materia:'História', assunto:'Antiguidade Oriental e Clássica',
    resumo:'Cobre as primeiras civilizações organizadas (Mesopotâmia, Egito, Pérsia) e as bases da civilização ocidental na Grécia (democracia, filosofia) e Roma (direito, engenharia, expansão territorial).',
    aprofundamento:'A Mesopotâmia, entre os rios Tigre e Eufrates, desenvolveu algumas das primeiras cidades-estado, escrita cuneiforme e o Código de Hamurábi, um dos primeiros conjuntos de leis escritas da história. O Egito Antigo se organizou em torno do rio Nilo, com forte centralização política (faraós) e crenças religiosas ligadas à vida após a morte. Na Grécia, Atenas desenvolveu a democracia direta (participação restrita a homens livres) enquanto Esparta se organizava em torno de um regime militarista rígido. Roma evoluiu de monarquia para república e depois império, desenvolvendo um direito romano que influencia até hoje sistemas legais ocidentais.',
    exemplo:'A democracia ateniense, embora pioneira, era bastante limitada: apenas homens livres nascidos em Atenas podiam participar das assembleias — mulheres, estrangeiros e escravizados, que formavam a maioria da população, eram excluídos da vida política.',
    pontos:['Mesopotâmia: Código de Hamurábi, uma das primeiras leis escritas da história','Atenas: democracia direta, mas restrita a homens livres nascidos na cidade','Roma: direito romano e engenharia sustentaram um império continental']},
  {trilha:'enem', materia:'História', assunto:'Idade Média',
    resumo:'Período entre a queda do Império Romano do Ocidente e o Renascimento, marcado pelo feudalismo, pela forte influência da Igreja Católica, pelas Cruzadas e pela formação das monarquias nacionais europeias.',
    aprofundamento:'O feudalismo organizou a sociedade europeia em relações de vassalagem e servidão: senhores feudais concediam proteção e terras em troca de fidelidade e trabalho, numa economia predominantemente agrária. O Império Bizantino preservou conhecimentos clássicos até ser conquistado pelos turcos otomanos em 1453. As Cruzadas foram expedições militares organizadas pela Igreja para retomar territórios sagrados, tendo impactos econômicos e culturais duradouros ao reaproximar Europa e Oriente. A partir da Baixa Idade Média, o Renascimento Comercial e Urbano enfraqueceu o feudalismo, abrindo caminho para as monarquias nacionais centralizadas.',
    exemplo:'As Cruzadas, embora motivadas oficialmente por razões religiosas, tiveram como efeito colateral duradouro a reabertura de rotas comerciais entre Europa e Oriente, ajudando a impulsionar o comércio europeu.',
    pontos:['Feudalismo: relações de vassalagem e servidão, economia agrária descentralizada','Império Bizantino: preservou conhecimento clássico até cair para os otomanos em 1453','Cruzadas: motivação religiosa, mas com efeitos comerciais e culturais duradouros']},
  {trilha:'enem', materia:'História', assunto:'Renascimento, Reformas e Expansão Marítima',
    resumo:'Período de transição para a Idade Moderna, marcado pelo renascimento cultural, pelas reformas religiosas que fraturaram a unidade católica na Europa, e pela expansão marítima que conectou continentes.',
    aprofundamento:'O Renascimento cultural valorizou o humanismo e o racionalismo científico, floresceu inicialmente na Itália antes de se espalhar pela Europa. A Reforma Protestante, iniciada por Martinho Lutero, criticou práticas da Igreja Católica e resultou numa fragmentação religiosa da Europa, à qual a Igreja respondeu com a Contrarreforma. A expansão marítima portuguesa e espanhola conectou pela primeira vez a Europa às Américas, à África e à Ásia de forma sistemática, dando início ao processo de colonização e ao comércio triangular, incluindo o tráfico de pessoas escravizadas.',
    exemplo:'A crítica de Martinho Lutero à venda de indulgências foi o estopim da Reforma Protestante, fragmentando permanentemente a unidade religiosa que a Europa Ocidental tinha sob a Igreja Católica havia séculos.',
    pontos:['Renascimento: humanismo, racionalismo científico, retomada da estética clássica','Reforma Protestante (Lutero): fragmentou a unidade religiosa católica na Europa','Expansão marítima: conectou Europa, América, África e Ásia de forma sistemática']},
  {trilha:'enem', materia:'História', assunto:'Absolutismo, Iluminismo e Revoluções Modernas',
    resumo:'Cobre a consolidação do poder centralizado nas monarquias absolutistas, a crítica iluminista a esse poder, e as revoluções que romperam com o Antigo Regime: Revolução Industrial, Independência dos EUA e Revolução Francesa.',
    aprofundamento:'O absolutismo concentrava poder político nas mãos do rei, justificado pela ideia do direito divino dos reis — a França de Luís XIV é o exemplo clássico mais cobrado. O Iluminismo criticou esse poder concentrado defendendo razão, liberdade individual e divisão de poderes, servindo de base filosófica para as revoluções seguintes. A Revolução Industrial transformou radicalmente os modos de produção, gerando também graves problemas sociais que impulsionaram os movimentos operários. A Revolução Francesa (1789) derrubou o Antigo Regime sob o lema "Liberdade, Igualdade, Fraternidade", tornando-se referência simbólica mundial, embora tenha passado por fases de intensa violência política.',
    exemplo:'A frase atribuída a Luís XIV, "o Estado sou eu", resume o absolutismo francês: o rei concentrava em si mesmo todos os poderes do Estado, sem divisão institucional.',
    pontos:['Absolutismo: poder concentrado no rei, justificado pelo direito divino','Revolução Industrial: da manufatura à fábrica mecanizada, gerou movimentos operários','Revolução Francesa (1789): "Liberdade, Igualdade, Fraternidade", derrubou o Antigo Regime']},
  {trilha:'enem', materia:'História', assunto:'Imperialismo e Guerras Mundiais',
    resumo:'Cobre a partilha colonial da África e Ásia pelas potências europeias no século XIX, e os dois grandes conflitos mundiais do século XX, incluindo a Revolução Russa e a ascensão dos regimes totalitários.',
    aprofundamento:'O Imperialismo do final do século XIX foi motivado pela necessidade de matérias-primas e mercados consumidores, resultando na partilha quase completa da África e de partes da Ásia entre as potências. A Primeira Guerra Mundial foi desencadeada por tensões nacionalistas e um sistema de alianças militares complexo, resultando no colapso de impérios. A Revolução Russa (1917) derrubou o czarismo e instaurou o primeiro Estado socialista do mundo. A Segunda Guerra Mundial, causada em grande parte pelo revanchismo alemão após o Tratado de Versalhes e pela ascensão do nazi-fascismo, resultou no Holocausto e no uso de armas nucleares no Japão.',
    exemplo:'O Tratado de Versalhes, que impôs punições severas à Alemanha após a Primeira Guerra, é apontado por historiadores como um dos fatores que criaram o ressentimento nacionalista explorado por Hitler para ascender ao poder.',
    pontos:['Imperialismo: partilha colonial da África e Ásia motivada por matérias-primas e mercados','Primeira Guerra Mundial: alianças militares e nacionalismo levaram ao colapso de impérios','Segunda Guerra Mundial: nazi-fascismo, Holocausto, uso de armas nucleares']},
  {trilha:'enem', materia:'História', assunto:'Guerra Fria e Mundo Contemporâneo',
    resumo:'Cobre a disputa ideológica entre EUA e URSS após a Segunda Guerra Mundial, os processos de descolonização na Ásia e África, e conflitos contemporâneos no Oriente Médio, incluindo a Primavera Árabe.',
    aprofundamento:'A Guerra Fria dividiu o mundo em dois blocos ideológicos — capitalista (EUA) e socialista (URSS) — travada através de disputas indiretas, corrida armamentista nuclear e corrida espacial, sem confronto militar direto. A descolonização da Ásia e África resultou na independência de dezenas de novos países, mas frequentemente deixou fronteiras artificiais e instabilidade política como legado colonial. O colapso da União Soviética (1991) encerrou formalmente a Guerra Fria. Conflitos no Oriente Médio seguem sendo tema recorrente do ENEM por sua relevância geopolítica atual.',
    exemplo:'A Guerra do Vietnã é um exemplo clássico de "guerra por procuração" da Guerra Fria: EUA e URSS/China nunca entraram em confronto direto entre si, mas apoiaram lados opostos num conflito armado real.',
    pontos:['Guerra Fria: disputa ideológica EUA x URSS, sem confronto militar direto entre as duas','Descolonização: independência de dezenas de países, com fronteiras artificiais como legado colonial','Oriente Médio: tema geopolítico recorrente, ligado a direitos humanos e migração']},
  {trilha:'enem', materia:'História', assunto:'Brasil Colonial',
    resumo:'Cobre desde o período pré-colonial e a chegada portuguesa até o fim do período colonial, incluindo a economia açucareira, a escravidão, as invasões estrangeiras, a mineração e as revoltas coloniais.',
    aprofundamento:'A colonização portuguesa se organizou através das Capitanias Hereditárias e depois do Governo Geral, estruturando a economia em torno do açúcar, sustentada pelo trabalho escravizado de povos africanos — um dos temas de maior peso histórico e social no ENEM. Invasões holandesas (Bahia e Pernambuco) buscaram controlar a produção açucareira. A mineração de ouro em Minas Gerais no século XVIII deslocou o eixo econômico da colônia, gerando revoltas nativistas (Guerra dos Emboabas) e emancipacionistas (Inconfidência Mineira, inspirada nos ideais iluministas).',
    exemplo:'A Inconfidência Mineira (1789), embora tenha fracassado antes de se concretizar, reflete a influência direta do Iluminismo e da Independência dos EUA sobre as elites coloniais brasileiras.',
    pontos:['Economia açucareira: sustentada pelo trabalho escravizado de povos africanos','Invasões holandesas buscavam controlar a produção açucareira (Bahia e Pernambuco)','Mineração em Minas Gerais deslocou o eixo econômico e gerou revoltas nativistas e emancipacionistas']},
  {trilha:'enem', materia:'História', assunto:'Brasil Império',
    resumo:'Cobre a vinda da Família Real, o processo de independência do Brasil, e o período imperial (Regência e Segundo Reinado), até a crise que levou à Proclamação da República.',
    aprofundamento:'A vinda da Família Real portuguesa (1808) elevou o status da colônia e abriu os portos ao comércio internacional, criando condições que tornariam a independência praticamente inevitável. A independência (1822) foi um processo relativamente negociado entre elites, mantendo a monarquia. O Período Regencial foi marcado por instabilidade e revoltas regionais (Cabanagem, Balaiada, Farroupilha). O Segundo Reinado trouxe relativa estabilidade, mas a crise final do Império (abolição da escravidão em 1888) desgastou o apoio das elites à monarquia, culminando na Proclamação da República em 1889.',
    exemplo:'A Lei Áurea (1888), que aboliu a escravidão sem qualquer política de reparação para os libertos, é apontada como um dos fatores que aceleraram a queda da monarquia, ao desagradar os grandes proprietários de terra.',
    pontos:['Vinda da Família Real (1808): abriu os portos, tornou a independência praticamente inevitável','Independência (1822): processo negociado entre elites, manteve a monarquia','Crise do Império: abolição sem reparação (1888) desgastou apoio à monarquia, levou à República (1889)']},
  {trilha:'enem', materia:'História', assunto:'Brasil República',
    resumo:'Cobre da Proclamação da República até os dias atuais, incluindo a República Oligárquica, a Era Vargas, o período populista, a Ditadura Militar e a redemocratização.',
    aprofundamento:'A República Oligárquica (1889-1930) foi marcada pela política do "café com leite" e pelo voto não secreto, entrando em crise com a Revolução de 1930. A Era Vargas (1930-1945) trouxe forte centralização política e a criação da CLT, com uma fase ditatorial (Estado Novo). O período populista foi marcado por líderes carismáticos, terminando com o Golpe Civil-Militar de 1964, dando início a duas décadas de Ditadura Militar, marcada por repressão e censura. A redemocratização, consolidada com a Constituição de 1988, trouxe estabilidade institucional relativa.',
    exemplo:'A política do "café com leite" da República Oligárquica exemplifica como o poder era dominado por acordos entre elites regionais (São Paulo e Minas Gerais), num sistema eleitoral com pouca participação popular real.',
    pontos:['República Oligárquica: política do "café com leite", voto não secreto facilitava fraudes','Era Vargas: centralização política, CLT, fase ditatorial no Estado Novo','Ditadura Militar (1964-1985): repressão política e censura, seguida de redemocratização em 1988']},
  {trilha:'enem', materia:'História', assunto:'História da Arte',
    resumo:'Percorre a arte desde a pré-história até a produção contemporânea, incluindo pintura, escultura, arquitetura, e também música e dança como expressões artísticas cobradas no ENEM.',
    aprofundamento:'A interpretação de uma obra de arte no ENEM geralmente exige relacionar elementos visuais (cores, formas, composição) com o contexto histórico e social de sua produção — uma pintura barroca reflete o dramatismo típico da Contrarreforma católica, enquanto o Modernismo brasileiro (Semana de Arte Moderna de 1922) rompeu com padrões acadêmicos europeus em busca de identidade nacional. As vanguardas europeias (cubismo, futurismo, surrealismo) romperam radicalmente com a representação realista tradicional. Música também é cobrada como manifestação cultural, incluindo gêneros brasileiros (samba, bossa nova, MPB) e seu papel na crítica social, especialmente durante a Ditadura Militar.',
    exemplo:'A Semana de Arte Moderna de 1922, em São Paulo, é o marco inicial do Modernismo brasileiro nas artes plásticas e na literatura, reunindo artistas que buscavam romper com o academicismo europeu.',
    pontos:['Interpretar arte no ENEM: relacionar elementos visuais ao contexto histórico e social','Vanguardas europeias (cubismo, futurismo, surrealismo): rupturas radicais com a arte realista','Semana de Arte Moderna (1922): marco do Modernismo brasileiro, busca por identidade nacional']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Pré-Socráticos e Sofistas',
    resumo:'Marca o surgimento da filosofia na Grécia Antiga como tentativa de explicar o mundo através da razão, e não apenas de mitos. Os pré-socráticos buscavam o "princípio" (arché) de todas as coisas, enquanto os sofistas deslocaram o foco para o ser humano e a linguagem.',
    aprofundamento:'Os filósofos pré-socráticos (Tales, Heráclito, Parmênides, entre outros) foram os primeiros a propor explicações racionais e naturais para a origem do universo, rompendo com explicações puramente mitológicas — Tales via a água como princípio de tudo, Heráclito defendia que tudo está em constante mudança ("não se entra duas vezes no mesmo rio"), enquanto Parmênides defendia que o ser é imutável, um contraponto direto. Os sofistas foram os primeiros a colocar o ser humano no centro da reflexão filosófica (o famoso "o homem é a medida de todas as coisas", de Protágoras), ensinando retórica e argumentação, mas sendo criticados por Sócrates e Platão por relativizarem a verdade em função da persuasão.',
    exemplo:'A frase "não se pode entrar duas vezes no mesmo rio", atribuída a Heráclito, ilustra sua filosofia do "devir": o rio parece o mesmo, mas a água que flui nunca é a mesma, assim como tudo no universo está em constante mudança.',
    pontos:['Pré-socráticos: buscavam o "princípio" (arché) racional do universo, não mitológico','Heráclito: tudo está em constante mudança (devir); Parmênides: o ser é imutável','Sofistas: colocaram o ser humano e a linguagem no centro da reflexão, ensinavam retórica']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Sócrates, Platão e Aristóteles',
    resumo:'O trio mais influente da filosofia clássica grega: Sócrates com seu método de investigação através do diálogo, Platão com a teoria das Ideias, e Aristóteles com sua abordagem mais empírica e sistemática da realidade, política e ética.',
    aprofundamento:'Sócrates não deixou nada escrito, mas é conhecido pelo método socrático (maiêutica): através de perguntas sucessivas, ele levava o interlocutor a perceber contradições em suas próprias ideias — seu lema era "só sei que nada sei". Platão, discípulo de Sócrates, propôs a Teoria das Ideias: o mundo sensível (percebido pelos sentidos) seria apenas uma cópia imperfeita do mundo das Ideias (perfeito e imutável), ilustrado no famoso Mito da Caverna, onde prisioneiros confundem sombras com a realidade. Aristóteles, discípulo de Platão, discordou do mestre ao valorizar a experiência sensível como fonte legítima de conhecimento, desenvolvendo a lógica formal, a ética das virtudes (o meio-termo entre excessos) e a ideia de que o ser humano é um "animal político" que só se realiza plenamente em sociedade.',
    exemplo:'No Mito da Caverna de Platão, prisioneiros acorrentados desde a infância só veem sombras projetadas numa parede e as confundem com a realidade — uma metáfora para como as pessoas comuns confundem aparências com a verdade profunda.',
    pontos:['Sócrates: método socrático (maiêutica), "só sei que nada sei"','Platão: Teoria das Ideias, Mito da Caverna (mundo sensível x mundo das Ideias)','Aristóteles: valoriza a experiência sensível, ética das virtudes (meio-termo), "animal político"']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Filosofia Helenística',
    resumo:'Período pós-Aristóteles marcado por escolas filosóficas voltadas para a busca da felicidade individual e da tranquilidade de espírito (ataraxia), num contexto de instabilidade política após a morte de Alexandre, o Grande.',
    aprofundamento:'O Estoicismo defendia que a felicidade vem da aceitação racional do que não podemos controlar (o destino), cultivando o autocontrole e a virtude como únicos bens verdadeiros. O Epicurismo, frequentemente mal interpretado como puro hedonismo, defendia a busca por prazeres moderados e simples como caminho para a tranquilidade. O Ceticismo questionava a possibilidade de se alcançar certeza absoluta sobre qualquer coisa, defendendo a suspensão do julgamento (epoché) como caminho para a paz de espírito.',
    exemplo:'Um estoico moderno, ao perder o emprego, focaria em aceitar racionalmente o que não pode mudar e concentrar sua energia no que está sob seu controle, em vez de sofrer com o que já passou — aplicação prática do estoicismo.',
    pontos:['Estoicismo: aceitação racional do destino, virtude como único bem verdadeiro','Epicurismo: prazeres moderados e simples, não hedonismo desenfreado','Ceticismo: suspensão do julgamento (epoché) diante da incerteza']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Filosofia Medieval',
    resumo:'Período em que a filosofia se desenvolveu em estreita ligação com a teologia cristã, buscando conciliar fé e razão — com Santo Agostinho influenciado por Platão e São Tomás de Aquino influenciado por Aristóteles.',
    aprofundamento:'Santo Agostinho incorporou elementos platônicos ao cristianismo, defendendo que a verdadeira sabedoria vem da iluminação divina, e que o mal não é uma substância própria, mas ausência de bem (privatio boni). São Tomás de Aquino promoveu uma síntese entre a filosofia aristotélica e a teologia católica, defendendo que fé e razão não se opõem, mas se complementam — a razão pode chegar a algumas verdades sobre Deus através da observação do mundo (suas famosas "cinco vias"), enquanto outras exigem revelação divina.',
    exemplo:'As "cinco vias" de Tomás de Aquino usam argumentos racionais (como a necessidade de uma "causa primeira" para explicar o movimento no universo) para sustentar racionalmente a existência de Deus.',
    pontos:['Agostinho: influência platônica, iluminação divina, o mal como ausência de bem','Tomás de Aquino: síntese entre Aristóteles e teologia católica, fé e razão se complementam','As "cinco vias" de Tomás de Aquino: argumentos racionais para a existência de Deus']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Renascimento e Filosofia Política Moderna',
    resumo:'Período de transição entre a Idade Média e a Modernidade, marcado pela retomada do humanismo clássico e pelo surgimento de reflexões políticas mais realistas sobre o poder, com destaque para Maquiavel e Hobbes.',
    aprofundamento:'Maquiavel, em "O Príncipe", rompeu com a tradição de tratar política e moral como inseparáveis, defendendo uma análise pragmática do poder — o governante deveria fazer o que fosse necessário para manter a estabilidade do Estado. Montaigne, com seus "Ensaios", inaugurou um estilo de reflexão mais pessoal e cético sobre a condição humana. Francis Bacon defendeu o método indutivo e experimental como caminho para o conhecimento científico. Thomas Hobbes descreveu o estado de natureza como "a guerra de todos contra todos", justificando a necessidade de um Estado forte (o Leviatã) para garantir a paz social através de um contrato social.',
    exemplo:'Hobbes argumenta que, sem um poder soberano forte controlando a sociedade, os seres humanos viveriam em constante conflito por recursos e segurança — por isso abrem mão de parte de sua liberdade natural em troca de proteção.',
    pontos:['Maquiavel: análise pragmática do poder, separação entre política e moral tradicional','Bacon: método indutivo e experimental como base da ciência moderna','Hobbes: estado de natureza como "guerra de todos contra todos", Leviatã garante a paz social']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Racionalismo (Descartes e Espinosa)',
    resumo:'O racionalismo defende que a razão, e não a experiência sensível, é a principal fonte confiável de conhecimento verdadeiro — com René Descartes como fundador da filosofia moderna e Espinosa desenvolvendo uma visão radical de unidade entre Deus e a natureza.',
    aprofundamento:'Descartes, em busca de uma base absolutamente certa para o conhecimento, duvidou metodicamente de tudo que pudesse ser questionado, chegando à conclusão de que a única coisa da qual não se pode duvidar é do próprio ato de duvidar — daí sua célebre frase "penso, logo existo" (cogito ergo sum). Espinosa propôs uma visão panteísta, na qual Deus e a Natureza são a mesma substância infinita ("Deus sive Natura"), rejeitando a ideia de um Deus pessoal separado do mundo.',
    exemplo:'A dúvida metódica de Descartes é como questionar absolutamente tudo que você acredita, até restar apenas uma certeza inabalável: o próprio ato de duvidar prova que existe algo (você) que duvida.',
    pontos:['Descartes: dúvida metódica leva à certeza do "penso, logo existo" (cogito ergo sum)','Racionalismo: a razão é a fonte principal do conhecimento verdadeiro, não os sentidos','Espinosa: panteísmo — Deus e Natureza são a mesma substância infinita']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Empirismo (Locke e Hume)',
    resumo:'O empirismo se opõe ao racionalismo ao defender que todo conhecimento vem da experiência sensível — a mente humana nasceria como uma "tábula rasa" a ser preenchida pelas experiências vividas.',
    aprofundamento:'John Locke defendeu que não existem ideias inatas: tudo que sabemos vem da experiência e da reflexão sobre essa experiência — essa visão influenciou teorias políticas liberais, incluindo a defesa da propriedade privada e dos direitos naturais. David Hume levou o empirismo a um ceticismo radical, questionando o princípio de causalidade: nunca observamos diretamente uma "causa" produzindo um "efeito", apenas eventos que costumam ocorrer em sequência — o que chamamos de causalidade seria apenas um hábito mental de associação.',
    exemplo:'Segundo Hume, quando vemos uma bola de bilhar bater em outra e a segunda se mover, não "vemos" a causalidade em si — apenas observamos que isso sempre aconteceu no passado, e por hábito assumimos que vai continuar acontecendo.',
    pontos:['Empirismo: todo conhecimento vem da experiência sensível, mente como "tábula rasa"','Locke: base filosófica do liberalismo político, direitos naturais (vida, liberdade, propriedade)','Hume: ceticismo radical sobre causalidade — seria apenas hábito de associação, não certeza lógica']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Iluminismo e Contratualismo',
    resumo:'Movimento intelectual do século XVIII que valorizava a razão, a ciência e a crítica às tradições e autoridades estabelecidas, lançando as bases filosóficas para a Revolução Francesa e as democracias modernas.',
    aprofundamento:'Voltaire defendia a liberdade de expressão e criticava duramente o fanatismo religioso e o abuso de poder. Montesquieu propôs a divisão dos poderes (Executivo, Legislativo, Judiciário) como forma de evitar a concentração e o abuso de poder — princípio que ainda hoje estrutura constituições democráticas, incluindo a brasileira. Rousseau desenvolveu sua própria versão do contrato social: para ele, o ser humano nasce naturalmente bom e é a sociedade que o corrompe, e o contrato social ideal deveria expressar a "vontade geral" do povo, não apenas submissão a um soberano.',
    exemplo:'A divisão dos três poderes proposta por Montesquieu é a base da organização do Estado brasileiro hoje, criada justamente para evitar que uma só pessoa ou grupo concentre poder demais.',
    pontos:['Voltaire: liberdade de expressão, crítica ao fanatismo e abuso de poder','Montesquieu: divisão dos três poderes (Executivo, Legislativo, Judiciário)','Rousseau: ser humano nasce bom, sociedade corrompe; contrato social deve expressar a "vontade geral"']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Immanuel Kant',
    resumo:'Kant promoveu uma "revolução copernicana" na filosofia ao propor que é a mente humana que estrutura ativamente a forma como percebemos a realidade — além de desenvolver uma ética baseada no dever, não nas consequências.',
    aprofundamento:'Para Kant, a mente humana possui estruturas próprias (como espaço e tempo) que organizam ativamente as informações sensoriais antes mesmo de qualquer experiência. Na ética, Kant propôs o imperativo categórico: agir sempre segundo uma máxima que você gostaria que se tornasse uma lei universal — diferente de julgar uma ação apenas por suas consequências, o que importa é agir por dever, pela boa vontade em si mesma.',
    exemplo:'Mentir para conseguir uma vantagem pessoal falha no teste do imperativo categórico kantiano: se todo mundo mentisse sempre que fosse conveniente, a própria confiança necessária para a mentira funcionar deixaria de existir.',
    pontos:['"Revolução copernicana": a mente estrutura ativamente como percebemos a realidade','Imperativo categórico: aja segundo uma máxima que poderia virar lei universal','Ética kantiana: o que importa é agir por dever, não pelas consequências ou interesse próprio']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Idealismo Alemão e Marx',
    resumo:'Hegel desenvolveu uma filosofia da história baseada no movimento dialético do Espírito em direção à liberdade plena, e Karl Marx inverteu essa dialética para analisar as contradições materiais e econômicas da sociedade capitalista.',
    aprofundamento:'Para Hegel, a história humana avança através de contradições que se resolvem em sínteses cada vez mais elevadas (o método dialético: tese, antítese, síntese). Marx pegou esse método, mas o aplicou de forma materialista: seriam as condições materiais e econômicas que determinam a consciência e a organização social ("materialismo histórico dialético"). Marx analisou o capitalismo como baseado na exploração da mais-valia (o valor que o trabalhador produz além do que recebe como salário), prevendo que as contradições internas do sistema levariam a revoluções proletárias.',
    exemplo:'Segundo Marx, o lucro do capitalista vem da diferença entre o valor que o trabalhador produz e o salário que ele efetivamente recebe — essa diferença é a mais-valia apropriada pelo dono dos meios de produção.',
    pontos:['Hegel: dialética (tese-antítese-síntese), história como progresso racional da liberdade','Marx: materialismo histórico — condições econômicas determinam a consciência social, não o contrário','Mais-valia: diferença entre o valor produzido pelo trabalhador e o salário que ele recebe']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Utilitarismo e Positivismo',
    resumo:'O utilitarismo avalia a moralidade de uma ação por suas consequências, buscando maximizar a felicidade do maior número de pessoas, enquanto o positivismo de Auguste Comte defendia que apenas o conhecimento científico deveria guiar a sociedade.',
    aprofundamento:'O utilitarismo de John Stuart Mill defende que uma ação é moralmente correta na medida em que maximiza a felicidade do maior número possível de pessoas afetadas — diferente da ética kantiana, que julga a ação pela intenção. Auguste Comte propôs a Lei dos Três Estados: o pensamento humano evolui de explicações teológicas para metafísicas até chegar ao estágio positivo (científico) — sua filosofia influenciou até a frase "Ordem e Progresso" na bandeira brasileira. Schopenhauer, mais pessimista, via a existência humana como dominada por uma "vontade" cega e insaciável, defendendo a arte e a compaixão como formas de aliviar o sofrimento.',
    exemplo:'A frase "Ordem e Progresso", presente na bandeira do Brasil, é uma síntese direta do lema positivista de Auguste Comte, demonstrando a influência dessa filosofia na formação da República brasileira.',
    pontos:['Utilitarismo (Mill): moralidade avaliada pelas consequências, maximizar felicidade coletiva','Positivismo (Comte): conhecimento científico deve guiar a sociedade; Lei dos Três Estados','A frase "Ordem e Progresso" da bandeira brasileira tem origem direta no positivismo de Comte']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Nietzsche',
    resumo:'Nietzsche criticou radicalmente a moral tradicional ocidental, propondo conceitos como a "morte de Deus", a vontade de potência e o além-do-homem como caminhos para uma nova forma de existência, livre de valores impostos externamente.',
    aprofundamento:'A célebre frase "Deus está morto" constata que os valores absolutos tradicionais perderam sua força de sustentação na sociedade moderna, deixando um vazio de sentido a ser preenchido por novos valores criados pelo próprio ser humano. Nietzsche criticava a "moral de rebanho" e propunha a vontade de potência — o impulso vital de autoafirmação e superação constante. O "além-do-homem" (Übermensch) representa um ideal de indivíduo que cria seus próprios valores, afirmando plenamente a existência através do conceito de "eterno retorno".',
    exemplo:'Alguém que abandona valores impostos pela sociedade para viver de acordo com seus próprios valores autênticos e criados por si mesmo estaria, na visão nietzschiana, se aproximando do ideal do além-do-homem.',
    pontos:['"Deus está morto": os valores absolutos tradicionais perderam sua força na modernidade','Vontade de potência: impulso vital de autoafirmação e superação constante','Além-do-homem (Übermensch): ideal de indivíduo que cria seus próprios valores']},
  {trilha:'enem', materia:'Filosofia', assunto:'Filosofia - Fenomenologia e Existencialismo',
    resumo:'A fenomenologia de Husserl busca descrever a experiência consciente tal como ela se apresenta, sem pressupostos prévios, e o existencialismo explorou a liberdade radical e a angústia da existência humana, sem essência predefinida.',
