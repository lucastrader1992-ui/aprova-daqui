    pontos:['Capitalismo: comercial → industrial → financeiro → informacional (fases históricas)','DIT: países centrais concentram tecnologia/serviços; periféricos, matérias-primas e produtos de menor valor agregado','Esse padrão vem mudando com a industrialização de países antes periféricos, mas ainda molda desigualdades globais']},
  {trilha:'enem', materia:'Geografia', assunto:'Geografia - Geopolítica Mundial (Ordem Mundial)',
    resumo:'Estuda a organização geopolítica do mundo após a Segunda Guerra Mundial (Velha Ordem Mundial, bipolar), a criação da ONU, e a reconfiguração das relações internacionais após o fim da Guerra Fria (Nova Ordem Mundial, multipolar).',
    aprofundamento:'A Velha Ordem Mundial (Guerra Fria, 1945-1991) foi marcada pela bipolaridade entre EUA (capitalismo) e URSS (socialismo), com o resto do mundo se posicionando entre os dois blocos ou se declarando não-alinhado. A ONU (Organização das Nações Unidas), criada em 1945, busca promover paz, segurança e cooperação internacional, com o Conselho de Segurança (e seus 5 membros permanentes com poder de veto) sendo seu órgão mais influente em questões de segurança global. A Nova Ordem Mundial, após o colapso da União Soviética (1991), é caracterizada por uma configuração mais multipolar (com potências regionais como China, Índia e a União Europeia ganhando peso, ao lado dos EUA), além de novos desafios geopolíticos como terrorismo, mudanças climáticas e disputas comerciais. Organizações e grupos internacionais (OMC, G20, BRICS, entre outros) refletem essa nova configuração de cooperação e disputa entre países.',
    exemplo:'O grupo BRICS (Brasil, Rússia, Índia, China, África do Sul, com expansão recente para outros países) representa a tentativa de potências emergentes de ganhar mais influência na governança econômica global, tradicionalmente dominada por EUA e Europa — um exemplo direto da configuração multipolar da Nova Ordem Mundial.',
    pontos:['Velha Ordem Mundial: bipolaridade EUA x URSS durante a Guerra Fria (1945-1991)','ONU: busca paz e cooperação internacional; Conselho de Segurança tem 5 membros permanentes com poder de veto','Nova Ordem Mundial: multipolar, com potências emergentes (China, Índia) ganhando peso ao lado dos EUA']},
  {trilha:'enem', materia:'Geografia', assunto:'Geografia - Globalização e Blocos Econômicos',
    resumo:'Estuda o processo de globalização (integração econômica, cultural e tecnológica entre países), a formação de blocos econômicos regionais e o papel do Brasil no comércio internacional.',
    aprofundamento:'A globalização intensificou o fluxo de mercadorias, capitais, informações e pessoas entre países, impulsionada pelo avanço tecnológico (internet, transporte, telecomunicações) — trazendo tanto integração econômica quanto críticas por aprofundar desigualdades entre países e regiões. Blocos econômicos (como Mercosul, União Europeia, entre outros) são acordos regionais que buscam facilitar o comércio entre países-membros, reduzindo tarifas e barreiras alfandegárias, e fortalecendo o poder de negociação conjunto desses países no cenário internacional. O comércio externo brasileiro é historicamente marcado pela exportação de commodities (soja, minério de ferro, petróleo) e importação de produtos manufaturados de maior valor agregado — um padrão que reflete o histórico papel do país na Divisão Internacional do Trabalho, ainda que com uma indústria nacional relevante em setores específicos.',
    exemplo:'O Mercosul (Brasil, Argentina, Paraguai, Uruguai, entre outros associados) busca reduzir tarifas comerciais entre seus membros, facilitando o comércio regional — mas enfrenta desafios de integração por diferenças econômicas e políticas entre os países-membros.',
    pontos:['Globalização: integração econômica/cultural intensificada pelo avanço tecnológico e das telecomunicações','Blocos econômicos regionais (Mercosul, União Europeia) buscam facilitar comércio entre países-membros','Comércio externo brasileiro: historicamente exporta commodities e importa produtos manufaturados de maior valor agregado']},
  {trilha:'enem', materia:'Geografia', assunto:'Geografia - Regionalização do Brasil',
    resumo:'Estuda os diferentes critérios usados para dividir o território brasileiro em regiões, incluindo a divisão oficial do IBGE (Norte, Nordeste, Centro-Oeste, Sudeste, Sul) e outras propostas de regionalização baseadas em critérios econômicos.',
    aprofundamento:'A divisão regional oficial do IBGE, criada com base em critérios físicos e administrativos, é a mais usada e ensinada, mas não é a única forma de regionalizar o Brasil — existe também a divisão em "Brasil Arquipélago" (regiões dinâmicas conectadas por fluxos econômicos, não necessariamente contíguas geograficamente) e outras propostas que consideram critérios socioeconômicos, como o eixo dinâmico Centro-Sul (mais industrializado) versus regiões periféricas do ponto de vista econômico. Essas diferentes formas de regionalizar revelam que "região" não é um conceito fixo, mas depende do critério (físico, econômico, cultural) usado para agrupar o território.',
    exemplo:'Enquanto a divisão do IBGE separa o Brasil em 5 regiões contíguas, uma análise por critério econômico poderia agrupar polos industriais de diferentes regiões oficiais (como São Paulo e partes do Sul) num mesmo "eixo dinâmico", mesmo sem serem geograficamente vizinhos.',
    pontos:['Divisão do IBGE (5 regiões): critério físico e administrativo, a mais usada oficialmente','"Brasil Arquipélago": regionalização por fluxos econômicos, não necessariamente contígua geograficamente','"Região" não é um conceito fixo — depende do critério (físico, econômico, cultural) usado para definir o agrupamento']},
  {trilha:'enem', materia:'Geografia', assunto:'Geografia - América e Estados Unidos',
    resumo:'Estuda a divisão do continente americano e seus aspectos físicos gerais, com foco na posição geopolítica e econômica dos Estados Unidos como principal potência do continente.',
    aprofundamento:'O continente americano se divide tradicionalmente em América Anglo-Saxônica (EUA e Canadá, colonizados por ingleses/franceses, com economias mais desenvolvidas historicamente) e América Latina (colonizada por portugueses e espanhóis, incluindo o Brasil). Os Estados Unidos se consolidaram como a maior potência econômica e militar do continente (e uma das maiores do mundo) através de fatores como grande extensão territorial com recursos naturais diversos, forte industrialização histórica, investimento em tecnologia e um sistema financeiro globalmente influente (o dólar como principal moeda de reserva internacional). Geopoliticamente, os EUA mantêm influência significativa sobre a América Latina através de acordos comerciais, investimentos e, historicamente, intervenções políticas diretas ou indiretas em vários países da região.',
    exemplo:'O dólar americano, usado como principal moeda de reserva por bancos centrais ao redor do mundo, é um dos pilares da influência econômica global dos Estados Unidos, permitindo ao país financiar déficits de forma mais fácil que a maioria das outras nações.',
    pontos:['América Anglo-Saxônica (EUA, Canadá) x América Latina (colonização portuguesa/espanhola)','EUA: maior potência econômica/militar do continente, dólar como moeda de reserva global','Influência histórica dos EUA sobre a América Latina através de comércio, investimentos e política']},
  {trilha:'enem', materia:'Geografia', assunto:'Geografia - Europa e Rússia/CEI',
    resumo:'Estuda a geopolítica europeia (integração através da União Europeia, desafios econômicos e migratórios) e a geopolítica da Rússia e dos países da CEI (Comunidade dos Estados Independentes, formada após o colapso da União Soviética).',
    aprofundamento:'A União Europeia representa um dos processos de integração regional mais avançados do mundo, com moeda única (euro, adotada pela maioria dos membros) e livre circulação de pessoas e mercadorias entre países-membros — mas enfrenta desafios como desigualdades econômicas entre países-membros, crises migratórias e movimentos nacionalistas que questionam a integração (como demonstrado pelo Brexit, saída do Reino Unido da UE). A Rússia, herdeira da maior parte do território e do poder militar da antiga União Soviética, mantém forte influência geopolítica sobre os países da CEI (ex-repúblicas soviéticas), com tensões recorrentes envolvendo o controle de rotas energéticas (gás natural) e disputas territoriais na região, temas centrais em conflitos geopolíticos recentes na Europa Oriental.',
    exemplo:'A dependência de vários países europeus do gás natural russo tem sido um fator central de tensão geopolítica, já que interrupções no fornecimento (por conflitos ou decisões políticas) afetam diretamente a segurança energética desses países.',
    pontos:['União Europeia: integração regional avançada (moeda única, livre circulação), mas com desafios de coesão','Brexit: saída do Reino Unido da UE, reflexo de movimentos nacionalistas e questionamento à integração','Rússia mantém influência geopolítica sobre países da CEI, com tensões ligadas a rotas energéticas e disputas territoriais']},
  {trilha:'enem', materia:'Geografia', assunto:'Geografia - África',
    resumo:'Estuda o histórico colonial da África, sua demografia (uma das populações mais jovens do mundo) e a geopolítica atual do continente, marcada por conflitos étnicos, desafios econômicos e um crescente potencial de desenvolvimento.',
    aprofundamento:'A partilha colonial da África pelas potências europeias no final do século XIX (Conferência de Berlim, 1884-85) traçou fronteiras artificiais que ignoraram divisões étnicas e culturais pré-existentes, sendo uma das raízes históricas de muitos conflitos internos vividos pelo continente após as independências (majoritariamente ocorridas entre 1950-1970). Demograficamente, a África tem a população mais jovem do mundo (alta taxa de natalidade, pirâmide etária de base larga), o que representa tanto um potencial de "bônus demográfico" (força de trabalho jovem) quanto um desafio (necessidade de gerar empregos e infraestrutura suficientes). Geopoliticamente, o continente enfrenta desafios como conflitos étnicos e territoriais (muitos ligados às fronteiras coloniais artificiais), instabilidade política em alguns países, mas também apresenta regiões de crescimento econômico acelerado e riqueza em recursos minerais estratégicos, atraindo investimentos internacionais (incluindo da China, um parceiro econico crescente no continente).',
    exemplo:'Conflitos étnicos em vários países africanos, como o genocídio em Ruanda (1994), têm raízes históricas que remontam, em parte, às fronteiras artificiais traçadas pelas potências coloniais europeias, que agruparam à força etnias historicamente rivais dentro do mesmo país.',
    pontos:['Partilha colonial (Conferência de Berlim, 1884-85): fronteiras artificiais, raiz histórica de muitos conflitos atuais','África tem a população mais jovem do mundo — potencial de bônus demográfico, mas desafio de geração de empregos','Continente rico em recursos minerais estratégicos, atraindo crescentes investimentos internacionais (incluindo chineses)']},
  {trilha:'enem', materia:'Geografia', assunto:'Geografia - Ásia: Japão, Tigres Asiáticos, Índia e China',
    resumo:'Estuda o desenvolvimento econômico do Japão e dos "Tigres Asiáticos" (Coreia do Sul, Taiwan, Cingapura, Hong Kong), a ascensão da Índia como potência emergente, e os aspectos físicos, demográficos, políticos e econômicos da China.',
    aprofundamento:'O Japão se reconstruiu como potência industrial e tecnológica após a Segunda Guerra Mundial através de forte investimento em educação, tecnologia e uma cultura organizacional de produção eficiente (como o toyotismo), tornando-se um modelo seguido pelos "Tigres Asiáticos" — economias que industrializaram-se rapidamente a partir da segunda metade do século XX, investindo em exportação de produtos tecnológicos e manufaturados de alto valor agregado. A Índia combina uma das maiores populações do mundo (em processo de superar a China) com um setor de tecnologia da informação em rápido crescimento, mas ainda enfrenta desafios significativos de desigualdade social e infraestrutura. A China, por sua vez, passou de uma economia predominantemente agrícola para se tornar a segunda maior economia do mundo em poucas décadas, através de reformas econômicas que abriram o país ao investimento estrangeiro mantendo controle político centralizado do Partido Comunista — uma combinação de economia de mercado com forte intervenção estatal muitas vezes chamada de "socialismo de mercado".',
    exemplo:'A ascensão econômica da China nas últimas décadas, transformando-a de economia majoritariamente agrícola para potência manufatureira e tecnológica global, é frequentemente comparada ao processo mais antigo dos Tigres Asiáticos, mas em escala muito maior devido ao tamanho de sua população e território.',
    pontos:['Tigres Asiáticos: Coreia do Sul, Taiwan, Cingapura e Hong Kong — industrialização rápida seguindo o modelo japonês','Índia: uma das maiores populações do mundo, forte setor de tecnologia da informação, mas desigualdade social significativa','China: "socialismo de mercado" — economia de mercado com forte controle político centralizado do Partido Comunista']},
  {trilha:'enem', materia:'Geografia', assunto:'Geografia - Oriente Médio',
    resumo:'Estuda a demografia, economia e geopolítica do Oriente Médio, incluindo a dependência do petróleo, os conflitos ligados à "Guerra ao Terror", a Primavera Árabe e a questão Israel-Palestina.',
    aprofundamento:'O Oriente Médio concentra algumas das maiores reservas de petróleo do mundo, o que torna a região estrategicamente importante e, ao mesmo tempo, fonte de disputas geopolíticas internacionais pelo controle de recursos energéticos. A chamada "Guerra ao Terror", iniciada pelos EUA após os atentados de 11 de setembro de 2001, resultou em intervenções militares no Afeganistão e Iraque, com impactos duradouros na instabilidade política da região. A Primavera Árabe (a partir de 2010-2011) foi uma onda de protestos populares em vários países árabes contra regimes autoritários, com resultados muito diferentes entre os países (desde mudanças de governo até guerras civis prolongadas, como na Síria). A questão Israel-Palestina, um dos conflitos mais antigos e complexos da geopolítica contemporânea, envolve disputas territoriais e políticas sobre a região historicamente habitada por israelenses e palestinos, com tentativas internacionais recorrentes (e até agora malsucedidas de forma definitiva) de mediar uma solução duradoura.',
    exemplo:'A Primavera Árabe teve desfechos muito diferentes conforme o país: na Tunísia, levou a uma transição (ainda que instável) para maior abertura política; já na Síria, o levante popular se transformou numa guerra civil prolongada, com consequências humanitárias graves e um dos maiores fluxos de refugiados do século XXI.',
    pontos:['Oriente Médio: grandes reservas de petróleo, tornando a região estrategicamente disputada globalmente','Primavera Árabe (2010-2011): onda de protestos com resultados muito diferentes entre os países','Questão Israel-Palestina: um dos conflitos territoriais/políticos mais antigos e complexos da geopolítica atual']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Mesopotâmia e Egito Antigo',
    resumo:'Cobre as primeiras civilizações organizadas em torno de grandes rios (Tigre/Eufrates na Mesopotâmia, Nilo no Egito), berços da escrita, das primeiras leis e da centralização política no mundo antigo.',
    aprofundamento:'A Mesopotâmia foi habitada por diversos povos (sumérios, acádios, assírios, caldeus) que desenvolveram a escrita cuneiforme e o Código de Hamurábi, um dos primeiros conjuntos de leis escritas da história, baseado na lei de talião ("olho por olho"). O Egito Antigo se organizou em torno do rio Nilo, cujas cheias regulares permitiam agricultura intensiva, sustentando um Estado fortemente centralizado nos faraós (considerados divindades vivas) e uma religião voltada à vida após a morte, refletida nas pirâmides e no processo de mumificação. O período dinástico egípcio se divide tradicionalmente em Antigo, Médio e Novo Império, cada um com características políticas e artísticas distintas.',
    exemplo:'O Código de Hamurábi, gravado numa estela de pedra, estabelecia punições proporcionais ao crime cometido, mas ainda diferenciava penas conforme a classe social do agressor e da vítima.',
    pontos:['Código de Hamurábi: um dos primeiros conjuntos de leis escritas, baseado na lei de talião','Egito: Estado centralizado nos faraós, religião voltada à vida após a morte','Cheias regulares do Nilo sustentavam agricultura intensiva e centralização política']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Pérsia e Antiguidade Oriental',
    resumo:'A Pérsia construiu um dos maiores impérios da Antiguidade, unificando diversos povos do Oriente Médio sob uma administração relativamente tolerante com culturas e religiões locais, diferente de outros impérios antigos.',
    aprofundamento:'O Império Persa (fundado por Ciro, o Grande) se destacou pela extensão territorial e pela organização administrativa em satrapias (províncias governadas por sátrapas, com fiscalização central), além de uma rede de estradas que facilitava comunicação e comércio. Diferente de outros impérios antigos, os persas geralmente permitiam que os povos conquistados mantivessem suas religiões e costumes, desde que pagassem tributos e reconhecessem a autoridade do rei. Os conflitos entre persas e gregos (Guerras Médicas) marcaram um dos primeiros grandes confrontos registrados entre Oriente e Ocidente na Antiguidade.',
    exemplo:'A tolerância religiosa persa é ilustrada pela permissão dada por Ciro para que os judeus exilados na Babilônia retornassem à Judeia e reconstruíssem seu templo — comportamento incomum entre impérios conquistadores da época.',
    pontos:['Satrapias: divisão administrativa do Império Persa, com fiscalização central','Tolerância religiosa e cultural com povos conquistados, diferente de outros impérios antigos','Guerras Médicas: primeiro grande confronto registrado entre Pérsia (Oriente) e Grécia (Ocidente)']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Grécia Antiga',
    resumo:'Cobre a formação da civilização grega, os modelos opostos de Esparta (militarista) e Atenas (democrática), o período clássico, o período helenístico e o legado cultural grego para a civilização ocidental.',
    aprofundamento:'Esparta era um regime militarista e oligárquico, com educação voltada à formação de guerreiros desde a infância; Atenas desenvolveu a democracia direta, mas restrita a homens livres nascidos na cidade, excluindo mulheres, estrangeiros e escravizados. O período clássico (séc. V-IV a.C.) foi o auge cultural, filosófico e artístico grego, marcado pelas Guerras Médicas contra a Pérsia e pela Guerra do Peloponeso entre Atenas e Esparta. O período helenístico começou com as conquistas de Alexandre, o Grande, espalhando a cultura grega pelo Oriente e fundindo-a com tradições locais. O legado cultural grego (filosofia, teatro, arquitetura, Jogos Olímpicos, fundamentos da democracia) influencia a civilização ocidental até hoje.',
    exemplo:'A rivalidade entre Atenas (marítima, democrática) e Esparta (terrestre, militarista) culminou na Guerra do Peloponeso, que enfraqueceu ambas as cidades-estado e abriu caminho para a conquista posterior pela Macedônia de Alexandre.',
    pontos:['Esparta: militarista e oligárquica; Atenas: democracia direta, restrita a homens livres nascidos na cidade','Período helenístico: fusão da cultura grega com tradições do Oriente após Alexandre, o Grande','Legado grego: filosofia, teatro, arquitetura e fundamentos da democracia, influentes até hoje']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Roma Antiga',
    resumo:'Cobre as três formas de governo de Roma (monarquia, república, império), o conflito entre patrícios e plebeus, a expansão territorial, a crise da república, os triunviratos, o Alto e Baixo Império, e o legado cultural romano.',
    aprofundamento:'Roma passou por três formas de governo: monarquia (fundação até 509 a.C.), república (509-27 a.C.) e império (27 a.C. em diante). Na República, o conflito entre patrícios (elite) e plebeus (povo comum) levou à criação de instituições como o tribunato da plebe, ampliando gradualmente direitos políticos. A expansão territorial romana (Guerras Púnicas contra Cartago, conquistas no Mediterrâneo) trouxe riqueza mas também instabilidade política, culminando na Crise da República e nos Triunviratos (alianças de poder entre generais, como César, Pompeu e Crasso), que pavimentaram o fim da república e o início do império sob Otávio Augusto. O Alto Império foi um período de estabilidade e expansão (Pax Romana); o Baixo Império foi marcado por crises econômicas, invasões bárbaras e a eventual queda do Império Romano do Ocidente (476 d.C.). O legado romano inclui o direito romano, engenharia (estradas, aquedutos) e a língua latina, origem das línguas românicas, incluindo o português.',
    exemplo:'O direito romano, com conceitos como propriedade privada e contratos, influencia até hoje os sistemas jurídicos de países de tradição romano-germânica, incluindo o Brasil.',
    pontos:['Roma: monarquia → república → império, cada fase com estrutura política própria','Triunviratos: alianças de poder entre generais que levaram ao fim da república','Legado romano: direito, engenharia e língua latina (origem do português)']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Bizâncio, Islã e Povos Bárbaros',
    resumo:'Cobre o Império Bizantino (continuação do Império Romano do Oriente), a expansão do Império Islâmico, e os povos bárbaros germânicos (como os francos) que ocuparam o antigo território romano do Ocidente.',
    aprofundamento:'O Império Bizantino preservou e desenvolveu a cultura greco-romana e o cristianismo ortodoxo, sobrevivendo mil anos após a queda de Roma até ser conquistado pelos turcos otomanos em 1453. O Islã, surgido na Península Arábica no século VII com Maomé, se expandiu rapidamente através da conquista militar e da conversão, criando um vasto império que ia da Península Ibérica à Ásia Central, preservando e traduzindo conhecimentos clássicos gregos durante a Idade Média europeia. Os povos bárbaros germânicos, como os francos, visigodos e ostrogodos, ocuparam o antigo território do Império Romano do Ocidente após sua queda, formando reinos que dariam origem às futuras nações europeias — os francos, sob a dinastia carolíngia (com destaque para Carlos Magno), formaram um dos reinos bárbaros mais duradouros e influentes.',
    exemplo:'Carlos Magno, rei dos francos coroado "Imperador do Sacro Império Romano" pelo Papa em 800 d.C., é visto por muitos historiadores como uma tentativa simbólica de restaurar a unidade do antigo Império Romano no Ocidente.',
    pontos:['Bizâncio preservou a cultura greco-romana até cair para os otomanos em 1453','Expansão islâmica preservou e traduziu conhecimentos clássicos gregos durante a Idade Média europeia','Francos (dinastia carolíngia, Carlos Magno): um dos reinos bárbaros mais duradouros e influentes']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Feudalismo e Alta Idade Média',
    resumo:'Estuda a organização social e econômica feudal (baseada em relações de vassalagem e servidão) e as Cruzadas, elementos centrais da Alta Idade Média europeia.',
    aprofundamento:'O feudalismo organizou a Europa em relações de dependência: senhores feudais concediam terras (feudos) e proteção a vassalos em troca de fidelidade e serviços militares, numa economia agrária e predominantemente local, com pouca circulação de moeda. Os servos (camponeses) trabalhavam a terra em troca de proteção do senhor feudal, numa relação de forte dependência e pouca mobilidade social. As Cruzadas foram expedições militares organizadas pela Igreja Católica para retomar territórios sagrados do controle muçulmano, com impactos culturais e comerciais duradouros ao reaproximar Europa e Oriente, mesmo sem atingirem plenamente seus objetivos religiosos.',
    exemplo:'As Cruzadas, apesar de motivadas oficialmente por razões religiosas, tiveram como efeito colateral duradouro a reabertura de rotas comerciais entre Europa e Oriente, impulsionando um comércio que enfraqueceria depois o próprio sistema feudal.',
    pontos:['Feudalismo: relações de vassalagem (senhor-vassalo) e servidão (senhor-servo), economia agrária local','Servos tinham forte dependência do senhor feudal e pouca mobilidade social','Cruzadas: motivação religiosa, mas com efeitos comerciais e culturais duradouros']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Baixa Idade Média: Crise e Monarquias Nacionais',
    resumo:'Cobre a Baixa Idade Média (séc. XI-XV): a crise do século XIV (Peste Negra), a Guerra dos Cem Anos, e a formação das monarquias nacionais (França, Inglaterra, Portugal, Espanha) e do Sacro Império Romano-Germânico.',
    aprofundamento:'A crise do século XIV foi marcada pela Peste Negra (que dizimou boa parte da população europeia), fome e guerras, acelerando o enfraquecimento do sistema feudal. A Guerra dos Cem Anos (entre França e Inglaterra) contribuiu para o fortalecimento do sentimento nacional e da centralização política em ambos os países. A formação das monarquias nacionais (centralização de poder nas mãos de um rei, unificando território sob uma autoridade única) ocorreu de forma diferente em cada país: na França e Inglaterra, através de conflitos e consolidação da nobreza sob a coroa; em Portugal e Espanha, ligada também à expulsão de mouros (Reconquista) e ao início da expansão marítima. O Sacro Império Romano-Germânico, diferente das monarquias nacionais centralizadas, permaneceu fragmentado em diversos principados até o século XIX.',
    exemplo:'A Guerra dos Cem Anos, apesar do nome, durou intermitentemente mais de cem anos (1337-1453) e teve a figura de Joana d\'Arc como símbolo do fortalecimento do sentimento nacional francês contra a ocupação inglesa.',
    pontos:['Peste Negra: dizimou boa parte da população europeia, acelerando o enfraquecimento do feudalismo','Formação das monarquias nacionais: centralização de poder nas mãos de um único rei','Sacro Império Romano-Germânico permaneceu fragmentado, diferente das monarquias centralizadas']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Renascimento Cultural',
    resumo:'Movimento cultural (séc. XIV-XVI) que retomou o humanismo e o naturalismo da arte clássica greco-romana, valorizando a razão, a ciência e a figura humana, floresceu primeiro na Itália antes de se espalhar pela Europa.',
    aprofundamento:'O Renascimento surgiu na Itália (Florença, principalmente) por causa da riqueza gerada pelo comércio e do mecenato de famílias como os Médici, que financiavam artistas e pensadores. As fases costumam ser divididas entre o Renascimento italiano (Trecento, Quattrocento, Cinquecento) e sua posterior difusão pelo norte da Europa (Renascimento Nórdico), com características próprias. Artistas como Leonardo da Vinci, Michelangelo e Rafael retomaram técnicas de perspectiva e proporção da arte clássica, ao mesmo tempo em que avanços científicos (Copérnico, Galileu) começavam a questionar a visão de mundo medieval centrada na Igreja.',
    exemplo:'A pintura da Capela Sistina por Michelangelo ilustra o domínio técnico da anatomia humana e da perspectiva que caracterizou o auge do Renascimento italiano no início do século XVI.',
    pontos:['Renascimento: retomada do humanismo e naturalismo da arte clássica greco-romana','Floresceu primeiro na Itália (mecenato de famílias como os Médici) antes de se espalhar pela Europa','Coincidiu com avanços científicos (Copérnico, Galileu) que questionavam a visão de mundo medieval']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Reformas Religiosas',
    resumo:'Estuda a Reforma Protestante (Luteranismo, Calvinismo, Anglicanismo) e a Contrarreforma católica, que fragmentaram permanentemente a unidade religiosa que a Europa Ocidental tinha sob a Igreja Católica.',
    aprofundamento:'Martinho Lutero criticou a venda de indulgências e defendeu a salvação pela fé (não por obras ou pagamentos), estopim da Reforma Protestante. João Calvino desenvolveu a doutrina da predestinação, cuja ética de trabalho e poupança influenciou (segundo o sociólogo Max Weber) o desenvolvimento do capitalismo em regiões protestantes. O Anglicanismo surgiu por razões políticas, quando Henrique VIII rompeu com Roma para conseguir anular seu casamento, criando a Igreja da Inglaterra. A Contrarreforma foi a resposta católica a esse cisma, através do Concílio de Trento, da Inquisição e da criação de novas ordens religiosas como os Jesuítas.',
    exemplo:'A crítica de Lutero à venda de indulgências (pagamentos que prometiam perdão de pecados) foi o estopim que fragmentou permanentemente a unidade religiosa que a Europa Ocidental tinha sob a Igreja Católica havia séculos.',
    pontos:['Lutero: salvação pela fé, crítica às indulgências; Calvino: predestinação, ligada à ética do capitalismo (Weber)','Anglicanismo: surgiu por razões políticas (Henrique VIII rompe com Roma)','Contrarreforma: resposta católica através do Concílio de Trento, Inquisição e ordens como os Jesuítas']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Expansão Marítima e Mercantilismo',
    resumo:'Estuda a expansão marítima portuguesa e espanhola, a chegada à América, e o mercantilismo, a política econômica dominante da Idade Moderna baseada no acúmulo de metais preciosos e no monopólio comercial com as colônias.',
    aprofundamento:'Portugal foi pioneiro na navegação atlântica (com investimento do Infante D. Henrique), buscando uma rota alternativa às Índias contornando a África; a Espanha financiou a expedição de Colombo, que em 1492 chegou à América, gerando disputa territorial entre as duas coroas ibéricas, resolvida pelo Tratado de Tordesilhas (1494). O mercantilismo era a política econômica das monarquias europeias da época: acumular metais preciosos (ouro e prata), manter balança comercial favorável (exportar mais do que importar) e explorar colônias através de monopólio comercial (o chamado Pacto Colonial), fornecendo matérias-primas e comprando exclusivamente produtos da metrópole.',
    exemplo:'O Tratado de Tordesilhas (1494), mediado pelo Papa, dividiu as terras "descobertas e por descobrir" fora da Europa entre Portugal e Espanha através de uma linha imaginária — base jurídica (embora pouco respeitada na prática) da colonização ibérica das Américas.',
    pontos:['Tratado de Tordesilhas (1494): dividiu terras coloniais entre Portugal e Espanha','Mercantilismo: acúmulo de metais preciosos, balança comercial favorável, monopólio com colônias','Pacto Colonial: colônias forneciam matérias-primas e compravam exclusivamente produtos da metrópole']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Absolutismo e Revoluções Inglesas',
    resumo:'Estuda o absolutismo (poder concentrado no rei, justificado pelo direito divino) na França e Inglaterra, e as Revoluções Inglesas (Puritana e Gloriosa), que limitaram o poder monárquico e lançaram as bases do liberalismo político moderno.',
    aprofundamento:'O absolutismo era justificado teoricamente pelo direito divino dos reis ou por pensadores como Hobbes (que via o Estado forte, o "Leviatã", como necessário para evitar o caos); a França de Luís XIV ("o Estado sou eu") é o exemplo clássico mais cobrado. Na Inglaterra, após a Guerra das Duas Rosas (que levou a dinastia Tudor ao poder), os Stuart tentaram impor um absolutismo que gerou forte conflito com o Parlamento, culminando na Revolução Puritana (guerra civil que terminou com a execução do rei Carlos I) e, décadas depois, na Revolução Gloriosa (1688), que depôs Jaime II sem grande derramamento de sangue e estabeleceu a monarquia parlamentar constitucional através da Declaração de Direitos (Bill of Rights) — um marco fundamental na limitação do poder monárquico pelo parlamento.',
    exemplo:'A Revolução Gloriosa, ao depor Jaime II e estabelecer a Declaração de Direitos (Bill of Rights), é considerada um marco na transição do absolutismo para a monarquia parlamentar constitucional, influenciando ideais políticos liberais posteriores.',
    pontos:['Absolutismo justificado pelo direito divino dos reis (ex: Luís XIV, "o Estado sou eu")','Revolução Puritana: guerra civil inglesa que terminou com a execução do rei Carlos I','Revolução Gloriosa (1688): estabeleceu a monarquia parlamentar constitucional na Inglaterra']},
  {trilha:'enem', materia:'História', assunto:'História Geral - América Colonial (Espanhola, Inglesa e Francesa)',
    resumo:'Estuda os povos pré-colombianos (astecas, maias, incas), a conquista e administração colonial espanhola, e os diferentes padrões de colonização inglesa e francesa na América do Norte.',
    aprofundamento:'Os povos pré-colombianos tinham civilizações complexas antes da chegada europeia, com organização política, arquitetura monumental e conhecimentos astronômicos avançados; a conquista espanhola foi rápida e violenta (Cortés destruiu o império asteca, Pizarro o inca), explorando mão de obra indígena através do sistema de encomiendas, e a administração colonial espanhola foi centralizada através de vice-reinados. A colonização inglesa na América do Norte teve caráter de povoamento (colônias com maior autonomia local e assembleias representativas), diferente do padrão de exploração predominante nas colônias ibéricas; a colonização francesa se concentrou em rotas comerciais (comércio de peles) no Canadá e na região dos Grandes Lagos, com povoamento mais esparso.',
    exemplo:'O sistema de encomiendas, que atribuía grupos de indígenas a colonizadores espanhóis para trabalho forçado em troca de "catequização", ilustra como a exploração da mão de obra nativa foi central para a economia colonial espanhola.',
    pontos:['Conquista espanhola: rápida e violenta (Cortés x astecas, Pizarro x incas), exploração via encomiendas','Colonização inglesa: caráter de povoamento, maior autonomia local e assembleias representativas','Colonização francesa: concentrada no comércio de peles, povoamento mais esparso']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Iluminismo e Liberalismo Econômico',
    resumo:'Estuda o Iluminismo (valorização da razão, crítica ao absolutismo e à Igreja) e o liberalismo econômico de Adam Smith, base teórica do capitalismo moderno.',
    aprofundamento:'Filósofos iluministas (Voltaire, Montesquieu, Rousseau) defenderam liberdade individual, divisão de poderes e soberania popular, lançando as bases filosóficas para as revoluções liberais que viriam a seguir (Independência dos EUA, Revolução Francesa). O liberalismo econômico de Adam Smith (em "A Riqueza das Nações") defendia que o mercado deveria se autorregular através da "mão invisível" da oferta e demanda, com mínima intervenção estatal — a base teórica do capitalismo industrial que se consolidaria com a Revolução Industrial nos séculos seguintes.',
    exemplo:'A defesa de Montesquieu pela divisão dos três poderes (Executivo, Legislativo, Judiciário) como forma de evitar a concentração e o abuso de poder ainda hoje estrutura constituições democráticas, incluindo a brasileira.',
    pontos:['Iluminismo: razão, liberdade individual e divisão de poderes, base filosófica das revoluções liberais','Liberalismo econômico (Adam Smith): mercado deve se autorregular ("mão invisível"), mínima intervenção estatal','Base teórica do capitalismo industrial que se consolidaria com a Revolução Industrial']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Revolução Industrial e Movimentos Operários',
    resumo:'Estuda a Revolução Industrial (transformação da manufatura em produção fabril mecanizada) e o surgimento de movimentos operários em resposta às péssimas condições de trabalho da época.',
    aprofundamento:'A Revolução Industrial (Inglaterra, séc. XVIII) foi impulsionada por invenções como a máquina a vapor, transformando radicalmente a produção artesanal em produção fabril, com jornadas de trabalho extenuantes, trabalho infantil e condições precárias de segurança e higiene. Essas condições geraram movimentos operários organizados (sindicalismo, socialismo utópico e científico, e o ludismo — destruição de máquinas vistas como responsáveis pelo desemprego) que reivindicavam melhores salários, redução da jornada de trabalho e condições mais seguras.',
    exemplo:'O movimento ludista, em que trabalhadores destruíam máquinas têxteis por considerá-las responsáveis pelo desemprego, ilustra a reação inicial e ainda pouco organizada da classe trabalhadora frente às transformações radicais trazidas pela industrialização.',
    pontos:['Revolução Industrial: máquina a vapor transforma produção artesanal em fabril mecanizada','Condições de trabalho precárias (jornadas extenuantes, trabalho infantil) geraram movimentos operários','Ludismo: destruição de máquinas por trabalhadores, reação inicial à industrialização']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Independência dos Estados Unidos',
    resumo:'Estuda o processo de independência das 13 colônias inglesas da América do Norte (1776), influenciado pelos ideais iluministas e motivado pela tributação sem representação política.',
    aprofundamento:'A independência dos EUA foi motivada pela cobrança de impostos sobre as colônias sem que estas tivessem representação no parlamento britânico (resumido no slogan "no taxation without representation"), resultando na Declaração de Independência (1776), documento inspirado em ideais iluministas de liberdade e direitos naturais. O processo culminou na criação de uma república federativa (com Constituição própria, 1787), servindo de inspiração posterior para outros movimentos de independência nas Américas, incluindo a Inconfidência Mineira no Brasil.',
    exemplo:'A Declaração de Independência dos EUA (1776), ao afirmar que todos os homens "são dotados pelo Criador de certos direitos inalienáveis", reflete diretamente a influência dos ideais iluministas de direitos naturais sobre os líderes revolucionários americanos.',
    pontos:['"No taxation without representation": motivação central da independência americana','Declaração de Independência (1776): inspirada em ideais iluministas de liberdade e direitos naturais','Inspirou outros movimentos de independência nas Américas, incluindo a Inconfidência Mineira']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Revolução Francesa e Revolução Haitiana',
    resumo:'Estuda a Revolução Francesa (1789), que derrubou o Antigo Regime sob o lema "Liberdade, Igualdade, Fraternidade", e a Revolução Haitiana, única revolta de escravizados da história que resultou na independência de um país.',
    aprofundamento:'A Revolução Francesa passou por fases distintas: a Assembleia Nacional Constituinte (fase moderada inicial), a Convenção (com o radical Terror jacobino, liderado por Robespierre) e o Diretório (fase de instabilidade que antecedeu a ascensão de Napoleão) — derrubando a monarquia absolutista e influenciando movimentos revolucionários por toda a Europa e Américas. A Revolução Haitiana (1791-1804), liderada por Toussaint Louverture, foi a única revolução de escravizados da história a resultar na criação de um Estado independente, tornando o Haiti a primeira república negra do mundo — um evento historicamente subestimado mas de enorme importância simbólica e política.',
    exemplo:'A Revolução Haitiana, ao libertar escravizados e derrotar tropas francesas, espanholas e britânicas, gerou tanto inspiração para outros movimentos abolicionistas quanto forte reação de isolamento diplomático e econômico contra o Haiti pelas potências escravistas da época.',
    pontos:['Revolução Francesa: Assembleia Constituinte → Convenção (Terror jacobino) → Diretório','Revolução Haitiana: única revolta de escravizados que resultou em Estado independente','Haiti: primeira república negra do mundo, evento historicamente subestimado']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Século XIX: Revoluções Liberais e Unificações',
    resumo:'Estuda as revoluções liberais do século XIX (ondas de protestos contra regimes conservadores restaurados) e as unificações da Itália e da Alemanha, que formaram esses dois países como Estados-nação centralizados e industrialmente poderosos.',
    aprofundamento:'As revoluções liberais (1820, 1830, 1848) foram ondas de protestos e revoltas contra regimes absolutistas ou conservadores restaurados após a queda de Napoleão (Congresso de Viena), buscando constituições e maior participação política em diversos países europeus. A unificação italiana (liderada por figuras como Cavour e Garibaldi) e a unificação alemã (liderada por Otto von Bismarck, através de guerras estratégicas como a Guerra Franco-Prussiana) transformaram territórios antes fragmentados em Estados-nação centralizados e industrialmente poderosos, mudando profundamente o equilíbrio de poder na Europa do final do século XIX.',
    exemplo:'A unificação alemã sob Bismarck, consolidada após a vitória na Guerra Franco-Prussiana (1870-71), transformou um conjunto fragmentado de estados germânicos numa potência industrial e militar que rivalizaria diretamente com França e Inglaterra nas décadas seguintes.',
    pontos:['Revoluções liberais (1820, 1830, 1848): reação contra regimes conservadores restaurados no Congresso de Viena','Unificação italiana: Cavour e Garibaldi; Unificação alemã: Bismarck e guerras estratégicas','Ambas transformaram territórios fragmentados em Estados-nação centralizados e poderosos']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Segunda Revolução Industrial e Imperialismo',
    resumo:'A Segunda Revolução Industrial (eletricidade, aço, petróleo) impulsionou o Imperialismo, a partilha colonial da África e Ásia pelas potências europeias, e a ascensão do Japão como potência industrial e militar.',
    aprofundamento:'A Segunda Revolução Industrial trouxe novas tecnologias (eletricidade, motor a combustão, indústria química) e formas de organização da produção, intensificando a necessidade de matérias-primas e mercados consumidores — motivação central do Imperialismo, que resultou na partilha quase completa da África (formalizada na Conferência de Berlim, 1884-85) e de partes da Ásia entre as potências europeias. O Japão, através da Restauração Meiji (modernização acelerada copiando tecnologia e instituições ocidentais), tornou-se a única potência não-europeia a competir em pé de igualdade imperialista, inclusive derrotando a Rússia numa guerra em 1905 — um evento que chocou o mundo por uma potência asiática vencer uma europeia.',
    exemplo:'A vitória japonesa sobre a Rússia na Guerra Russo-Japonesa (1904-05) foi a primeira vez que uma potência asiática derrotava uma potência europeia num conflito militar moderno, simbolizando o sucesso da rápida modernização japonesa via Restauração Meiji.',
    pontos:['Conferência de Berlim (1884-85): formalizou a partilha colonial da África entre potências europeias','Restauração Meiji: modernização acelerada do Japão, copiando tecnologia e instituições ocidentais','Japão derrotou a Rússia em 1905 — primeira vitória de potência asiática sobre europeia em guerra moderna']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Primeira Guerra Mundial',
    resumo:'Estuda os antecedentes (tensões nacionalistas, sistema de alianças), o desenrolar do conflito (guerra de trincheiras) e os tratados de paz que reorganizaram o mapa europeu após 1918.',
    aprofundamento:'A Primeira Guerra Mundial foi desencadeada por tensões nacionalistas acumuladas, um sistema de alianças militares complexo (Tríplice Aliança x Tríplice Entente) e o estopim do assassinato do arquiduque Francisco Ferdinando da Áustria-Hungria (1914). O conflito foi marcado pela guerra de trincheiras (combates prolongados e de baixo avanço territorial, com altíssimo custo de vidas) e pelo uso de novas armas (gases tóxicos, metralhadoras, tanques). O Tratado de Versalhes impôs punições severas e humilhantes à Alemanha derrotada, gerando um ressentimento nacionalista que seria explorado décadas depois pelo nazismo.',
    exemplo:'O Tratado de Versalhes, que impôs reparações de guerra pesadas e restrições militares à Alemanha, é apontado por historiadores como um dos fatores que criaram o ressentimento nacionalista explorado por Hitler para ascender ao poder na década seguinte.',
    pontos:['Sistema de alianças militares e nacionalismo levaram ao colapso de impérios na Primeira Guerra','Guerra de trincheiras: combates prolongados, alto custo de vidas, pouco avanço territorial','Tratado de Versalhes: punições severas à Alemanha, gerando ressentimento explorado depois pelo nazismo']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Revolução Russa',
    resumo:'Estuda a Revolução de Fevereiro de 1917 (que derrubou o czarismo) e a Revolução de Outubro (quando os bolcheviques tomaram o poder, liderados por Lênin), instaurando o primeiro Estado socialista do mundo.',
    aprofundamento:'O descontentamento popular com os altos custos humanos da Primeira Guerra Mundial, somado à desigualdade social crônica sob o czarismo, levou à queda do czar Nicolau II em fevereiro de 1917. O governo provisório que assumiu em seguida, instável e ainda comprometido com a guerra, foi derrubado pelos bolcheviques (partido comunista liderado por Lênin) em outubro do mesmo ano, estabelecendo um governo socialista que, após uma guerra civil, formaria a União Soviética (URSS) — o primeiro Estado socialista do mundo, com profundo impacto na geopolítica do século XX.',
    exemplo:'A promessa bolchevique de "Paz, Terra e Pão" resumia as principais demandas populares que sustentaram a tomada de poder de Lênin em outubro de 1917: sair da guerra, redistribuir terras e resolver a escassez de alimentos.',
    pontos:['Revolução de Fevereiro (1917): derrubou o czarismo por descontentamento com a guerra e desigualdade social','Revolução de Outubro (1917): bolcheviques (Lênin) tomam o poder do governo provisório instável','Resultado: formação da URSS, primeiro Estado socialista do mundo']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Entreguerras: Crise de 1929 e Totalitarismos',
    resumo:'A quebra da bolsa de Nova York (1929) gerou crise econômica mundial, criando terreno fértil para regimes totalitários: fascismo italiano, nazismo alemão e totalitarismos ibéricos (Franco na Espanha, Salazar em Portugal).',
    aprofundamento:'A Crise de 1929 gerou desemprego em massa e instabilidade política ao redor do mundo, um cenário explorado por líderes autoritários que prometiam ordem e recuperação econômica rápida. O fascismo de Mussolini enfatizava nacionalismo extremo, culto ao Estado forte e supressão de oposições políticas; o nazismo de Hitler combinou nacionalismo extremo com antissemitismo radical e busca por "espaço vital", culminando no Holocausto (genocídio sistemático de judeus e outras minorias). Francisco Franco (Espanha, após a Guerra Civil Espanhola) e António de Oliveira Salazar (Portugal) estabeleceram regimes autoritários de direita duradouros, com forte apoio da Igreja Católica e repressão política sistemática.',
    exemplo:'A Crise de 1929, ao gerar desemprego em massa na Alemanha (já fragilizada pelas punições do Tratado de Versalhes), criou o cenário de desespero econômico que Hitler soube explorar politicamente para chegar ao poder em 1933.',
    pontos:['Crise de 1929: desemprego em massa e instabilidade, terreno fértil para autoritarismo','Fascismo (Mussolini): nacionalismo extremo; Nazismo (Hitler): nacionalismo + antissemitismo radical, Holocausto','Totalitarismos ibéricos (Franco, Salazar): regimes autoritários duradouros, apoio da Igreja Católica']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Segunda Guerra Mundial',
    resumo:'Estuda as causas (revanchismo alemão, expansão do Eixo), o desenrolar do conflito nas frentes europeia e do Pacífico, a derrota do Eixo, e as conferências que reorganizaram o mundo pós-guerra.',
    aprofundamento:'A Segunda Guerra Mundial foi causada em grande parte pelo revanchismo alemão após as punições do Tratado de Versalhes e pela expansão territorial agressiva do Eixo (Alemanha, Itália, Japão). O conflito se dividiu em frentes europeia e do Pacífico, com o Holocausto e o uso de bombas atômicas em Hiroshima e Nagasaki como marcos definidores de sua brutalidade. As conferências entre os Aliados (Yalta, Potsdam) definiram a reorganização geopolítica do mundo pós-guerra, incluindo a divisão de zonas de influência que sementeou a divisão bipolar que geraria a Guerra Fria.',
    exemplo:'As conferências de Yalta e Potsdam, reunindo os líderes dos Aliados vencedores, definiram a divisão da Alemanha em zonas de ocupação e influenciaram diretamente a formação dos dois blocos que disputariam a Guerra Fria nas décadas seguintes.',
    pontos:['Causas: revanchismo alemão pós-Versalhes e expansão territorial agressiva do Eixo','Marcos definidores: Holocausto e uso de bombas atômicas em Hiroshima e Nagasaki','Conferências de Yalta e Potsdam: reorganização geopolítica que sementeou a divisão da Guerra Fria']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Guerra Fria: Conflitos Armados',
    resumo:'A disputa ideológica entre EUA e URSS se expressou através de conflitos indiretos ("guerras por procuração") em terceiros países: Guerra da Coreia, Guerra do Vietnã, Revolução Cubana, Crise de Berlim e Guerra do Afeganistão.',
    aprofundamento:'A Guerra Fria nunca envolveu confronto militar direto entre EUA e URSS, mas sim disputas indiretas em terceiros países: a Guerra da Coreia dividiu a península entre um norte comunista e um sul capitalista (divisão que persiste até hoje); a Guerra do Vietnã (EUA apoiando o sul contra o norte comunista) terminou com vitória comunista, sendo um trauma político e militar duradouro para os EUA; a Revolução Cubana (liderada por Fidel Castro) aproximou o país da URSS, gerando a tensa Crise dos Mísseis; Berlim foi dividida por um muro entre 1961-1989, símbolo mais concreto da divisão bipolar do mundo; a invasão soviética do Afeganistão (1979) enfraqueceu economicamente e militarmente a URSS, com apoio dos EUA aos mujahidins locais.',
    exemplo:'O Muro de Berlim (1961-1989), que dividia fisicamente a cidade entre setor ocidental capitalista e oriental comunista, tornou-se o símbolo mais concreto e visível da divisão do mundo em blocos durante toda a Guerra Fria.',
    pontos:['Guerra Fria: nunca houve confronto direto EUA x URSS, apenas "guerras por procuração" em terceiros países','Vietnã: vitória comunista, trauma militar e político duradouro para os EUA','Muro de Berlim (1961-1989): símbolo mais concreto da divisão bipolar do mundo']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Revolução Chinesa e Descolonização',
    resumo:'A Revolução Chinesa (1949, liderada por Mao Tsé-tung) instaurou um regime comunista na China, e os processos de descolonização da Ásia e África resultaram na independência de dezenas de países, frequentemente com fronteiras artificiais como legado colonial.',
    aprofundamento:'A Revolução Chinesa culminou décadas de guerra civil entre nacionalistas e comunistas, estabelecendo a República Popular da China sob controle do Partido Comunista liderado por Mao Tsé-tung. A descolonização (majoritariamente entre 1945-1975) resultou da combinação de movimentos nacionalistas locais fortalecidos com o enfraquecimento das potências coloniais europeias após a devastação da Segunda Guerra Mundial, mas frequentemente deixou fronteiras artificiais (traçadas sem considerar divisões étnicas locais) e instabilidade política duradoura como legado colonial nos novos países independentes.',
    exemplo:'Muitos conflitos étnicos internos vividos por países africanos e asiáticos após a independência têm raízes nas fronteiras artificiais traçadas pelas potências coloniais europeias, que agruparam à força etnias historicamente rivais dentro do mesmo território nacional.',
    pontos:['Revolução Chinesa (1949): fim da guerra civil, estabelece regime comunista sob Mao Tsé-tung','Descolonização (1945-1975): movimentos nacionalistas + enfraquecimento das potências coloniais europeias','Fronteiras artificiais herdadas do período colonial geram instabilidade e conflitos étnicos até hoje']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Ditaduras na América Latina',
    resumo:'Estuda a onda de golpes militares e regimes ditatoriais em vários países latino-americanos durante a Guerra Fria, geralmente apoiados pelos EUA como forma de conter avanços comunistas na região.',
    aprofundamento:'Países como Brasil (1964), Chile (1973, sob Augusto Pinochet), Argentina (1976) e outros viveram ditaduras militares marcadas por repressão política sistemática, censura e graves violações de direitos humanos (prisão, tortura, desaparecimentos forçados de opositores). Esses regimes eram geralmente justificados pela chamada "Doutrina de Segurança Nacional", que via a repressão interna como necessária para combater o avanço do comunismo na região durante o contexto da Guerra Fria, e frequentemente contaram com apoio direto ou indireto dos Estados Unidos.',
    exemplo:'A Operação Condor, uma coordenação secreta entre as ditaduras militares de diversos países sul-americanos (incluindo Brasil, Argentina e Chile) para perseguir opositores políticos além de suas próprias fronteiras nacionais, ilustra o alcance regional da repressão desse período.',
    pontos:['Ditaduras militares latino-americanas: repressão sistemática, censura, violações de direitos humanos','Justificadas pela "Doutrina de Segurança Nacional" (combate ao comunismo durante a Guerra Fria)','Operação Condor: coordenação secreta entre ditaduras para perseguir opositores além das fronteiras nacionais']},
  {trilha:'enem', materia:'História', assunto:'História Geral - Fim da Guerra Fria e Oriente Médio Contemporâneo',
    resumo:'A desintegração do bloco soviético (1991) encerrou a Guerra Fria, e conflitos no Oriente Médio (Revolução Iraniana, Guerras do Golfo, Primavera Árabe) seguem moldando a geopolítica contemporânea.',
    aprofundamento:'A desintegração da URSS resultou de crises econômicas internas e de reformas (perestroika, reestruturação econômica, e glasnost, abertura política, ambas de Gorbachev) que acabaram acelerando o colapso do sistema soviético em vez de salvá-lo. A Revolução Iraniana (1979) substituiu um regime pró-ocidental por uma república islâmica, gerando a longa Guerra Irã-Iraque; as Guerras do Golfo (contra o Iraque de Saddam Hussein) e a Guerra do Afeganistão (iniciada após os atentados de 11 de setembro de 2001) marcaram intervenções militares recentes na região; a Primavera Árabe (2010-2011) foi uma onda de protestos populares contra regimes autoritários árabes, com resultados muito diferentes entre os países — de transições políticas a guerras civis prolongadas, como na Síria.',
    exemplo:'A Primavera Árabe teve desfechos muito diferentes conforme o país: na Tunísia, levou a uma transição (ainda que instável) rumo a maior abertura política; já na Síria, o levante popular se transformou numa guerra civil prolongada, com graves consequências humanitárias.',
    pontos:['Perestroika e glasnost (Gorbachev): reformas que aceleraram, em vez de evitar, o colapso da URSS','Revolução Iraniana (1979): substituiu regime pró-ocidental por república islâmica, gerou guerra com o Iraque','Primavera Árabe (2010-2011): resultados muito diferentes entre países, de transições a guerras civis']},
  {trilha:'enem', materia:'História', assunto:'História do Brasil - Pré-História e Povos Indígenas',
    resumo:'Estuda as teorias sobre o povoamento da América, a pré-história brasileira e a diversidade dos povos indígenas que habitavam o território antes da chegada europeia.',
    aprofundamento:'Existem diferentes teorias sobre como e quando os primeiros humanos chegaram à América — a teoria clássica do estreito de Bering (migração via Ásia, durante a última era glacial) e teorias alternativas que sugerem rotas marítimas e datas mais antigas, sustentadas por sítios arqueológicos brasileiros como o Parque Nacional Serra da Capivara, no Piauí. Os povos indígenas brasileiros, antes da chegada portuguesa, eram extremamente diversos em línguas, organização social e modos de vida, vivendo principalmente da caça, pesca, coleta e agricultura de subsistência, sem uma "cultura indígena única" — eram centenas de povos distintos.',
    exemplo:'Os sítios arqueológicos da Serra da Capivara, no Piauí, contêm evidências que alguns pesquisadores interpretam como indicativas de ocupação humana na América muito anterior à data tradicionalmente aceita pela teoria do estreito de Bering, gerando debate científico ainda em aberto.',
    pontos:['Teoria do estreito de Bering: migração para a América via Ásia durante a última era glacial','Teorias alternativas sugerem rotas marítimas e datas mais antigas, debate científico ainda em aberto','Povos indígenas brasileiros pré-cabralinos: centenas de povos distintos, não uma cultura única']},
  {trilha:'enem', materia:'História', assunto:'História do Brasil - Período Pré-Colonial',
    resumo:'Estuda a expansão marítima portuguesa, a viagem de Cabral (1500) e o período pré-colonial (1500-1530), quando o Brasil ainda não tinha colonização efetiva, apenas exploração do pau-brasil através de escambo.',
    aprofundamento:'Portugal já dominava técnicas de navegação avançadas (caravela, astrolábio, bússola) e buscava uma rota alternativa para as lucrativas Índias quando a expedição de Pedro Álvares Cabral chegou ao litoral brasileiro em 1500. Nas primeiras três décadas, não houve colonização efetiva do território — apenas extração de pau-brasil (madeira usada para produzir corante têxtil) através de escambo com indígenas, já que o interesse português principal ainda estava concentrado no comércio muito mais lucrativo com o Oriente.',
    exemplo:'A carta de Pero Vaz de Caminha, primeiro documento escrito sobre o Brasil, registra as primeiras impressões portuguesas sobre a terra e os povos indígenas encontrados, sendo uma fonte histórica fundamental para entender o contato inicial.',
    pontos:['Portugal buscava rota alternativa para as Índias quando a expedição de Cabral chegou ao Brasil (1500)','Primeiras três décadas: sem colonização efetiva, apenas extração de pau-brasil por escambo','Interesse português principal ainda estava no comércio com o Oriente, mais lucrativo que o Brasil']},
  {trilha:'enem', materia:'História', assunto:'História do Brasil - Capitanias Hereditárias e Governo-Geral',
    resumo:'Estuda as primeiras tentativas de colonização efetiva através das Capitanias Hereditárias e, depois de seu relativo fracasso, a criação do Governo-Geral centralizado, incluindo a expulsão da tentativa francesa no Rio de Janeiro.',
    aprofundamento:'As Capitanias Hereditárias (1534), que dividiam o território em faixas doadas a donatários particulares, fracassaram em sua maioria por falta de recursos dos donatários e ataques indígenas, levando a Coroa portuguesa a criar o Governo-Geral (1548), com Tomé de Souza como primeiro governador-geral, fundando Salvador como capital da colônia. Os governos-gerais seguintes (Duarte da Costa, depois Mem de Sá) enfrentaram desafios como a tentativa francesa de colonização no Rio de Janeiro (França Antártica), que foi expulsa por Mem de Sá em meados do século XVI.',
    exemplo:'Apenas duas ou três das quatorze Capitanias Hereditárias originais (destaque para Pernambuco e São Vicente) tiveram algum sucesso relativo, evidenciando o fracasso amplo desse modelo descentralizado de colonização inicial.',
    pontos:['Capitanias Hereditárias (1534): fracasso majoritário por falta de recursos e ataques indígenas','Governo-Geral (1548): centralização sob Tomé de Souza, fundação de Salvador como capital','França Antártica: tentativa francesa de colonização no Rio de Janeiro, expulsa por Mem de Sá']},
  {trilha:'enem', materia:'História', assunto:'História do Brasil - Economia Açucareira e Escravidão',
    resumo:'Estuda o engenho de açúcar como base da economia colonial, a sociedade açucareira e o sistema de escravidão (inicialmente indígena, depois majoritariamente africana) que sustentava essa produção, além das formas de resistência.',
    aprofundamento:'A economia açucareira se organizou em torno do engenho (unidade produtiva com plantação, moenda e casa-grande), sustentada pelo trabalho escravizado — inicialmente indígena, substituído progressivamente por africanos por razões econômicas (tráfico negreiro era altamente lucrativo para a Coroa e traficantes) e de resistência dos povos indígenas (fuga para território conhecido, alta mortalidade por epidemias trazidas pelos europeus). Formas de resistência à escravidão incluíam fugas para quilombos (comunidades organizadas de escravizados fugidos, com destaque para o Quilombo dos Palmares, que resistiu por décadas), rebeliões pontuais e resistência cultural cotidiana.',
    exemplo:'O Quilombo dos Palmares, liderado por figuras como Zumbi, resistiu por quase um século no interior de Alagoas, tornando-se o maior e mais duradouro símbolo de resistência coletiva à escravidão no período colonial brasileiro.',
    pontos:['Engenho de açúcar: unidade produtiva central da economia colonial, sustentada por trabalho escravizado','Substituição da escravidão indígena pela africana: razões econômicas e de resistência indígena','Quilombo dos Palmares: maior e mais duradouro símbolo de resistência coletiva à escravidão']},
  {trilha:'enem', materia:'História', assunto:'História do Brasil - União Ibérica e Invasões Estrangeiras',
    resumo:'Estuda o período da União Ibérica (Portugal sob domínio espanhol, 1580-1640), a tentativa francesa de colonização no Maranhão (França Equinocial) e as invasões holandesas na Bahia e Pernambuco, motivadas pelo controle da produção açucareira.',
    aprofundamento:'Durante a União Ibérica, o Brasil ficou mais vulnerável a ataques de inimigos da Espanha (como Holanda e Inglaterra), já que a defesa colonial ficava associada aos interesses espanhóis. A França Equinocial (fundação de São Luís em 1612 pelos franceses) foi expulsa por Portugal em 1615, mas deixou o nome da cidade como legado histórico. As invasões holandesas buscavam controlar diretamente a lucrativa produção açucareira, sendo temporariamente bem-sucedidas em Pernambuco sob o governo do conde Maurício de Nassau (que promoveu certo desenvolvimento urbano e cultural na região), antes de serem expulsas definitivamente por volta de 1654.',
    exemplo:'O governo de Maurício de Nassau em Pernambuco, apesar de fazer parte de uma ocupação estrangeira, é lembrado por promover desenvolvimento urbano, tolerância religiosa relativa e produção artística e científica na região ocupada.',
    pontos:['União Ibérica (1580-1640): Brasil mais vulnerável a ataques de inimigos da Espanha','França Equinocial: colonização francesa em São Luís (1612), expulsa por Portugal em 1615','Invasões holandesas buscavam controlar a produção açucareira; Nassau governou Pernambuco ocupado']},
  {trilha:'enem', materia:'História', assunto:'História do Brasil - Expansão Territorial e Interiorização',
    resumo:'Estuda o movimento bandeirante, as missões jesuíticas, o tropeirismo e os tratados que formalizaram a expansão do território colonial brasileiro muito além da linha estabelecida pelo Tratado de Tordesilhas.',
    aprofundamento:'Os bandeirantes paulistas expandiram o território colonial muito além do estabelecido pelo Tratado de Tordesilhas, inicialmente caçando indígenas para escravizar e, mais tarde, buscando ouro e pedras preciosas no interior do território; as missões jesuíticas (aldeamentos organizados pela Igreja) protegiam indígenas da escravização, gerando conflitos diretos com os interesses bandeirantes. O tropeirismo (comércio de gado e mulas entre regiões) e as chamadas "drogas do sertão" (extrativismo de produtos nativos como cacau e castanha na Amazônia) foram outras formas de ocupação e integração econômica do interior colonial; tratados diplomáticos posteriores (como Madrid e Santo Ildefonso) formalizaram essa expansão territorial que já havia ocorrido de fato, ampliando as fronteiras do Brasil muito além do limite original de Tordesilhas.',
    exemplo:'O princípio jurídico do "uti possidetis" (quem ocupa de fato o território tem mais direito sobre ele), usado nos tratados que sucederam Tordesilhas, favoreceu diretamente Portugal, cujos bandeirantes já haviam ocupado de fato um território muito maior do que o originalmente atribuído.',
    pontos:['Bandeirantes: expandiram o território muito além de Tordesilhas, caçando indígenas e depois buscando ouro','Missões jesuíticas protegiam indígenas da escravização, gerando conflito direto com bandeirantes','Tratados posteriores (Madrid, Santo Ildefonso) formalizaram a expansão territorial já ocorrida de fato']},
  {trilha:'enem', materia:'História', assunto:'História do Brasil - Mineração no Brasil',
    resumo:'A descoberta de ouro em Minas Gerais no final do século XVII deslocou o eixo econômico da colônia, trazendo transformações econômicas, sociais e culturais profundas, além de rígido controle fiscal português.',
    aprofundamento:'A mineração atraiu grande fluxo migratório para Minas Gerais, urbanizando rapidamente a região e criando uma sociedade mais diversificada e urbana que a das áreas açucareiras tradicionais do litoral; a Coroa portuguesa controlava rigidamente a extração e a cobrança de impostos sobre o ouro (o "quinto", correspondente a 20% da produção, e as chamadas "derramas", cobranças forçadas quando a arrecadação ficava abaixo da esperada), gerando forte insatisfação que alimentaria revoltas posteriores. Culturalmente, o período gerou um barroco mineiro bastante rico, com destaque para a arquitetura religiosa, as esculturas do Aleijadinho e a produção musical da região.',
    exemplo:'As "derramas" — cobrança forçada e coletiva de impostos quando a arrecadação do quinto do ouro ficava abaixo da meta estabelecida pela Coroa — foram uma das principais motivações de revolta que alimentaram o movimento da Inconfidência Mineira décadas depois.',
    pontos:['Mineração deslocou o eixo econômico da colônia para Minas Gerais, urbanizando a região','Controle fiscal rígido: quinto do ouro (20%) e derramas geraram forte insatisfação colonial','Barroco mineiro: legado cultural rico, com destaque para as esculturas do Aleijadinho']},
  {trilha:'enem', materia:'História', assunto:'História do Brasil - Revoltas Nativistas e Emancipacionistas',
    resumo:'Estuda as revoltas nativistas (que reivindicavam mudanças dentro do sistema colonial, como Guerra dos Emboabas e Guerra dos Mascates) e as revoltas emancipacionistas (que já propunham a independência, como a Inconfidência Mineira e a Conjuração Baiana).',
    aprofundamento:'As revoltas nativistas geralmente protestavam contra questões econômicas específicas (impostos, monopólios comerciais) sem questionar o vínculo colonial em si — a Guerra dos Emboabas foi um conflito entre paulistas e forasteiros ("emboabas") pelo controle das áreas de mineração recém-descobertas; a Guerra dos Mascates envolveu disputa comercial entre os comerciantes portugueses de Recife e os produtores de açúcar de Olinda. Já as revoltas emancipacionistas, influenciadas pelo Iluminismo e pela recente Independência dos EUA, já propunham romper com Portugal — a Inconfidência Mineira (1789), motivada em parte pela ameaça de uma derrama, é a mais famosa, tendo Tiradentes como mártir símbolo do movimento; a Conjuração Baiana (1798), diferente da mineira, teve participação mais popular (incluindo escravizados e libertos) e propostas mais radicais, incluindo a abolição da escravidão.',
    exemplo:'Diferente da Inconfidência Mineira (movimento restrito a elites locais), a Conjuração Baiana teve ampla participação popular e chegou a propor explicitamente o fim da escravidão — uma diferença importante que o ENEM costuma explorar ao comparar os dois movimentos.',
    pontos:['Revoltas nativistas: questionavam problemas específicos sem propor romper com Portugal (Emboabas, Mascates)','Inconfidência Mineira (1789): movimento emancipacionista restrito a elites, Tiradentes como mártir símbolo','Conjuração Baiana (1798): participação popular mais ampla, propunha inclusive o fim da escravidão']},
  {trilha:'enem', materia:'História', assunto:'História do Brasil - Chegada da Família Real e Governo Joanino',
    resumo:'A fuga da família real portuguesa para o Brasil (1808), fugindo das invasões napoleônicas, e as transformações do período joanino que elevaram o status da colônia e tornaram a independência praticamente inevitável.',
    aprofundamento:'A vinda da corte portuguesa para o Rio de Janeiro (1808) abriu os portos brasileiros ao comércio internacional (rompendo o antigo monopólio comercial exclusivo com Portugal), elevou o Brasil à condição de Reino Unido a Portugal e Algarves (1815), e trouxe instituições que antes eram proibidas na colônia (bancos, bibliotecas, academias militares e científicas, imprensa) — mudanças que, paradoxalmente, fortaleceram enormemente a autonomia econômica e institucional brasileira e tornaram um eventual retorno ao status colonial anterior praticamente impossível.',
    exemplo:'A Abertura dos Portos às Nações Amigas (1808), um dos primeiros atos de D. João logo após sua chegada, rompeu de vez o antigo monopólio comercial português, permitindo que o Brasil comerciasse diretamente com outros países — mudança econômica que dificultaria muito uma futura recolonização.',
    pontos:['Vinda da Família Real (1808): abriu os portos, tornou a independência praticamente inevitável','Reino Unido a Portugal e Algarves (1815): elevou o status político do Brasil dentro do império português','Instituições trazidas (bancos, imprensa, academias) fortaleceram a autonomia institucional brasileira']},
  {trilha:'enem', materia:'História', assunto:'História do Brasil - Independência do Brasil',
    resumo:'Estuda o processo que levou à independência (1822), incluindo a Revolução Pernambucana, a Revolução do Porto (que exigia o retorno do rei a Portugal e a recolonização do Brasil) e as guerras de independência em algumas províncias resistentes.',
    aprofundamento:'A independência do Brasil foi um processo relativamente negociado entre elites, mantendo a monarquia sob D. Pedro I — diferente de processos revolucionários mais radicais e violentos vividos na América espanhola. A Revolução do Porto, ocorrida em Portugal em 1820, exigia o retorno de D. João VI e a recolonização do Brasil (revertendo as conquistas do período joanino), o que acelerou a ruptura definitiva. Algumas províncias (como a Bahia) resistiram à separação e exigiram guerras de independência regionais mais prolongadas antes de aceitarem definitivamente a ruptura com Portugal.',
    exemplo:'A resistência de tropas portuguesas na Bahia, que só foi definitivamente derrotada em 1823 (quase um ano após o "Grito do Ipiranga"), mostra que a independência não foi um evento único e instantâneo, mas um processo que se estendeu de forma desigual pelo território.',
    pontos:['Revolução do Porto (1820): exigia recolonização do Brasil, acelerou a ruptura definitiva','Independência: processo negociado entre elites, manteve a monarquia sob D. Pedro I','Bahia resistiu à separação, exigindo guerra de independência regional até 1823']},
  {trilha:'enem', materia:'História', assunto:'História do Brasil - Período Regencial',
    resumo:'Estuda o período (1831-1840) em que o Brasil ficou sem imperador presente (D. Pedro II ainda criança), marcado por instabilidade política e diversas revoltas regionais (Cabanagem, Balaiada, Farroupilha, Sabinada, Revolta dos Malês).',
    aprofundamento:'O período regencial se divide entre uma fase de avanço liberal (maior descentralização e autonomia provincial) e um regresso conservador (recentralização de poder, culminando no Golpe da Maioridade, que antecipou a maioridade de D. Pedro II para encerrar antecipadamente o período regencial e sua instabilidade). As revoltas regenciais refletiam fortes tensões sociais e políticas regionais: a Cabanagem no Pará e a Balaiada no Maranhão tiveram ampla participação popular de camadas pobres; a Revolução Farroupilha no Rio Grande do Sul teve caráter separatista prolongado (quase dez anos de conflito); a Revolta dos Malês na Bahia foi organizada por escravizados de origem muçulmana.',
    exemplo:'A Balaiada, ocorrida no Maranhão entre 1838-1841, reuniu vaqueiros, sertanejos pobres e até escravizados fugidos contra a elite política local, refletindo as profundas tensões sociais vividas no período em que o Brasil ficou sem uma autoridade imperial central forte.',
    pontos:['Período regencial (1831-1840): avanço liberal seguido de regresso conservador (Golpe da Maioridade)','Cabanagem (Pará) e Balaiada (Maranhão): revoltas com ampla participação popular','Farroupilha (Rio Grande do Sul): caráter separatista, conflito prolongado por quase uma década']},
  {trilha:'enem', materia:'História', assunto:'História do Brasil - Segundo Reinado',
    resumo:'Estuda o longo governo pessoal de D. Pedro II (1840-1889), marcado por relativa estabilidade política interna, transformações econômicas (Lei de Terras, fim do tráfico negreiro, surto industrial e imigração) e a Guerra do Paraguai na política externa.',
    aprofundamento:'Internamente, o Segundo Reinado alternou o poder entre os partidos Liberal e Conservador através da chamada "Era das Conciliações" e viveu revoltas pontuais como a Revolução Praieira. Economicamente, a Lei de Terras (1850) dificultou o acesso à terra por ex-escravizados e imigrantes pobres (exigindo compra formal em vez de simples ocupação), enquanto a Lei Eusébio de Queirós (mesmo ano) encerrou o tráfico negreiro internacional, redirecionando capital antes investido no tráfico para outros setores da economia e impulsionando um surto industrial incipiente e a imigração europeia (recrutada principalmente para substituir mão de obra escravizada nas lavouras de café). Na política externa, a Guerra do Paraguai (1864-1870) foi o maior conflito armado da história da América do Sul, envolvendo o Brasil, a Argentina e o Uruguai (Tríplice Aliança) contra o Paraguai.',
    exemplo:'A Lei de Terras (1850), ao exigir a compra formal de terras devolutas em vez de permitir sua simples ocupação, dificultou deliberadamente o acesso à propriedade rural por ex-escravizados e imigrantes pobres, favorecendo a concentração fundiária nas mãos de quem já possuía capital.',
    pontos:['Lei Eusébio de Queirós (1850): fim do tráfico negreiro internacional, redireciona capital para outros setores','Lei de Terras (1850): dificultou acesso à propriedade rural por ex-escravizados e imigrantes pobres','Guerra do Paraguai (1864-1870): maior conflito armado da história da América do Sul']},
  {trilha:'enem', materia:'História', assunto:'História do Brasil - Crise do Império e Proclamação da República',
    resumo:'Estuda as questões que desgastaram a monarquia (questão militar, questão religiosa, questão republicana) e culminaram no abolicionismo (Lei Áurea, 1888) e na Proclamação da República (1889).',
    aprofundamento:'A questão militar envolveu atrito crescente entre o Exército (que ganhou prestígio e autoestima política após a Guerra do Paraguai) e o governo civil, que tentava manter os militares subordinados ao poder político; a questão religiosa envolveu conflito entre a Igreja Católica e o Estado imperial; o movimento republicano crescia sobretudo entre elites cafeeiras paulistas insatisfeitas com a centralização política monárquica e a falta de representatividade regional. A Lei Áurea (1888), que aboliu a escravidão sem qualquer política de reparação ou indenização — nem para os libertos, nem (segundo reivindicavam) para os grandes proprietários de terra —, desgastou fortemente o apoio das elites à monarquia, sendo apontada como um dos fatores decisivos que aceleraram a Proclamação da República, liderada por setores militares em 1889.',
    exemplo:'A Lei Áurea, ao abolir a escravidão "de uma penada" sem qualquer política de transição, reparação para os libertos ou indenização para os proprietários, desagradou simultaneamente diferentes setores da sociedade, acelerando o desgaste final da monarquia.',
    pontos:['Questão militar: atrito entre Exército (fortalecido após a Guerra do Paraguai) e governo civil','Lei Áurea (1888): aboliu a escravidão sem qualquer reparação, desgastando apoio das elites à monarquia','Proclamação da República (1889): liderada por setores militares, movimento essencialmente elitista']},
  {trilha:'enem', materia:'História', assunto:'História do Brasil - República da Espada e República Oligárquica',
    resumo:'Estuda os primeiros governos militares após a Proclamação (Deodoro da Fonseca e Floriano Peixoto, "República da Espada") e o período seguinte da República Oligárquica, marcado pela política do "café com leite" e pela economia de café, borracha e início da industrialização.',
    aprofundamento:'A República da Espada consolidou a nova ordem republicana através de governos militares fortes, enfrentando resistências como a Revolta da Armada; a República Oligárquica (1894-1930) foi marcada pela alternância de poder entre elites políticas de São Paulo e Minas Gerais (a chamada política do "café com leite") e pelo voto não secreto, que facilitava fraudes eleitorais e o controle político local pelos chamados "coronéis" (o "voto de cabresto"). Economicamente, o país dependia fortemente da exportação de café, com um breve mas economicamente importante ciclo da borracha na Amazônia (que entrou em declínio com a concorrência asiática), além do início de uma industrialização ainda bastante incipiente e concentrada.',
    exemplo:'O "voto de cabresto", em que coronéis locais controlavam o voto de trabalhadores e dependentes através de coerção econômica e social, foi um mecanismo central que sustentava o domínio político das oligarquias regionais durante toda a República Oligárquica.',
    pontos:['República da Espada: governos militares de Deodoro e Floriano consolidam a nova ordem republicana','Política do "café com leite": alternância de poder entre elites de São Paulo e Minas Gerais','"Voto de cabresto": coronéis controlavam o voto local, sustentando o domínio das oligarquias regionais']},
  {trilha:'enem', materia:'História', assunto:'História do Brasil - Movimentos Sociais da Primeira República',
    resumo:'Estuda revoltas populares e messiânicas (Canudos, Contestado), banditismo social (Cangaço), e revoltas urbanas (Revolta da Vacina, Revolta da Chibata) que expuseram as profundas tensões sociais da República Oligárquica.',
