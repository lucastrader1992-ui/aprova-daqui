    aprofundamento:'Os experimentos de Pasteur (com o balão de pescoço de cisne) refutaram definitivamente a abiogênese, mostrando que a vida só surge de vida preexistente (biogênese). A hipótese de Oparin propõe que moléculas orgânicas simples se formaram espontaneamente na atmosfera primitiva da Terra, ideia testada experimentalmente por Miller e Urey, que recriaram condições da Terra primitiva em laboratório e obtiveram aminoácidos. A hipótese do "mundo de RNA" sugere que o RNA pode ter sido o primeiro material genético, por conseguir tanto armazenar informação quanto catalisar reações. A teoria endossimbiótica explica a origem de mitocôndrias e cloroplastos como bactérias antigas incorporadas por simbiose, evidenciada pelo fato dessas organelas terem DNA próprio.',
    exemplo:'O experimento de Miller e Urey (1953) recriou em laboratório a atmosfera primitiva da Terra com descargas elétricas simulando raios, produzindo aminoácidos — evidência experimental a favor da hipótese de Oparin.',
    pontos:['Pasteur refutou a geração espontânea (abiogênese) com o experimento do balão de pescoço de cisne','Miller e Urey testaram experimentalmente a hipótese de Oparin, obtendo aminoácidos','Teoria endossimbiótica: mitocôndrias e cloroplastos seriam bactérias antigas incorporadas por simbiose']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Evolução',
    resumo:'Estuda como as espécies mudam ao longo do tempo através da seleção natural, principal mecanismo proposto por Darwin, e como evidências como fósseis, anatomia comparada e genética molecular sustentam a teoria evolutiva moderna.',
    aprofundamento:'A seleção natural darwiniana propõe que indivíduos com características mais vantajosas têm maior chance de sobreviver e se reproduzir — é um processo que atua sobre a variação já existente numa população, não "cria" características sob demanda. O neodarwinismo integrou a genética às ideias de Darwin. Órgãos homólogos (mesma origem embrionária, funções diferentes, como o braço humano e a asa do morcego) são evidência de ancestralidade comum; órgãos análogos (funções parecidas, origens diferentes) são evidência de evolução convergente. O Equilíbrio de Hardy-Weinberg descreve as condições sob as quais as frequências gênicas de uma população permanecem estáveis — útil para detectar quando uma população está de fato evoluindo.',
    exemplo:'A resistência de bactérias a antibióticos é um exemplo moderno de seleção natural em ação: bactérias com mutações que conferem resistência sobrevivem ao tratamento e se multiplicam, tornando a população cada vez mais resistente ao longo do tempo.',
    pontos:['Seleção natural: atua sobre variação já existente, não cria características sob demanda','Órgãos homólogos: mesma origem, funções diferentes (evidência de ancestralidade comum)','Órgãos análogos: funções parecidas, origens diferentes (evolução convergente)']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Taxionomia',
    resumo:'Estuda a classificação científica dos seres vivos em categorias hierárquicas, usando o sistema binomial de nomenclatura criado por Lineu, além de conceitos modernos como os três domínios da vida.',
    aprofundamento:'O sistema binomial de Lineu nomeia cada espécie com dois termos em latim: o gênero (inicial maiúscula) e o epíteto específico (minúsculo), ambos em itálico — como Homo sapiens. A classificação moderna adota três domínios (Bacteria, Archaea e Eukarya), que agrupam os antigos cinco reinos com base em características celulares moleculares. Árvores evolutivas (cladogramas) representam graficamente as relações de parentesco evolutivo entre grupos, mostrando quais compartilham ancestrais comuns mais recentes.',
    exemplo:'O ser humano é classificado como Homo sapiens: Homo é o gênero (compartilhado com espécies extintas como Homo erectus) e sapiens é o epíteto específico exclusivo da nossa espécie.',
    pontos:['Sistema binomial de Lineu: Gênero + epíteto específico, em itálico (ex: Homo sapiens)','3 domínios: Bacteria, Archaea, Eukarya (baseados em características celulares moleculares)','Cladogramas mostram relações de parentesco evolutivo entre grupos']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Microbiologia',
    resumo:'Estuda os microrganismos — vírus, bactérias, protozoários e fungos — incluindo suas características, formas de transmissão de doenças e importância médica e ambiental. É um bloco muito atual, ligado a epidemias e saúde pública.',
    aprofundamento:'Vírus são agentes acelulares que dependem obrigatoriamente de uma célula hospedeira para se replicar — doenças virais recorrentes no ENEM incluem dengue, gripe, COVID-19 e HIV. Bactérias são procariontes que podem causar doenças (tuberculose, cólera) mas também têm papéis benéficos (fixação de nitrogênio no solo, fermentação). Protozoários causam doenças como malária (transmitida pelo mosquito Anopheles) e doença de Chagas (transmitida pelo barbeiro), temas recorrentes de saúde pública em regiões tropicais como o Brasil. Fungos podem ser decompositores importantes, mas também causam micoses e intoxicações alimentares.',
    exemplo:'A malária, causada pelo protozoário Plasmodium e transmitida pela picada da fêmea do mosquito Anopheles, ainda é um grave problema de saúde pública em regiões tropicais, incluindo partes da Amazônia brasileira.',
    pontos:['Vírus: acelulares, dependem de célula hospedeira para se replicar','Bactérias: procariontes, podem ser patogênicas ou benéficas (fixação de nitrogênio, fermentação)','Protozoários: causam malária (Plasmodium, mosquito Anopheles) e doença de Chagas (barbeiro)']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Botânica',
    resumo:'Estuda as plantas — suas estruturas, classificação (briófitas, pteridófitas, gimnospermas, angiospermas) e processos vitais como fotossíntese, reprodução e resposta a estímulos através de fitormônios.',
    aprofundamento:'A evolução das plantas mostra progressiva adaptação ao ambiente terrestre: briófitas dependem de água para reprodução e não têm vasos condutores; pteridófitas já têm vasos condutores mas ainda dependem de água para reprodução; gimnospermas produzem sementes mas não têm frutos; angiospermas produzem flores e frutos, sendo o grupo mais diversificado. Os fitormônios regulam o crescimento vegetal: auxinas controlam o crescimento em direção à luz e à gravidade; giberelinas estimulam crescimento e germinação; etileno acelera o amadurecimento de frutos. A fotossíntese ocorre em duas etapas: fase clara (produz ATP e libera O2) e fase escura ou Ciclo de Calvin (fixa CO2 em glicose usando o ATP produzido).',
    exemplo:'Colocar uma banana verde dentro de um saco fechado junto com uma maçã madura acelera seu amadurecimento, porque a maçã libera etileno, o hormônio vegetal responsável por sinalizar o amadurecimento de frutos.',
    pontos:['Evolução das plantas: briófitas → pteridófitas → gimnospermas → angiospermas (crescente adaptação terrestre)','Auxinas: crescimento direcional (luz e gravidade); Etileno: amadurecimento de frutos','Fotossíntese: fase clara (produz ATP e O2) + fase escura/Ciclo de Calvin (fixa CO2 em glicose)']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Zoologia',
    resumo:'Estuda a diversidade e classificação dos animais, desde invertebrados simples até vertebrados complexos, incluindo suas características anatômicas e fisiológicas distintivas.',
    aprofundamento:'Os invertebrados evoluíram de estruturas corporais simples para mais complexas: poríferos não têm tecidos verdadeiros; cnidários têm simetria radial e células urticantes; platelmintos e nematódeos incluem importantes parasitas humanos (tênia, esquistossomose, ascaridíase); artrópodes são o grupo animal mais numeroso e diverso do planeta. Entre os vertebrados, a evolução mostra adaptações progressivas ao ambiente terrestre: peixes (respiração branquial, ectotermia), anfíbios (respiração dupla, dependência de água para reprodução), répteis (ovo amniótico, reprodução totalmente terrestre), aves e mamíferos (endotermia). O ENEM costuma contextualizar zoologia com saúde pública e conservação ambiental.',
    exemplo:'A esquistossomose é causada por um platelminto (Schistosoma mansoni) transmitido através do contato com água contaminada por um caramujo hospedeiro intermediário — um problema de saúde pública em regiões com saneamento básico precário no Brasil.',
    pontos:['Invertebrados: de poríferos (sem tecidos) a artrópodes (grupo mais diverso do planeta)','Vertebrados: peixes → anfíbios → répteis → aves/mamíferos (crescente adaptação terrestre)','Endotermia (aves e mamíferos): manutenção de temperatura corporal constante']},
  {trilha:'enem', materia:'Biologia', assunto:'Biologia - Ecologia',
    resumo:'Ecologia estuda as relações entre os seres vivos e o ambiente. No ENEM, aparece muito ligada a questões ambientais atuais, como desmatamento, cadeias alimentares e impacto humano nos ecossistemas.',
    aprofundamento:'Entender o fluxo de energia numa cadeia alimentar é essencial: a energia sempre flui em uma direção (produtores → consumidores → decompositores), e a cada nível trófico se perde uma boa parte da energia em forma de calor — por isso cadeias alimentares raramente têm mais de 4-5 níveis. O ENEM gosta de contextualizar isso com questões ambientais reais: o que acontece com uma cadeia alimentar quando um nível é removido (ex: extinção de um predador), ou como o desmatamento afeta ciclos biogeoquímicos inteiros, não só a vegetação local.',
    exemplo:'Se um predador de topo (como uma onça) é extinto numa região, a população de suas presas tende a crescer descontroladamente, o que pode levar ao esgotamento da vegetação da qual essas presas se alimentam — um efeito em cascata.',
    pontos:['Produtores: fazem fotossíntese (plantas, algas)','Consumidores: se alimentam de outros seres vivos','Decompositores: reciclam matéria orgânica no ecossistema']},
  {trilha:'enem', materia:'Física', assunto:'Física - Análise Dimensional e Fundamentos',
    resumo:'Bloco que estabelece as ferramentas matemáticas usadas em toda a Física do ENEM: proporcionalidade entre grandezas, potências de 10, conversão de unidades e o uso do triângulo retângulo (seno, cosseno, tangente) para decompor grandezas vetoriais. A análise dimensional confere se uma fórmula "faz sentido" comparando as unidades dos dois lados da equação.',
    aprofundamento:'Grandezas físicas quase sempre se relacionam por proporcionalidade direta ou inversa (força e aceleração são diretamente proporcionais; pressão e área, inversamente proporcionais para uma mesma força) — reconhecer o tipo de relação antes de montar a conta evita erro de fórmula. Notação científica é indispensável porque grandezas físicas variam de escalas atômicas (carga do elétron, ~10⁻¹⁹ C) a astronômicas (massa da Terra, ~10²⁴ kg). Conversão de unidades é a base que evita a maioria dos erros bobos: sempre confira se todas as grandezas de uma fórmula estão na mesma unidade antes de substituir os valores. O triângulo retângulo (sen, cos, tg) decompõe qualquer grandeza vetorial em componentes horizontal e vertical — ferramenta que reaparece em cinemática, dinâmica e eletromagnetismo. Análise dimensional verifica a fórmula: as unidades dos dois lados de uma equação física devem coincidir; se não coincidirem, a fórmula está errada.',
    exemplo:'Um carro a 72 km/h, convertendo pra unidade padrão do SI: 72÷3,6 = 20 m/s. Praticamente toda fórmula de Física no ENEM espera a resposta em unidades do Sistema Internacional (metro, segundo, quilograma).',
    pontos:['km/h → m/s: divide por 3,6; m/s → km/h: multiplica por 3,6','Triângulo retângulo (sen, cos, tg) decompõe vetores em componentes','Análise dimensional: as unidades dos dois lados de uma equação devem coincidir']},
  {trilha:'enem', materia:'Física', assunto:'Física - Cinemática',
    resumo:'Cinemática estuda o movimento dos corpos sem se preocupar com suas causas, cobrindo Movimento Uniforme (MU), Movimento Uniformemente Variado (MUV), vetores, Movimento Circular Uniforme (MCU) e lançamentos (vertical, horizontal, oblíquo). É um dos blocos mais recorrentes do ENEM, sempre contextualizado com trânsito, esportes e transporte.',
    aprofundamento:'No MU, a velocidade é constante e a posição varia linearmente com o tempo (S = S0 + v×t); no MUV, existe aceleração constante, e as equações principais são v = v0 + a×t e S = S0 + v0×t + a×t²/2, além da Equação de Torricelli (v² = v0² + 2×a×ΔS), usada quando o tempo não é fornecido. Vetores exigem decompor grandezas em componentes (usando seno e cosseno) antes de somar ou subtrair — a velocidade resultante de um barco atravessando um rio com correnteza é a soma vetorial da velocidade do barco com a da correnteza. O MCU introduz velocidade angular (ω = Δθ/Δt) e a relação v = ω×R entre velocidade linear e angular, essencial em problemas de engrenagens e polias acopladas (que têm a mesma velocidade angular se compartilham o eixo, ou a mesma velocidade linear se conectadas por uma correia). Lançamentos horizontais e oblíquos combinam MU na horizontal com MUV (queda livre) na vertical — os dois movimentos são independentes e só se conectam pelo tempo. Em gráficos de posição x tempo, a inclinação da reta é a velocidade; em gráficos de velocidade x tempo, a área sob a curva é o deslocamento e a inclinação é a aceleração.',
    exemplo:'Uma bola lançada horizontalmente de uma mesa de 1,25m de altura (g=10m/s²) leva t=√(2×1,25/10)=0,5s pra cair (movimento vertical, independente da velocidade horizontal) — nesse tempo, ela percorre horizontalmente a distância que sua velocidade horizontal constante permitir.',
    pontos:['MUV: v=v0+at; S=S0+v0t+at²/2; Torricelli: v²=v0²+2aΔS (sem tempo)','MCU: v=ω×R — engrenagens no mesmo eixo têm mesma ω; conectadas por correia, mesma v','Lançamentos: horizontal (MU) e vertical (MUV/queda livre) são independentes, unidos pelo tempo']},
  {trilha:'enem', materia:'Física', assunto:'Física - Dinâmica (Leis de Newton e Forças)',
    resumo:'Dinâmica estuda as causas do movimento através das três Leis de Newton, e as forças mais cobradas: peso, normal, tração, elástica e atrito. Inclui sistemas de blocos, plano inclinado, força centrípeta e a Máquina de Atwood.',
    aprofundamento:'A 1ª Lei (inércia) diz que um corpo mantém seu estado de repouso ou movimento retilíneo uniforme a menos que uma força resultante atue sobre ele. A 2ª Lei (F=m×a) relaciona força resultante, massa e aceleração — a ferramenta de cálculo central da dinâmica. A 3ª Lei (ação e reação) diz que toda força tem um par de reação de mesma intensidade e direção oposta, atuando em corpos diferentes (por isso não se cancelam). Em sistemas de blocos conectados por fios (Máquina de Atwood), a estratégia é isolar cada bloco, escrever a 2ª Lei para cada um, e resolver o sistema de equações — a aceleração é a mesma para todos os blocos conectados pelo mesmo fio inextensível. No plano inclinado, decompõe-se o peso em componente paralela ao plano (que acelera o corpo) e perpendicular (que se equilibra com a normal). A força de atrito se opõe ao movimento (ou tendência de movimento) e tem dois regimes: estático (até o corpo começar a se mover) e cinético (durante o movimento, geralmente menor que o estático máximo). Força centrípeta não é um "novo tipo" de força, mas sim a resultante das forças reais (tração, normal, atrito) que aponta para o centro de uma trajetória circular, dada por Fc=m×v²/R.',
    exemplo:'Numa Máquina de Atwood com massas de 3kg e 5kg penduradas nas duas pontas de um fio sobre uma polia, o bloco mais pesado desce e o mais leve sobe com a mesma aceleração: a=(5-3)×10/(5+3)=2,5m/s² (usando g=10m/s²).',
    pontos:['2ª Lei de Newton: F=m×a — base de todo cálculo dinâmico','Ação e reação atuam em corpos diferentes, por isso nunca se cancelam','Força centrípeta: Fc=m×v²/R, é a resultante das forças reais apontando pro centro']},
  {trilha:'enem', materia:'Física', assunto:'Física - Trabalho, Energia e Quantidade de Movimento',
    resumo:'Estende a Dinâmica para os conceitos de trabalho mecânico, energia cinética, potencial (gravitacional e elástica), conservação de energia mecânica, quantidade de movimento (momento linear), impulso e colisões.',
    aprofundamento:'Trabalho de uma força é W=F×d×cos(θ), e o Teorema do Trabalho-Energia diz que o trabalho da força resultante é igual à variação de energia cinética. Em sistemas conservativos (sem atrito), a energia mecânica (cinética + potencial) se conserva — o que o corpo perde de altura (energia potencial) ele ganha em velocidade (energia cinética), e vice-versa. Em sistemas dissipativos (com atrito), parte da energia mecânica se transforma em calor e a energia mecânica total diminui. Quantidade de movimento (p=m×v) se conserva em sistemas isolados (sem forças externas), sendo a base para analisar colisões: colisões perfeitamente elásticas conservam tanto momento quanto energia cinética; colisões inelásticas conservam só o momento, perdendo energia cinética (que vira calor, som, deformação); colisões perfeitamente inelásticas terminam com os corpos grudados, movendo-se juntos com a mesma velocidade final. Impulso (I=F×Δt) é igual à variação da quantidade de movimento — é por isso que air bags e zonas de deformação de carros aumentam o tempo de impacto para reduzir a força sentida pelo corpo.',
    exemplo:'Um carrinho de 2kg a 3m/s colide e gruda em outro de 1kg parado (colisão perfeitamente inelástica): pela conservação do momento, 2×3+1×0=(2+1)×v → v=2m/s. Parte da energia cinética inicial foi perdida na colisão (virou calor e deformação).',
    pontos:['Energia mecânica conserva-se sem atrito; com atrito, parte vira calor (sistema dissipativo)','p=m×v conserva-se em sistemas isolados — base para resolver colisões','Impulso (F×Δt) = variação do momento — explica por que air bags reduzem a força de impacto']},
  {trilha:'enem', materia:'Física', assunto:'Física - Gravitação',
    resumo:'Estuda o movimento de planetas e satélites através das Leis de Kepler e da Lei da Gravitação Universal de Newton, incluindo o fenômeno das marés e o cálculo de órbitas de satélites.',
    aprofundamento:'As três Leis de Kepler descrevem o movimento planetário: 1ª Lei (órbitas são elipses com o Sol em um dos focos), 2ª Lei (a linha que une o planeta ao Sol varre áreas iguais em tempos iguais — por isso o planeta se move mais rápido quando está mais perto do Sol), e 3ª Lei (o quadrado do período orbital é proporcional ao cubo do raio médio da órbita, T²∝R³, mesma constante de proporcionalidade para todos os planetas do mesmo sistema). A Lei da Gravitação Universal (F=G×m1×m2/d²) explica essas órbitas: a força gravitacional entre dois corpos é proporcional às suas massas e inversamente proporcional ao quadrado da distância entre eles. As marés são causadas principalmente pela atração gravitacional da Lua (e, em menor grau, do Sol) sobre os oceanos da Terra, gerando dois "abaulamentos" de água — um voltado para a Lua e outro no lado oposto do planeta. Satélites em órbita estão em queda livre constante: a força gravitacional funciona como a força centrípeta que os mantém em trajetória circular ao redor da Terra.',
    exemplo:'Um satélite geoestacionário orbita a Terra com o mesmo período de rotação do planeta (24h), permanecendo sempre sobre o mesmo ponto do equador — essencial para comunicações e transmissão de TV via satélite.',
    pontos:['2ª Lei de Kepler: planeta mais rápido perto do Sol, mais lento longe (áreas iguais em tempos iguais)','3ª Lei de Kepler: T²∝R³ — mesma proporção pra todos os planetas de um sistema','Gravitação: F=G×m1×m2/d² — força cai com o quadrado da distância']},
  {trilha:'enem', materia:'Física', assunto:'Física - Estática',
    resumo:'Estuda o equilíbrio de corpos em repouso, incluindo centro de massa, tipos de equilíbrio, alavancas, momento de uma força (torque) e as condições de equilíbrio de ponto material e de corpo extenso.',
    aprofundamento:'Para um ponto material estar em equilíbrio, a soma vetorial de todas as forças deve ser zero. Para um corpo extenso, além da resultante das forças ser zero, a soma dos momentos (torques) também deve ser zero — essa segunda condição é o que diferencia estática de corpo extenso da de ponto material. O momento de uma força (M=F×d, onde d é a distância perpendicular até o eixo de rotação) mede a tendência de uma força causar rotação — é o princípio por trás de alavancas (uma pequena força aplicada longe do eixo pode equilibrar uma força grande aplicada perto dele). O equilíbrio pode ser estável (o corpo volta à posição original após pequeno deslocamento, como um cone apoiado na base), instável (o corpo se afasta ainda mais da posição original, como um cone apoiado na ponta) ou indiferente (o corpo permanece na nova posição, como uma esfera numa superfície plana). O centro de massa é o ponto onde se pode considerar toda a massa do corpo concentrada para efeitos de cálculo de equilíbrio e movimento.',
    exemplo:'Uma gangorra equilibrada com uma criança de 30kg a 2m do centro e um adulto de 90kg do outro lado: pela condição de momento nulo, 30×10×2 = 90×10×d → d≈0,67m — o adulto precisa se sentar bem mais perto do centro pra equilibrar.',
    pontos:['Equilíbrio de corpo extenso exige: resultante das forças = 0 E soma dos momentos = 0','Momento de uma força: M=F×d (distância perpendicular ao eixo) — princípio das alavancas','Equilíbrio estável, instável ou indiferente depende de como o corpo reage a um pequeno deslocamento']},
  {trilha:'enem', materia:'Física', assunto:'Física - Hidrostática',
    resumo:'Estuda fluidos em repouso: densidade, pressão, pressão atmosférica, Teorema de Stevin, Princípio de Pascal e o Princípio de Arquimedes (empuxo). É a base para entender prensas hidráulicas, submarinos e por que objetos flutuam ou afundam.',
    aprofundamento:'Densidade (d=m/V) determina, junto com o volume submerso, se um objeto flutua ou afunda em um líquido. O Teorema de Stevin (P=P0+d×g×h) mostra que a pressão num líquido aumenta com a profundidade, independente do formato do recipiente — por isso mergulhadores sentem mais pressão quanto mais fundo vão. O Princípio de Pascal diz que uma pressão aplicada em um ponto de um líquido em repouso se transmite integralmente a todos os pontos do fluido — é o que permite prensas e macacos hidráulicos multiplicarem força aplicando-a numa área pequena e recebendo o efeito numa área grande (F1/A1=F2/A2). O Princípio de Arquimedes diz que todo corpo imerso em um fluido recebe um empuxo (força para cima) igual ao peso do fluido deslocado — se o empuxo for maior que o peso do objeto, ele flutua; se for menor, afunda; se for igual, fica em equilíbrio submerso (como um submarino em profundidade constante).',
    exemplo:'Um navio de aço (mais denso que a água) flutua porque seu formato desloca um grande volume de água — o empuxo (peso da água deslocada) se iguala ao peso total do navio, mesmo o material sendo mais denso que a água.',
    pontos:['Teorema de Stevin: pressão aumenta com a profundidade, independente do formato do recipiente','Princípio de Pascal: F1/A1=F2/A2 — base das prensas hidráulicas (multiplicam força)','Empuxo=peso do fluido deslocado — objeto flutua se empuxo > peso próprio']},
  {trilha:'enem', materia:'Física', assunto:'Física - Hidrodinâmica',
    resumo:'Estuda fluidos em movimento através da vazão, da Equação de Continuidade e da Equação de Bernoulli, explicando desde o funcionamento de mangueiras até a sustentação de aviões.',
    aprofundamento:'Vazão (Q=V/t, volume por tempo) mede quanto fluido passa por uma seção em um intervalo de tempo. A Equação de Continuidade (A1×v1=A2×v2) diz que, num tubo com seção variável, a vazão se mantém constante — por isso o fluido acelera ao passar por uma parte mais estreita do tubo (como o dedo tampando parcialmente a saída de uma mangueira, que faz a água sair com mais velocidade). A Equação de Bernoulli relaciona pressão, velocidade e altura ao longo do escoamento de um fluido: onde a velocidade é maior, a pressão é menor, e vice-versa (para fluidos ideais, sem viscosidade). Esse princípio explica a sustentação das asas de um avião: o formato da asa faz o ar passar mais rápido por cima do que por baixo, criando uma diferença de pressão (maior embaixo, menor em cima) que gera uma força de sustentação para cima.',
    exemplo:'Tampar parcialmente a saída de uma mangueira de jardim com o dedo faz a água sair com jato mais forte e distante — pela Equação de Continuidade, reduzir a área de saída aumenta a velocidade do fluido, mantendo a vazão constante.',
    pontos:['Equação de Continuidade: A1×v1=A2×v2 — vazão constante num tubo de seção variável','Bernoulli: onde a velocidade do fluido é maior, a pressão é menor (e vice-versa)','Sustentação de aviões: diferença de pressão entre a parte de cima e de baixo da asa']},
  {trilha:'enem', materia:'Física', assunto:'Física - Termologia (Dilatação e Calorimetria)',
    resumo:'Estuda temperatura, escalas termométricas, dilatação térmica (linear, superficial e volumétrica), capacidade térmica, calor específico, calor sensível e latente, mudanças de estado físico e as formas de transmissão de calor (condução, convecção, radiação).',
    aprofundamento:'As escalas termométricas mais usadas são Celsius, Fahrenheit e Kelvin, relacionadas por fórmulas de conversão — Kelvin é a escala absoluta, usada obrigatoriamente em cálculos de gases. A dilatação térmica ocorre porque o aumento de temperatura aumenta a agitação molecular, afastando as moléculas: dilatação linear (ΔL=L0×α×ΔT) é usada para objetos alongados (trilhos, pontes), superficial e volumétrica seguem a mesma lógica em mais dimensões. A água tem dilatação anômala entre 0°C e 4°C: ao contrário da maioria das substâncias, ela se contrai ao esquentar nessa faixa (por isso o gelo, menos denso, flutua). Calor sensível (Q=m×c×ΔT) muda a temperatura sem mudar o estado físico; calor latente (Q=m×L) muda o estado físico (fusão, vaporização) sem mudar a temperatura — é por isso que a água fica "parada" em 100°C enquanto ferve, mesmo recebendo calor continuamente. As trocas de calor entre corpos em contato seguem o princípio de que o calor cedido por um corpo mais quente é igual ao calor recebido pelo mais frio, até atingirem equilíbrio térmico. Condução transmite calor por contato direto (colisão entre moléculas), convecção por movimento de massas de fluido (correntes de ar quente/frio), e radiação por ondas eletromagnéticas, sem precisar de meio material (é assim que o calor do Sol chega à Terra através do vácuo).',
    exemplo:'Uma lâmina bimetálica (dois metais com coeficientes de dilatação diferentes colados) se curva quando aquecida, porque um metal dilata mais que o outro — princípio usado em termostatos que ligam/desligam automaticamente por temperatura.',
    pontos:['Calor sensível muda temperatura (Q=mcΔT); calor latente muda estado físico (Q=mL), sem mudar temperatura','Água tem dilatação anômala entre 0°C e 4°C — por isso o gelo flutua','Condução (contato), convecção (movimento de fluido) e radiação (ondas, funciona no vácuo)']},
  {trilha:'enem', materia:'Física', assunto:'Física - Termodinâmica',
    resumo:'Estuda a relação entre calor, trabalho e energia interna dos gases, através da Teoria Cinética dos Gases, da Primeira e Segunda Lei da Termodinâmica, transformações cíclicas e o Ciclo de Carnot.',
    aprofundamento:'A Teoria Cinética explica a temperatura de um gás como reflexo da energia cinética média de agitação de suas moléculas — quanto mais quente o gás, mais rápido suas moléculas se movem. A Primeira Lei da Termodinâmica (ΔU=Q-W) diz que a variação de energia interna de um gás é igual ao calor recebido menos o trabalho realizado pelo gás — é a lei da conservação de energia aplicada a sistemas térmicos. A Segunda Lei estabelece que calor flui espontaneamente do corpo mais quente para o mais frio, nunca o contrário sem trabalho externo, e que nenhuma máquina térmica pode ter rendimento de 100% (sempre parte da energia se dissipa). O Ciclo de Carnot é o ciclo teórico de rendimento máximo possível para uma máquina térmica operando entre duas temperaturas fixas, servindo como limite teórico de comparação para motores reais.',
    exemplo:'Um motor de carro é uma máquina térmica real: parte da energia da queima do combustível vira trabalho (movimento), mas uma parcela significativa sempre se perde como calor (pelo escapamento e radiador) — nenhum motor converte 100% do combustível em movimento útil.',
    pontos:['1ª Lei da Termodinâmica: ΔU=Q-W (conservação de energia aplicada a gases)','2ª Lei: calor flui do quente para o frio espontaneamente, nunca ao contrário sem trabalho externo','Ciclo de Carnot: rendimento máximo teórico, nenhuma máquina real atinge 100%']},
  {trilha:'enem', materia:'Física', assunto:'Física - Ondulatória e Acústica',
    resumo:'Estuda os fenômenos ondulatórios (reflexão, refração, difração, interferência, polarização, ressonância) e suas aplicações no som: propriedades fisiológicas, Efeito Doppler, ondas estacionárias em cordas e tubos sonoros.',
    aprofundamento:'Ondas transportam energia sem transportar matéria, e seus principais fenômenos são: reflexão (a onda volta ao encontrar um obstáculo), refração (muda de velocidade e direção ao mudar de meio), difração (contorna obstáculos), e interferência (duas ondas se somam, podendo se reforçar — interferência construtiva — ou se anular — destrutiva). Ressonância ocorre quando um sistema é excitado numa frequência igual à sua frequência natural, amplificando a vibração — é o princípio por trás de copos de cristal que quebram com um som muito agudo na frequência certa. As propriedades fisiológicas do som são altura (relacionada à frequência: som agudo ou grave), intensidade (relacionada à amplitude: som forte ou fraco) e timbre (permite diferenciar a mesma nota tocada por instrumentos diferentes). O Efeito Doppler explica por que o som de uma sirene parece mais agudo quando a fonte se aproxima e mais grave quando se afasta — a frequência percebida muda conforme a fonte e o observador se movem um em relação ao outro. Ondas estacionárias em cordas e tubos sonoros (como em instrumentos musicais) se formam por interferência entre ondas incidentes e refletidas, criando pontos fixos (nós) e pontos de máxima vibração (ventres).',
    exemplo:'A sirene de uma ambulância parece mais aguda enquanto ela se aproxima e cai de tom assim que ela passa e se afasta — o Efeito Doppler altera a frequência percebida pelo movimento relativo entre fonte sonora e observador.',
    pontos:['Interferência: construtiva (ondas se reforçam) ou destrutiva (ondas se anulam)','Efeito Doppler: frequência percebida muda com o movimento relativo entre fonte e observador','Altura=frequência (agudo/grave); Intensidade=amplitude (forte/fraco); Timbre diferencia fontes sonoras']},
  {trilha:'enem', materia:'Física', assunto:'Física - Movimento Harmônico Simples (MHS)',
    resumo:'Estuda movimentos periódicos e oscilatórios, como o de uma mola ou de um pêndulo, caracterizados por uma força restauradora proporcional ao deslocamento e sempre direcionada para a posição de equilíbrio.',
    aprofundamento:'No MHS, a força restauradora (como a força elástica de uma mola, F=-k×x) é sempre proporcional ao deslocamento e aponta para a posição de equilíbrio — por isso o movimento se repete periodicamente. A posição, velocidade e aceleração do corpo variam de forma senoidal ao longo do tempo: a velocidade é máxima no ponto de equilíbrio (onde a força restauradora é zero) e nula nos pontos extremos (onde o deslocamento é máximo); a aceleração faz o oposto, sendo máxima nos extremos e zero no equilíbrio. O período de oscilação de um sistema massa-mola depende da massa e da constante elástica da mola, mas não da amplitude da oscilação — essa independência da amplitude é uma característica central do MHS, e é o motivo pelo qual pêndulos e sistemas oscilantes conseguem manter um ritmo estável mesmo variando a energia inicial.',
    exemplo:'Um bloco preso a uma mola, esticado e solto, oscila indefinidamente (num sistema ideal, sem atrito) — a velocidade é máxima ao passar pela posição de equilíbrio (mola relaxada) e zero nos pontos de maior esticamento/compressão.',
    pontos:['Força restauradora proporcional ao deslocamento, sempre voltada para o equilíbrio','Velocidade máxima no equilíbrio; aceleração máxima nos pontos extremos','Período do sistema massa-mola não depende da amplitude da oscilação']},
  {trilha:'enem', materia:'Física', assunto:'Física - Óptica',
    resumo:'Estuda o comportamento da luz através de espelhos planos e esféricos, refração, reflexão total, lentes esféricas, prismas e instrumentos ópticos (incluindo o olho humano). É um bloco muito aplicado a correção de problemas de visão e instrumentos como lupas e microscópios.',
    aprofundamento:'Espelhos planos formam imagens virtuais, direitas e do mesmo tamanho do objeto, sempre atrás do espelho à mesma distância que o objeto está na frente. Espelhos esféricos (côncavos e convexos) e lentes esféricas (convergentes e divergentes) formam imagens que podem ser reais ou virtuais, direitas ou invertidas, maiores ou menores que o objeto, dependendo da posição do objeto em relação ao foco — a Equação de Gauss (1/f = 1/p + 1/p-linha) relaciona distância focal, posição do objeto e posição da imagem. A refração ocorre quando a luz muda de velocidade ao mudar de meio (ar para água, por exemplo), e a reflexão total interna ocorre quando a luz tenta passar de um meio mais denso para um menos denso com ângulo maior que o ângulo limite — é o princípio das fibras óticas. Prismas separam a luz branca em suas cores componentes (dispersão) porque cada cor tem um índice de refração ligeiramente diferente. O olho humano funciona como um sistema óptico com uma lente (cristalino) que projeta imagens na retina; miopia e hipermetropia são corrigidas com lentes divergentes e convergentes, respectivamente.',
    exemplo:'Uma lupa é uma lente convergente usada com o objeto posicionado entre o foco e a lente, produzindo uma imagem virtual, direita e ampliada — o mesmo princípio óptico usado em microscópios simples.',
    pontos:['Espelho plano: imagem sempre virtual, direita e do mesmo tamanho, à mesma distância atrás do espelho','Equação de Gauss: 1/f=1/p+1/p′ — relaciona distância focal, objeto e imagem','Miopia corrigida com lente divergente; hipermetropia, com lente convergente']},
  {trilha:'enem', materia:'Física', assunto:'Física - Eletrostática',
    resumo:'Estuda cargas elétricas em repouso: processos de eletrização, Lei de Coulomb, campo elétrico, potencial elétrico, diferença de potencial (DDP) e capacitores. É a base conceitual para toda a eletricidade estudada depois.',
    aprofundamento:'Um corpo pode ser eletrizado por atrito (transferência de elétrons entre materiais diferentes), contato (transferência direta entre corpos que se tocam) ou indução (separação de cargas por aproximação, sem contato direto). A Lei de Coulomb (F=k×q1×q2/d²) descreve a força entre duas cargas elétricas, com a mesma estrutura matemática da Lei da Gravitação Universal (mas cargas de mesmo sinal se repelem, diferente da gravidade que só atrai). O campo elétrico é a região do espaço onde uma carga de prova sofreria força elétrica, e o potencial elétrico é a energia potencial elétrica por unidade de carga num ponto do campo. A diferença de potencial (DDP ou tensão) entre dois pontos é o que impulsiona o movimento de cargas elétricas (corrente elétrica) num condutor. Capacitores são dispositivos que armazenam energia elétrica na forma de campo elétrico entre duas placas condutoras separadas por um isolante — a rigidez dielétrica do isolante determina até que tensão ele suporta antes de sofrer ruptura (faísca).',
    exemplo:'Ao esfregar um balão no cabelo (eletrização por atrito), elétrons são transferidos de um material para o outro, deixando o balão eletrizado o suficiente para atrair pequenos pedaços de papel — aplicação direta da Lei de Coulomb em pequena escala.',
    pontos:['Eletrização: atrito (transferência por fricção), contato (toque direto) ou indução (sem toque)','Lei de Coulomb: F=k×q1×q2/d² — cargas de mesmo sinal se repelem, diferentes se atraem','Capacitor: armazena energia elétrica como campo elétrico entre duas placas']},
  {trilha:'enem', materia:'Física', assunto:'Física - Eletrodinâmica',
    resumo:'Estuda cargas elétricas em movimento (corrente elétrica), através das Leis de Ohm, potência elétrica, associação de resistores em série e paralelo, e circuitos com geradores e receptores.',
    aprofundamento:'A Primeira Lei de Ohm (U=R×i) relaciona tensão, resistência e corrente elétrica num resistor ôhmico. A resistência elétrica de um condutor depende de suas características físicas (comprimento, área da seção transversal e material), descritas pela Segunda Lei de Ohm. Resistores em série têm a mesma corrente passando por todos, e a resistência equivalente é a soma das resistências individuais; resistores em paralelo têm a mesma tensão em todos, e o inverso da resistência equivalente é a soma dos inversos das resistências individuais — por isso associar resistores em paralelo sempre resulta numa resistência equivalente menor que a menor resistência individual. A potência elétrica (P=U×i=R×i²=U²/R) mede a taxa de conversão de energia elétrica em outras formas (calor, luz, movimento). Circuitos reais incluem geradores (convertem outra forma de energia em elétrica, como pilhas) e receptores (convertem energia elétrica em outra forma útil, como motores) — ambos têm uma resistência interna que causa queda de tensão ou perda de energia.',
    exemplo:'Ao associar duas lâmpadas idênticas em série num circuito, se uma queimar, a outra apaga também (o circuito é interrompido); em paralelo, cada lâmpada tem seu próprio caminho, então se uma queimar a outra continua acesa — por isso instalações residenciais usam ligação em paralelo.',
    pontos:['1ª Lei de Ohm: U=R×i','Série: mesma corrente, resistências somam; Paralelo: mesma tensão, inversos das resistências somam','Instalações residenciais usam ligação em paralelo — falha em um aparelho não afeta os outros']},
  {trilha:'enem', materia:'Física', assunto:'Física - Eletromagnetismo',
    resumo:'Estuda a relação entre eletricidade e magnetismo: campo magnético gerado por fios e espiras, força magnética sobre cargas e correntes, indução eletromagnética e transformadores. É a base de motores elétricos, geradores e usinas de energia.',
    aprofundamento:'Uma corrente elétrica gera um campo magnético ao seu redor (descoberta de Oersted) — um fio reto gera campo circular, e uma espira ou solenoide (bobina) concentra e intensifica esse campo, funcionando como um ímã. A força magnética sobre uma carga em movimento (Força de Lorentz) depende da velocidade da carga, da intensidade do campo magnético e do ângulo entre eles — é o que faz partículas carregadas se moverem em trajetórias curvas dentro de um campo magnético. A indução eletromagnética (Lei de Faraday) é o fenômeno em que um campo magnético variável gera uma corrente elétrica induzida num condutor — é o princípio por trás de geradores elétricos (que convertem energia mecânica em elétrica através de bobinas girando num campo magnético) e de transformadores (que mudam a tensão de uma corrente alternada, essenciais na transmissão de energia elétrica a longas distâncias com baixa perda).',
    exemplo:'Um transformador numa usina eleva a tensão da energia gerada antes de transmiti-la por longas distâncias (reduzindo a corrente e as perdas por aquecimento nos cabos), e depois um transformador abaixador reduz essa tensão de volta a níveis seguros antes de chegar às casas.',
    pontos:['Corrente elétrica gera campo magnético (Oersted); espiras e solenoides intensificam esse campo','Indução eletromagnética (Faraday): campo magnético variável gera corrente elétrica induzida','Transformadores: essenciais para transmitir energia elétrica a longas distâncias com baixa perda']},
  {trilha:'enem', materia:'Física', assunto:'Física - Física Moderna',
    resumo:'Cobre os fundamentos da Teoria da Relatividade de Einstein e da Física Quântica: relação massa-energia, radiação de corpo negro, o modelo atômico de Bohr e o Efeito Fotoelétrico. É o bloco mais conceitual e recente da Física, com forte presença em textos de divulgação científica no ENEM.',
    aprofundamento:'A Teoria da Relatividade Restrita de Einstein estabelece que a velocidade da luz no vácuo é constante para todos os observadores, independente do seu movimento, e que tempo e espaço não são absolutos, mas dependem do referencial do observador (dilatação do tempo e contração do espaço em altas velocidades, descritas pelo fator de Lorentz). A famosa equação E=mc² mostra que massa e energia são formas equivalentes e intercambiáveis — a base teórica por trás da energia liberada em reações nucleares. A Física Quântica surgiu para explicar fenômenos que a física clássica não conseguia, como a radiação de corpo negro (que levou Planck a propor que a energia é emitida em pacotes discretos, os "quanta") e o modelo atômico de Bohr (que propôs órbitas eletrônicas com níveis de energia quantizados e definidos, explicando os espectros de emissão dos átomos). O Efeito Fotoelétrico, explicado por Einstein, mostra que a luz se comporta como partícula (fóton) ao arrancar elétrons de uma superfície metálica, sendo a energia de cada fóton proporcional à sua frequência (e não à intensidade da luz) — descoberta que rendeu a Einstein o Prêmio Nobel.',
    exemplo:'O GPS do seu celular precisa corrigir constantemente pequenas diferenças de tempo entre os relógios dos satélites (em órbita, movendo-se rápido) e os relógios na superfície da Terra, por causa dos efeitos previstos pela Teoria da Relatividade — sem essa correção, a localização teria erros de vários quilômetros.',
    pontos:['E=mc²: massa e energia são equivalentes e intercambiáveis','Física Quântica: energia é emitida em pacotes discretos ("quanta"), não de forma contínua','Efeito Fotoelétrico: luz se comporta como partícula (fóton), energia proporcional à frequência']},
  {trilha:'enem', materia:'Química', assunto:'Química - Misturas',
    resumo:'Misturas são combinações de duas ou mais substâncias que mantêm suas propriedades. O ENEM costuma explorar processos de separação de misturas em contextos de saneamento, indústria e meio ambiente.',
    aprofundamento:'A escolha do processo de separação correto depende das propriedades físicas dos componentes da mistura. Filtração separa sólido de líquido (baseado no tamanho das partículas), decantação separa líquidos de densidades diferentes que não se misturam (ou sólido que sedimenta), e destilação separa líquidos misturados com base na diferença de ponto de ebulição. O ENEM costuma contextualizar isso em situações reais de tratamento de água, purificação de combustíveis ou processos industriais, exigindo que o candidato escolha o método certo para cada tipo de mistura apresentada.',
    exemplo:'Para separar areia de água (mistura heterogênea sólido-líquido), usa-se filtração. Para separar álcool de água (mistura homogênea, líquidos com pontos de ebulição diferentes), usa-se destilação simples.',
    pontos:['Mistura homogênea: uma única fase visível (ex: água + sal)','Mistura heterogênea: mais de uma fase visível (ex: água + óleo)','Processos de separação: filtração, destilação, decantação']},
  {trilha:'enem', materia:'Química', assunto:'Química - Porcentagem e concentração',
    resumo:'Em Química, porcentagem é usada para expressar concentração de soluções — quanto soluto existe em relação à quantidade total da solução. Aparece direto em rótulos de soro, medicamentos, bebidas e produtos de limpeza, sendo um assunto de aplicação muito prática no ENEM.',
    aprofundamento:'Existem três formas principais: % massa/massa (massa de soluto ÷ massa de solução ×100), % massa/volume (massa de soluto em gramas ÷ volume de solução em mL ×100, usada em soro e medicamentos) e % volume/volume (volume de soluto ÷ volume de solução, usada em bebidas alcoólicas). O erro mais comum é aplicar a fórmula errada por não identificar qual tipo de porcentagem o rótulo está informando — o ENEM gosta de dar o rótulo de um produto real (soro, álcool, vinagre) e pedir para calcular a massa ou volume de soluto presente numa quantidade específica.',
    exemplo:'Soro fisiológico "0,9% m/v" significa 0,9 g de cloreto de sódio para cada 100 mL de solução. Em uma bolsa de 500 mL desse soro, a massa de sal é: 0,9 × (500/100) = 4,5 g.',
    pontos:['% m/v: massa de soluto (g) ÷ volume de solução (mL) ×100 — padrão em soro e remédios','% v/v: usada em bebidas alcoólicas (ex: cerveja com 5% v/v de álcool)','Sempre identifique qual tipo de porcentagem o rótulo está usando antes de calcular']},
  {trilha:'enem', materia:'Química', assunto:'Química - Estrutura Atômica',
    resumo:'Estuda a organização interna do átomo: um núcleo com prótons e nêutrons, cercado por uma eletrosfera de elétrons. Os conceitos de número atômico, número de massa, íons e isótopos formam a base para entender a tabela periódica e as ligações químicas.',
    aprofundamento:'O ENEM cobra bastante a diferença entre número atômico (Z = quantidade de prótons, identifica o elemento) e número de massa (A = prótons + nêutrons). Um erro comum é achar que o número de elétrons é fixo: em um átomo neutro, elétrons = prótons, mas ao formar um íon isso muda — cátions perdem elétrons (ficam com carga positiva), ânions ganham elétrons (carga negativa), e nada disso altera o número de massa, que depende só de prótons e nêutrons. Isótopos são átomos do mesmo elemento (mesmo Z) com números de massa diferentes (quantidade diferente de nêutrons) — é a base de aplicações como datação por carbono-14 e exames de medicina nuclear, temas frequentes de contextualização.',
    exemplo:'O carbono-14 tem Z=6 (6 prótons) e A=14 (6 prótons + 8 nêutrons); o carbono-12, mais comum, tem A=12 (6 prótons + 6 nêutrons). Ambos são isótopos de carbono, pois têm o mesmo número atômico.',
    pontos:['Z (número atômico) = quantidade de prótons, define o elemento','A (número de massa) = prótons + nêutrons','Isótopos: mesmo Z, A diferente (mesmo elemento, massa diferente)']},
  {trilha:'enem', materia:'Química', assunto:'Química - Tabela Periódica',
    resumo:'A tabela periódica organiza os elementos químicos por número atômico crescente, agrupando-os em famílias (colunas, propriedades químicas parecidas) e períodos (linhas, número de camadas eletrônicas). É a ferramenta usada para prever o comportamento químico de qualquer elemento.',
    aprofundamento:'As propriedades periódicas mais cobradas são raio atômico, eletronegatividade e energia de ionização. O raio atômico aumenta descendo numa família (mais camadas eletrônicas) e diminui da esquerda para a direita num período (mais prótons puxando os elétrons para mais perto do núcleo). A eletronegatividade tem comportamento oposto ao raio: aumenta da esquerda para a direita e de baixo para cima, com o flúor sendo o elemento mais eletronegativo da tabela. O ENEM gosta de contextualizar com aplicações reais: por que metais alcalinos (família 1A) são tão reativos (perdem facilmente o único elétron da última camada) e por que os gases nobres (família 8A) são estáveis e pouco reativos (camada de valência completa).',
    exemplo:'Comparando sódio (Na, família 1A) e cloro (Cl, família 7A) no mesmo período: o cloro tem raio atômico menor e eletronegatividade muito maior, por isso "atrai" o elétron do sódio na formação do sal de cozinha (NaCl).',
    pontos:['Raio atômico: aumenta descendo na família, diminui da esquerda para a direita no período','Eletronegatividade: comportamento oposto ao raio atômico (flúor é o mais eletronegativo)','Família 1A (alcalinos): muito reativos; Família 8A (gases nobres): estáveis']},
  {trilha:'enem', materia:'Química', assunto:'Química - Ligações Químicas',
    resumo:'Ligações químicas explicam como os átomos se unem para formar substâncias mais estáveis, geralmente buscando completar a camada de valência. Os três tipos principais são iônica, covalente e metálica, cada uma responsável por um conjunto característico de propriedades físicas.',
    aprofundamento:'A ligação iônica ocorre entre metal e não-metal (com transferência de elétrons), forma cristais sólidos com alto ponto de fusão e só conduz eletricidade quando dissolvida em água ou fundida (nunca no estado sólido). A ligação covalente ocorre entre não-metais (com compartilhamento de elétrons), forma moléculas com propriedades muito variadas — de gases a sólidos — e geralmente não conduz eletricidade. A ligação metálica ocorre entre átomos de metais e explica a maleabilidade e a alta condutividade elétrica e térmica através do chamado "mar de elétrons" livres que circula entre os átomos. O erro mais comum é achar que toda ligação envolvendo um metal é automaticamente iônica — na prática, o tipo de ligação depende da diferença de eletronegatividade entre os átomos envolvidos, não apenas de um deles ser metal.',
    exemplo:'No cloreto de sódio (NaCl), o sódio perde 1 elétron e o cloro ganha, formando íons Na⁺ e Cl⁻ que se atraem eletrostaticamente — ligação iônica. Já no gás oxigênio (O₂), os dois átomos são não-metais e compartilham elétrons — ligação covalente.',
    pontos:['Iônica: metal + não-metal, transferência de elétrons, conduz eletricidade dissolvido ou fundido','Covalente: não-metal + não-metal, compartilhamento de elétrons','Metálica: metal + metal, "mar de elétrons" explica condutividade e maleabilidade']},
  {trilha:'enem', materia:'Química', assunto:'Química - Nox e Reações Redox',
    resumo:'O número de oxidação (Nox) indica a carga que um átomo teria se a ligação fosse totalmente iônica, e é usado para identificar reações de oxidação (perda de elétrons) e redução (ganho de elétrons) — as duas sempre acontecem juntas nas reações de óxido-redução (redox).',
    aprofundamento:'A regra prática mais usada é: quem oxida perde elétron e tem o Nox aumentado; quem reduz ganha elétron e tem o Nox diminuído. O ENEM costuma contextualizar isso com corrosão de metais (enferrujamento), funcionamento de pilhas e baterias, e processos biológicos como a respiração celular. Um erro muito comum é confundir "quem sofre oxidação" com "agente oxidante": o agente oxidante é a substância que provoca a oxidação da outra, mas ela mesma sofre redução no processo — parece contraintuitivo, mas é assim que a nomenclatura funciona.',
    exemplo:'No enferrujamento, o ferro metálico (Nox 0) perde elétrons e vira Fe³⁺ (Nox +3) — é oxidado. O oxigênio do ar ganha esses elétrons e é reduzido. Nesse processo, o ferro é o agente redutor e o oxigênio é o agente oxidante.',
    pontos:['Oxidação: perde elétron, Nox aumenta','Redução: ganha elétron, Nox diminui','Agente oxidante sofre redução; agente redutor sofre oxidação']},
  {trilha:'enem', materia:'Química', assunto:'Química - Funções Inorgânicas',
    resumo:'As quatro funções inorgânicas principais são ácidos, bases, sais e óxidos, classificadas pelos íons que liberam em solução aquosa ou pela composição dos elementos. Cada função tem propriedades e aplicações práticas muito cobradas em contextos do cotidiano.',
    aprofundamento:'Ácidos liberam H⁺ em solução aquosa (ex: o ácido clorídrico do suco gástrico), bases liberam OH⁻ (ex: hidróxido de sódio, a soda cáustica), sais são formados pela reação de neutralização entre um ácido e uma base (ex: cloreto de sódio, o sal de cozinha), e óxidos são compostos binários que contêm oxigênio (ex: CO₂, o gás carbônico). O pH é a ferramenta usada para medir acidez ou basicidade: valores menores que 7 indicam meio ácido, igual a 7 é neutro, e maiores que 7 é básico — o ENEM adora contextualizar isso com chuva ácida, pH do sangue, azia estomacal e produtos de limpeza doméstica.',
    exemplo:'Ao tomar um antiácido (uma base fraca) para aliviar azia (excesso de ácido clorídrico no estômago), ocorre uma reação de neutralização: ácido + base → sal + água, reduzindo a acidez estomacal.',
    pontos:['Ácidos: liberam H⁺ em água, pH menor que 7','Bases: liberam OH⁻ em água, pH maior que 7','Sal + água = resultado da reação de neutralização entre ácido e base']},
  {trilha:'enem', materia:'Química', assunto:'Química - Estequiometria',
    resumo:'Estequiometria é o cálculo das quantidades de reagentes e produtos envolvidos numa reação química, usando a proporção definida pelos coeficientes da equação balanceada. É um dos assuntos mais cobrados porque exige integrar mol, massa molar e proporção numa única questão.',
    aprofundamento:'O passo a passo padrão é: balancear a equação química, converter os dados fornecidos (massa, volume ou número de partículas) para mol, aplicar a proporção estequiométrica dos coeficientes para descobrir a quantidade da substância pedida, e converter o resultado de volta para a unidade solicitada pela questão. O erro mais comum é esquecer de balancear a equação antes de montar a proporção, ou tentar usar a massa da substância diretamente sem antes converter para mol. Questões de reagente limitante são as mais difíceis do tópico: quando são fornecidas quantidades de dois reagentes ao mesmo tempo, é preciso descobrir qual deles "acaba primeiro" — esse reagente limita a quantidade máxima de produto que pode ser formada.',
    exemplo:'Na reação 2H₂ + O₂ → 2H₂O, se reagem 4 mol de H₂, a proporção 2:1 mostra que são necessários 2 mol de O₂ para reagir completamente, formando 4 mol de água.',
    pontos:['Sempre balanceie a equação antes de calcular qualquer proporção','Converta tudo para mol antes de aplicar a proporção dos coeficientes','Reagente limitante: o que acaba primeiro determina a quantidade máxima de produto formado']},
  {trilha:'enem', materia:'Química', assunto:'Química - Soluções',
    resumo:'Soluções são misturas homogêneas formadas por soluto (a substância que se dissolve) e solvente (a substância que dissolve), caracterizadas pela concentração, que pode ser expressa em diferentes unidades como g/L, mol/L (molaridade) ou porcentagem.',
    aprofundamento:'A molaridade (mol/L) é a unidade mais cobrada no ENEM porque conecta diretamente com estequiometria: é o número de mols de soluto dividido pelo volume da solução em litros. Diluição é um tópico muito recorrente, resolvido com a fórmula C1×V1 = C2×V2 — a quantidade de soluto (em mols) não muda ao diluir, só o volume aumenta, e por isso a concentração diminui proporcionalmente. Um erro comum é confundir "diluir" com "adicionar mais soluto": diluir significa sempre adicionar mais solvente (normalmente água), o que reduz a concentração sem alterar a quantidade de soluto presente.',
    exemplo:'Uma solução de 2 mol/L com 100 mL é diluída até atingir 500 mL. Usando C1×V1 = C2×V2: 2 × 100 = C2 × 500 → C2 = 0,4 mol/L (a concentração cai, mas a quantidade de soluto em mols continua a mesma).',
    pontos:['Molaridade = mol de soluto ÷ volume da solução em litros','Diluição: C1×V1 = C2×V2 (a quantidade de soluto não muda, só o volume)','Diluir sempre significa adicionar solvente, nunca soluto']},
  {trilha:'enem', materia:'Química', assunto:'Química - Termoquímica',
    resumo:'Termoquímica estuda as trocas de calor que ocorrem durante as reações químicas. Toda reação libera ou absorve energia, e essa variação é medida pela entalpia (H) — um assunto muito aplicado no ENEM em contextos de combustíveis, alimentos e aquecimento global.',
    aprofundamento:'A variação de entalpia (ΔH = entalpia dos produtos − entalpia dos reagentes) define o tipo de reação: se ΔH é negativo, a reação é exotérmica (libera calor para o ambiente); se ΔH é positivo, é endotérmica (absorve calor do ambiente). A causa física por trás disso é o balanço entre quebrar ligações dos reagentes (processo que sempre consome energia) e formar ligações nos produtos (processo que sempre libera energia) — se formar libera mais do que quebrar consumiu, sobra energia e ela é liberada (exotérmica); se quebrar consome mais do que formar libera, falta energia e ela precisa vir do ambiente (endotérmica). Um erro muito comum é achar que ΔH negativo significa "menos energia" — na verdade significa que o sistema perdeu energia para a vizinhança, esquentando o ambiente ao redor.',
    exemplo:'Ao dissolver nitrato de amônio em água, a solução esfria bastante — é o princípio das bolsas de gelo instantâneo usadas em lesões esportivas: a dissolução é endotérmica (ΔH > 0), pois o sistema retira calor da água ao redor. Já a queima de um palito de fósforo libera calor sentido na mão — reação exotérmica (ΔH < 0).',
    pontos:['ΔH negativo = exotérmica (libera calor); ΔH positivo = endotérmica (absorve calor)','A causa: energia para quebrar ligações vs. energia liberada ao formar novas ligações','ΔH°f de substância simples no estado padrão é sempre igual a zero (convenção)']},
  {trilha:'enem', materia:'Química', assunto:'Química - Cinética Química',
    resumo:'Cinética Química estuda a velocidade das reações químicas e os fatores que a alteram — como temperatura, concentração, superfície de contato e presença de catalisadores. É a base para entender por que alguns processos são instantâneos (explosão) e outros extremamente lentos (enferrujamento).',
    aprofundamento:'A velocidade de uma reação depende de quantas colisões efetivas acontecem entre as partículas dos reagentes por unidade de tempo — uma colisão só é efetiva se tiver energia suficiente (energia de ativação) e orientação geométrica adequada. Aumentar a temperatura acelera a reação porque as partículas se movem mais rápido, colidindo com mais frequência e mais energia. Aumentar a concentração dos reagentes também acelera, pois há mais partículas por volume, aumentando a chance de colisão. Aumentar a superfície de contato (ex: pulverizar um sólido em vez de deixá-lo em pedaço único) expõe mais área para reagir. Já o catalisador acelera a reação sem ser consumido, porque oferece um "caminho alternativo" com menor energia de ativação — ele não muda se a reação vai acontecer, só torna mais fácil ela acontecer mais rápido. Um erro comum é achar que o catalisador participa da equação química final ou que é consumido no processo — ele é regenerado ao final da reação.',
    exemplo:'Um comprimido efervescente dissolve mais rápido em água morna do que em água gelada (efeito da temperatura), e mais rápido triturado do que inteiro (efeito da superfície de contato). O catalisador da panela de pressão industrial em reações químicas funciona de forma parecida ao catalisador do escapamento de um carro: acelera a reação de gases poluentes sem ser consumido no processo.',
    pontos:['Velocidade de reação depende de colisões efetivas (energia suficiente + orientação correta)','Temperatura, concentração e superfície de contato aumentam a velocidade da reação','Catalisador acelera a reação diminuindo a energia de ativação, sem ser consumido']},
  {trilha:'enem', materia:'Química', assunto:'Química - Equilíbrio Químico',
    resumo:'Equilíbrio químico ocorre quando, numa reação reversível, as velocidades das reações direta e inversa se igualam, fazendo as concentrações de reagentes e produtos permanecerem constantes (mas não nulas). É a base para entender processos industriais como a síntese da amônia e fenômenos biológicos como o transporte de oxigênio no sangue.',
    aprofundamento:'O Princípio de Le Chatelier prevê como um sistema em equilíbrio reage a perturbações: se você aumenta a concentração de um reagente, o equilíbrio se desloca no sentido de consumir esse excesso (formando mais produto); se aumenta a pressão num sistema gasoso, o equilíbrio se desloca para o lado com menor número de mols de gás; se aumenta a temperatura, desloca no sentido endotérmico da reação (absorvendo o calor extra). O ENEM adora contextualizar isso com processos industriais (síntese da amônia, produção de ácido sulfúrico) e fenômenos naturais (equilíbrio do CO2 dissolvido em oceanos, hemoglobina e oxigênio). Erro comum: achar que equilíbrio significa "reação parada" — na verdade ambas as reações (direta e inversa) continuam acontecendo, só que na mesma velocidade, por isso as concentrações não mudam mais.',
    exemplo:'Na hemoglobina do sangue, o equilíbrio Hb + O2 ⇌ HbO2 se desloca para a direita nos pulmões (alta concentração de O2, capturando oxigênio) e para a esquerda nos tecidos (baixa concentração de O2, liberando oxigênio) — um exemplo perfeito de deslocamento de equilíbrio por variação de concentração.',
    pontos:['Equilíbrio: velocidade direta = velocidade inversa (reação não para, só estabiliza)','Le Chatelier: sistema sempre reage contra a perturbação aplicada','Aumentar pressão desloca o equilíbrio para o lado com menos mols de gás']},
  {trilha:'enem', materia:'Química', assunto:'Química - Eletroquímica',
    resumo:'Eletroquímica estuda a relação entre reações químicas e corrente elétrica, dividindo-se em pilhas (energia química vira energia elétrica, processo espontâneo) e eletrólise (energia elétrica força uma reação não espontânea a ocorrer). É a base de baterias, carregadores e processos de galvanoplastia.',
    aprofundamento:'Numa pilha, o eletrodo onde ocorre oxidação é chamado de ânodo (polo negativo) e onde ocorre redução é o cátodo (polo positivo) — os elétrons fluem espontaneamente do ânodo para o cátodo pelo fio externo. Na eletrólise, o processo se inverte em termos de energia: uma fonte externa força elétrons a fluir no sentido contrário ao espontâneo, permitindo reações que não ocorreriam sozinhas — é assim que se recobre um objeto de metal barato com uma fina camada de ouro ou cromo (eletrodeposição). Um erro muito comum é confundir os nomes dos polos entre pilha e eletrólise: na pilha o cátodo é positivo, mas na eletrólise o cátodo é negativo — o nome do eletrodo não muda (ânodo=oxidação, cátodo=redução), mas a polaridade sim.',
    exemplo:'A bateria de um carro é uma pilha (transforma energia química em elétrica para dar partida no motor). Já o processo de banhar uma joia barata com uma fina camada de ouro é uma eletrólise (usa energia elétrica externa para depositar o metal).',
    pontos:['Pilha: processo espontâneo, energia química → energia elétrica','Eletrólise: processo não espontâneo, precisa de energia elétrica externa','Ânodo = oxidação; Cátodo = redução (em ambos os casos, mas a polaridade se inverte)']},
  {trilha:'enem', materia:'Química', assunto:'Química - Propriedades Coligativas',
    resumo:'Propriedades coligativas são efeitos causados pela presença de um soluto não volátil numa solução, que alteram propriedades físicas do solvente independentemente de qual soluto seja — o que importa é a quantidade de partículas dissolvidas, não sua natureza química.',
    aprofundamento:'Existem quatro efeitos principais: tonoscopia (diminuição da pressão de vapor), ebulioscopia (aumento do ponto de ebulição), crioscopia (diminuição do ponto de congelamento) e osmose (passagem de solvente através de uma membrana semipermeável, da solução menos concentrada para a mais concentrada). O ENEM adora contextualizar com o cotidiano: jogar sal nas ruas para derreter gelo (crioscopia), adicionar sal à água do macarrão para ferver em temperatura mais alta (ebulioscopia), ou conservar alimentos com sal/açúcar (osmose retirando água das células de microrganismos, impedindo sua proliferação). Erro comum: para solutos iônicos que se dissociam em vários íons (como o NaCl), é preciso considerar o número total de partículas geradas, não apenas o número de "moléculas" de soluto adicionadas.',
    exemplo:'Colocar sal na estrada durante o inverno faz o gelo derreter em temperaturas abaixo de 0°C, porque a presença do sal dissolvido diminui o ponto de congelamento da água — crioscopia aplicada na prática.',
    pontos:['Tonoscopia: diminui a pressão de vapor','Ebulioscopia: aumenta o ponto de ebulição; Crioscopia: diminui o ponto de congelamento','Osmose: solvente atravessa membrana da solução menos concentrada para a mais concentrada']},
  {trilha:'enem', materia:'Química', assunto:'Química - Química Orgânica',
    resumo:'Química Orgânica estuda os compostos formados principalmente por carbono e hidrogênio, base de toda a vida e de inúmeros materiais do dia a dia (combustíveis, plásticos, medicamentos, alimentos). É um dos blocos mais extensos do ENEM, cobrando funções orgânicas, cadeias carbônicas e isomeria.',
    aprofundamento:'O carbono forma até 4 ligações covalentes simultâneas, o que permite cadeias longuíssimas e ramificadas — essa versatilidade explica a existência de milhões de compostos orgânicos diferentes. As principais funções cobradas no ENEM são: hidrocarbonetos (só C e H, base dos combustíveis), álcoois (grupo -OH ligado a carbono saturado, como o etanol), ácidos carboxílicos (grupo -COOH, responsável pela acidez do vinagre), ésteres (responsáveis por aromas de frutas), e aminas/amidas (presentes em proteínas e medicamentos). Isomeria é central: compostos com a mesma fórmula molecular mas estrutura diferente (e por isso propriedades diferentes) — a isomeria plana (cadeia, posição, função) se distingue pela estrutura visível na fórmula, enquanto a isomeria espacial (geométrica cis-trans, óptica) depende da disposição tridimensional dos átomos.',
    exemplo:'O etanol (álcool combustível, C2H6O) e o éter dimetílico (usado como propelente, também C2H6O) têm exatamente a mesma fórmula molecular, mas propriedades físicas e químicas completamente diferentes — são isômeros de função, um dos exemplos mais cobrados no ENEM.',
    pontos:['Carbono forma 4 ligações covalentes, permitindo cadeias longas e ramificadas','Principais funções: hidrocarbonetos, álcoois, ácidos carboxílicos, ésteres, aminas','Isomeria: mesma fórmula molecular, estruturas e propriedades diferentes']},
  {trilha:'enem', materia:'Química', assunto:'Química - Estudo dos Gases',
    resumo:'O estudo dos gases descreve como pressão, volume, temperatura e quantidade de matéria se relacionam através das leis dos gases ideais — fundamentais para entender desde o funcionamento de uma panela de pressão até processos industriais e fenômenos atmosféricos.',
    aprofundamento:'A equação geral dos gases ideais é PV = nRT (pressão × volume = número de mols × constante universal dos gases × temperatura em Kelvin). As leis específicas são casos particulares dela: Lei de Boyle (temperatura constante: P e V inversamente proporcionais), Lei de Charles (pressão constante: V e T diretamente proporcionais — um balão esquenta e expande), e Lei de Gay-Lussac (volume constante: P e T diretamente proporcionais — por isso latas de spray não podem ser aquecidas). Um erro muito comum é usar temperatura em Celsius nos cálculos — todas as fórmulas de gases exigem temperatura em Kelvin (K = °C + 273).',
    exemplo:'Uma lata de desodorante aerossol não deve ser jogada no fogo porque o aumento de temperatura (a volume constante da lata) aumenta muito a pressão interna do gás, podendo causar explosão — aplicação direta da Lei de Gay-Lussac.',
    pontos:['PV = nRT — sempre use temperatura em Kelvin (K = °C + 273)','Boyle: temperatura constante, P e V inversamente proporcionais','Gay-Lussac: volume constante, P e T diretamente proporcionais (por isso spray não pode esquentar)']},
  {trilha:'enem', materia:'Química', assunto:'Química - Radioatividade',
    resumo:'Radioatividade é a emissão espontânea de partículas ou energia por núcleos atômicos instáveis, buscando atingir uma configuração mais estável. É a base de aplicações médicas (radioterapia, exames), geração de energia nuclear e datação de fósseis e materiais antigos.',
    aprofundamento:'Existem três tipos principais de emissão: partículas alfa (núcleos de hélio, baixo poder de penetração, barradas até por uma folha de papel), partículas beta (elétrons de alta velocidade, penetração média, barradas por uma placa de alumínio) e radiação gama (energia pura, sem massa, altíssimo poder de penetração, precisa de chumbo ou concreto grosso para ser barrada). O tempo de meia-vida é o tempo necessário para metade dos átomos radioativos de uma amostra se desintegrarem — é constante para cada isótopo, e é a base do método de datação por carbono-14, usado para descobrir a idade de fósseis e objetos arqueológicos. Erro comum: achar que meia-vida significa "toda a substância desaparece" nesse tempo — na verdade, a cada meia-vida, resta sempre a metade do que havia antes, nunca chegando exatamente a zero.',
    exemplo:'Se um material radioativo tem meia-vida de 10 anos e começamos com 100 g, restam 50 g após 10 anos, 25 g após 20 anos e 12,5 g após 30 anos — a quantidade cai pela metade a cada meia-vida, não zera de uma vez.',
    pontos:['Alfa: baixa penetração (barrada por papel); Beta: média (barrada por alumínio); Gama: altíssima (precisa de chumbo)','Meia-vida: tempo para metade dos átomos se desintegrarem','A cada meia-vida, a quantidade cai pela metade — nunca zera de uma vez']},
  {trilha:'enem', materia:'Química', assunto:'Química - Química Ambiental',
    resumo:'Química Ambiental estuda os processos químicos que afetam o meio ambiente — poluição do ar, da água e do solo, efeito estufa, chuva ácida e a camada de ozônio — sendo um dos temas mais contextualizados do ENEM, por conectar química com questões sociais e ambientais atuais.',
    aprofundamento:'O efeito estufa é um fenômeno natural e necessário (sem ele, a Terra seria muito mais fria), mas o aumento excessivo de gases como CO2 e metano pela atividade humana intensifica esse efeito, causando aquecimento global acima do normal. A chuva ácida ocorre quando óxidos de enxofre e nitrogênio, emitidos por indústrias e veículos, reagem com a água da atmosfera, formando ácidos que caem com a chuva, prejudicando solos, plantas e construções. A destruição da camada de ozônio (que filtra radiação ultravioleta nociva) foi historicamente ligada aos CFCs, usados em aerossóis e refrigeração antigos, levando ao Protocolo de Montreal, um dos acordos ambientais internacionais mais citados no ENEM por seu sucesso relativo. Erro comum: confundir efeito estufa com buraco na camada de ozônio — são fenômenos diferentes, com causas e gases diferentes, mesmo estando ambos relacionados à atmosfera.',
    exemplo:'A queima de combustíveis fósseis em grande escala libera CO2, intensificando o efeito estufa; já os antigos gases CFC de sprays e geladeiras destruíam moléculas de ozônio na estratosfera, criando o buraco na camada de ozônio — dois problemas ambientais distintos, frequentemente confundidos.',
    pontos:['Efeito estufa: gases como CO2 intensificam o aquecimento natural da Terra','Chuva ácida: óxidos de enxofre/nitrogênio reagem com a água da atmosfera','Camada de ozônio: destruída historicamente por CFCs — problema diferente do efeito estufa']},

  // ---------------- POLÍCIA MILITAR ----------------
  {trilha:'pm', materia:'Português', assunto:'Concordância verbal',
    resumo:'Concordância verbal é a regra que faz o verbo concordar em número e pessoa com o sujeito da oração. É um dos pontos mais cobrados em provas de concurso, especialmente em casos de sujeito composto ou expressões de tempo.',
    aprofundamento:'O verbo "fazer" indicando tempo decorrido é impessoal e nunca flexiona no plural: "Faz dois anos", nunca "Fazem dois anos". O mesmo vale para o verbo "haver" no sentido de existir: "Havia muitos problemas" (nunca "Haviam muitos problemas"). Já quando o sujeito composto vem antes do verbo, a concordância vai para o plural: "O policial e o sargento chegaram" (não "chegou"). Bancas de concurso adoram testar exatamente essas exceções, porque são pontos onde o erro "soa natural" na fala cotidiana, mas é gramaticalmente incorreto na norma culta.',
    exemplo:'"Faz três meses que o concurso foi anunciado" (correto, verbo impessoal) — nunca "Fazem três meses".',
    pontos:['"Faz" (tempo decorrido) não flexiona no plural: "Faz dois anos"','Sujeito composto antes do verbo: verbo no plural','Verbo "haver" no sentido de existir é impessoal, fica sempre no singular']},
  {trilha:'pm', materia:'Português', assunto:'Ortografia',
    resumo:'Questões de ortografia em concursos testam o domínio das regras oficiais da língua, incluindo acentuação e grafia de palavras comumente confundidas.',
    aprofundamento:'As proparoxítonas (palavras com sílaba tônica na antepenúltima sílaba) são SEMPRE acentuadas, sem exceção — é uma das regras mais seguras de acentuação em português. Já a diferença entre sufixos "-izar" e "-isar" segue um padrão: a maioria das palavras formadas a partir de substantivos com "-ização" leva Z (ex: organizar/organização, priorizar/priorização); poucas exceções usam S (ex: analisar, catequizar é exceção rara). Bancas de concurso costumam explorar justamente essas palavras de grafia menos intuitiva.',
    exemplo:'"Prioridade" e "priorizar" levam Z porque derivam de "organização"-tipo de formação; já "analisar" é uma das exceções que leva S.',
    pontos:['Atenção a palavras com "z" vs "s" em sufixos (-izar, -isar)','Revisar acentuação de proparoxítonas (sempre acentuadas)','Praticar com listas de palavras frequentes em provas anteriores']},
  {trilha:'pm', materia:'Raciocínio Lógico', assunto:'Sequências lógicas',
    resumo:'Questões de sequência lógica pedem para identificar o padrão de formação de uma lista de números ou figuras e prever o próximo elemento.',
    aprofundamento:'O primeiro passo é sempre calcular a diferença entre termos consecutivos: se a diferença é constante, é uma progressão aritmética (soma sempre o mesmo valor); se a razão entre termos consecutivos é constante, é uma progressão geométrica (multiplica sempre pelo mesmo valor). Sequências mais difíceis combinam duas operações (ex: soma um número que também cresce) ou alternam padrões entre posições pares e ímpares — por isso é essencial testar a hipótese em pelo menos 3-4 termos antes de responder, não só nos dois primeiros.',
    exemplo:'Sequência 3, 6, 12, 24: a razão entre termos consecutivos é sempre 2 (progressão geométrica), então o próximo termo é 24×2 = 48.',
    pontos:['Verifique se é soma, multiplicação ou outra operação constante','Compare a razão entre termos consecutivos','Teste sua hipótese em pelo menos 3 termos antes de responder']},
  {trilha:'pm', materia:'Raciocínio Lógico', assunto:'Proposições lógicas',
    resumo:'Lógica proposicional trabalha com afirmações que podem ser verdadeiras ou falsas, e como elas se relacionam através de conectivos (e, ou, se-então).',
    aprofundamento:'A negação de proposições com "e" (conjunção) e "ou" (disjunção) segue as Leis de De Morgan: a negação de "A e B" é "não A OU não B" (troca o conectivo!), e a negação de "A ou B" é "não A E não B". Esse é o erro mais comum em provas: candidatos negam cada parte da proposição mas esquecem de trocar o conectivo. Também é essencial lembrar que a negação de "Todo A é B" não é "Nenhum A é B" (isso seria um erro grave) — a negação correta é "Existe pelo menos um A que não é B".',
    exemplo:'Negação de "Está chovendo E está frio": não é "Não está chovendo E não está frio" (errado). O correto é "Não está chovendo OU não está frio" (troca o conectivo, pela Lei de De Morgan).',
    pontos:['"Todo A é B" não implica "Todo B é A"','Negação de "Todo A é B" é "Existe A que não é B"','Cuidado com pegadinhas de negação dupla']},
  {trilha:'pm', materia:'Direito Constitucional', assunto:'Direitos e garantias fundamentais',
    resumo:'A Constituição Federal de 1988 dedica um título inteiro aos direitos e garantias fundamentais, que são a base de proteção do cidadão frente ao Estado.',
    aprofundamento:'O Título II da Constituição (artigos 5º a 17) reúne os direitos e garantias fundamentais, divididos em cinco categorias: direitos individuais e coletivos (art. 5º), direitos sociais (art. 6º a 11), nacionalidade (art. 12-13), direitos políticos (art. 14-16) e partidos políticos (art. 17). Para quem presta concurso policial, o art. 5º é o mais cobrado, por tratar diretamente de temas como devido processo legal, prisão em flagrante, e vedação à tortura — temas centrais na atuação policial diária.',
    exemplo:'O art. 5º, LXVIII, garante o habeas corpus sempre que alguém sofrer ou se achar ameaçado de sofrer violência ou coação em sua liberdade de locomoção — um dos remédios constitucionais mais cobrados em provas policiais.',
    pontos:['Título II da Constituição concentra os principais direitos','Direitos individuais, coletivos, sociais e políticos','Muito cobrado em conjunto com Direitos Humanos']},
  {trilha:'pm', materia:'Direitos Humanos', assunto:'Conceitos gerais',
    resumo:'Direitos Humanos são princípios que garantem dignidade a todo ser humano, independente de nacionalidade, gênero ou condição social, sendo universais e indivisíveis.',
    aprofundamento:'Os três princípios mais cobrados em provas policiais são: universalidade (valem para toda pessoa, sem distinção), indivisibilidade (um direito não pode ser sacrificado em nome de outro — ex: não se pode justificar tortura alegando necessidade de investigação) e inalienabilidade (não podem ser retirados ou renunciados pela própria pessoa). Para a atuação policial, entender esses princípios é essencial porque o uso da força deve sempre respeitar a dignidade humana do indivíduo abordado, mesmo em situações de conflito ou prisão.',
    exemplo:'Mesmo durante uma prisão legítima, o uso de força deve ser proporcional e nunca incluir tortura ou tratamento degradante — isso é reflexo direto do princípio da indivisibilidade dos Direitos Humanos.',
    pontos:['Universalidade: valem para todas as pessoas','Indivisibilidade: um direito não pode ser separado do outro','Muito relevante na atuação policial diária']},
  {trilha:'pm', materia:'Legislação de Trânsito', assunto:'CTB - infrações',
    resumo:'O Código de Trânsito Brasileiro classifica as infrações por gravidade (leve, média, grave, gravíssima), o que define a pontuação e a penalidade aplicada.',

const SUPABASE_URL = 'https://hsrvpuryxgnmfkgvsawq.supabase.co';
