function iniciarSimulado(qtd){
  const poolTrilha = BANCO_QUESTOES.filter(q=>q.trilha===trilhaAtual);
  const embaralhadas = [...poolTrilha].sort(()=>Math.random()-0.5).slice(0, qtd);
  simuladoAtivo = {
    questoes: embaralhadas,
    indice: 0,
    acertos: 0,
    respostas: [],
    tempoRestante: qtd * 90, // 90s por questão
  };
  simuladoAtivo.timerId = setInterval(()=>{
    simuladoAtivo.tempoRestante--;
    if(simuladoAtivo.tempoRestante <= 0){
      clearInterval(simuladoAtivo.timerId);
      finalizarSimulado();
    }else{
      atualizarTimerDisplay();
    }
  }, 1000);
  render();
}

function atualizarTimerDisplay(){
  const el = document.getElementById('timer-display');
  if(!el || !simuladoAtivo) return;
  const m = Math.floor(simuladoAtivo.tempoRestante/60);
  const s = simuladoAtivo.tempoRestante % 60;
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

async function finalizarSimulado(){
  if(simuladoAtivo.timerId) clearInterval(simuladoAtivo.timerId);
  await registrarSimulado(trilhaAtual, simuladoAtivo.questoes.length, simuladoAtivo.acertos);
  simuladoAtivo.finalizado = true;
  render();
}

function renderSimulado(main){
  if(!simuladoAtivo){
    const poolTrilha = BANCO_QUESTOES.filter(q=>q.trilha===trilhaAtual);
    main.innerHTML = `
      <div class="page-title">Simulado — ${TRILHAS[trilhaAtual].nome}</div>
      <div class="page-sub">Teste seu ritmo com tempo cronometrado, igual no dia da prova.</div>
      <div class="card">
        <h3>Escolha o tamanho do simulado (banco atual tem ${poolTrilha.length} questões)</h3>
        <div class="filter-row">
          <button class="btn" data-qtd="5">5 questões (rápido)</button>
          <button class="btn secondary" data-qtd="${Math.min(10,poolTrilha.length)}">${Math.min(10,poolTrilha.length)} questões</button>
          <button class="btn secondary" data-qtd="${poolTrilha.length}">${poolTrilha.length} questões (todas)</button>
        </div>
      </div>
    `;
    main.querySelectorAll('[data-qtd]').forEach(b=>{
      b.addEventListener('click', ()=> iniciarSimulado(parseInt(b.dataset.qtd)));
    });
    return;
  }

  if(simuladoAtivo.finalizado){
    const s = simuladoAtivo;
    main.innerHTML = `
      <div class="page-title">Resultado do Simulado</div>
      <div class="nota-total">
        <div class="num">${s.acertos}/${s.questoes.length}</div>
        <div class="lbl">questões corretas</div>
      </div>
      <div class="card">
        <h3>Revisão</h3>
        ${s.questoes.map((q,i)=>{
          const r = s.respostas[i];
          return `<div class="comp-row">
            <span class="comp-name">${i+1}. ${q.assunto}</span>
            <span class="comp-score" style="color:${r && r.correta ? 'var(--ok-green)' : 'var(--clay-red)'}">${r ? r.respostaDada : '—'} ${r && r.correta ? '✓' : '✗'} (gabarito: ${q.correta})</span>
          </div>`;
        }).join('')}
      </div>
      <button class="btn" id="btn-novo-simulado">Fazer outro simulado</button>
    `;
    document.getElementById('btn-novo-simulado').addEventListener('click', ()=>{
      simuladoAtivo = null;
      render();
    });
    return;
  }

  const q = simuladoAtivo.questoes[simuladoAtivo.indice];
  const pctProgresso = Math.round((simuladoAtivo.indice / simuladoAtivo.questoes.length) * 100);
  main.innerHTML = `
    <div class="page-title">Simulado em andamento</div>
    <div class="timer-box" id="timer-display">--:--</div>
    <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pctProgresso}%"></div></div>
    <div class="card question-card">
      <span class="tag">Questão ${simuladoAtivo.indice+1} de ${simuladoAtivo.questoes.length} · ${q.materia}</span>
      <div class="question-text">${q.enunciado}</div>
      <div class="opcoes"></div>
    </div>
  `;
  atualizarTimerDisplay();
  const opcoesDiv = main.querySelector('.opcoes');
  Object.entries(q.alternativas).forEach(([letra, texto])=>{
    const opt = document.createElement('div');
    opt.className = 'opt';
    opt.innerHTML = `<span class="opt-letter">${letra})</span><span>${texto}</span>`;
    opt.addEventListener('click', ()=>{
      const correta = letra===q.correta;
      if(correta) simuladoAtivo.acertos++;
      simuladoAtivo.respostas.push({respostaDada:letra, correta});
      simuladoAtivo.indice++;
      if(simuladoAtivo.indice >= simuladoAtivo.questoes.length){
        finalizarSimulado();
      }else{
        render();
      }
    });
    opcoesDiv.appendChild(opt);
  });
}

/* ---------- REDAÇÃO (correção por IA) ---------- */
function renderRedacao(main){
  main.innerHTML = `
    <div class="page-title">Redação</div>
    <div class="page-sub">Escreva sua redação dissertativo-argumentativa e receba correção baseada nas 5 competências do ENEM.</div>
    <div class="card">
      <h3>Tema: "Os desafios da educação no interior do Brasil"</h3>
      <textarea id="txt-redacao" placeholder="Escreva sua redação aqui (mínimo recomendado: 7 linhas)..."></textarea>
      <div style="margin-top:14px;">
        <button class="btn" id="btn-corrigir">Corrigir com IA</button>
        <span id="status-correcao" style="margin-left:12px;"></span>
      </div>
    </div>
    <div id="resultado-correcao"></div>
    <div class="card">
      <h3>Histórico de redações</h3>
      ${DADOS.redacoes.length ? DADOS.redacoes.slice().reverse().map(r=>`
        <div class="comp-row">
          <span class="comp-name">${new Date(r.data).toLocaleDateString('pt-BR')}</span>
          <span class="comp-score">${r.notaTotal}/1000</span>
        </div>
      `).join('') : '<p class="empty-note">Nenhuma redação corrigida ainda.</p>'}
    </div>
  `;

  document.getElementById('btn-corrigir').addEventListener('click', corrigirRedacao);
}

async function corrigirRedacao(){
  const texto = document.getElementById('txt-redacao').value.trim();
  const statusEl = document.getElementById('status-correcao');
  const resultadoEl = document.getElementById('resultado-correcao');
  if(texto.length < 100){
    statusEl.textContent = 'Escreva um pouco mais antes de corrigir (mínimo ~100 caracteres).';
    statusEl.style.color = 'var(--clay-red)';
    return;
  }
  statusEl.innerHTML = '<span class="loading-dots">Corrigindo com IA, isso leva alguns segundos...</span>';
  statusEl.style.color = 'var(--chalk-white)';

  try{
    // Chama a função serverless (/api/corrigir-redacao.js na Vercel) — a chave da IA
    // fica protegida no servidor, nunca exposta no navegador.
    const response = await fetch("/api/corrigir-redacao", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ texto })
    });
    const parsed = await response.json();
    if(parsed.error) throw new Error(parsed.error);

    DADOS.redacoes.push({ data: Date.now(), texto, notaTotal: parsed.notaTotal, ...parsed });
    try{
      await sb.from('redacoes').insert({
        aluno_id: ALUNO.id, texto,
        nota_c1: parsed.c1.nota, nota_c2: parsed.c2.nota, nota_c3: parsed.c3.nota,
        nota_c4: parsed.c4.nota, nota_c5: parsed.c5.nota,
        nota_total: parsed.notaTotal, comentario_geral: parsed.comentarioGeral
      });
      await atualizarRanking();
    }catch(e){ console.error('Erro ao salvar redação', e); }

    statusEl.textContent = 'Correção concluída!';
    statusEl.style.color = 'var(--ok-green)';

    const competencias = [
      {key:'c1', nome:'Competência 1 — Norma culta'},
      {key:'c2', nome:'Competência 2 — Compreensão do tema'},
      {key:'c3', nome:'Competência 3 — Organização de argumentos'},
      {key:'c4', nome:'Competência 4 — Coesão e coerência'},
      {key:'c5', nome:'Competência 5 — Proposta de intervenção'},
    ];

    resultadoEl.innerHTML = `
      <div class="card">
        <div class="nota-total">
          <div class="num">${parsed.notaTotal}</div>
          <div class="lbl">de 1000 pontos</div>
        </div>
        ${competencias.map(c=>`
          <div class="comp-row" style="flex-direction:column; align-items:flex-start;">
            <div style="display:flex; justify-content:space-between; width:100%;">
              <span class="comp-name">${c.nome}</span>
              <span class="comp-score">${parsed[c.key].nota}/200</span>
            </div>
            <div class="comp-comment">${parsed[c.key].comentario}</div>
          </div>
        `).join('')}
        <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--paper-dim);">
          <strong>Comentário geral:</strong>
          <p style="color:var(--ink-soft); font-size:0.9rem;">${parsed.comentarioGeral}</p>
        </div>
      </div>
    `;
  }catch(err){
    console.error(err);
    statusEl.textContent = 'Erro ao corrigir. Tenta novamente em instantes.';
    statusEl.style.color = 'var(--clay-red)';
  }
}

/* ---------- RANKING (tabela real do Supabase, visível a todos os alunos) ---------- */
async function renderRanking(main){
  main.innerHTML = `
    <div class="page-title">Ranking Geral</div>
    <div class="page-sub">Pontuação combinando questões respondidas corretamente e notas de redação, somando todas as trilhas.</div>
    <div class="card" id="ranking-card"><p class="loading-dots">Carregando ranking...</p></div>
  `;

  try{
    const { data, error } = await sb.from('ranking').select('*').order('pontos', {ascending:false}).limit(20);
    if(error) throw error;

    const card = document.getElementById('ranking-card');
    card.innerHTML = (data && data.length) ? data.map((r,i)=>`
      <div class="rank-row ${r.aluno_id===ALUNO.id ? 'me':''}">
        <span class="rank-pos">${i+1}º</span>
        <span class="rank-name">${r.nome}${r.cidade ? ' · '+r.cidade : ''}</span>
        <span class="rank-pts">${r.pontos} pts</span>
      </div>
    `).join('') : '<p class="empty-note">Ninguém no ranking ainda — responda questões pra aparecer aqui!</p>';
  }catch(e){
    console.error(e);
    document.getElementById('ranking-card').innerHTML = '<p class="empty-note">Não foi possível carregar o ranking agora.</p>';
  }
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  const alunoIdSalvo = localStorage.getItem('aprova_daqui_aluno_id');
  if(alunoIdSalvo){
    try{
      const { data, error } = await sb.from('alunos').select('id,nome,email,cidade').eq('id', alunoIdSalvo).single();
      if(data && !error){
        ALUNO = data;
        await iniciarApp();
        return;
      }
    }catch(e){ /* sessão inválida, cai pro login */ }
  }
  renderTelaLogin();
})();
</script>
